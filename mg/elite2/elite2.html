<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Elite Remake — Prototype v2</title>
    <link
      rel="icon"
      type="image/png"
      href="../res/favicon-64.png"
      sizes="64x64"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }

      body.hide-cursor {
        cursor: none;
      }

      /* ---------- HUD в стиле оригинальной Elite ---------- */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: "Courier New", monospace;
        color: #33ff88;
        text-shadow:
          0 0 6px #00ff88,
          0 0 2px #00ff88;
        user-select: none;
      }

      #cockpit-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #cockpit-svg path,
      #cockpit-svg line,
      #cockpit-svg polyline {
        fill: none;
        stroke: #33ff88;
        stroke-width: 2;
        filter: drop-shadow(0 0 4px #00ff88);
      }

      .indicator {
        position: absolute;
        font-size: 13px;
        line-height: 1.35;
        letter-spacing: 1px;
      }
      #ind-speed {
        left: 110px;
        bottom: 90px;
      }
      #ind-shield {
        left: 110px;
        bottom: 150px;
      }
      #ind-fuel {
        left: 110px;
        bottom: 210px;
      }
      #ind-credits {
        right: 110px;
        bottom: 90px;
        text-align: right;
      }
      #ind-kills {
        right: 110px;
        bottom: 150px;
        text-align: right;
      }
      #ind-sector {
        right: 110px;
        bottom: 210px;
        text-align: right;
      }

      .bar {
        display: inline-block;
        width: 90px;
        height: 8px;
        border: 1px solid #33ff88;
        margin-left: 6px;
        vertical-align: middle;
        position: relative;
      }
      .bar > i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: #33ff88;
        box-shadow: 0 0 6px #00ff88;
        display: block;
      }

      #reticle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
      }
      #reticle svg {
        width: 100%;
        height: 100%;
      }
      #reticle .rh {
        stroke: #33ff88;
        stroke-width: 2;
        filter: drop-shadow(0 0 4px #00ff88);
      }

      #damage-flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(255, 40, 40, 0.55)
        );
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }

      #hint {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 8px;
        font-family: "Courier New", monospace;
        font-size: 12px;
        letter-spacing: 2px;
        color: #33ff88;
        text-shadow:
          0 0 6px #00ff88,
          0 0 2px #00ff88;
        background: linear-gradient(
          180deg,
          rgba(0, 40, 20, 0.55),
          rgba(0, 20, 10, 0.75)
        );
        border: 1px solid rgba(51, 255, 136, 0.55);
        border-radius: 999px;
        box-shadow:
          0 0 0 1px rgba(0, 255, 136, 0.15) inset,
          0 0 12px rgba(0, 255, 136, 0.35),
          0 0 24px rgba(0, 255, 136, 0.15);
        cursor: pointer;
        pointer-events: auto;
        opacity: 0;
        animation:
          hint-appear 0.6s ease-out 0.8s forwards,
          hint-pulse 2.6s ease-in-out 1.6s infinite;
        transition:
          background 0.2s,
          box-shadow 0.2s,
          transform 0.15s,
          color 0.2s;
      }

      #hint:hover,
      #hint:focus-visible {
        color: #b6ffd2;
        background: linear-gradient(
          180deg,
          rgba(0, 70, 35, 0.7),
          rgba(0, 30, 15, 0.85)
        );
        box-shadow:
          0 0 0 1px rgba(0, 255, 136, 0.35) inset,
          0 0 18px rgba(0, 255, 136, 0.7),
          0 0 36px rgba(0, 255, 136, 0.35);
        transform: translateX(-50%) translateY(-1px);
        outline: none;
      }

      #hint:active {
        transform: translateX(-50%) translateY(0);
        box-shadow:
          0 0 0 1px rgba(0, 255, 136, 0.4) inset,
          0 0 10px rgba(0, 255, 136, 0.6);
      }

      .hint-key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 20px;
        padding: 0 6px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #002a14;
        background: linear-gradient(180deg, #7dffb0, #33ff88);
        border-radius: 5px;
        box-shadow:
          0 1px 0 rgba(0, 0, 0, 0.5),
          0 0 8px rgba(0, 255, 136, 0.8),
          0 0 2px rgba(255, 255, 255, 0.6) inset;
        text-shadow: none;
        transform: translateY(-1px);
      }

      .hint-text {
        padding-right: 4px;
      }

      @keyframes hint-appear {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes hint-pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 1px rgba(0, 255, 136, 0.15) inset,
            0 0 12px rgba(0, 255, 136, 0.35),
            0 0 24px rgba(0, 255, 136, 0.15);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(0, 255, 136, 0.25) inset,
            0 0 20px rgba(0, 255, 136, 0.55),
            0 0 40px rgba(0, 255, 136, 0.25);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #hint {
          animation: hint-appear 0.4s ease-out forwards;
        }
        #hint:hover,
        #hint:focus-visible {
          transform: translateX(-50%);
        }
      }

      #gameover {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.75);
        color: #ff4444;
        font-size: 32px;
        text-shadow: 0 0 12px #f00;
        letter-spacing: 3px;
      }
      #gameover small {
        font-size: 14px;
        color: #33ff88;
        margin-top: 20px;
        letter-spacing: 2px;
      }

      #hyper {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 60, 30, 0.55),
          rgba(0, 0, 0, 0.95)
        );
        color: #b6ffd2;
        font-family: "Courier New", monospace;
        letter-spacing: 3px;
        text-shadow: 0 0 12px #00ff88;
        z-index: 40;
        pointer-events: none;
      }
      #hyper .hyper-title {
        font-size: 28px;
        margin-bottom: 12px;
        animation: hyper-flicker 0.6s infinite alternate;
      }
      #hyper .hyper-sub {
        font-size: 16px;
        opacity: 0.85;
        margin-bottom: 18px;
      }
      #hyper .hyper-bar {
        width: 260px;
        height: 8px;
        border: 1px solid #33ff88;
        position: relative;
      }
      #hyper .hyper-bar > i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: #33ff88;
        box-shadow: 0 0 10px #00ff88;
      }
      @keyframes hyper-flicker {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>

      <div id="reticle">

          <line class="rh" x1="35" y1="50" x2="35" y2="70" />

      <div class="indicator" id="ind-speed">
        SPEED <span id="speed">0</span>
        <span class="bar"><i id="speed-bar" style="width: 0%"></i></span>
      </div>
      <div class="indicator" id="ind-shield">
        SHIELD <span id="shield">100</span>
        <span class="bar"><i id="shield-bar" style="width: 100%"></i></span>
      </div>
      <div class="indicator" id="ind-fuel">

      <div id="damage-flash"></div>

      <button id="hint" type="button" aria-label="Открыть справку">

      <div id="gameover">
        GAME OVER
        <small>нажми ENTER чтобы начать заново</small>
      </div>

      <div id="hyper">

        <div class="hyper-sub" id="hyper-target">— — —</div>

      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <!-- Классические скрипты: кладут GALAXY, STAR, PLANET, HELP в глобал -->
    <script src="./galaxy/galaxy.js"></script>
    <script src="./galaxy/star.js"></script>
    <script src="./galaxy/planet.js"></script>
    <script src="./galaxy/hyperfx.js"></script>
    <script src="./galaxy/skystar.js"></script>
    <script src="./js/help.js"></script>
    <script src="../js/sound-lib.js"></script>

    <script type="module">
      import * as THREE from "three";
      window.THREE = THREE;

      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      
        const FUEL_BURN_PER_SPEED = 0;//0.005; // топливо/сек на единицу скорости
        const HYPER_FUEL_PER_UNIT = 0;//40;    // топлива на 1.0 расстояния между звёздами
        const HYPER_MIN_FUEL = 5;              // минимум, чтобы вообще стартовать
        const HYPER_DURATION = 6;              // в секундах
        
        const TUNING_SHIP =
        {
            fuel_rate:      FUEL_BURN_PER_SPEED,
            fuel_hyper:     HYPER_FUEL_PER_UNIT,
            fuel_hyper_min: HYPER_MIN_FUEL
        };

      // ------------------------------------------------------------------
      //  Отладочные переключатели
      // ------------------------------------------------------------------
      const DEBUG = {
        isSpawnEnemies: false, // ← временно выключено для дебага
        //isSpawnMeteors: true,
        //isLogJumps: true,
      };

      // ============================================================
      //  Скрытие курсора через 3 секунды бездействия
      // ============================================================
      let cursorTimer = null;
      function hideCursor() {
        document.body.classList.add("hide-cursor");
      }
      function showCursor() {
        document.body.classList.remove("hide-cursor");
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(hideCursor, 3000);
      }
      ["mousedown", "pointerdown", "touchstart", "keydown", "wheel"].forEach(
        (evt) => document.addEventListener(evt, showCursor, { passive: true }),
      );
      showCursor();

      // ============================================================
      //  Звук
      // ============================================================
      const kit = SoundKit.createSoundKit({
        laser: { src: "snd/laser-1.mp3", volume: 0.45, pool: 3 },
        death: { src: "snd/ship-death-1.mp3", volume: 0.35, pool: 1 },
        damag: { src: "snd/damag-1.mp3", volume: 0.35, pool: 3 },
        hjump: { src: "snd/ship-HJ-1.mp3", volume: 0.35, pool: 1 },
      });

      kit.autoUnlock();

      const playLaser = () => kit.sounds.laser.play();
      const playDeath = () => kit.sounds.death.play();
      const playDamag = () => kit.sounds.damag.play();
      // kit.sounds.hjump.play();

      // ------------------------------------------------------------------
      //  Утилиты
      // ------------------------------------------------------------------
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function wrapAround(pos, origin, halfSize) {
        const dx = pos.x - origin.x;
        const dy = pos.y - origin.y;
        const dz = pos.z - origin.z;
        if (dx > halfSize) pos.x -= halfSize * 2;
        if (dx < -halfSize) pos.x += halfSize * 2;
        if (dy > halfSize) pos.y -= halfSize * 2;
        if (dy < -halfSize) pos.y += halfSize * 2;
        if (dz > halfSize) pos.z -= halfSize * 2;
        if (dz < -halfSize) pos.z += halfSize * 2;
      }

      // ------------------------------------------------------------------
      //  Корабль игрока
      // ------------------------------------------------------------------
      function makePlayerShip() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.ConeGeometry(6, 22, 8),
          new THREE.MeshStandardMaterial({
            color: 0x8899aa,
            metalness: 0.7,
            roughness: 0.4,
          }),
        );
        body.rotation.x = Math.PI / 2;
        body.position.z = -8;
        group.add(body);

        const wing = new THREE.Mesh(
          new THREE.BoxGeometry(20, 1, 6),
          new THREE.MeshStandardMaterial({
            color: 0x556677,
            metalness: 0.8,
            roughness: 0.5,
          }),
        );
        wing.position.z = 2;
        group.add(wing);

        const cockpit = new THREE.Mesh(
          new THREE.SphereGeometry(3, 12, 8),
          new THREE.MeshStandardMaterial({
            color: 0x224466,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x113355,
            emissiveIntensity: 0.6,
          }),
        );
        cockpit.position.set(0, 2, -4);
        cockpit.scale.set(1, 0.7, 1.6);
        group.add(cockpit);

        const engMat = new THREE.MeshBasicMaterial({
          color: 0x66ccff,
          toneMapped: false,
        });
        const eng1 = new THREE.Mesh(
          new THREE.CylinderGeometry(2, 2.5, 3, 12),
          engMat,
        );
        eng1.rotation.x = Math.PI / 2;
        eng1.position.set(-5, 0, 8);
        group.add(eng1);
        const eng2 = eng1.clone();
        eng2.position.x = 5;
        group.add(eng2);

        const muzzleMat = new THREE.MeshBasicMaterial({
          color: 0xffffaa,
          toneMapped: false,
          transparent: true,
          opacity: 0,
        });
        const muzzle1 = new THREE.Mesh(
          new THREE.SphereGeometry(1.6, 8, 8),
          muzzleMat.clone(),
        );
        muzzle1.position.set(-8, 0, 0);
        group.add(muzzle1);
        const muzzle2 = muzzle1.clone();
        muzzle2.position.x = 8;
        group.add(muzzle2);

        group.userData.engines = [eng1, eng2];
        group.userData.muzzles = [muzzle1, muzzle2];
        return group;
      }

      // ------------------------------------------------------------------
      //  Враг
      // ------------------------------------------------------------------
      function makeEnemyShip() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
          color: 0xaa3333,
          metalness: 0.7,
          roughness: 0.5,
        });
        group.add(new THREE.Mesh(new THREE.OctahedronGeometry(8, 0), mat));
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(10, 1, 8, 24),
          new THREE.MeshBasicMaterial({ color: 0xff4444, toneMapped: false }),
        );
        ring.rotation.x = Math.PI / 2;
        group.add(ring);
        group.userData.enemy = true;
        return group;
      }

      // ------------------------------------------------------------------
      //  Лазер
      // ------------------------------------------------------------------
      const LASER_LENGTH = 40;
      const LASER_RADIUS = 0.4;
      const LASER_SPEED = 900;

      const laserGeo = new THREE.CylinderGeometry(
        LASER_RADIUS,
        LASER_RADIUS,
        LASER_LENGTH,
        6,
        1,
        true,
      );
      laserGeo.rotateX(Math.PI / 2);

      function makeLaserMaterial() {
        return new THREE.MeshBasicMaterial({
          color: 0xffff66,
          toneMapped: false,
          transparent: true,
          opacity: 1.0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
      }

      // ------------------------------------------------------------------
      //  Сцена / камера / рендерер
      // ------------------------------------------------------------------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000005);

      const camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        20000,
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(
        new THREE.Vector2(innerWidth, innerHeight),
        0.9,
        0.6,
        0.15,
      );
      composer.addPass(bloom);
      
      // Визуал эффекта туннеля Гиперпрыжка
      HYPERFX.attach({ THREE, scene, camera, bloom,
        composer,
        chromatic: {
            enabled: true,
            maxOffset: 0.012,
            vignette: 0.6,
            baseIntensity: 0.15,
            boostDuringJump: 0.85,
          },
      });

      const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
      sunLight.position.set(1, 0.5, 0.7);
      scene.add(sunLight);
      scene.add(new THREE.AmbientLight(0x334455, 0.6));

      // ---------------------------------------|
      //  Звёздное небо (дальний фон).
      // ---------------------------------------:
      const skystars = SKYSTAR.makeStarfield(12345, {
          count: 4000,
          radius: 4000,
          sizeMax: 8,
          opacity: 0.9,
          starPoints: 6,
          
            // Цвет
            hueBase: 0.10,   // центр спектра (0..1): 0.55 ≈ голубой
            hueRange: 0.20,  // насколько широко разбрасывать вокруг него.
            saturation: 0.8, // насыщенность 0..1
            saturationJitter: 0.25, // добавочный разброс насыщенности
            
            lightnessMin: 0.7, lightnessRange: 0.25,
          shapeWeights: { star: 40, sparkle: 20, disc: 40 },
        });
      scene.add(skystars);

      const player = makePlayerShip();
      camera.add(player);
      player.position.set(0, -6, 12);
      player.scale.set(3, 0.1, 3);
      scene.add(camera);

      // ------------------------------------------------------------------
      //  Система текущей звезды: светило + планеты
      //  Использует STAR и PLANET из ./galaxy/star.js и ./galaxy/planet.js
      // ------------------------------------------------------------------
      const planets = []; // массив хэндлов PLANET.generate(...)
      let currentStarHandle = null;

      function clearSystem() {
        for (const p of planets) {
          scene.remove(p.mesh);
          if (p.atmosphere) scene.remove(p.atmosphere);
          if (p.rings) scene.remove(p.rings);
          PLANET.dispose(p);
        }
        planets.length = 0;

        if (currentStarHandle) {
          scene.remove(currentStarHandle.mesh);
          scene.remove(currentStarHandle.corona);
          scene.remove(currentStarHandle.light);
          STAR.dispose(currentStarHandle);
          currentStarHandle = null;
        }
      }

      function buildSystemFromStar(star) {
        if (!star) return;

        // Светило — висит далеко впереди
        currentStarHandle = STAR.generate(star);
        const starPos = new THREE.Vector3(0, 0, -3000);
        currentStarHandle.mesh.position.copy(starPos);
        currentStarHandle.corona.position.copy(starPos);
        currentStarHandle.light.position.copy(starPos);
        scene.add(currentStarHandle.mesh);
        scene.add(currentStarHandle.corona);
        scene.add(currentStarHandle.light);

        // Планеты: число зависит от tech
        const n = Math.min(5, 1 + Math.floor((star.tech || 1) / 4));
        for (let i = 0; i < n; i++) {
          const p = PLANET.generate(star);
          const rng = mulberry32(star.id * 1000 + i);
          const dist = 800 + i * 900 + rng() * 400;
          const ang = rng() * Math.PI * 2;
          p.mesh.position.set(
            Math.cos(ang) * dist,
            (rng() - 0.5) * 400,
            Math.sin(ang) * dist - 1500,
          );
          scene.add(p.mesh);
          planets.push(p);
        }
      }

      // ------------------------------------------------------------------
      //  Враги / лазеры / эффекты
      // ------------------------------------------------------------------
      const enemies = [];
      const lasers = [];

      function spawnEnemy() {
        if (!DEBUG.isSpawnEnemies) return; // дебаг-выключатель

        const e = makeEnemyShip();
        const ang = Math.random() * Math.PI * 2;
        const dist = 400 + Math.random() * 600;
        e.position.set(
          Math.cos(ang) * dist,
          (Math.random() - 0.5) * 200,
          Math.sin(ang) * dist,
        );
        e.userData.hp = 3;
        e.userData.speed = 20 + Math.random() * 40;
        scene.add(e);
        enemies.push(e);
      }

      let shotCounter = 0;

      function spawnLaser() {
        const pos = new THREE.Vector3();
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
          camera.quaternion,
        );

        const muzzleIdx = shotCounter++ % 2;
        const muzzle = player.userData.muzzles[muzzleIdx];
        muzzle.getWorldPosition(pos);
        muzzle.material.opacity = 1.0;

        const mesh = new THREE.Mesh(laserGeo, makeLaserMaterial());
        mesh.position.copy(pos);
        mesh.quaternion.copy(camera.quaternion);
        mesh.userData.velocity = dir.clone().multiplyScalar(LASER_SPEED);
        mesh.userData.life = 1.5;
        scene.add(mesh);
        return mesh;
      }

      const hitEffects = [];
      const hitFlashGeo = new THREE.SphereGeometry(1, 12, 12);

      function spawnHitFlash(position, scale = 1) {
        const mat = new THREE.MeshBasicMaterial({
          color: 0xff44ff,
          toneMapped: false,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const mesh = new THREE.Mesh(hitFlashGeo, mat);
        mesh.position.copy(position);
        mesh.scale.setScalar(scale);
        scene.add(mesh);

        const light = new THREE.PointLight(0xff22ff, 4, 80, 2);
        light.position.copy(position);
        scene.add(light);

        hitEffects.push({
          mesh,
          light,
          life: 0.35,
          maxLife: 0.35,
          baseScale: scale,
        });
      }

      function updateHitEffects(dt) {
        for (let i = hitEffects.length - 1; i >= 0; i--) {
          const e = hitEffects[i];
          e.life -= dt;
          const k = Math.max(0, e.life / e.maxLife);
          e.mesh.scale.setScalar(e.baseScale * (1 + (1 - k) * 2.5));
          e.mesh.material.opacity = k;
          e.light.intensity = 4 * k * k;
          if (e.life <= 0) {
            scene.remove(e.mesh);
            scene.remove(e.light);
            e.mesh.material.dispose();
            hitEffects.splice(i, 1);
          }
        }
      }

      // ------------------------------------------------------------------
      //  Космическая пыль
      // ------------------------------------------------------------------
      const DUST_COUNT  = 3000;
      const DUST_RADIUS = 800;

      function makeDust() {
        const positions = new Float32Array(DUST_COUNT * 3);
        for (let i = 0; i < DUST_COUNT; i++) {
          positions[i * 3 + 0] =
            camera.position.x + (Math.random() - 0.5) * DUST_RADIUS * 2;
          positions[i * 3 + 1] =
            camera.position.y + (Math.random() - 0.5) * DUST_RADIUS * 2;
          positions[i * 3 + 2] =
            camera.position.z + (Math.random() - 0.5) * DUST_RADIUS * 2;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: 0xaaccff,
          size: 2.0,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.8,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const points = new THREE.Points(geo, mat);
        points.frustumCulled = false;
        return points;
      }

      const dust = makeDust();
      scene.add(dust);

      // ------------------------------------------------------------------
      //  Метеоры
      // ------------------------------------------------------------------
      const METEOR_COUNT = 60;
      const METEOR_RADIUS = 500;
      const meteors = [];

      function makeMeteor() {
        const size = 3 + Math.random() * 12;
        const geo = new THREE.IcosahedronGeometry(size, 0);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setXYZ(
            i,
            pos.getX(i) * (0.7 + Math.random() * 0.6),
            pos.getY(i) * (0.7 + Math.random() * 0.6),
            pos.getZ(i) * (0.7 + Math.random() * 0.6),
          );
        }
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
          color: 0x776655,
          roughness: 0.9,
          metalness: 0.1,
          flatShading: true,
          emissive: 0x221100,
          emissiveIntensity: 0.3,
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData.spin = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
        );
        mesh.userData.size = size;
        mesh.position.set(
          camera.position.x + (Math.random() - 0.5) * METEOR_RADIUS * 2,
          camera.position.y + (Math.random() - 0.5) * METEOR_RADIUS * 2,
          camera.position.z + (Math.random() - 0.5) * METEOR_RADIUS * 2,
        );
        scene.add(mesh);
        meteors.push(mesh);
      }

      for (let i = 0; i < METEOR_COUNT; i++) makeMeteor();

      // ------------------------------------------------------------------
      //  Ввод
      // ------------------------------------------------------------------
      const keys = {};

      addEventListener("keydown", (e) => {
        // F1: справка
        if (e.code === "F1") {
          e.preventDefault();
          HELP.toggle();
          return;
        }

        // ESC: закрыть оверлей
        if (e.code === "Escape") {
          if (HELP.isOpen()) {
            HELP.close();
            e.preventDefault();
            return;
          }
          if (GALAXY.isOpen()) {
            GALAXY.setOpen(false);
            e.preventDefault();
            return;
          }
        }

        // Справка открыта — глушим остальное
        if (HELP.isOpen()) {
          e.preventDefault();
          return;
        }

        // Гиперпрыжок — работает и с открытой картой, и в полёте
        if (e.code === "KeyJ") {
          tryHyperJump();
          e.preventDefault();
          return;
        }

        // Карта галактики
        if (e.code === "KeyM") {
          GALAXY.toggle();
          e.preventDefault();
          return;
        }

        if (GALAXY.isOpen()) {
          if (e.code === "ArrowLeft") GALAXY.moveSelection(-1, 0);
          if (e.code === "ArrowRight") GALAXY.moveSelection(1, 0);
          if (e.code === "ArrowUp") GALAXY.moveSelection(0, 1);
          if (e.code === "ArrowDown") GALAXY.moveSelection(0, -1);
          if (e.code === "Enter") GALAXY.confirmJump();
          e.preventDefault();
          return;
        }

        // Игра
        keys[e.code] = true;
        if (e.code === "Space") e.preventDefault();
        if (e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
        if (e.code === "Enter" && state.dead) resetGame();
      });

      addEventListener("keyup", (e) => (keys[e.code] = false));

      // ------------------------------------------------------------------
      //  Состояние
      // ------------------------------------------------------------------
      const state = {
        starIndex: 0,
        currentStar: null,

        speed: 0,
        maxSpeed: 320,
        minSpeed: -80,
        shield: 100,
        fuel: 100,
        credits: 1000,
        kills: 0,
        sector: { x: 0, y: 0 },
        dead: false,

        // гиперпрыжок
        hyper: {
          active: false,
          t: 0, // прошло секунд
          duration: 2.2, // длительность анимации
          targetIdx: -1, // куда прыгаем
          fuelCost: 0, // сколько топлива спишет
        },
      };

      function updateSectorFromStar(star) {
        if (!star) return;
        state.sector.x = Math.round((star.x + 1) * 50);
        state.sector.y = Math.round((star.y + 1) * 50);
      }

      // ★ HUD-элементы, нужные гиперпрыжку
      const $ = (id) => document.getElementById(id);
      const elHyper = $("hyper");
      const elHyperTarget = $("hyper-target");
      const elHyperProgress = $("hyper-progress");

      // ------------------------------------------------------------------
      //  Гиперпрыжок
      // ------------------------------------------------------------------
      function distanceBetweenStars(a, b) {
        if (!a || !b) return 0;
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function tryHyperJump() {
        if (state.dead || state.hyper.active) return;

        // Если карта закрыта — откроем её, чтобы игрок выбрал цель
        if (!GALAXY.isOpen()) {
          GALAXY.toggle();
          return;
        }

        const curIdx = GALAXY.currentIndex;
        const targetIdx = GALAXY.selectedIndex;

        if (targetIdx === curIdx) {
          console.log("HYPER: цель совпадает с текущей звездой");
          return;
        }

        const cur = GALAXY.getCurrentStar();
        const dst = GALAXY.getStar(targetIdx);
        if (!cur || !dst) return;

        const dist = distanceBetweenStars(cur, dst);
        const fuelCost = Math.max(
          HYPER_MIN_FUEL,
          Math.round(dist * HYPER_FUEL_PER_UNIT),
        );

        if (state.fuel < fuelCost) {
          console.log(
            `HYPER: недостаточно топлива (нужно ${fuelCost}, есть ${Math.round(state.fuel)})`,
          );
          return;
        }

        // Запускаем анимацию
        state.hyper.active = true;
        state.hyper.t = 0;
        state.hyper.duration = HYPER_DURATION;
        state.hyper.targetIdx = targetIdx;
        state.hyper.fuelCost = fuelCost;

        elHyperTarget.textContent = `${cur.name} → ${dst.name}`;
        elHyperProgress.style.width = "0%";
        elHyper.style.display = "flex";

        kit.sounds.hjump.play();
        HYPERFX.start(state.hyper.duration); // визуал Гиперпрыжка

        GALAXY.setOpen(false);
      }

      function completeHyperJump() {
        const targetIdx = state.hyper.targetIdx;
        const star = GALAXY.getStar(targetIdx);
        if (!star) {
          state.hyper.active = false;
          
          HYPERFX.stop(); // Остановка Гиперпрыжка.
          
          elHyper.style.display = "none";
          return;
        }

        // Списываем топливо
        state.fuel = Math.max(0, state.fuel - TUNING_SHIP.fuel_hyper);

        // Обновляем состояние игрока
        state.starIndex = targetIdx;
        state.currentStar = star;
        updateSectorFromStar(star);
        GALAXY.setPlayerStar(targetIdx);

        // Сброс сцены
        camera.position.set(0, 0, 0);
        camera.quaternion.set(0, 0, 0, 1);
        state.speed = 0;

        for (const e of enemies) scene.remove(e);
        enemies.length = 0;
        for (const l of lasers) scene.remove(l);
        lasers.length = 0;

        reseedDustAndMeteors();
        clearSystem();
        buildSystemFromStar(star);

        console.log(
          "HYPER →",
          star.name,
          star.tech,
          star.dangerLabel,
          star.economy,
          `(-${state.hyper.fuelCost} fuel)`,
        );

        // kit.sounds.hjump.stop(); // ★ звук прибытия

        // Завершаем
        state.hyper.active = false;
        elHyper.style.display = "none";
      }

      function updateHyper(dt) {
        if (!state.hyper.active) return;

        state.hyper.t += dt;
        const k = Math.min(1, state.hyper.t / state.hyper.duration);
        elHyperProgress.style.width = (k * 100).toFixed(1) + "%";

        if (k >= 1) completeHyperJump();
      }

      // ------------------------------------------------------------------
      //  Инициализация HELP и GALAXY
      // ------------------------------------------------------------------
      HELP.init();

      GALAXY.init();
      GALAXY.setPlayerStar(state.starIndex);

      state.currentStar = GALAXY.getCurrentStar();
      updateSectorFromStar(state.currentStar);

      // Лог текущей звезды
      const s = state.currentStar;
      console.log(
        "STAR:",
        s.name,
        s.tech,
        s.dangerLabel,
        s.economy,
        s.population,
      );

      // Стартовая система
      buildSystemFromStar(state.currentStar);

      // Прыжок
      // GALAXY.onJumpRequest((idx, star) => {
      //   state.starIndex = idx;
      //   state.currentStar = star;
      //   updateSectorFromStar(star);
      //   GALAXY.setPlayerStar(idx);
      //   GALAXY.setOpen(false);

      //   camera.position.set(0, 0, 0);
      //   camera.quaternion.set(0, 0, 0, 1);
      //   state.speed = 0;

      //   for (const e of enemies) scene.remove(e);
      //   enemies.length = 0;
      //   for (const l of lasers) scene.remove(l);
      //   lasers.length = 0;

      //   reseedDustAndMeteors();
      //   clearSystem();
      //   buildSystemFromStar(star);

      //   console.log(
      //     "JUMP →",
      //     star.name,
      //     star.tech,
      //     star.dangerLabel,
      //     star.economy,
      //     star.population,
      //   );
      // });

      function resetGame() {
        state.speed = 0;
        state.shield = 100;
        state.fuel = 100;
        state.credits = 1000;
        state.kills = 0;
        state.dead = false;

        for (const e of enemies) scene.remove(e);
        enemies.length = 0;
        for (const l of lasers) scene.remove(l);
        lasers.length = 0;

        camera.position.set(0, 0, 0);
        camera.quaternion.set(0, 0, 0, 1);

        reseedDustAndMeteors();

        document.getElementById("gameover").style.display = "none";
      }

      function reseedDustAndMeteors() {
        const posAttr = dust.geometry.attributes.position;
        for (let i = 0; i < DUST_COUNT; i++) {
          posAttr.setXYZ(
            i,
            camera.position.x + (Math.random() - 0.5) * DUST_RADIUS * 2,
            camera.position.y + (Math.random() - 0.5) * DUST_RADIUS * 2,
            camera.position.z + (Math.random() - 0.5) * DUST_RADIUS * 2,
          );
        }
        posAttr.needsUpdate = true;

        for (const m of meteors) {
          m.position.set(
            camera.position.x + (Math.random() - 0.5) * METEOR_RADIUS * 2,
            camera.position.y + (Math.random() - 0.5) * METEOR_RADIUS * 2,
            camera.position.z + (Math.random() - 0.5) * METEOR_RADIUS * 2,
          );
        }
      }

      // ------------------------------------------------------------------
      //  HUD
      // ------------------------------------------------------------------
      //const $ = (id) => document.getElementById(id);
      const elSpeed = $("speed");
      const elSpeedBar = $("speed-bar");
      const elShield = $("shield");
      const elShieldBar = $("shield-bar");
      const elFuel = $("fuel");
      const elFuelBar = $("fuel-bar");
      const elCredits = $("credits");
      const elKills = $("kills");
      const elSector = $("sector");
      const elDamage = $("damage-flash");
      const elGameover = $("gameover");

      let damageTimer = 0;
      function flashDamage(intensity = 1) {
        damageTimer = 0.25;
        elDamage.style.opacity = String(Math.min(0.9, intensity));
      }

      function updateHUD() {
        elSpeed.textContent = Math.round(state.speed);
        elSpeedBar.style.width =
          Math.min(100, (Math.abs(state.speed) / state.maxSpeed) * 100) + "%";
        elShield.textContent = Math.round(state.shield);
        elShieldBar.style.width = state.shield + "%";
        elFuel.textContent = Math.round(state.fuel);
        elFuelBar.style.width = state.fuel + "%";
        elCredits.textContent = state.credits;
        elKills.textContent = state.kills;
        elSector.textContent = `${state.sector.x},${state.sector.y}`;

        // подсветка, когда топлива мало:
        elFuel.style.color = state.fuel < 10 ? "#ff6666" : "";
        
        // подсветить режим дебага
        //elFuel.textContent = DEBUG.infiniteFuel ? "∞" : Math.round(state.fuel);
        //elFuelBar.style.width = DEBUG.infiniteFuel ? "100%" : state.fuel + "%";
        //elFuel.style.color = DEBUG.infiniteFuel ? "#33ff88" : (state.fuel < 10 ? "#ff6666" : "");
      }

      // ------------------------------------------------------------------
      //  Стрельба
      // ------------------------------------------------------------------
      let fireCooldown = 0;

      function fire() {
        if (fireCooldown > 0 || state.dead) return;
        fireCooldown = 0.12;
        const laser = spawnLaser();
        lasers.push(laser);
        playLaser();
      }

      // ------------------------------------------------------------------
      //  Цикл
      // ------------------------------------------------------------------
      const clock = new THREE.Clock();
      const tmpVec = new THREE.Vector3();
      const playerWorldPos = new THREE.Vector3();

      function animate() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const time = clock.elapsedTime;

        GALAXY.update(dt);
        updateHyper(dt);
        HYPERFX.update(dt, clock.elapsedTime);

        // Пока идёт гиперпрыжок — мир заморожен, но рендер идёт
        if (state.hyper.active) {
          // Светило текущей системы можно продолжать анимировать для красоты
          if (currentStarHandle && currentStarHandle.update) {
            currentStarHandle.update(dt, clock.elapsedTime);
          }
          composer.render();
          requestAnimationFrame(animate);
          return;
        }

        if (HELP.isOpen()) {
          composer.render();
          requestAnimationFrame(animate);
          return;
        }

        if (!state.dead) {
          // Тяга
          if (keys["ArrowUp"]) state.speed += 220 * dt;
          if (keys["ArrowDown"]) state.speed -= 220 * dt;

          state.speed *= Math.pow(0.85, dt);
          state.speed = Math.max(
            state.minSpeed,
            Math.min(state.maxSpeed, state.speed),
          );

          // Ориентация
          const rotSpeed = 1.2 * dt;
          if (keys["KeyW"]) camera.rotateX(rotSpeed);
          if (keys["KeyS"]) camera.rotateX(-rotSpeed);
          if (keys["KeyA"]) camera.rotateZ(rotSpeed);
          if (keys["KeyD"]) camera.rotateZ(-rotSpeed);
          if (keys["ArrowLeft"]) camera.rotateY(rotSpeed);
          if (keys["ArrowRight"]) camera.rotateY(-rotSpeed);

          // Движение вперёд
          const forward = tmpVec
            .set(0, 0, -1)
            .applyQuaternion(camera.quaternion)
            .clone();
          camera.position.addScaledVector(forward, state.speed * dt);

          // Дрейф метеоров (мир летит на игрока — минус корректный)
          //const drift = forward.multiplyScalar(-state.speed * dt);

            // Пыль частично «догоняет» камеру.
            //   0.0 = пыль стоит в мире → летит на игрока на полной скорости
            //   0.8 = пыль почти «прилипла» к камере → почти не набегает
            //   1.0 = пыль движется вместе с кораблём → стоит на месте визуально
            const DUST_FOLLOW = 0.7;
            const dustDrift = forward
              .clone()
              .multiplyScalar(state.speed * dt * DUST_FOLLOW);

          // Пыль
          {
            const attr = dust.geometry.attributes.position;
            const arr = attr.array;
            const H = DUST_RADIUS;
            const cx = camera.position.x;
            const cy = camera.position.y;
            const cz = camera.position.z;

            for (let i = 0; i < DUST_COUNT; i++) {
              const ix = i * 3;
              arr[ix + 0] += dustDrift.x;
              arr[ix + 1] += dustDrift.y;
              arr[ix + 2] += dustDrift.z;

              const dx = arr[ix + 0] - cx;
              const dy = arr[ix + 1] - cy;
              const dz = arr[ix + 2] - cz;
              if (dx > H) arr[ix + 0] -= H * 2;
              if (dx < -H) arr[ix + 0] += H * 2;
              if (dy > H) arr[ix + 1] -= H * 2;
              if (dy < -H) arr[ix + 1] += H * 2;
              if (dz > H) arr[ix + 2] -= H * 2;
              if (dz < -H) arr[ix + 2] += H * 2;
            }
            attr.needsUpdate = true;

            const speedFactor = Math.min(
              1,
              Math.abs(state.speed) / state.maxSpeed,
            );
            dust.material.opacity = 0.35 + speedFactor * 0.65;
            dust.material.size = 1.2 + speedFactor * 2.0;
          }

          // Метеоры
          player.getWorldPosition(playerWorldPos);

          for (const m of meteors) {
            m.position.x += dustDrift.x;
            m.position.y += dustDrift.y;
            m.position.z += dustDrift.z;

            m.rotation.x += m.userData.spin.x * dt;
            m.rotation.y += m.userData.spin.y * dt;
            m.rotation.z += m.userData.spin.z * dt;

            wrapAround(m.position, camera.position, METEOR_RADIUS);

            const d = m.position.distanceTo(playerWorldPos);
            if (d < m.userData.size + 12) {
              state.shield -= 200 * dt;
              flashDamage(0.6);
              if (state.shield <= 0) {
                state.shield = 0;
                state.dead = true;
                elGameover.style.display = "flex";
                playDeath();
              }
            }
          }

          // Стрельба
          fireCooldown -= dt;
          if (keys["Space"]) fire();

            // Топливо
            if (state.speed !== 0)
            {
                state.fuel -= Math.abs(state.speed) * dt * TUNING_SHIP.fuel_rate;
                if (state.fuel <= 0)
                {   state.fuel  = 0;
                    state.speed *= 0.98;
                }
            }
        } else {
          fireCooldown -= dt;
        }

        // Дульные вспышки гаснут
        for (const m of player.userData.muzzles) {
          m.material.opacity = Math.max(0, m.material.opacity - dt * 12);
        }

        // Лазеры
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.position.addScaledVector(l.userData.velocity, dt);
          l.userData.life -= dt;
          l.material.opacity = Math.min(1, l.userData.life * 3);

          if (l.userData.life <= 0) {
            scene.remove(l);
            l.material.dispose();
            lasers.splice(i, 1);
            continue;
          }

          // Лазер vs враг
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (l.position.distanceTo(e.position) < 30) {
              e.userData.hp -= 1;
              spawnHitFlash(l.position.clone(), 2.5);
              playDamag();

              scene.remove(l);
              l.material.dispose();
              lasers.splice(i, 1);

              if (e.userData.hp <= 0) {
                scene.remove(e);
                enemies.splice(j, 1);
                state.kills++;
                state.credits += 100;
                spawnHitFlash(e.position.clone(), 6);
              }
              break;
            }
          }

          // Лазер vs метеор
          for (let k = meteors.length - 1; k >= 0; k--) {
            const m = meteors[k];
            if (l.position.distanceTo(m.position) < m.userData.size) {
              scene.remove(l);
              l.material.dispose();
              lasers.splice(i, 1);
              m.userData.size = Math.max(1, m.userData.size * 0.5);
              m.scale.setScalar(0.5);
              break;
            }
          }
        }

        // Спавн врагов
        if (!state.dead && enemies.length < 5 && Math.random() < 0.005)
          spawnEnemy();

        // ИИ врагов
        player.getWorldPosition(playerWorldPos);

        for (const e of enemies) {
          const toPlayer = new THREE.Vector3().subVectors(
            playerWorldPos,
            e.position,
          );
          const dist = toPlayer.length();
          toPlayer.normalize();
          e.position.addScaledVector(toPlayer, e.userData.speed * dt);
          e.rotation.x += dt * 0.5;
          e.rotation.y += dt * 0.7;

          if (dist < 30 && !state.dead) {
            state.shield -= 30 * dt;
            flashDamage(0.4);
            if (state.shield <= 0) {
              state.shield = 0;
              state.dead = true;
              elGameover.style.display = "flex";
              playDeath();
            }
          }
        }

        // Светило и планеты текущей системы
        if (currentStarHandle && currentStarHandle.update) {
          currentStarHandle.update(dt, time);
        }
        for (const p of planets) p.update(dt);

        // Звёздное небо следует за камерой
        skystars.position.copy(camera.position);
        if (skystars.userData.update) skystars.userData.update(dt, clock.elapsedTime);

        // Пульсация двигателей
        const engMat = player.userData.engines[0].material;
        const intensity = 0.6 + (Math.abs(state.speed) / state.maxSpeed) * 0.8;
        engMat.color.setRGB(0.4 * intensity, 0.8 * intensity, 1.0 * intensity);

        // Затухание damage flash
        if (damageTimer > 0) {
          damageTimer -= dt;
          if (damageTimer <= 0) elDamage.style.opacity = "0";
        }

        updateHitEffects(dt);
        updateHUD();
        composer.render();
        requestAnimationFrame(animate);
      }

      // ------------------------------------------------------------------
      //  Игровой цикл
      // ------------------------------------------------------------------
      animate();

      // ------------------------------------------------------------------
      //  Resize
      // ------------------------------------------------------------------
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        
        if (skystars.userData.setPixelRatio) {
            skystars.userData.setPixelRatio(devicePixelRatio);
        }
      });
    </script>
  </body>
</html>
