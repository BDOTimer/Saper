      function requestFs() {
          //if (isFullscreen()) return Promise.resolve();

          const e = document.documentElement;
          let p;
          if (e.requestFullscreen) p = e.requestFullscreen();
          else if (e.webkitRequestFullscreen) p = e.webkitRequestFullscreen();
          else if (e.msRequestFullscreen) p = e.msRequestFullscreen();
          else return Promise.resolve();

          return Promise.resolve(p);
      }

      // ------------------------------------------------------------------

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function wrapAround(pos, origin, halfSize) {
        const dx = pos.x - origin.x;
        const dy = pos.y - origin.y;
        const dz = pos.z - origin.z;
        if (dx > halfSize) pos.x -= halfSize * 2;
        if (dx < -halfSize) pos.x += halfSize * 2;
        if (dy > halfSize) pos.y -= halfSize * 2;
        if (dy < -halfSize) pos.y += halfSize * 2;
        if (dz > halfSize) pos.z -= halfSize * 2;
        if (dz < -halfSize) pos.z += halfSize * 2;
      }

      class CameraManager
      {
        constructor(camera, ship, planets) {
          this.camera  = camera;
          this.ship    = ship;    // объект с .position (THREE.Vector3)
          this.planets = planets; // массив объектов с .position

          this.clock = new THREE.Clock();
          this.farUpdateTimer = 0;
          this.checkInterval  = 1.0; // секунды
          this.minFar = 7000;
          this.margin = 1.2;

          this.seconds = 0;
        }

        /**
         * Вызывать один раз в кадре (из основного animate)
         */
        update()
        { const dt = this.clock.getDelta();
          this.farUpdateTimer += dt;

          if (this.farUpdateTimer >= this.checkInterval) {
            this.farUpdateTimer -= this.checkInterval;
            this._recalculateFar();
            this.seconds++;
          }
        }

        _recalculateFar()
        {
          const positionShip = this.ship.position;
          let maxVisible = 0;

          // 1. Считаем самую дальнюю планету
          for (const p of this.planets) {
            const d = positionShip.distanceTo(p.position);
            if (d > maxVisible) maxVisible = d;
          }

          // 2. Учитываем звезду в (0, 0, 0)
          const distToStar = positionShip.length(); // это distanceTo(new THREE.Vector3(0,0,0))
          if (distToStar > maxVisible) {
            maxVisible = distToStar;
          }

          this.camera.far = Math.max(maxVisible * this.margin, this.minFar);
          this.camera.updateProjectionMatrix();
        }

        _zoomInStar()
        {
          const positionShip = this.ship.position;

          const distToStar = positionShip.length();
          const maxOrbit   = 8000;  // радиус орбиты самой дальней планеты

          // Самый дальний объект, который может быть виден:
          // планета на противоположной от корабля стороне звезды
          const maxVisible = distToStar + maxOrbit;

          this.camera.far = Math.max(maxVisible * this.margin, this.minFar);
          this.camera.updateProjectionMatrix();
        }
      }

      const renderer = new THREE.WebGLRenderer({

    // ------------------------------------------------------------------------:
    const planets = []; // массив хэндлов PLANET.generate(...)
    let currentStarHandle    = null;

    function clearSystem()
    {   for (const p of planets) {

          if (p.rings) scene.remove(p.rings);

    function buildSystemFromStar(star)
    {   if (!star) return;

        // sun.rebuild(state.dataStar);
        // sun.setPosition(0, 2000, 8000);
        // sun.setVisible(false);

        // Светило — висит далеко впереди
        currentStarHandle = STAR.generate(star);
        const starPos = new THREE.Vector3(0, 0, -3000);
        currentStarHandle.mesh.position.copy(starPos);
        currentStarHandle.corona.position.copy(starPos);
        currentStarHandle.light.position.copy(starPos);
        scene.add(currentStarHandle.mesh);
        scene.add(currentStarHandle.corona);
        scene.add(currentStarHandle.light);

        sunLight.position.set(0, 0, -3000);

        // Планеты: число зависит от tech
        const n = Math.min(5, 1 + Math.floor((star.tech || 1) / 4));
        
        for (let i = 0; i < n; i++) {
            const rng = mulberry32(star.id * 1000 + i);
            const dist = 800 + i * 900 + rng() * 400;
            const ang  = rng() * Math.PI * 2;
            const pos = new THREE.Vector3(
                Math.cos(ang) * dist,
                (rng() - 0.5) * 400,
                Math.sin(ang) * dist - 1500,
            );

            const p = PLANET.generate(star, {
                planetIndex:        i, // ★ уникализирует текстуру между планетами
                position:         pos, // ★ (по желанию) для направления света
                starPosition: starPos, // ★ если хочешь, чтобы свет шёл от звезды
                textureSize:      512, // ★ опционально; можно 256 для экономии
            });

            p.mesh.position.copy(pos);
            scene.add(p.mesh);
            planets.push(p);
        }
        
        //-------------------------|
        // Станция::Ориентация.    |
        //-------------------------:
        currentStationHandle = STATION.generate(star, {
          rotation: { x: 0, y: Math.PI, z: 0 },
        });
        
        //-------------------------|
        // Станция::Позиция.       |
        //-------------------------:
        currentStationHandle.group.position.set(0, 0, -600);
        scene.add(currentStationHandle.group);
    }

      let shotCounter = 0;

      function spawnLaser() {
        const pos = new THREE.Vector3();
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
          camera.quaternion,
        );

        const muzzleIdx = shotCounter++ % 2;
        const muzzle = player.userData.muzzles[muzzleIdx];
        muzzle.getWorldPosition(pos);
        muzzle.material.opacity = 1.0;

        const mesh = new THREE.Mesh(laserGeo, makeLaserMaterial());
        mesh.position.copy(pos);
        mesh.quaternion.copy(camera.quaternion);
        mesh.userData.velocity = dir.clone().multiplyScalar(LASER_SPEED);
        mesh.userData.life = 1.5;
        scene.add(mesh);
        return mesh;
      }

      const hitEffects = [];
      const hitFlashGeo = new THREE.SphereGeometry(1, 12, 12);

      function spawnHitFlash(position, scale = 1) {
        const mat = new THREE.MeshBasicMaterial({
          color: 0xff44ff,
          toneMapped: false,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const mesh = new THREE.Mesh(hitFlashGeo, mat);
        mesh.position.copy(position);
        mesh.scale.setScalar(scale);
        scene.add(mesh);

        const light = new THREE.PointLight(0xff22ff, 4, 80, 2);
        light.position.copy(position);
        scene.add(light);

        hitEffects.push({
          mesh,
          light,
          life: 0.35,
          maxLife: 0.35,
          baseScale: scale,
        });
      }

      function updateHitEffects(dt) {
        for (let i = hitEffects.length - 1; i >= 0; i--) {
          const e = hitEffects[i];
          e.life -= dt;
          const k = Math.max(0, e.life / e.maxLife);
          e.mesh.scale.setScalar(e.baseScale * (1 + (1 - k) * 2.5));
          e.mesh.material.opacity = k;
          e.light.intensity = 4 * k * k;
          if (e.life <= 0) {
            scene.remove(e.mesh);
            scene.remove(e.light);
            e.mesh.material.dispose();
            hitEffects.splice(i, 1);
          }
        }
      }

      const DUST_COUNT  = 3000;

      function makeDust() {
        const positions = new Float32Array(DUST_COUNT * 3);
        for (let i = 0; i < DUST_COUNT; i++) {
          positions[i * 3 + 0] =
            camera.position.x + (Math.random() - 0.5) * DUST_RADIUS * 2;
          positions[i * 3 + 1] =
            camera.position.y + (Math.random() - 0.5) * DUST_RADIUS * 2;
          positions[i * 3 + 2] =
            camera.position.z + (Math.random() - 0.5) * DUST_RADIUS * 2;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: 0xaaccff,
          size: 2.0,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.8,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const points = new THREE.Points(geo, mat);
        points.frustumCulled = false;
        return points;
      }

      // ------------------------------------------------------------

      // ------------------------------------------------------------
      function distanceBetweenStars(a, b) {
        if (!a || !b) return 0;
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function tryHyperJump() {
        if (state.dead || game.hyper.active) return;

        // Если карта закрыта — откроем её, чтобы игрок выбрал цель
        if (!GALAXY.isOpen()) {
          GALAXY.toggle();
          return;
        }

        const curIdx = GALAXY.currentIndex;
        const targetIdx = GALAXY.selectedIndex;

        if (targetIdx === curIdx) {
          console.log("HYPER: цель совпадает с текущей звездой");
          return;
        }

        const cur = GALAXY.getCurrentStar();
        const dst = GALAXY.getStar(targetIdx);
        if (!cur || !dst) return;

        const dist = distanceBetweenStars(cur, dst);

        const fuelCost = Math.max(
          ship.TUNING.fuel_hyper_min, Math.round(dist * ship.TUNING.fuel_hyper));

        if (state.fuel < fuelCost) {
          console.log(
            `HYPER: недостаточно топлива (нужно ${fuelCost}, есть ${Math.round(state.fuel)})`,
          );
          return;
        }

        // Запускаем анимацию
        game.hyper.active = true;
        game.hyper.t = 0;
        game.hyper.targetIdx = targetIdx;
        game.hyper.fuelCost = fuelCost;

        elHyperTarget.textContent = `${cur.name} → ${dst.name}`;

        kit.sounds.hjump.play();
        HYPERFX.start(game.hyper.duration); // визуал Гиперпрыжка

        GALAXY.setOpen(false);

          elHyper.style.display = "none";
          return;

///////////////////////////////////////////////////////////////////// 🔍 .keys:

// ------- Плавная тяга с инерцией -------
const thrustIn = (keys["ArrowUp"] ? 1 : 0) - (keys["ArrowDown"] ? 1 : 0);

state.speed += thrustIn * ship.THR.accel * dt;

// Экспоненциальное торможение (не зависит от FPS)

const damping = thrustIn === 0 ? ship.THR.brake : ship.THR.drag;

);

  const az = (keys["KeyA"] ? 1 : 0) - (keys["KeyD"] ? 1 : 0); // roll

  // Разгон по осям
  state.angVel.pitch += ax * ship.ROT.accel * dt;
  state.angVel.yaw   += ay * ship.ROT.accel * dt;
  state.angVel.roll  += az * ship.ROT.accel * dt;

  // Экспоненциальное торможение (работает и при отпущенной клавише,
  // и как «вязкое» ограничение сверху)
  const damp = Math.exp(-ship.ROT.damping * dt);
  state.angVel.pitch *= damp;
  state.angVel.yaw   *= damp;
  state.angVel.roll  *= damp;

  // Ограничение максимальной угловой скорости
  state.angVel.pitch = THREE.MathUtils.clamp(state.angVel.pitch, -ship.ROT.maxPitch, ship.ROT.maxPitch);
  state.angVel.yaw   = THREE.MathUtils.clamp(state.angVel.yaw,   -ship.ROT.maxYaw,   ship.ROT.maxYaw);
  state.angVel.roll  = THREE.MathUtils.clamp(state.angVel.roll,  -ship.ROT.maxRoll,  ship.ROT.maxRoll);

  // Мёртвая зона, чтобы не «дрожал» на нуле
  if (Math.abs(state.angVel.pitch) < 1e-4) state.angVel.pitch = 0;
  if (Math.abs(state.angVel.yaw)   < 1e-4) state.angVel.yaw   = 0;
  if (Math.abs(state.angVel.roll)  < 1e-4) state.angVel.roll  = 0;

  // Применяем вращение
  camera.rotateX(state.angVel.pitch * dt);
  camera.rotateY(state.angVel.yaw   * dt);
  camera.rotateZ(state.angVel.roll  * dt);
}
////////////////////////////////////////////////////////////////////////////////

        // Движение вперёд
        const forward = tmpVec
          .set(0, 0, -1)
          .applyQuaternion(camera.quaternion)
          .clone();
        camera.position.addScaledVector(forward, state.speed * dt);

        // Дрейф метеоров (мир летит на игрока — минус корректный)
        //const drift = forward.multiplyScalar(-state.speed * dt);

        // Пыль частично «догоняет» камеру.
        //   0.0 = пыль стоит в мире → летит на игрока на полной скорости
        //   0.8 = пыль почти «прилипла» к камере → почти не набегает
        //   1.0 = пыль движется вместе с кораблём → стоит на месте визуально
        const DUST_FOLLOW = 0.7;
        const METEOR_FOLLOW = 0.0;
        const dustDrift = forward
          .clone()
          .multiplyScalar((state.speed - 5) * dt * DUST_FOLLOW);

        // Пыль
        {
          const attr = dust.geometry.attributes.position;
          const arr = attr.array;
          const H = DUST_RADIUS;
          const cx = camera.position.x;
          const cy = camera.position.y;
          const cz = camera.position.z;

          for (let i = 0; i < DUST_COUNT; i++) {
            const ix = i * 3;
            arr[ix + 0] += dustDrift.x;
            arr[ix + 1] += dustDrift.y;
            arr[ix + 2] += dustDrift.z;

            const dx = arr[ix + 0] - cx;
            const dy = arr[ix + 1] - cy;
            const dz = arr[ix + 2] - cz;
            if (dx > H) arr[ix + 0] -= H * 2;
            if (dx < -H) arr[ix + 0] += H * 2;
            if (dy > H) arr[ix + 1] -= H * 2;
            if (dy < -H) arr[ix + 1] += H * 2;
            if (dz > H) arr[ix + 2] -= H * 2;
            if (dz < -H) arr[ix + 2] += H * 2;
          }
          attr.needsUpdate = true;

          const speedFactor = Math.min(
            1,
            Math.abs(state.speed) / state.maxSpeed,
          );
          dust.material.opacity = 0.35 + speedFactor * 0.65;
          dust.material.size = 1.2 + speedFactor * 2.0;
        }

        // Метеоры
        player.getWorldPosition(playerWorldPos);

        for (const m of meteors) {
          m.position.x += dustDrift.x;
          m.position.y += dustDrift.y;
          m.position.z += dustDrift.z;

          m.rotation.x += m.userData.spin.x * dt;
          m.rotation.y += m.userData.spin.y * dt;
          m.rotation.z += m.userData.spin.z * dt;

          wrapAround(m.position, camera.position, METEOR_RADIUS);

          /// 💀💀💀
          const d = m.position.distanceTo(playerWorldPos);
          if (d < m.userData.size + 12) {

            let damag = 5*dt;
            if(state.speed > 10) damag = 0.4*state.speed * dt;

            state.shield -= damag;

            flashDamage(0.6);
            if (state.shield <= 0) {
              state.shield = 0;
              state.dead = true;
              elGameover.style.display = "flex";
              playDeath();
            }
          }
        }
          
        ///-----------------------------------|
        /// Проверка столкновения с Планетами.|
        ///-----------------------------------:
        for (const p of planets)
        {
            const dangerLevel = p.getDangerLevel(playerWorldPos);
            
            if(dangerLevel > 0.99)
            {
                state.shield = 0;
                state.dead = true;
                elGameover.style.display = "flex";
                playDeath();
            }
            else if(dangerLevel > 0.1)
            {
                state.shield -= 0.001 * dt;
                flashDamage(0.6 * dangerLevel);
            }
        }
        
        ///-----------------------------------|
        /// Проверка столкновения со Звездой. |
        ///-----------------------------------:
        if (currentStarHandle && currentStarHandle.getDangerLevel)
        {
            const starDanger = currentStarHandle.getDangerLevel(playerWorldPos);

            if (starDanger > 0.99)
            {
                state.shield = 0;
                state.dead = true;
                elGameover.style.display = "flex";
                playDeath();
            }
            else if (starDanger > 0.1)
            {
                state.shield -= 0.001 * dt;
                flashDamage(starDanger);
            }
        }
        
        ///-------------------------------------|
        /// Cтанция в системе[СТЫКОВКА].
        ///-------------------------------------:
        const playerWorldQuat = new THREE.Quaternion();
        player.getWorldQuaternion(playerWorldQuat);
        // playerWorldPos уже вычислен выше
        
        
const up = new THREE.Vector3(0,1,0).applyQuaternion(playerWorldQuat);
const nose = new THREE.Vector3(0,0,-1).applyQuaternion(playerWorldQuat);
const gateUp = new THREE.Vector3(0,1,0); // станция не повёрнута
const gateIn = new THREE.Vector3(0,0,1);  // внутрь станции

//console.log(
//"up dot gateUp:", up.dot(gateUp).toFixed(3),
//"nose dot gateIn:", nose.dot(gateIn).toFixed(3),
//);
/// Интерпретация:
/// up dot gateUp ≈ +1 — корабль «стоит на киле» относительно станции, верх совпадает.
/// up dot gateUp ≈ −1 — корабль вверх ногами относительно станции.
/// up dot gateUp ≈  0 — корабль «лежит на боку» (крен ±90°).
/// nose dot gateIn ≈ +1 — нос смотрит внутрь станции, всё правильно.
/// nose dot gateIn ≈ −1 — нос смотрит наружу, ты летишь «задом наперёд».
        
        if (currentStationHandle)
        { const status = currentStationHandle.getLandingStatus(
            playerWorldPos,
            playerWorldQuat,
          );

          if (status === 2)
          {
            // авария
            game.isDocked = false;
            state.shield = 0;
            state.dead = true;
            elGameover.style.display = "flex";
            playDeath();
          }
          else if (status === 1) {
            // успешная посадка — например, пополнить топливо/щит,
            // показать сообщение, отключить управление и т.п.
            // ...
            game.isDocked = true;
          }
          else
          {
            game.isDocked = false; // ???
          }
        }
        
        // Стрельба
        fireCooldown -= dt;
        if (keys["Space"]) fire();

        // Топливо
        if (state.speed !== 0)
        {
            state.fuel -= Math.abs(state.speed) * dt * ship.TUNING.fuel_rate;
            if (state.fuel <= 0)
            {   state.fuel  = 0;
                state.speed *= 0.98;
            }
        }
            
    } else
    {   fireCooldown -= dt;
    }
////////////////////////////////////////////////////////////////////////////////

        // Дульные вспышки гаснут
        for (const m of player.userData.muzzles) {
          m.material.opacity = Math.max(0, m.material.opacity - dt * 12);
        }

        // Лазеры
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.position.addScaledVector(l.userData.velocity, dt);
          l.userData.life -= dt;
          l.material.opacity = Math.min(1, l.userData.life * 3);

          if (l.userData.life <= 0) {
            scene.remove(l);
            l.material.dispose();
            lasers.splice(i, 1);
            continue;
          }

          // Лазер vs враг
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (l.position.distanceTo(e.position) < 30) {
              e.userData.hp -= 1;
              spawnHitFlash(l.position.clone(), 2.5);
              playDamag();

              scene.remove(l);
              l.material.dispose();
              lasers.splice(i, 1);

              if (e.userData.hp <= 0) {
                scene.remove(e);
                enemies.splice(j, 1);
                state.kills++;
                state.credits += 100;
                spawnHitFlash(e.position.clone(), 6);
              }
              break;
            }
          }

          // Лазер vs метеор
          for (let k = meteors.length - 1; k >= 0; k--) {
            const m = meteors[k];
            if (l.position.distanceTo(m.position) < m.userData.size) {
              scene.remove(l);
              l.material.dispose();
              lasers.splice(i, 1);
              m.userData.size = Math.max(1, m.userData.size * 0.5);
              m.scale.setScalar(0.5);
              break;
            }
          }
        }

        // Спавн врагов
        if (!state.dead && enemies.length < 5 && Math.random() < 0.005)
          spawnEnemy();

        // ИИ врагов
        player.getWorldPosition(playerWorldPos);

        for (const e of enemies) {
          const toPlayer = new THREE.Vector3().subVectors(
            playerWorldPos,
            e.position,
          );
          const dist = toPlayer.length();
          toPlayer.normalize();
          e.position.addScaledVector(toPlayer, e.userData.speed * dt);
          e.rotation.x += dt * 0.5;
          e.rotation.y += dt * 0.7;

          if (dist < 30 && !state.dead) {
            state.shield -= 30 * dt;
            flashDamage(0.4);
            if (state.shield <= 0) {
              state.shield = 0;
              state.dead = true;
              elGameover.style.display = "flex";
              playDeath();
            }
          }
        }

        // Светило и планеты текущей системы
        if (currentStarHandle && currentStarHandle.update) {
          currentStarHandle.update(dt, time);
        }
        for (const p of planets) p.update(dt);
        
        ///-------------------------------------|
        /// Cтанция в системе.
        ///-------------------------------------:
        if (currentStationHandle) {
            currentStationHandle.update(dt, time);
        }

        // Звёздное небо следует за камерой
        skystars.position.copy(camera.position);
        if (skystars.userData.update) skystars.userData.update(dt, clock.elapsedTime);

        // Пульсация двигателей
        const engMat = player.userData.engines[0].material;
        const intensity = 0.6 + (Math.abs(state.speed) / state.maxSpeed) * 0.8;
        engMat.color.setRGB(0.4 * intensity, 0.8 * intensity, 1.0 * intensity);

        // Затухание damage flash
        if (damageTimer > 0) {
          damageTimer -= dt;
          if (damageTimer <= 0) elDamage.style.opacity = "0";
        }

        updateHitEffects(dt);
        updateHUD();
        composer.render();
        requestAnimationFrame(animate);
    }

    animate();

    ///------------------------------------------------------------------------|
    /// Resize.
    ///------------------------------------------------------------------------:    
    function resize() {
    
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        
        if (skystars.userData.setPixelRatio) {
            skystars.userData.setPixelRatio(devicePixelRatio);
        }
          
    /// console.log("🚩 resize OK");
    }

    window.addEventListener('resize', resize);
    resize();
    </script>
  </body>
</html>
