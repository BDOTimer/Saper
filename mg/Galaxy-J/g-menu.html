<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Galaxy-J — Prototype v2</title>
    <link
      rel="icon"
      type="image/png"
      href="../res/favicon-64.png"
      sizes="64x64"
    />
    
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Galaxy-J — Меню</title>

    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background-color: #0a140a;
      font-family: "Courier New", monospace;
    }

    .menu-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: clamp(20px, 5vh, 40px);
      padding: 20px;
      position: relative;
    }

    /* Декоративная сетка на фоне */
    .menu-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(160, 255, 120, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160, 255, 120, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(
        circle at center,
        #000 0%,
        transparent 75%
      );
    }

    h1 {
      color: #a8ff78;
      font-size: clamp(28px, 9vw, 56px);
      letter-spacing: clamp(3px, 1.5vw, 10px);
      text-shadow:
        0 0 10px #a8ff78,
        0 0 30px #a8ff78,
        0 0 60px rgba(168, 255, 120, 0.5);
      text-align: center;
      z-index: 2;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.75;
      }
    }

    .subtitle {
      color: #eaffd0;
      opacity: 0.5;
      font-size: clamp(11px, 3vw, 15px);
      letter-spacing: 4px;
      z-index: 2;
      margin-top: -10px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 16px);
      width: min(340px, 82vw);
      z-index: 2;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(9px, 2.2vh, 14px) clamp(20px, 5vw, 30px);
      background: rgba(168, 255, 120, 0.08);
      border: 2px solid #a8ff78;
      color: #a8ff78;
      font-family: inherit;
      font-size: clamp(16px, 4.5vw, 22px);
      letter-spacing: 3px;
      text-decoration: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(168, 255, 120, 0.2);
      text-align: left;
    }

    .menu-btn[hidden] {
      display: none;
    }

    .menu-btn[disabled],
    .menu-btn.is-disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    .menu-btn .num {
      color: #eaffd0;
      opacity: 0.6;
      font-size: 0.85em;
      margin-right: 10px;
    }

    .menu-btn .arrow {
      transition: transform 0.2s ease;
    }

    .menu-btn:hover,
    .menu-btn:active {
      background: rgba(168, 255, 120, 0.25);
      color: #f4ffe8;
      box-shadow:
        0 0 25px rgba(168, 255, 120, 0.6),
        inset 0 0 20px rgba(168, 255, 120, 0.2);
      transform: translateY(-2px);
    }

    .menu-btn:hover .arrow {
      transform: translateX(6px);
    }

    .footer {
      position: absolute;
      bottom: 15px;
      color: #a8ff78;
      opacity: 0.35;
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 2px;
      z-index: 2;
    }

    /* Декоративная картинка справа */
    .side-art {
      position: absolute;
      right: clamp(0px, 9vw, 60px);
      top: 50%;
      transform: translateY(-50%);
      height: min(70vh, 520px);
      width: auto;
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 0 24px rgba(168, 255, 120, 0.5));
      z-index: 1;
    }

    @media (max-width: 700px) {
      .side-art {
        display: none;
      }
    }

    /* Уменьшенная кнопка F11 — шрифт вдвое меньше */
    .menu-btn--small {
      font-size: clamp(8px, 2.25vw, 20px);
      letter-spacing: 1.5px;
      padding: clamp(6px, 1.4vh, 9px) clamp(14px, 3.5vw, 16px);
      border-width: 1px;
    }

        /* --- Акцентная кнопка (аналог .winner-screen button) --- */
    .winner-screen button,
    .back-btn {
        padding: 15px 30px;
        font-size: clamp(16px, 4vw, 20px);
        background: #a8ff78;
        color: #0a140a;
        border: none;
        cursor: pointer;
        border-radius: 10px;
        font-weight: bold;
        font-family: inherit;
        box-shadow: 0 0 20px rgba(168, 255, 120, 0.6);
        text-decoration: none;
        display: inline-block;
        letter-spacing: 2px;
        transition: all 0.2s ease;
    }

    .winner-screen button:hover,
    .winner-screen button:focus {
        background: #c6ff9a;
        color: #0a140a;
        box-shadow:
            0 0 28px rgba(168, 255, 120, 0.85),
            0 0 60px rgba(168, 255, 120, 0.35);
        transform: translateY(-2px);
        outline: none;
    }

    /* --- Кнопка "Назад" (контурная) --- */
    .back-btn {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 8px 16px;
        font-size: clamp(13px, 3vw, 16px);
        background: rgba(168, 255, 120, 0.15);
        color: #a8ff78;
        border: 2px solid #a8ff78;
        box-shadow: 0 0 12px rgba(168, 255, 120, 0.4);
        z-index: 25;
        letter-spacing: 2px;
    }

    .back-btn:hover,
    .back-btn:focus {
        background: rgba(168, 255, 120, 0.28);
        color: #f4ffe8;
        box-shadow: 0 0 20px rgba(168, 255, 120, 0.7);
        outline: none;
    }

    .back-btn:active {
        background: rgba(168, 255, 120, 0.55);
        color: #0a140a;
        box-shadow: 0 0 26px rgba(168, 255, 120, 0.9);
    }
    </style>
  </head>

  <body>
    <script src="../res/click-sound.js"></script>

    <div class="menu-wrapper">
      <h1>GALAXY-J</h1>
      <div class="subtitle">Classic space • ZX SPECTRUM</div>

      <div class="menu-buttons">
        <a href="game-j.html" class="menu-btn" data-action="new" >
          <span><span class="num">01</span>НОВАЯ ИГРА</span>
          <span class="arrow">▶</span>
        </a>

        <a
          href="mg/elite/game.html?continue=1"
          class="menu-btn is-disabled"
          data-action="continue"
          id="btn-continue"
          aria-disabled="true"
        >
          <span><span class="num">02</span>ПРОДОЛЖИТЬ</span>
          <span class="arrow">▶</span>
        </a>

        <a href="mg/elite/about.html" 
           class="menu-btn" 
           data-action="about"
           id="btn-about"
        >
          <span><span class="num">03</span>ОПИСАНИЕ ИГРЫ</span>
          <span class="arrow">▶</span>
        </a>

        <a href="mg/elite/scores.html" class="menu-btn" data-action="scores">
          <span><span class="num">04</span>РЕКОРД-ЛИСТ</span>
          <span class="arrow">▶</span>
        </a>

        <button
          type="button"
          class="menu-btn menu-btn--small is-disabled"
          id="btn-fullscreen"
          data-action="fullscreen"
        >
          <span><span class="num">05</span>F11 - ПОЛНЫЙ ЭКРАН</span>
          <span class="arrow">⛶</span>
        </button>
      </div>

      <div class="footer">ВЫБЕРИ ДЕЙСТВИЕ</div>

      <!--
      <img src="../res/123.png" alt="" class="side-art" />
      -->
    </div>

    <a href="../../index.html" class="back-btn">← Меню</a>

</html>
