<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Galaxy-J — Prototype v2</title>
    <link
      rel="icon"
      type="image/png"
      href="../res/favicon-64.png"
      sizes="64x64"
    />
    
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link
      rel="icon"
      type="image/png"
      href="mg/res/favicon-64.png"
      sizes="64x64"
    />

    <title>Elite — Меню</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background-color: #0a140a;
        font-family: "Courier New", monospace;
      }

      .menu-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: clamp(20px, 5vh, 40px);
        padding: 20px;
        position: relative;
      }

      /* Декоративная сетка на фоне */
      .menu-wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(160, 255, 120, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(160, 255, 120, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, #000 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(
          circle at center,
          #000 0%,
          transparent 75%
        );
      }

      h1 {
        color: #a8ff78;
        font-size: clamp(28px, 9vw, 56px);
        letter-spacing: clamp(3px, 1.5vw, 10px);
        text-shadow:
          0 0 10px #a8ff78,
          0 0 30px #a8ff78,
          0 0 60px rgba(168, 255, 120, 0.5);
        text-align: center;
        z-index: 2;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.75;
        }
      }

      .subtitle {
        color: #eaffd0;
        opacity: 0.5;
        font-size: clamp(11px, 3vw, 15px);
        letter-spacing: 4px;
        z-index: 2;
        margin-top: -10px;
      }

      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2vh, 16px);
        width: min(340px, 82vw);
        z-index: 2;
      }

      .menu-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: clamp(9px, 2.2vh, 14px) clamp(20px, 5vw, 30px);
        background: rgba(168, 255, 120, 0.08);
        border: 2px solid #a8ff78;
        color: #a8ff78;
        font-family: inherit;
        font-size: clamp(16px, 4.5vw, 22px);
        letter-spacing: 3px;
        text-decoration: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(168, 255, 120, 0.2);
        text-align: left;
      }

      .menu-btn[hidden] {
        display: none;
      }

      .menu-btn[disabled],
      .menu-btn.is-disabled {
        opacity: 0.35;
        pointer-events: none;
        filter: grayscale(0.6);
      }

      .menu-btn .num {
        color: #eaffd0;
        opacity: 0.6;
        font-size: 0.85em;
        margin-right: 10px;
      }

      .menu-btn .arrow {
        transition: transform 0.2s ease;
      }

      .menu-btn:hover,
      .menu-btn:active {
        background: rgba(168, 255, 120, 0.25);
        color: #f4ffe8;
        box-shadow:
          0 0 25px rgba(168, 255, 120, 0.6),
          inset 0 0 20px rgba(168, 255, 120, 0.2);
        transform: translateY(-2px);
      }

      .menu-btn:hover .arrow {
        transform: translateX(6px);
      }

      .footer {
        position: absolute;
        bottom: 15px;
        color: #a8ff78;
        opacity: 0.35;
        font-size: clamp(10px, 2.5vw, 12px);
        letter-spacing: 2px;
        z-index: 2;
      }

      /* Декоративная картинка справа */
      .side-art {
        position: absolute;
        right: clamp(0px, 9vw, 60px);
        top: 50%;
        transform: translateY(-50%);
        height: min(70vh, 520px);
        width: auto;
        opacity: 0.5;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        filter: drop-shadow(0 0 24px rgba(168, 255, 120, 0.5));
        z-index: 1;
      }

      @media (max-width: 700px) {
        .side-art {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <script src="mg/res/click-sound.js"></script>

    <div class="menu-wrapper">
      <h1>GALAXY-J</h1>
      <div class="subtitle">Classic space • ZX SPECTRUM</div>

      <div class="menu-buttons">
        <a href="game-j.html" class="menu-btn" data-action="new">
          <span><span class="num">01</span>НОВАЯ ИГРА</span>
          <span class="arrow">▶</span>
        </a>

        <a
          href="mg/elite/game.html?continue=1"
          class="menu-btn is-disabled"
          data-action="continue"
          id="btn-continue"
          aria-disabled="true"
        >
          <span><span class="num">02</span>ПРОДОЛЖИТЬ</span>
          <span class="arrow">▶</span>
        </a>

        <a href="mg/elite/about.html" class="menu-btn" data-action="about">
          <span><span class="num">03</span>ОПИСАНИЕ ИГРЫ</span>
          <span class="arrow">▶</span>
        </a>

        <a href="mg/elite/scores.html" class="menu-btn" data-action="scores">
          <span><span class="num">04</span>РЕКОРД-ЛИСТ</span>
          <span class="arrow">▶</span>
        </a>

        <button
          type="button"
          class="menu-btn"
          id="btn-fullscreen"
          data-action="fullscreen"
        >
          <span><span class="num">05</span>НА ВЕСЬ ЭКРАН</span>
          <span class="arrow">⛶</span>
        </button>
      </div>

      <div class="footer">ВЫБЕРИ ДЕЙСТВИЕ</div>

      <img src="mg/res/123.png" alt="" class="side-art" />
    </div>

    <script>
      (function () {
        /* ---------- Проверка сохранения (заглушка) ---------- */
        // Замените на реальную проверку: localStorage, IndexedDB и т.п.
        function hasSave() {
          try {
            return !!localStorage.getItem("elite.save");
          } catch (e) {
            return false;
          }
        }

        var btnContinue = document.getElementById("btn-continue");
        
        if (hasSave()) {
          btnContinue.classList.remove("is-disabled");
          btnContinue.removeAttribute("aria-disabled");
        } else {
          btnContinue.addEventListener("click", function (e) {
            e.preventDefault();
          });
        }

        /* ---------- Полноэкранный режим ---------- */
        var btnFs = document.getElementById("btn-fullscreen");

        function isFullscreen() {
          return !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement
          );
        }

        function requestFs(el) {
          if (el.requestFullscreen) return el.requestFullscreen();
          if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
          if (el.msRequestFullscreen) return el.msRequestFullscreen();
        }

        function exitFs() {
          if (document.exitFullscreen)
            return document.exitFullscreen();

          if (document.webkitExitFullscreen)
            return document.webkitExitFullscreen();

          if (document.msExitFullscreen) 
            return document.msExitFullscreen();
        }

        btnFs.addEventListener("click", function () {
          if (isFullscreen()) {
            exitFs();
          } else {
            requestFs(document.documentElement).catch(function () {});
          }
        });

        function updateFsLabel() {
          var label = btnFs.querySelector("span:first-child");
          // сохраняем номер "05", меняем только текст
          label.innerHTML =
            '<span class="num">05</span>' +
            (isFullscreen() ? "ВЫЙТИ ИЗ ПОЛНОГО ЭКРАНА" : "НА ВЕСЬ ЭКРАН");
        }

        ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(
          function (evt) {
            document.addEventListener(evt, updateFsLabel);
          }
        );

   /* ---------- НОВАЯ ИГРА в новом окне ---------- */
    var btnNew = document.querySelector('.menu-btn[data-action="new"]');
    if (btnNew) {
      btnNew.addEventListener("click", function (e) {
        e.preventDefault();
        window.open('game-j.html', '_blank');
      });
    }
        
      })();

    </script>
  </body>
</html>
