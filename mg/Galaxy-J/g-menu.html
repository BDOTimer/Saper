<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Galaxy-J — Меню</title>
    
    <link
      rel="icon"
      type="image/png"
      href="../res/favicon-64.png"
      sizes="64x64"
    />
    
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, 
               user-scalable=no, viewport-fit=cover"
    />

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ---------- ФОН СТРАНИЦЫ ---------- */
  html,
  body {
    height: 100%;
    overflow: hidden;
    background-color: #0a140a;
    font-family: "Courier New", monospace;

    background-image: url("res/planet-4+1.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* ---------- ОБЁРТКА МЕНЮ ---------- */
  .menu-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: clamp(20px, 5vh, 40px);
    padding: 20px;
    position: relative;
    z-index: 2;
  }

  /* ---------- ДЕКОРАТИВНАЯ СЕТКА ---------- */
  .menu-wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(160, 255, 120, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(160, 255, 120, 0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(
      circle at center,
      #000 0%,
      transparent 75%
    );
    z-index: 1;
  }

  /* ---------- ЗАТЕМНЯЮЩАЯ ПОДЛОЖКА ПОД МЕНЮ ---------- */
  .menu-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0.55) 0%,
      rgba(0, 0, 0, 0.75) 55%,
      rgba(0, 0, 0, 0.9) 100%
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- ЗАГОЛОВОК ---------- */
  h1 {
    color: #d8ffd8;
    font-size: clamp(28px, 9vw, 72px);
    letter-spacing: clamp(3px, 1.5vw, 10px);
    text-shadow:
      0 0 10px #a8ff78,
      0 0 30px #a8ff78,
      0 0 60px rgba(168, 255, 120, 0.5);
    text-align: center;
    z-index: 2;
    position: relative;
    animation: pulse 3.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 0.85;
      text-shadow:
        0 0 10px #a8ff78,
        0 0 30px #a8ff78,
        0 0 60px rgba(168, 255, 120, 0.5);
    }
    50% {
      opacity: 0.45;
      text-shadow:
        0 0 6px #a8ff78,
        0 0 16px #a8ff78,
        0 0 32px rgba(168, 255, 120, 0.35),
        0 0 90px rgba(168, 255, 120, 0.25);
    }
  }

  .subtitle {
    color: #eaffd0;
    opacity: 0.5;
    font-size: clamp(11px, 3vw, 15px);
    letter-spacing: 4px;
    z-index: 2;
    position: relative;
    margin-top: -10px;
  }

  /* ---------- КОНТЕЙНЕР КНОПОК (матовая плашка) ---------- */
  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vh, 16px);
    width: min(400px, 82vw);
    z-index: 2;
    position: relative;
    padding: 16px;
    border-radius: 18px;
  }

  .menu-buttons::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 18px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- ОБЩИЙ СТИЛЬ КНОПОК (меню + back) ---------- */
  .menu-btn,
  .back-btn {
    background: rgba(168, 255, 120, 0.15);
    border: 2px solid #a8ff78;
    color: #a8ff78;
    border-radius: 10px;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 12px rgba(168, 255, 120, 0.4);
  }

  /* ---------- HOVER / FOCUS ---------- */
  .menu-btn:hover,
  .menu-btn:focus,
  .back-btn:hover,
  .back-btn:focus {
    background: rgba(168, 255, 120, 0.28);
    color: #f4ffe8;
    box-shadow: 0 0 20px rgba(168, 255, 120, 0.7);
    outline: none;
  }

  /* ---------- ACTIVE ---------- */
  .menu-btn:active,
  .back-btn:active {
    background: rgba(168, 255, 120, 0.55);
    color: #0a140a;
    box-shadow: 0 0 26px rgba(168, 255, 120, 0.9);
  }

  /* ---------- УНИКАЛЬНОЕ ДЛЯ .menu-btn ---------- */
  .menu-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(9px, 2.2vh, 14px) clamp(20px, 5vw, 30px);
    font-size: clamp(16px, 4.5vw, 22px);
    position: relative;
    overflow: hidden;
    text-align: left;
  }

  .menu-btn[hidden] {
    display: none;
  }

  .menu-btn[disabled],
  .menu-btn.is-disabled {
    opacity: 0.35;
    pointer-events: none;
    filter: grayscale(0.6);
  }

  .menu-btn .num {
    color: #eaffd0;
    opacity: 0.7;
    font-size: 0.85em;
    margin-right: 10px;
  }

  .menu-btn .arrow {
    transition: transform 0.2s ease;
  }

  .menu-btn:hover .arrow,
  .menu-btn:focus .arrow {
    transform: translateX(6px);
  }

  /* ---------- УМЕНЬШЕННАЯ КНОПКА F11 ---------- */
  .menu-btn--small {
    font-size: clamp(8px, 2.25vw, 20px);
    letter-spacing: 1.5px;
    padding: clamp(6px, 1.4vh, 9px) clamp(14px, 3.5vw, 16px);
    border-width: 1px;
  }

  /* ---------- ФУТЕР ---------- */
  .footer {
    position: absolute;
    bottom: 15px;
    color: #a8ff78;
    opacity: 0.35;
    font-size: clamp(10px, 2.5vw, 12px);
    letter-spacing: 2px;
    z-index: 2;
  }

  /* ---------- ДЕКОРАТИВНАЯ КАРТИНКА СПРАВА ---------- */
  .side-art {
    position: absolute;
    right: clamp(0px, 9vw, 60px);
    top: 50%;
    transform: translateY(-50%);
    height: min(70vh, 520px);
    width: auto;
    opacity: 0.5;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    filter: drop-shadow(0 0 24px rgba(168, 255, 120, 0.5));
    z-index: 1;
  }

  @media (max-width: 700px) {
    .side-art {
      display: none;
    }
  }

  /* ---------- АКЦЕНТНАЯ КНОПКА (winner-screen) ---------- */
  .winner-screen button {
    padding: 15px 30px;
    font-size: clamp(16px, 4vw, 20px);
    background: #a8ff78;
    color: #0a140a;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-weight: bold;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(168, 255, 120, 0.6);
    text-decoration: none;
    display: inline-block;
    letter-spacing: 2px;
    transition: all 0.2s ease;
  }

  .winner-screen button:hover,
  .winner-screen button:focus {
    background: #c6ff9a;
    color: #0a140a;
    box-shadow:
      0 0 28px rgba(168, 255, 120, 0.85),
      0 0 60px rgba(168, 255, 120, 0.35);
    transform: translateY(-2px);
    outline: none;
  }

  /* ---------- КНОПКА "НАЗАД" (только позиция) ---------- */
  .back-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 8px 16px;
    font-size: clamp(13px, 3vw, 16px);
    z-index: 25;
    display: inline-block;
  }
</style>
</head>
