<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite — Neon Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            color: #0ff;
            -webkit-tap-highlight-color: transparent;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 10px;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: #000;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            color: #0ff;
            font-size: clamp(11px, 2.6vw, 14px);
            text-shadow: 0 0 8px #0ff;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .hud .label { opacity: 0.6; }
        .hud .val { color: #fff; }

        .corner-btn {
            position: absolute;
            top: 10px;
            padding: 6px 12px;
            font-family: inherit;
            font-size: clamp(11px, 2.6vw, 14px);
            background: rgba(0, 255, 255, 0.12);
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            z-index: 20;
            user-select: none;
            line-height: 1;
        }
        .corner-btn:active { background: rgba(0, 255, 255, 0.4); color: #000; }
        .back-btn { left: 10px; }
        .fs-btn   { right: 10px; }

        .status-bar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: clamp(11px, 2.6vw, 14px);
            text-shadow: 0 0 8px #0ff;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
            max-width: 96vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 5;
        }
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #0ff;
            box-shadow: 0 0 6px #0ff;
        }
        .crosshair::before {
            top: 50%; left: 0; right: 0; height: 1px;
            transform: translateY(-50%);
        }
        .crosshair::after {
            left: 50%; top: 0; bottom: 0; width: 1px;
            transform: translateX(-50%);
        }
        .crosshair .dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            margin: -2px 0 0 -2px;
            background: #0ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #0ff;
        }

        /* Индикатор скорости */
        .speed-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: min(220px, 50vw);
            height: 6px;
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 3px;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }
        .speed-indicator .fill {
            height: 100%;
            background: linear-gradient(90deg, #0ff, #f0f);
            box-shadow: 0 0 10px #0ff;
            transition: width 0.1s linear;
            width: 0%;
        }

        .trade-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(520px, 92vw);
            max-height: 86vh;
            background: rgba(0, 10, 20, 0.96);
            border: 2px solid #0ff;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 50;
            overflow-y: auto;
        }
        .trade-panel.show { display: flex; }

        .trade-panel h2 {
            color: #0ff;
            text-align: center;
            letter-spacing: 3px;
            font-size: clamp(16px, 4vw, 22px);
            text-shadow: 0 0 12px #0ff;
        }

        .trade-panel .info {
            display: flex;
            justify-content: space-between;
            font-size: clamp(12px, 2.8vw, 15px);
            color: #fff;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 8px;
        }

        .trade-panel .info .label { color: #0ff; }

        .goods-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .good-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 8px;
            align-items: center;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: clamp(11px, 2.6vw, 14px);
            background: rgba(0, 255, 255, 0.05);
        }

        .good-row .name { color: #0ff; }
        .good-row .price { color: #0f0; text-shadow: 0 0 6px #0f0; }
        .good-row .qty { color: #fff; min-width: 40px; text-align: right; }

        .good-row button {
            padding: 4px 10px;
            font-family: inherit;
            font-size: clamp(10px, 2.4vw, 13px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .good-row button:active { background: #0ff; color: #000; }
        .good-row button:disabled { opacity: 0.3; cursor: not-allowed; }

        .trade-panel .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .trade-panel .actions button {
            padding: 10px 20px;
            font-family: inherit;
            font-size: clamp(12px, 2.8vw, 15px);
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        .trade-panel .actions button.secondary {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
        }
        .trade-panel .actions button:active { transform: scale(0.96); }

        .help-block {
            position: absolute;
            top: 40px;
            left: 10px;
            color: rgba(0, 255, 255, 0.55);
            font-size: clamp(10px, 2.2vw, 12px);
            line-height: 1.45;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 4px rgba(0, 255, 255, 0.4);
        }

        @media (max-width: 700px) {
            .help-block { display: none; }
        }
    </style>
</head>
<body>

<a href="../index.html" class="corner-btn back-btn">← Меню</a>
<button type="button" class="corner-btn fs-btn" id="btnFullscreen">⛶</button>

<div class="game-wrapper">
    <canvas id="canvas"></canvas>

    <div class="hud">
        <span><span class="label">КРЕДИТЫ:</span> <span class="val" id="credits">100.0</span></span>
        <span><span class="label">ТОПЛИВО:</span> <span class="val" id="fuel">7.0</span></span>
        <span><span class="label">ЩИТ:</span> <span class="val" id="shield">100</span></span>
        <span><span class="label">СКОРОСТЬ:</span> <span class="val" id="speed">0</span></span>
        <span><span class="label">СИСТЕМА:</span> <span class="val" id="system">Lave</span></span>
    </div>

    <div class="crosshair"><div class="dot"></div></div>

    <div class="help-block">
        W / S — тангаж<br>
        A / D — рыскание<br>
        J — тяга (удерживать)<br>
        ЛКМ — выстрел<br>
        ENTER — торговля<br>
        H — гиперпрыжок<br>
        R — ремонт
    </div>

    <div class="speed-indicator"><div class="fill" id="speedFill"></div></div>

    <div class="status-bar" id="status">W/S — тангаж · A/D — рыскание · J — тяга · ЛКМ — выстрел</div>

    <div class="trade-panel" id="tradePanel">
        <h2>ТОРГОВЛЯ</h2>
        <div class="info">
            <span><span class="label">Система:</span> <span id="tradeSystem">Lave</span></span>
            <span><span class="label">Кредиты:</span> <span id="tradeCredits">100.0</span></span>
            <span><span class="label">Трюм:</span> <span id="tradeCargo">0/20</span></span>
        </div>
        <div class="goods-list" id="goodsList"></div>
        <div class="actions">
            <button id="btnLaunch">ВЗЛЁТ</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //                       КОНСТАНТЫ
    // ============================================================
    const CANVAS_W = 640;
    const CANVAS_H = 480;
    const STAR_COUNT = 220;
    const FUEL_MAX = 7.0;

    // Физика корабля
    const PITCH_SPEED  = 1.8;    // рад/с — поворот вокруг локальной X (W/S)
    const YAW_SPEED    = 1.6;    // рад/с — поворот вокруг локальной Z (A/D)
    const THRUST_ACCEL = 60;     // ускорение при тяге (J)
    const MAX_SPEED    = 280;    // максимальная скорость
    const DRAG         = 0.6;    // торможение (доля скорости в секунду)

    const GOODS = [
        { name: 'Еда',        basePrice: 4.0,  eco: -1 },
        { name: 'Текстиль',   basePrice: 6.0,  eco: -1 },
        { name: 'Руды',       basePrice: 8.0,  eco: -1 },
        { name: 'Компьютеры', basePrice: 40.0, eco: 1 },
        { name: 'Оружие',     basePrice: 30.0, eco: 1 },
        { name: 'Наркотики',  basePrice: 20.0, eco: 1 },
    ];

    // ============================================================
    //                       DOM
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const creditsEl = document.getElementById('credits');
    const fuelEl = document.getElementById('fuel');
    const shieldEl = document.getElementById('shield');
    const speedEl = document.getElementById('speed');
    const systemEl = document.getElementById('system');
    const speedFill = document.getElementById('speedFill');

    const tradePanel = document.getElementById('tradePanel');
    const tradeSystem = document.getElementById('tradeSystem');
    const tradeCredits = document.getElementById('tradeCredits');
    const tradeCargo = document.getElementById('tradeCargo');
    const goodsList = document.getElementById('goodsList');

    // ============================================================
    //                       СОСТОЯНИЕ
    // ============================================================
    let player = {
        credits: 100.0,
        fuel: FUEL_MAX,
        shield: 100,
        cargo: {},
        cargoUsed: 0,
        cargoMax: 20,
        system: 'Lave',

        // Позиция и ориентация корабля
        x: 0, y: 0, z: 0,
        yaw: 0,      // рыскание (вокруг мировой Y)
        pitch: 0,    // тангаж (вокруг локальной X)
        roll: 0,     // крен — на будущее, пока 0
        speed: 0,    // текущая скорость
    };

    let stars = [];
    let planets = [];
    let enemies = [];
    let bullets = [];
    let particles = [];

    let mode = 'flight';
    let keys = {};
    let lastShot = 0;
    let mouseDown = false;
    let autoFireTimer = null;
    let touchStart = null;

    // ============================================================
    //                       ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ
    // ============================================================
    function makeSystem(seed, index) {
        let s = (seed * 1103515245 + index * 12345) >>> 0;
        const rand = () => {
            s = (s * 1664525 + 1013904223) >>> 0;
            return s / 4294967296;
        };
        const names = ['Lave', 'Diso', 'Leesti', 'Riedquat', 'Zaonce', 'Tionisla', 'Oresrati', 'Uszaa'];
        const name = names[Math.floor(rand() * names.length)] + (index > 0 ? ' ' + index : '');
        const radius = 30 + rand() * 50;
        const distance = rand() * 12 + 1;
        return { name, radius, distance, seed: s };
    }

    const systems = [];
    for (let i = 0; i < 20; i++) systems.push(makeSystem(i * 7 + 1, i));
    player.system = systems[0].name;

    // ============================================================
    //                       ЗВЁЗДЫ И ПЛАНЕТЫ
    // ============================================================
    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: (Math.random() - 0.5) * 2000,
                y: (Math.random() - 0.5) * 2000,
                z: Math.random() * 1500,
                brightness: 0.3 + Math.random() * 0.7,
            });
        }
    }

    function initPlanets() {
        planets = [{
            x: (Math.random() - 0.5) * 300,
            y: (Math.random() - 0.5) * 300,
            z: 250 + Math.random() * 200,
            radius: 40 + Math.random() * 30,
        }];
    }

    // ============================================================
    //                       МАТРИЦА ПОВОРОТА / ПРОЕКЦИЯ
    // ============================================================
    //
    // Камера смотрит вперёд по оси +Z. Ориентация задаётся yaw и pitch.
    // Чтобы перевести мировую точку в систему камеры:
    //   1) повернуть вокруг Y на -yaw,
    //   2) повернуть вокруг X на -pitch.
    //
    function project(wx, wy, wz, camX, camY, camZ, camYaw, camPitch) {
        // Смещение в систему камеры
        let x = wx - camX;
        let y = wy - camY;
        let z = wz - camZ;

        // Поворот вокруг Y (-yaw)
        const cosY = Math.cos(-camYaw), sinY = Math.sin(-camYaw);
        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;

        // Поворот вокруг X (-pitch)
        const cosP = Math.cos(-camPitch), sinP = Math.sin(-camPitch);
        const y1 = y * cosP - z1 * sinP;
        const z2 = y * sinP + z1 * cosP;

        if (z2 < 1) return null;

        const fov = 320;
        const sx = CANVAS_W / 2 + (x1 * fov) / z2;
        const sy = CANVAS_H / 2 - (y1 * fov) / z2;

        return { sx, sy, z: z2 };
    }

    // ============================================================
    //                       ОТРИСОВКА
    // ============================================================
    function render() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Звёзды — пролетают мимо, двигаются в мировых координатах
        // Для простоты: звёзды «привязаны» к игроку по Z (не улетают), но
        // смещаются по X и Y в зависимости от позиции игрока — эффект параллакса.
        for (const s of stars) {
            const p = project(s.x, s.y, s.z, 0, 0, 0, player.yaw, player.pitch);
            if (!p) continue;
            const size = Math.max(0.5, 2 - p.z / 500);
            const alpha = Math.min(1, s.brightness * (1 - p.z / 1800));
            ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
            ctx.fillRect(p.sx, p.sy, size, size);
        }

        // Планеты
        for (const pl of planets) {
            const p = project(pl.x, pl.y, pl.z, player.x, player.y, player.z, player.yaw, player.pitch);
            if (!p) continue;
            const screenR = (pl.radius * 320) / p.z;
            if (screenR < 2) continue;

            ctx.strokeStyle = 'rgba(0, 200, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, screenR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 200, 255, 0.15)';
            ctx.beginPath();
            ctx.ellipse(p.sx, p.sy, screenR, screenR * 0.3, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Враги
        for (const e of enemies) {
            const p = project(e.x, e.y, e.z, player.x, player.y, player.z, player.yaw, player.pitch);
            if (!p) continue;
            const size = Math.max(4, 2500 / p.z);
            if (size < 3) continue;

            ctx.strokeStyle = '#f0f';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#f0f';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(p.sx, p.sy - size);
            ctx.lineTo(p.sx - size * 0.7, p.sy + size * 0.5);
            ctx.lineTo(p.sx + size * 0.7, p.sy + size * 0.5);
            ctx.closePath();
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // Пули
        for (const b of bullets) {
            const p = project(b.x, b.y, b.z, player.x, player.y, player.z, player.yaw, player.pitch);
            if (!p) continue;
            ctx.fillStyle = '#0ff';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 6;
            ctx.fillRect(p.sx - 1.5, p.sy - 1.5, 3, 3);
            ctx.shadowBlur = 0;
        }

        // Частицы
        for (const pt of particles) {
            const p = project(pt.x, pt.y, pt.z, player.x, player.y, player.z, player.yaw, player.pitch);
            if (!p) continue;
            ctx.fillStyle = `rgba(255, 200, 0, ${pt.life})`;
            ctx.fillRect(p.sx - 1, p.sy - 1, 2, 2);
        }
    }

    // ============================================================
    //                       ИГРОВОЙ ЦИКЛ
    // ============================================================
    let lastTime = 0;

    function loop(t) {
        if (!lastTime) lastTime = t;
        const dt = Math.min((t - lastTime) / 1000, 0.1);
        lastTime = t;

        if (mode === 'flight') update(dt);

        render();
        requestAnimationFrame(loop);
    }

    function update(dt) {
        // ------------------------------------------------------------
        // УПРАВЛЕНИЕ ОРИЕНТАЦИЕЙ
        // ------------------------------------------------------------
        // W / S — тангаж (поворот вокруг локальной X корабля)
        // W — «вверх» (нос вверх), S — «вниз»
        if (keys['w'] || keys['W'] || keys['ц'] || keys['Ц']) {
            player.pitch += PITCH_SPEED * dt;
        }
        if (keys['s'] || keys['S'] || keys['ы'] || keys['Ы']) {
            player.pitch -= PITCH_SPEED * dt;
        }

        // A / D — рыскание (поворот вокруг локальной Z корабля)
        // A — по часовой стрелке (нос вправо), D — против часовой (нос влево)
        if (keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) {
            player.yaw += YAW_SPEED * dt;
        }
        if (keys['d'] || keys['D'] || keys['в'] || keys['В']) {
            player.yaw -= YAW_SPEED * dt;
        }

        // Ограничение тангажа, чтобы не перевернуться через полюс
        player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));

        // ------------------------------------------------------------
        // ТЯГА (J) И СКОРОСТЬ
        // ------------------------------------------------------------
        if (keys['j'] || keys['J'] || keys['о'] || keys['О']) {
            player.speed += THRUST_ACCEL * dt;
            if (player.speed > MAX_SPEED) player.speed = MAX_SPEED;
        } else {
            // Пассивное торможение
            player.speed -= player.speed * DRAG * dt;
            if (Math.abs(player.speed) < 0.5) player.speed = 0;
        }

        // Движение вперёд (в направлении взгляда)
        const dirX = Math.sin(player.yaw) * Math.cos(player.pitch);
        const dirY = -Math.sin(player.pitch);
        const dirZ = Math.cos(player.yaw) * Math.cos(player.pitch);

        player.x += dirX * player.speed * dt;
        player.y += dirY * player.speed * dt;
        player.z += dirZ * player.speed * dt;

        // ------------------------------------------------------------
        // ВРАГИ
        // ------------------------------------------------------------
        for (const e of enemies) {
            const dx = player.x - e.x;
            const dz = player.z - e.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 10) {
                e.x += (dx / dist) * e.speed * dt;
                e.z += (dz / dist) * e.speed * dt;
            }
            if (dist < 150 && Math.random() < 0.01) {
                player.shield -= 5;
                updateHUD();
            }
        }

        // ------------------------------------------------------------
        // ПУЛИ
        // ------------------------------------------------------------
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.z += b.vz * dt;
            b.life -= dt;

            let hit = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                const dx = b.x - e.x;
                const dy = b.y - e.y;
                const dz = b.z - e.z;
                if (dx * dx + dy * dy + dz * dz < 400) {
                    e.hp -= 34;
                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        player.credits += 10;
                        updateHUD();
                        statusEl.textContent = 'Враг уничтожен! +10 кредитов';
                    }
                    hit = true;
                    break;
                }
            }

            if (hit || b.life <= 0) bullets.splice(i, 1);
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.z += pt.vz * dt;
            pt.life -= dt * 2;
            if (pt.life <= 0) particles.splice(i, 1);
        }

        // Спавн врагов
        if (enemies.length < 3 && Math.random() < 0.005) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 400 + Math.random() * 300;
            enemies.push({
                x: player.x + Math.cos(angle) * dist,
                y: (Math.random() - 0.5) * 100,
                z: player.z + Math.sin(angle) * dist,
                hp: 100,
                speed: 30 + Math.random() * 20,
            });
        }

        // Щит восстанавливается
        if (player.shield < 100 && Math.random() < 0.02) {
            player.shield = Math.min(100, player.shield + 1);
            updateHUD();
        }

        // Смерть
        if (player.shield <= 0) {
            player.shield = 0;
            statusEl.textContent = 'Корабль уничтожен! Нажмите R для рестарта';
            mode = 'dead';
        }

        // Обновление индикатора скорости
        speedEl.textContent = Math.round(player.speed);
        speedFill.style.width = Math.min(100, (player.speed / MAX_SPEED) * 100) + '%';
    }

    // ============================================================
    //                       СТРЕЛЬБА
    // ============================================================
    function shoot() {
        const now = performance.now();
        if (now - lastShot < 110) return;
        lastShot = now;

        // Пуля летит в направлении взгляда
        const dirX = Math.sin(player.yaw) * Math.cos(player.pitch);
        const dirY = -Math.sin(player.pitch);
        const dirZ = Math.cos(player.yaw) * Math.cos(player.pitch);

        const bulletSpeed = 900;
        bullets.push({
            x: player.x + dirX * 12,
            y: player.y + dirY * 12,
            z: player.z + dirZ * 12,
            vx: dirX * bulletSpeed,
            vy: dirY * bulletSpeed,
            vz: dirZ * bulletSpeed,
            life: 2,
        });
    }

    // ============================================================
    //                       HUD
    // ============================================================
    function updateHUD() {
        creditsEl.textContent = player.credits.toFixed(1);
        fuelEl.textContent = player.fuel.toFixed(1);
        shieldEl.textContent = Math.max(0, Math.round(player.shield));
        systemEl.textContent = player.system;
    }

    // ============================================================
    //                       ТОРГОВЛЯ
    // ============================================================
    function getPrice(good, systemName) {
        const sys = systems.find(s => s.name === systemName) || systems[0];
        const ecoFactor = 1 + Math.sin(sys.seed * 0.01) * 0.5;
        return Math.max(1, Math.round(good.basePrice * ecoFactor * 10) / 10);
    }

    function openTrade() {
        mode = 'trade';
        tradePanel.classList.add('show');
        renderTrade();
        updateHUD();
    }

    function closeTrade() {
        mode = 'flight';
        tradePanel.classList.remove('show');
    }

    function renderTrade() {
        tradeSystem.textContent = player.system;
        tradeCredits.textContent = player.credits.toFixed(1);
        tradeCargo.textContent = player.cargoUsed + '/' + player.cargoMax;

        goodsList.innerHTML = '';
        for (const good of GOODS) {
            const price = getPrice(good, player.system);
            const owned = player.cargo[good.name] || 0;

            const row = document.createElement('div');
            row.className = 'good-row';
            row.innerHTML = `
                <span class="name">${good.name}</span>
                <span class="price">${price.toFixed(1)}₡</span>
                <span class="qty">${owned} шт</span>
            `;

            const buyBtn = document.createElement('button');
            buyBtn.textContent = 'КУПИТЬ';
            buyBtn.disabled = player.credits < price || player.cargoUsed >= player.cargoMax;
            buyBtn.onclick = () => {
                if (player.credits >= price && player.cargoUsed < player.cargoMax) {
                    player.credits -= price;
                    player.cargo[good.name] = (player.cargo[good.name] || 0) + 1;
                    player.cargoUsed++;
                    renderTrade();
                    updateHUD();
                }
            };

            const sellBtn = document.createElement('button');
            sellBtn.textContent = 'ПРОДАТЬ';
            sellBtn.disabled = owned === 0;
            sellBtn.onclick = () => {
                if (player.cargo[good.name] > 0) {
                    player.credits += price * 0.8;
                    player.cargo[good.name]--;
                    if (player.cargo[good.name] === 0) delete player.cargo[good.name];
                    player.cargoUsed--;
                    renderTrade();
                    updateHUD();
                }
            };

            const btnWrap = document.createElement('div');
            btnWrap.style.display = 'flex';
            btnWrap.style.gap = '4px';
            btnWrap.appendChild(buyBtn);
            btnWrap.appendChild(sellBtn);
            row.appendChild(btnWrap);

            goodsList.appendChild(row);
        }
    }

    // ============================================================
    //                       ГИПЕРПРЫЖОК
    // ============================================================
    function hyperspace() {
        if (player.fuel < 1) {
            statusEl.textContent = 'Недостаточно топлива!';
            return;
        }

        const sysIndex = systems.findIndex(s => s.name === player.system);
        const nextIndex = (sysIndex + 1) % systems.length;
        const nextSys = systems[nextIndex];

        if (nextSys.distance > player.fuel) {
            statusEl.textContent = `Нужно ${nextSys.distance.toFixed(1)} топлива, есть ${player.fuel.toFixed(1)}`;
            return;
        }

        player.fuel -= nextSys.distance;
        player.system = nextSys.name;

        enemies = [];
        bullets = [];
        particles = [];
        initPlanets();

        statusEl.textContent = `Прыжок в ${nextSys.name} · Топливо: ${player.fuel.toFixed(1)}`;
        updateHUD();
    }

    // ============================================================
    //                       СОБЫТИЯ
    // ============================================================
    document.addEventListener('keydown', e => {
        // Нормализуем: храним и оригинальный ключ, и нижний регистр
        keys[e.key] = true;
        keys[e.key.toLowerCase()] = true;

        // Enter / Space — открыть торговлю
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (mode === 'flight') openTrade();
            return;
        }

        // H — гиперпрыжок
        if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') {
            if (mode === 'flight') hyperspace();
            return;
        }

        // R — ремонт / рестарт после смерти
        if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
            if (mode === 'dead') {
                player.shield = 100;
                player.speed = 0;
                mode = 'flight';
                statusEl.textContent = 'Корабль восстановлен · W/S — тангаж · A/D — рыскание';
            } else {
                player.shield = 100;
                statusEl.textContent = 'Щит восстановлен';
            }
            updateHUD();
            return;
        }

        // Escape — закрыть торговлю
        if (e.key === 'Escape') {
            if (mode === 'trade') closeTrade();
            return;
        }

        // Пробел — тормоз (обнуляем скорость)
        if (e.key === 'Shift') {
            player.speed *= 0.5;
        }
    });

    document.addEventListener('keyup', e => {
        keys[e.key] = false;
        keys[e.key.toLowerCase()] = false;
    });

    // Сбрасываем все клавиши при потере фокуса — иначе «залипают»
    window.addEventListener('blur', () => {
        keys = {};
        mouseDown = false;
        stopAutoFire();
    });

    // ------------------------------------------------------------
    // ЛЕВАЯ КНОПКА МЫШИ — ОГОНЬ
    // ------------------------------------------------------------
    // При нажатии — стреляем сразу и запускаем авто-огонь, пока кнопка
    // удерживается. Отпускание — останавливаем авто-огонь.
    canvas.addEventListener('mousedown', e => {
        if (e.button !== 0) return;               // только левая
        if (mode !== 'flight') return;
        e.preventDefault();
        mouseDown = true;
        shoot();
        startAutoFire();
    });

    // Отпускание — на документе, чтобы поймать и вне canvas
    document.addEventListener('mouseup', e => {
        if (e.button !== 0) return;
        mouseDown = false;
        stopAutoFire();
    });

    // Защита от «залипания» при уходе курсора за пределы окна
    document.addEventListener('mouseleave', () => {
        mouseDown = false;
        stopAutoFire();
    });

    // Запрет контекстного меню — иначе ПКМ мешает игре
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    function startAutoFire() {
        stopAutoFire();
        autoFireTimer = setInterval(() => {
            if (!mouseDown || mode !== 'flight') {
                stopAutoFire();
                return;
            }
            shoot();
        }, 120);
    }

    function stopAutoFire() {
        if (autoFireTimer) {
            clearInterval(autoFireTimer);
            autoFireTimer = null;
        }
    }

    // ------------------------------------------------------------
    // ТАЧ-УПРАВЛЕНИЕ (мобильные)
    // ------------------------------------------------------------
    // Свайп одной рукой — поворот, тап — выстрел.
    // Пальцы не мешают: тап = короткий свайп < 200 мс.
    canvas.addEventListener('touchstart', e => {
        if (mode !== 'flight') return;
        if (e.touches.length === 1) {
            const t = e.touches[0];
            touchStart = {
                x: t.clientX,
                y: t.clientY,
                time: Date.now(),
                moved: false,
            };
        }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
        if (mode !== 'flight') return;
        if (touchStart && e.touches.length === 1) {
            const t = e.touches[0];
            const dx = t.clientX - touchStart.x;
            const dy = t.clientY - touchStart.y;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) touchStart.moved = true;

            // Горизонтальный свайп — рыскание (A/D)
            player.yaw -= dx * 0.006;
            // Вертикальный свайп — тангаж (W/S)
            player.pitch -= dy * 0.006;
            player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));

            // Обновляем опорную точку, чтобы движение было плавным
            touchStart.x = t.clientX;
            touchStart.y = t.clientY;
        }
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
        if (!touchStart) return;
        const dt = Date.now() - touchStart.time;
        const wasTap = !touchStart.moved && dt < 200;
        touchStart = null;

        if (wasTap && mode === 'flight') {
            shoot();
        }
    }, { passive: true });

    // ------------------------------------------------------------
    // КНОПКА ТОРГОВЛИ
    // ------------------------------------------------------------
    document.getElementById('btnLaunch').addEventListener('click', () => {
        closeTrade();
        statusEl.textContent = `Взлёт из ${player.system} · H — гиперпрыжок`;
    });

    // ------------------------------------------------------------
    // ПОЛНЫЙ ЭКРАН
    // ------------------------------------------------------------
    const fsBtn = document.getElementById('btnFullscreen');
    const fsTarget = document.documentElement;

    function isFullscreen() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement;
    }

    function toggleFullscreen() {
        if (!isFullscreen()) {
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        } else {
            const exit = document.exitFullscreen ||
                         document.webkitExitFullscreen ||
                         document.msExitFullscreen;
            if (exit) {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            }
        }
    }

    fsBtn.addEventListener('click', toggleFullscreen);
    fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

    ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
        .forEach(evt => document.addEventListener(evt, () => {
            fsBtn.textContent = isFullscreen() ? '⤡' : '⛶';
        }));

    // Автовосстановление полного экрана из меню
    (function autoFullscreenFromMenu() {
        const KEY = 'arcade_fullscreen_pref';
        let pref = '0';
        try { pref = localStorage.getItem(KEY) || '0'; } catch (e) {}
        if (pref !== '1') return;

        function tryFs() {
            if (isFullscreen()) return;
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        }
        const once = () => {
            tryFs();
            document.removeEventListener('pointerdown', once);
            document.removeEventListener('keydown', once);
        };
        document.addEventListener('pointerdown', once, { once: true });
        document.addEventListener('keydown', once, { once: true });
        tryFs();
    })();

    // ============================================================
    //                       РЕСАЙЗ CANVAS
    // ============================================================
    function resizeCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scale = Math.min(w / CANVAS_W, h / CANVAS_H);
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;
        canvas.style.width = (CANVAS_W * scale) + 'px';
        canvas.style.height = (CANVAS_H * scale) + 'px';
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 200);
    });

    // ============================================================
    //                       СТАРТ
    // ============================================================
    initStars();
    initPlanets();
    resizeCanvas();
    updateHUD();

    // Первый статус
    statusEl.textContent = 'W/S — тангаж · A/D — рыскание · J — тяга · ЛКМ — огонь · H — прыжок';

    // Показываем рекордный шрифт — статус обновляем раз в 4 секунды,
    // если ничего важного не произошло
    setInterval(() => {
        if (mode === 'flight' && statusEl.textContent === 'W/S — тангаж · A/D — рыскание · J — тяга · ЛКМ — огонь · H — прыжок') {
            return;
        }
        if (mode === 'flight' && !statusEl.dataset.keep) {
            // Ничего не делаем — статус остаётся, пока игрок не сделает что-то важное
        }
    }, 4000);

    requestAnimationFrame(loop);
</script>
