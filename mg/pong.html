<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pong Mobile</title>
    
    <link rel="icon" type="image/png" href="res/favicon-64.png" sizes="64x64">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            font-family: 'Courier New', monospace;
        }

        .game-wrapper {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none;
        }

        canvas {
            max-width: 95vw;
            max-height: 70vh;
            width: auto;
            height: auto;
            aspect-ratio: 8 / 5;
            image-rendering: pixelated;
            background-color: #000;
            border: 2px solid #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: clamp(16px, 4vw, 24px);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px #0ff;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 20;
            pointer-events: auto;
        }

        .control-btn {
            width: clamp(55px, 14vw, 75px);
            height: clamp(55px, 14vw, 75px);
            background: rgba(0, 255, 255, 0.15);
            border: 3px solid #0ff;
            color: #0ff;
            font-size: clamp(24px, 6vw, 40px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-btn:active {
            background: rgba(0, 255, 255, 0.4);
            transform: scale(0.9);
        }

        .winner-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }

        .winner-screen h2 {
            margin-bottom: 20px;
            font-size: clamp(22px, 7vw, 32px);
            text-shadow: 0 0 15px #0ff;
        }

        .winner-screen button,
        .back-btn {
            padding: 15px 30px;
            font-size: clamp(16px, 4vw, 20px);
            background: #0ff;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            text-decoration: none;
            display: inline-block;
        }

        .back-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 8px 16px;
            font-size: clamp(13px, 3vw, 16px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 2px solid #0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            z-index: 25;
        }

        .back-btn:active {
            background: rgba(0, 255, 255, 0.4);
            color: #000;
        }
        
        body.hide-cursor,
        body.hide-cursor * {
            cursor: none !important;
        }

        /* Подсказка о выходе из Pointer Lock */
        .lock-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0ff;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: clamp(12px, 3vw, 15px);
            text-shadow: 0 0 8px #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            pointer-events: none;
            z-index: 22;
            opacity: 0;
            transition: opacity 0.25s ease;
            white-space: nowrap;
        }

        .lock-hint.visible {
            opacity: 1;
        }

        .lock-hint b {
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-btn">← Меню</a>

<div class="game-wrapper">
    <div class="scoreboard">
        Игрок: <span id="playerScore">0</span> | Бот: <span id="computerScore">0</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="control-btn" id="btnUp">▲</div>
        <div class="control-btn" id="btnDown">▼</div>
    </div>

    <div class="lock-hint" id="lockHint">Нажмите <b>Esc</b>, чтобы выйти из захвата курсора</div>

    <div class="winner-screen" id="winScreen">
        <h2 id="winnerText"></h2>
        <button onclick="resetGame()">Играть снова</button>
    </div>
</div>

<script>

// ============================================================
//  Скрытие курсора через 3 секунды бездействия
// ============================================================

    let cursorTimer = null;

    function hideCursor() {
        document.body.classList.add('hide-cursor');
    }

    function showCursor() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(hideCursor, 3000);
    }

    ['mousemove', 'mousedown', 'pointerdown', 'touchstart', 'keydown', 'wheel']
        .forEach(evt => document.addEventListener(evt, showCursor, { passive: true }));

    hideCursor();

// ============================================================
//                    ЗВУК НАЖАТИЙ
// ============================================================
const SOUNDS = {
    kick: { src: 'res/kickball-1.mp3', volume: 0.45, pool: 2 },
    goal: { src: 'res/gol-1.mp3',      volume: 0.35, pool: 2 },
    kickFig : { src: 'res/tetris/1/kick-fig-1.mp3' , volume: 0.45, pool: 2 },
    kickSide: { src: 'res/tetris/1/kick-side-1.mp3', volume: 0.45, pool: 2 },
    linedel : { src: 'res/tetris/1/linedel-1.mp3'  , volume: 0.55, pool: 2 },
    move    : { src: 'res/tetris/1/move-1.mp3'     , volume: 0.35, pool: 3 },
    rot     : { src: 'res/tetris/1/rot-1.mp3'      , volume: 0.35, pool: 3 },
    death   : { src: 'res/tetris/1/death.mp3'      , volume: 0.55, pool: 1 },
};

const audioUnlocked = { value: false };

function createSound(src, volume, poolSize = 2) {
    const pool = Array.from({ length: poolSize }, () => {
        const a = new Audio(src);
        a.preload = 'auto';
        a.volume = volume;
        return a;
    });
    let idx = 0;

    return {
        play() {
            if (!audioUnlocked.value) return;
            const a = pool[idx];
            idx = (idx + 1) % poolSize;
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (_) {}
        },
        warmup() {
            const a = pool[0];
            const prev = a.volume;
            a.volume = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
            setTimeout(() => {
                try { a.pause(); a.currentTime = 0; } catch (_) {}
                a.volume = prev;
            }, 60);
        },
    };
}

const sounds = Object.fromEntries(
    Object.entries(SOUNDS).map(([name, cfg]) => [
        name,
        createSound(cfg.src, cfg.volume, cfg.pool),
    ])
);

const playClick = () => sounds.kick.play();
const playGoal  = () => sounds.goal.play();

function unlockAudio() {
    if (audioUnlocked.value) return;
    audioUnlocked.value = true;
    Object.values(sounds).forEach(s => s.warmup());
}

['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, unlockAudio, { passive: true });
});
    

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const baseWidth = 800;
    const baseHeight = 500;

    function resizeCanvas() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        let targetWidth = Math.min(vw * 0.95, baseWidth);
        let targetHeight = targetWidth * (baseHeight / baseWidth);

        if (targetHeight > vh * 0.7) {
            targetHeight = vh * 0.7;
            targetWidth = targetHeight * (baseWidth / baseHeight);
        }

        canvas.width = targetWidth;
        canvas.height = targetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const playerScoreSpan = document.getElementById('playerScore');
    const computerScoreSpan = document.getElementById('computerScore');
    let playerScore = 0;
    let computerScore = 0;

    const paddleWidth = canvas.width * 0.015;
    const paddleHeight = canvas.height * 0.15;

    // Скорости в пикселях в СЕКУНДУ (было за кадр при 60 FPS → умножили на 60)
    const player   = { x: 15, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, dy: 0, speed: 360 };
    const computer = { x: canvas.width - 25, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, dy: 0, speed: 240 };
    const ball     = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: canvas.width * 0.012,
        dx: 240,
        dy: Math.random() > 0.5 ? 180 : -180,
        speed: 240
    };

    let isPaused = false;
    let activeTouches = {};

    function handleTouchStart(direction) {
        activeTouches[direction] = true;
        if (direction === 'up') player.dy = -player.speed;
        if (direction === 'down') player.dy = player.speed;
    }

    function handleTouchEnd(direction) {
        delete activeTouches[direction];
        if ((direction === 'up' && player.dy < 0) || (direction === 'down' && player.dy > 0)) {
            player.dy = 0;
        }
    }

    document.querySelectorAll('.control-btn').forEach(btn => {
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleTouchStart(e.target.id.includes('Up') ? 'up' : 'down'); });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); handleTouchEnd(e.target.id.includes('Up') ? 'up' : 'down'); });
        btn.addEventListener('pointercancel', (e) => { e.preventDefault(); handleTouchEnd(e.target.id.includes('Up') ? 'up' : 'down'); });
    });

    // ============================================================
    //  УПРАВЛЕНИЕ МЫШКОЙ
    //  - Pointer Lock: мышь захватывается, движение работает
    //    даже за пределами окна (относительное смещение movementY)
    //  - Фолбэк: обычное абсолютное позиционирование по mousemove
    // ============================================================

    let pointerLocked = false;
    const MOUSE_SENSITIVITY = 1.0;

    const lockHint = document.getElementById('lockHint');

    // --- Запрос захвата по клику на канвас ---
    canvas.addEventListener('click', () => {
        if (!pointerLocked && canvas.requestPointerLock) {
            canvas.requestPointerLock();
        }
    });

    // --- Отслеживаем состояние захвата ---
    document.addEventListener('pointerlockchange', () => {
        pointerLocked = (document.pointerLockElement === canvas);
        lockHint.classList.toggle('visible', pointerLocked);
    });

    // --- Движение мыши ---
    document.addEventListener('mousemove', (e) => {
        if (pointerLocked) {
            // Относительное движение — работает за пределами окна
            player.y += e.movementY * MOUSE_SENSITIVITY;
        } else {
            // Абсолютное позиционирование — только когда курсор над канвасом
            const rect = canvas.getBoundingClientRect();
            if (
                e.clientX < rect.left || e.clientX > rect.right ||
                e.clientY < rect.top  || e.clientY > rect.bottom
            ) return;

            const mouseY = e.clientY - rect.top;
            const scaleY = canvas.height / rect.height;
            player.y = mouseY * scaleY - player.height / 2;
        }

        // Общие ограничения по вертикали
        if (player.y < 0) player.y = 0;
        if (player.y + player.height > canvas.height) {
            player.y = canvas.height - player.height;
        }

        // Сбрасываем скорость, чтобы не конфликтовать с кнопками/клавиатурой
        player.dy = 0;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') player.dy = -player.speed;
        if (e.key === 's' || e.key === 'ArrowDown') player.dy = player.speed;
        if (e.key === ' ') isPaused = !isPaused;
    });
    window.addEventListener('keyup', (e) => {
        if ((e.key === 'w' || e.key === 'ArrowUp') && player.dy < 0) player.dy = 0;
        if ((e.key === 's' || e.key === 'ArrowDown') && player.dy > 0) player.dy = 0;
    });

    function collides(ballObj, paddle) {
        return ballObj.x + ballObj.radius > paddle.x &&
               ballObj.x - ballObj.radius < paddle.x + paddle.width &&
               ballObj.y + ballObj.radius > paddle.y &&
               ballObj.y - ballObj.radius < paddle.y + paddle.height;
    }

    function moveComputer() {
        const paddleCenter = computer.y + computer.height / 2;
        if (paddleCenter < ball.y - 10) {
            computer.dy = computer.speed;
        } else if (paddleCenter > ball.y + 10) {
            computer.dy = -computer.speed;
        } else {
            computer.dy = 0;
        }
    }

    function drawRect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
    function drawCircle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath(); ctx.fill(); }

    function drawNet() {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = Math.max(1, canvas.width * 0.002);
        ctx.setLineDash([Math.round(canvas.height * 0.02), Math.round(canvas.height * 0.03)]);
        ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke(); ctx.setLineDash([]);
    }

    // dt — время в секундах с прошлого кадра
    function update(dt) {
        if (isPaused) return;

        if (activeTouches['up']) player.dy = -player.speed;
        if (activeTouches['down']) player.dy = player.speed;

        player.y += player.dy * dt;
        if (player.y < 0) player.y = 0;
        if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

        moveComputer();
        computer.y += computer.dy * dt;
        if (computer.y < 0) computer.y = 0;
        if (computer.y + computer.height > canvas.height) computer.y = canvas.height - computer.height;

        ball.x += ball.dx * dt;
        ball.y += ball.dy * dt;

        if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
            ball.dy *= -1;
        }

        if (collides(ball, player)) {
            ball.dx = Math.abs(ball.dx);
            ball.dx += 0.3 * 60 * dt;   // ускорение, нормированное к 60 FPS
            ball.dy += (ball.y - (player.y + player.height / 2)) * 0.1 * 60 * dt;
            playClick();
        }

        if (collides(ball, computer)) {
            ball.dx = -Math.abs(ball.dx);
            ball.dx -= 0.3 * 60 * dt;
            ball.dy += (ball.y - (computer.y + computer.height / 2)) * 0.1 * 60 * dt;
            playClick();
        }

        if (ball.x - ball.radius < 0) {
            computerScore++;
            computerScoreSpan.textContent = computerScore;
            playGoal();
            resetBall(false);
        }

        if (ball.x + ball.radius > canvas.width) {
            playerScore++;
            playerScoreSpan.textContent = playerScore;
            playGoal();
            resetBall(true);
        }

        if (playerScore >= 7 || computerScore >= 7) {
            endGame();
        }
    }

    function resetBall(toRight) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = toRight ? ball.speed : -ball.speed;
        ball.dy = (Math.random() > 0.5 ? 1 : -1) * 180;  // 3 * 60
    }

    function render() {
        drawRect(0, 0, canvas.width, canvas.height, '#000');
        drawNet();
        drawRect(player.x, player.y, player.width, player.height, '#0ff');
        drawRect(computer.x, computer.y, computer.width, computer.height, '#0ff');
        drawCircle(ball.x, ball.y, ball.radius, '#fff');

        // Подсказка по управлению внизу канваса
        ctx.font = `${Math.round(canvas.height * 0.028)}px 'Courier New', monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0, 255, 255, 0.55)';
        if (pointerLocked) {
            ctx.fillText('Esc — выйти из захвата курсора', canvas.width / 2, canvas.height - 10);
        } else {
            ctx.fillText('Клик — захватить курсор мыши', canvas.width / 2, canvas.height - 10);
        }
    }

    function endGame() {
        isPaused = true;
        document.getElementById('winnerText').textContent =
            playerScore > computerScore ? 'Вы победили!' : 'Бот победил!';
        document.getElementById('winScreen').style.display = 'flex';
    }

    function resetGame() {
        playerScore = 0;
        computerScore = 0;
        playerScoreSpan.textContent = '0';
        computerScoreSpan.textContent = '0';
        resetBall(true);
        isPaused = false;
        document.getElementById('winScreen').style.display = 'none';
    }

    // ============================================================
    //  ИГРОВОЙ ЦИКЛ с delta time
    // ============================================================
    let lastTime = performance.now();

    function gameLoop(now) {
        if (now === undefined) now = performance.now();

        let dt = (now - lastTime) / 1000; // секунды
        lastTime = now;

        // Ограничение, чтобы при лагах/сворачивании вкладки шарик
        // не телепортировался сквозь ракетку
        if (dt > 1 / 30) dt = 1 / 30;

        update(dt);
        render();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
