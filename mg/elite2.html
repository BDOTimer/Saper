<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Elite Remake — Prototype v2</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }

  body.hide-cursor { cursor: none; }

  /* ---------- HUD в стиле оригинальной Elite ---------- */
  #hud {
    position: absolute; inset: 0; pointer-events: none;
    font-family: "Courier New", monospace;
    color: #33ff88;
    text-shadow: 0 0 6px #00ff88, 0 0 2px #00ff88;
    user-select: none;
  }

  #cockpit-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #cockpit-svg path, #cockpit-svg line, #cockpit-svg polyline {
    fill: none;
    stroke: #33ff88;
    stroke-width: 2;
    filter: drop-shadow(0 0 4px #00ff88);
  }

  .indicator {
    position: absolute;
    font-size: 13px;
    line-height: 1.35;
    letter-spacing: 1px;
  }
  #ind-speed   { left: 110px; bottom: 90px; }
  #ind-shield  { left: 110px; bottom: 150px; }
  #ind-fuel    { left: 110px; bottom: 210px; }
  #ind-credits { right: 110px; bottom: 90px; text-align: right; }
  #ind-kills   { right: 110px; bottom: 150px; text-align: right; }
  #ind-sector  { right: 110px; bottom: 210px; text-align: right; }

  .bar {
    display: inline-block;
    width: 90px; height: 8px;
    border: 1px solid #33ff88;
    margin-left: 6px;
    vertical-align: middle;
    position: relative;
  }
  .bar > i {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: #33ff88;
    box-shadow: 0 0 6px #00ff88;
    display: block;
  }

  #reticle {
    position: absolute; left: 50%; top: 50%;
    width: 70px; height: 70px;
    transform: translate(-50%,-50%);
  }
  #reticle svg { width: 100%; height: 100%; }
  #reticle .rh { stroke: #33ff88; stroke-width: 2; filter: drop-shadow(0 0 4px #00ff88); }

  #damage-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,40,40,0.55));
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }

  #hint {
    position: absolute; left: 50%; top: 20px;
    transform: translateX(-50%);
    font-size: 12px; opacity: 0.6;
    letter-spacing: 1px;
  }

  #gameover {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.75);
    color: #ff4444;
    font-size: 32px;
    text-shadow: 0 0 12px #f00;
    letter-spacing: 3px;
  }
  #gameover small { font-size: 14px; color: #33ff88; margin-top: 20px; letter-spacing: 2px; }
</style>
</head>
<body>

  <div id="reticle">

      <line class="rh" x1="35" y1="0"  x2="35" y2="20"/>

      <line class="rh" x1="0"  y1="35" x2="20" y2="35"/>

  <div class="indicator" id="ind-speed">

    GAME OVER
    <small>нажми ENTER чтобы начать заново</small>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================
//  Скрытие курсора через 3 секунды бездействия
// ============================================================
let cursorTimer = null;

function hideCursor() {
  document.body.classList.add('hide-cursor');
}
function showCursor() {
  document.body.classList.remove('hide-cursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(hideCursor, 3000);
}

['mousedown', 'pointerdown', 'touchstart', 'keydown', 'wheel']
  .forEach(evt => document.addEventListener(evt, showCursor, { passive: true }));
showCursor();


// ============================================================
//                    ЗВУК НАЖАТИЙ
// ============================================================
const SOUNDS = {
    laser: { src: 'res/laser-1.mp3'     , volume: 0.45, pool: 3 },
    death: { src: 'res/ship-death-1.mp3', volume: 0.35, pool: 1 },
    damag: { src: 'res/damag-1.mp3'     , volume: 0.35, pool: 3 },
};

const audioUnlocked = { value: false };

/**
 * Создаёт объект-плеер: пул Audio + метод play().d
 * @param {string} src
 * @param {number} volume
 * @param {number} poolSize
 */
function createSound(src, volume, poolSize = 2) {
    const pool = Array.from({ length: poolSize }, () => {
        const a = new Audio(src);
        a.preload = 'auto';
        a.volume = volume;
        return a;
    });
    let idx = 0;

    return {
        play() {
            if (!audioUnlocked.value) return;
            const a = pool[idx];
            idx = (idx + 1) % poolSize;
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (_) {}
        },
        // «Прогрев» для разблокировки аудио на мобильных
        warmup() {
            const a = pool[0];
            const prev = a.volume;
            a.volume = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
            setTimeout(() => {
                try { a.pause(); a.currentTime = 0; } catch (_) {}
                a.volume = prev;
            }, 60);
        },
    };
}

// Создаём звуки
const sounds = Object.fromEntries(
    Object.entries(SOUNDS).map(([name, cfg]) => [
        name,
        createSound(cfg.src, cfg.volume, cfg.pool),
    ])
);

// Удобные обёртки
const playLaser = () => sounds.laser.play();
const playDeath = () => sounds.death.play();
const playDamag = () => sounds.damag.play();

// ---------- Разблокировка аудио (нужен жест пользователя) ----------
function unlockAudio() {
    if (audioUnlocked.value) return;
    audioUnlocked.value = true;
    Object.values(sounds).forEach(s => s.warmup());
}

unlockAudio();

['pointerdown', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
    document.addEventListener(evt, unlockAudio, { passive: true });
});
    

// ------------------------------------------------------------------
//  Утилиты
// ------------------------------------------------------------------
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function wrapAround(pos, origin, halfSize) {
  const dx = pos.x - origin.x;
  const dy = pos.y - origin.y;
  const dz = pos.z - origin.z;
  if (dx >  halfSize) pos.x -= halfSize * 2;
  if (dx < -halfSize) pos.x += halfSize * 2;
  if (dy >  halfSize) pos.y -= halfSize * 2;
  if (dy < -halfSize) pos.y += halfSize * 2;
  if (dz >  halfSize) pos.z -= halfSize * 2;
  if (dz < -halfSize) pos.z += halfSize * 2;
}

// ------------------------------------------------------------------
//  Планеты — шейдеры
// ------------------------------------------------------------------
const planetVert = /* glsl */`
  varying vec3 vPos;
  varying vec3 vNormal;
  void main() {
    vPos = position;
    vNormal = normal;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const planetFrag = /* glsl */`
  varying vec3 vPos;
  varying vec3 vNormal;
  uniform vec3  uColorA, uColorB, uColorC;
  uniform float uSeed;

  float hash(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float noise(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                   mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                   mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
  }
  float fbm(vec3 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
    return v;
  }
  void main() {
    vec3 n = normalize(vPos + uSeed);
    float n1 = fbm(n * 3.0);
    float n2 = fbm(n * 6.0 + 10.0);
    float m = smoothstep(0.35, 0.65, n1 + n2 * 0.3);
    vec3 col = mix(uColorA, uColorB, m);
    col = mix(col, uColorC, smoothstep(0.7, 0.95, n2));
    vec3 L = normalize(vec3(1.0, 0.5, 0.7));
    float d = max(dot(normalize(vNormal), L), 0.0);
    gl_FragColor = vec4(col * (0.15 + 0.85 * d), 1.0);
  }
`;

function makePlanet(seed) {
  const rng = mulberry32(seed);
  const radius = 200 + rng() * 300;
  const geo = new THREE.SphereGeometry(radius, 64, 64);
  const mat = new THREE.ShaderMaterial({
    vertexShader: planetVert,
    fragmentShader: planetFrag,
    uniforms: {
      uColorA: { value: new THREE.Color().setHSL(rng(), 0.5 + rng()*0.4, 0.25 + rng()*0.2) },
      uColorB: { value: new THREE.Color().setHSL(rng(), 0.6, 0.45 + rng()*0.2) },
      uColorC: { value: new THREE.Color().setHSL(rng(), 0.7, 0.7) },
      uSeed:   { value: rng() * 100.0 }
    }
  });
  const m = new THREE.Mesh(geo, mat);
  m.userData.radius = radius;
  return m;
}

// ------------------------------------------------------------------
//  Звёзды
// ------------------------------------------------------------------
function makeStarfield(seed) {
  const rng = mulberry32(seed);
  const count = 4000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const u = rng() * 2 - 1, t = rng() * Math.PI * 2;
    const r = 4000, s = Math.sqrt(1 - u * u);
    pos[i*3+0] = r * s * Math.cos(t);
    pos[i*3+1] = r * u;
    pos[i*3+2] = r * s * Math.sin(t);
    const c = new THREE.Color().setHSL(0.55 + rng()*0.15, 0.3, 0.7 + rng()*0.3);
    col[i*3+0] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 4, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  return p;
}

// ------------------------------------------------------------------
//  Корабль игрока
// ------------------------------------------------------------------
function makePlayerShip() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(6, 22, 8),
    new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.7, roughness: 0.4 })
  );
  body.rotation.x = Math.PI / 2;
  body.position.z = -8;
  group.add(body);

  const wing = new THREE.Mesh(
    new THREE.BoxGeometry(20, 1, 6),
    new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.8, roughness: 0.5 })
  );
  wing.position.z = 2;
  group.add(wing);

  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(3, 12, 8),
    new THREE.MeshStandardMaterial({ color: 0x224466, metalness: 0.9, roughness: 0.1,
                                     emissive: 0x113355, emissiveIntensity: 0.6 })
  );
  cockpit.position.set(0, 2, -4);
  cockpit.scale.set(1, 0.7, 1.6);
  group.add(cockpit);

  const engMat = new THREE.MeshBasicMaterial({ color: 0x66ccff, toneMapped: false });
  const eng1 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 3, 12), engMat);
  eng1.rotation.x = Math.PI / 2;
  eng1.position.set(-5, 0, 8);
  group.add(eng1);
  const eng2 = eng1.clone();
  eng2.position.x = 5;
  group.add(eng2);

  const muzzleMat = new THREE.MeshBasicMaterial({ color: 0xffffaa, toneMapped: false, transparent: true, opacity: 0 });
  const muzzle1 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), muzzleMat.clone());
  muzzle1.position.set(-8, 0, 0);
  group.add(muzzle1);
  const muzzle2 = muzzle1.clone();
  muzzle2.position.x = 8;
  group.add(muzzle2);

  group.userData.engines = [eng1, eng2];
  group.userData.muzzles = [muzzle1, muzzle2];
  return group;
}

// ------------------------------------------------------------------
//  Враг
// ------------------------------------------------------------------
function makeEnemyShip() {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xaa3333, metalness: 0.7, roughness: 0.5 });
  group.add(new THREE.Mesh(new THREE.OctahedronGeometry(8, 0), mat));
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(10, 1, 8, 24),
    new THREE.MeshBasicMaterial({ color: 0xff4444, toneMapped: false })
  );
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  group.userData.enemy = true;
  return group;
}

// ------------------------------------------------------------------
//  Лазер
// ------------------------------------------------------------------
const LASER_LENGTH = 40;
const LASER_RADIUS = 0.4;
const LASER_SPEED  = 900;

const laserGeo = new THREE.CylinderGeometry(LASER_RADIUS, LASER_RADIUS, LASER_LENGTH, 6, 1, true);
laserGeo.rotateX(Math.PI / 2);

function makeLaserMaterial() {
  return new THREE.MeshBasicMaterial({
    color: 0xffff66,
    toneMapped: false,
    transparent: true,
    opacity: 1.0,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
}

// ------------------------------------------------------------------
//  Сцена / камера / рендерер
// ------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 20000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.6, 0.15);
composer.addPass(bloom);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
sunLight.position.set(1, 0.5, 0.7);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x334455, 0.6));

const stars = makeStarfield(12345);
scene.add(stars);

// Игрок — добавляем к камере, чтобы всегда была перед глазами
const player = makePlayerShip();
camera.add(player);
player.position.set(0, -6, 12);
player.scale.set(3, 0.1, 3);
scene.add(camera);

// ------------------------------------------------------------------
//  Планеты
// ------------------------------------------------------------------
const planets = [];
function spawnPlanet(seed) {
  const p = makePlanet(seed);
  const rng = mulberry32(seed ^ 0x9e3779b9);
  // Дистанция должна быть минимум в 4 раза больше радиуса планеты
  const minDist = p.userData.radius * 4;
  const dist = minDist + rng() * 2500;
  const ang = rng() * Math.PI * 2;
  p.position.set(Math.cos(ang) * dist, (rng() - 0.5) * 800, Math.sin(ang) * dist);
  scene.add(p);
  planets.push(p);
}
spawnPlanet(1);
spawnPlanet(2);

// ------------------------------------------------------------------
//  Враги
// ------------------------------------------------------------------
const enemies = [];
const lasers  = [];

function spawnEnemy() {
  const e = makeEnemyShip();
  const ang = Math.random() * Math.PI * 2;
  const dist = 400 + Math.random() * 600;
  e.position.set(Math.cos(ang) * dist, (Math.random() - 0.5) * 200, Math.sin(ang) * dist);
  e.userData.hp = 3;
  e.userData.speed = 20 + Math.random() * 40;
  scene.add(e);
  enemies.push(e);
}

function spawnLaser() {
  const pos = new THREE.Vector3();
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

  const muzzleIdx = (shotCounter++) % 2;
  const muzzle = player.userData.muzzles[muzzleIdx];
  muzzle.getWorldPosition(pos);
  muzzle.material.opacity = 1.0;

  const mesh = new THREE.Mesh(laserGeo, makeLaserMaterial());
  mesh.position.copy(pos);
  mesh.quaternion.copy(camera.quaternion);
  mesh.userData.velocity = dir.clone().multiplyScalar(LASER_SPEED);
  mesh.userData.life = 1.5;
  scene.add(mesh);
  return mesh;
}
let shotCounter = 0;

// ------------------------------------------------------------------
//  Эффекты попадания (пурпурное сияние)
// ------------------------------------------------------------------
const hitEffects = [];

// Общая сфера-вспышка. Используем простую геометрию и переиспользуем
// её между эффектами, чтобы не плодить мусор в GPU.
const hitFlashGeo = new THREE.SphereGeometry(1, 12, 12);

function spawnHitFlash(position, scale = 1) {
  // Сфера-вспышка пурпурного цвета с additive blending
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff44ff,
    toneMapped: false,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(hitFlashGeo, mat);
  mesh.position.copy(position);
  mesh.scale.setScalar(scale);
  scene.add(mesh);

  // Пурпурный PointLight — добавит сияния и подсветит близкие объекты
  const light = new THREE.PointLight(0xff22ff, 4, 80, 2);
  light.position.copy(position);
  scene.add(light);

  hitEffects.push({
    mesh,
    light,
    life: 0.35,
    maxLife: 0.35,
    baseScale: scale
  });
}

function updateHitEffects(dt) {
  for (let i = hitEffects.length - 1; i >= 0; i--) {
    const e = hitEffects[i];
    e.life -= dt;
    const k = Math.max(0, e.life / e.maxLife);

    // Сфера расширяется и гаснет
    e.mesh.scale.setScalar(e.baseScale * (1 + (1 - k) * 2.5));
    e.mesh.material.opacity = k;

    // Свет затухает быстрее
    e.light.intensity = 4 * k * k;

    if (e.life <= 0) {
      scene.remove(e.mesh);
      scene.remove(e.light);
      e.mesh.material.dispose();
      hitEffects.splice(i, 1);
    }
  }
}

// ------------------------------------------------------------------
//  Космическая пыль (points вокруг камеры, wrap-around)
// ------------------------------------------------------------------
const DUST_COUNT  = 3000;
const DUST_RADIUS = 800;

function makeDust() {
  const positions = new Float32Array(DUST_COUNT * 3);
  for (let i = 0; i < DUST_COUNT; i++) {
    positions[i*3+0] = camera.position.x + (Math.random() - 0.5) * DUST_RADIUS * 2;
    positions[i*3+1] = camera.position.y + (Math.random() - 0.5) * DUST_RADIUS * 2;
    positions[i*3+2] = camera.position.z + (Math.random() - 0.5) * DUST_RADIUS * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: 0xaaccff,
    size: 2.0,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.8,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return points;
}

const dust = makeDust();
scene.add(dust);

// ------------------------------------------------------------------
//  Метеоры
// ------------------------------------------------------------------
const METEOR_COUNT  = 60;
const METEOR_RADIUS = 500;
const meteors = [];

function makeMeteor() {
  const size = 3 + Math.random() * 12;
  const geo = new THREE.IcosahedronGeometry(size, 0);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i,
      pos.getX(i) * (0.7 + Math.random() * 0.6),
      pos.getY(i) * (0.7 + Math.random() * 0.6),
      pos.getZ(i) * (0.7 + Math.random() * 0.6)
    );
  }
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x776655,
    roughness: 0.9,
    metalness: 0.1,
    flatShading: true,
    emissive: 0x221100,
    emissiveIntensity: 0.3
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.spin = new THREE.Vector3(
    (Math.random() - 0.5) * 2,
    (Math.random() - 0.5) * 2,
    (Math.random() - 0.5) * 2
  );
  mesh.userData.size = size;
  mesh.position.set(
    camera.position.x + (Math.random() - 0.5) * METEOR_RADIUS * 2,
    camera.position.y + (Math.random() - 0.5) * METEOR_RADIUS * 2,
    camera.position.z + (Math.random() - 0.5) * METEOR_RADIUS * 2
  );
  scene.add(mesh);
  meteors.push(mesh);
}

for (let i = 0; i < METEOR_COUNT; i++) makeMeteor();

// ------------------------------------------------------------------
//  Ввод
// ------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
  if (e.code === 'Enter' && state.dead) resetGame();
});
addEventListener('keyup', e => keys[e.code] = false);

// ------------------------------------------------------------------
//  Состояние
// ------------------------------------------------------------------
const state = {
  speed: 0,
  maxSpeed: 320,
  minSpeed: -80,
  shield: 100,
  fuel: 100,
  credits: 1000,
  kills: 0,
  sector: { x: 0, y: 0 },
  dead: false
};

function resetGame() {
  state.speed = 0;
  state.shield = 100;
  state.fuel = 100;
  state.credits = 1000;
  state.kills = 0;
  state.dead = false;

  for (const e of enemies) scene.remove(e);
  enemies.length = 0;
  for (const l of lasers) scene.remove(l);
  lasers.length = 0;

  camera.position.set(0, 0, 0);
  camera.quaternion.set(0, 0, 0, 1);

  // Пересеять пыль и метеоры вокруг новой позиции
  reseedDustAndMeteors();

  document.getElementById('gameover').style.display = 'none';
}

function reseedDustAndMeteors() {
  const posAttr = dust.geometry.attributes.position;
  for (let i = 0; i < DUST_COUNT; i++) {
    posAttr.setXYZ(i,
      camera.position.x + (Math.random() - 0.5) * DUST_RADIUS * 2,
      camera.position.y + (Math.random() - 0.5) * DUST_RADIUS * 2,
      camera.position.z + (Math.random() - 0.5) * DUST_RADIUS * 2
    );
  }
  posAttr.needsUpdate = true;

  for (const m of meteors) {
    m.position.set(
      camera.position.x + (Math.random() - 0.5) * METEOR_RADIUS * 2,
      camera.position.y + (Math.random() - 0.5) * METEOR_RADIUS * 2,
      camera.position.z + (Math.random() - 0.5) * METEOR_RADIUS * 2
    );
  }
}

// ------------------------------------------------------------------
//  HUD
// ------------------------------------------------------------------
const $ = id => document.getElementById(id);
const elSpeed      = $('speed');
const elSpeedBar   = $('speed-bar');
const elShield     = $('shield');
const elShieldBar  = $('shield-bar');
const elFuel       = $('fuel');
const elFuelBar    = $('fuel-bar');
const elCredits    = $('credits');
const elKills      = $('kills');
const elSector     = $('sector');
const elDamage     = $('damage-flash');
const elGameover   = $('gameover');

let damageTimer = 0;
function flashDamage(intensity = 1) {
  damageTimer = 0.25;
  elDamage.style.opacity = String(Math.min(0.9, intensity));
}

function updateHUD() {
  elSpeed.textContent = Math.round(state.speed);
  elSpeedBar.style.width = Math.min(100, Math.abs(state.speed) / state.maxSpeed * 100) + '%';
  elShield.textContent = Math.round(state.shield);
  elShieldBar.style.width = state.shield + '%';
  elFuel.textContent = Math.round(state.fuel);
  elFuelBar.style.width = state.fuel + '%';
  elCredits.textContent = state.credits;
  elKills.textContent = state.kills;
  elSector.textContent = `${state.sector.x},${state.sector.y}`;
}

// ------------------------------------------------------------------
//  Стрельба
// ------------------------------------------------------------------
let fireCooldown = 0;

function fire() {
  if (fireCooldown > 0 || state.dead) return;
  fireCooldown = 0.12;
  const laser = spawnLaser();
  lasers.push(laser);
  playLaser();
}

// ------------------------------------------------------------------
//  Цикл
// ------------------------------------------------------------------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!state.dead) {
    // ---- Тяга ----
    if (keys['KeyR']) state.speed += 220 * dt;
    if (keys['KeyF']) state.speed -= 220 * dt;
    state.speed *= Math.pow(0.85, dt);
    state.speed = Math.max(state.minSpeed, Math.min(state.maxSpeed, state.speed));

    // ---- Ориентация ----
    const rotSpeed = 1.2 * dt;
    if (keys['KeyW']) camera.rotateX( rotSpeed);
    if (keys['KeyS']) camera.rotateX(-rotSpeed);
    if (keys['KeyA']) camera.rotateZ( rotSpeed);
    if (keys['KeyD']) camera.rotateZ(-rotSpeed);
    if (keys['ArrowLeft'])  camera.rotateY( rotSpeed);
    if (keys['ArrowRight']) camera.rotateY(-rotSpeed);

    // ---- Движение вперёд ----
    const forward = tmpVec.set(0, 0, -1).applyQuaternion(camera.quaternion).clone();
    camera.position.addScaledVector(forward, state.speed * dt);

    // ---- Пыль и метеоры: летят назад со скоростью корабля ----
    const drift = forward.multiplyScalar(-state.speed * dt);

    // ---- Пыль ----
    {
      const attr = dust.geometry.attributes.position;
      const arr = attr.array;
      const H = DUST_RADIUS;
      const cx = camera.position.x;
      const cy = camera.position.y;
      const cz = camera.position.z;

      for (let i = 0; i < DUST_COUNT; i++) {
        const ix = i * 3;
        arr[ix+0] += drift.x;
        arr[ix+1] += drift.y;
        arr[ix+2] += drift.z;

        let dx = arr[ix+0] - cx;
        let dy = arr[ix+1] - cy;
        let dz = arr[ix+2] - cz;
        if (dx >  H) arr[ix+0] -= H * 2;
        if (dx < -H) arr[ix+0] += H * 2;
        if (dy >  H) arr[ix+1] -= H * 2;
        if (dy < -H) arr[ix+1] += H * 2;
        if (dz >  H) arr[ix+2] -= H * 2;
        if (dz < -H) arr[ix+2] += H * 2;
      }
      attr.needsUpdate = true;

      // Чем больше скорость — тем ярче и крупнее пыль
      const speedFactor = Math.min(1, Math.abs(state.speed) / state.maxSpeed);
      dust.material.opacity = 0.35 + speedFactor * 0.65;
      dust.material.size    = 1.2 + speedFactor * 2.0;
    }

    // ---- Метеоры ----
    const playerPos = new THREE.Vector3();
    player.getWorldPosition(playerPos);

    for (const m of meteors) {
      m.position.x += drift.x;
      m.position.y += drift.y;
      m.position.z += drift.z;

      m.rotation.x += m.userData.spin.x * dt;
      m.rotation.y += m.userData.spin.y * dt;
      m.rotation.z += m.userData.spin.z * dt;

      wrapAround(m.position, camera.position, METEOR_RADIUS);

      const d = m.position.distanceTo(playerPos);
      if (d < m.userData.size + 12) {
        state.shield -= 200 * dt;
        flashDamage(0.6);
        if (state.shield <= 0) {
          state.shield = 0;
          state.dead = true;
          elGameover.style.display = 'flex';
          playDeath();
        }
      }
    }

    // ---- Стрельба ----
    fireCooldown -= dt;
    if (keys['Space']) fire();

    // ---- Расход топлива ----
    if (state.speed !== 0) {
      state.fuel -= Math.abs(state.speed) * dt * 0.005;
      if (state.fuel <= 0) { state.fuel = 0; state.speed *= 0.98; }
    }
  } else {
    fireCooldown -= dt;
  }

  // ---- Вспышки дула гаснут ----
  for (const m of player.userData.muzzles) {
    m.material.opacity = Math.max(0, m.material.opacity - dt * 12);
  }

  // ---- Лазеры ----
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.position.addScaledVector(l.userData.velocity, dt);
    l.userData.life -= dt;
    l.material.opacity = Math.min(1, l.userData.life * 3);

    if (l.userData.life <= 0) {
      scene.remove(l);
      l.material.dispose();
      lasers.splice(i, 1);
      continue;
    }

// Столкновение лазера с врагом
for (let j = enemies.length - 1; j >= 0; j--) {
  const e = enemies[j];
  if (l.position.distanceTo(e.position) < 30) {
    e.userData.hp -= 1;

    // Пурпурная вспышка в точке попадания
    spawnHitFlash(l.position.clone(), 2.5);
    
    playDamag();

    scene.remove(l);
    l.material.dispose();
    lasers.splice(i, 1);
    if (e.userData.hp <= 0) {
      scene.remove(e);
      enemies.splice(j, 1);
      state.kills++;
      state.credits += 100;
      // Большая вспышка при уничтожении
      spawnHitFlash(e.position.clone(), 6);
    }
    break;
  }
}

    // Столкновение лазера с метеором
    for (let k = meteors.length - 1; k >= 0; k--) {
      const m = meteors[k];
      if (l.position.distanceTo(m.position) < m.userData.size) {
        scene.remove(l);
        l.material.dispose();
        lasers.splice(i, 1);
        // Метеор разлетается: уменьшаем и перекидываем
        m.userData.size = Math.max(1, m.userData.size * 0.5);
        m.scale.setScalar(m.userData.size / (m.userData.size * 2));
        break;
      }
    }
  }

  // ---- Спавн врагов ----
  if (!state.dead && enemies.length < 5 && Math.random() < 0.005) spawnEnemy();

  // ---- ИИ врагов ----
  const playerPos = new THREE.Vector3();
  player.getWorldPosition(playerPos);

  for (const e of enemies) {
    const toPlayer = new THREE.Vector3().subVectors(playerPos, e.position);
    const dist = toPlayer.length();
    toPlayer.normalize();
    e.position.addScaledVector(toPlayer, e.userData.speed * dt);
    e.rotation.x += dt * 0.5;
    e.rotation.y += dt * 0.7;

    if (dist < 30 && !state.dead) {
      state.shield -= 30 * dt;
      flashDamage(0.4);
      if (state.shield <= 0) {
        state.shield = 0;
        state.dead = true;
        elGameover.style.display = 'flex';
        playDeath();
      }
    }
  }

  // ---- Планеты ----
  for (const p of planets) p.rotation.y += dt * 0.05;

  // ---- Звёзды следуют за камерой ----
  stars.position.copy(camera.position);

  // ---- Пульсация двигателей ----
  const engMat = player.userData.engines[0].material;
  const intensity = 0.6 + Math.abs(state.speed) / state.maxSpeed * 0.8;
  engMat.color.setRGB(0.4 * intensity, 0.8 * intensity, 1.0 * intensity);

  // ---- Damage flash fade ----
  if (damageTimer > 0) {
    damageTimer -= dt;
    if (damageTimer <= 0) elDamage.style.opacity = '0';
  }
  
  updateHitEffects(dt);

  updateHUD();
  composer.render();
  requestAnimationFrame(animate);
}

animate();

// ------------------------------------------------------------------
//  Resize
// ------------------------------------------------------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
