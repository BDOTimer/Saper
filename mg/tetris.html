<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tetris Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            font-family: 'Courier New', monospace;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none;
            padding: 50px 10px 110px; /* сверху под счёт, снизу под кнопки */
        }

        .play-area {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-shrink: 0;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            background-color: #000;
            border: 2px solid #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-size: clamp(10px, 2.6vw, 14px);
        }

        .side-panel .label { letter-spacing: 1px; opacity: 0.8; }

        #nextCanvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            background-color: #000;
            display: block;
        }

        .scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: clamp(13px, 3.6vw, 20px);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px #0ff;
            white-space: nowrap;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 20;
            pointer-events: auto;
        }

        .control-btn {
            width: clamp(48px, 12vw, 66px);
            height: clamp(48px, 12vw, 66px);
            background: rgba(0, 255, 255, 0.15);
            border: 3px solid #0ff;
            color: #0ff;
            font-size: clamp(18px, 5vw, 30px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-btn:active {
            background: rgba(0, 255, 255, 0.4);
            transform: scale(0.9);
        }

        .control-btn.small { font-size: clamp(13px, 3.6vw, 20px); }

        .winner-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }

        .winner-screen h2 {
            margin-bottom: 20px;
            font-size: clamp(20px, 6vw, 30px);
            text-shadow: 0 0 15px #0ff;
        }

        .winner-screen button,
        .back-btn {
            padding: 14px 28px;
            font-size: clamp(15px, 4vw, 19px);
            background: #0ff;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            text-decoration: none;
            display: inline-block;
        }

        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 7px 14px;
            font-size: clamp(12px, 3vw, 15px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 2px solid #0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            z-index: 25;
        }

        .back-btn:active {
            background: rgba(0, 255, 255, 0.4);
            color: #000;
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-btn">← Меню</a>

<div class="game-wrapper">
    <div class="scoreboard">
        Очки: <span id="score">0</span> | Линии: <span id="lines">0</span> | Ур.: <span id="level">1</span>
    </div>

    <div class="play-area">
        <canvas id="gameCanvas"></canvas>
        <div class="side-panel">
            <div class="label">СЛЕД.</div>
            <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn small" id="btnRotate">⟳</div>
        <div class="control-btn" id="btnLeft">◀</div>
        <div class="control-btn" id="btnDown">▼</div>
        <div class="control-btn" id="btnRight">▶</div>
        <div class="control-btn small" id="btnDrop">⤓</div>
    </div>

    <div class="winner-screen" id="winScreen">
        <h2 id="winnerText">Игра окончена</h2>
        <button onclick="resetGame()">Играть снова</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nctx = nextCanvas.getContext('2d');

    const COLS = 10;
    const ROWS = 20;

    const COLORS = {
        I: '#0ff',
        J: '#0080ff',
        L: '#ff8c00',
        O: '#ffea00',
        S: '#00ff66',
        T: '#f0f',
        Z: '#ff2a2a'
    };

    const SHAPES = {
        I: [[1,1,1,1]],
        J: [[1,0,0],[1,1,1]],
        L: [[0,0,1],[1,1,1]],
        O: [[1,1],[1,1]],
        S: [[0,1,1],[1,1,0]],
        T: [[0,1,0],[1,1,1]],
        Z: [[1,1,0],[0,1,1]]
    };

    let blockSize = 20;
    let board = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0, lines = 0, level = 1;
    let dropInterval = 500, dropCounter = 0, lastTime = 0;
    let gameOver = false;

    const scoreSpan = document.getElementById('score');
    const linesSpan = document.getElementById('lines');
    const levelSpan = document.getElementById('level');

    // ---------- РАЗМЕРЫ ----------
    function resizeCanvas() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // Реально доступное место под поле: минус панель счёта сверху, кнопки снизу и панель "след." сбоку
        const availableH = vh - 170;          // ~50 сверху + ~110 снизу + запас
        const sideReserve = 100;              // резерв под nextCanvas + gap
        const availableW = vw - sideReserve - 30;

        // Максимально возможный размер клетки
        const maxByH = availableH / ROWS;
        const maxByW = availableW / COLS;

        blockSize = Math.floor(Math.max(10, Math.min(maxByH, maxByW)));
        // Ограничим сверху, чтобы на ПК не было гигантским
        blockSize = Math.min(blockSize, 40);

        const w = blockSize * COLS;
        const h = blockSize * ROWS;

        canvas.width = w;
        canvas.height = h;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        // nextCanvas пропорционален
        const nSize = Math.max(60, Math.min(blockSize * 4, 90));
        nextCanvas.width = nSize;
        nextCanvas.height = nSize;
        nextCanvas.style.width = nSize + 'px';
        nextCanvas.style.height = nSize + 'px';
    }

    // ---------- ИГРА ----------
    function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function randomPiece() {
        const keys = Object.keys(SHAPES);
        const type = keys[Math.floor(Math.random() * keys.length)];
        const shape = SHAPES[type].map(row => [...row]);
        return { type, shape, x: 0, y: 0 };
    }

    function spawnPiece() {
        if (!nextPiece) nextPiece = randomPiece();
        currentPiece = nextPiece;
        nextPiece = randomPiece();
        currentPiece.x = Math.floor((COLS - currentPiece.shape[0].length) / 2);
        currentPiece.y = 0;

        if (collides(currentPiece.shape, currentPiece.x, currentPiece.y)) {
            endGame();
        }
        drawNext();
    }

    function collides(shape, px, py) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    const x = px + c, y = py + r;
                    if (x < 0 || x >= COLS || y >= ROWS) return true;
                    if (y >= 0 && board[y][x]) return true;
                }
            }
        }
        return false;
    }

    function merge() {
        currentPiece.shape.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val) {
                    const y = currentPiece.y + r;
                    const x = currentPiece.x + c;
                    if (y >= 0) board[y][x] = currentPiece.type;
                }
            });
        });
    }

    function rotate(shape) {
        const rows = shape.length, cols = shape[0].length;
        const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
        for (let r = 0; r < rows; r++)
            for (let c = 0; c < cols; c++)
                rotated[c][rows - 1 - r] = shape[r][c];
        return rotated;
    }

    function rotatePiece() {
        if (!currentPiece || gameOver) return;
        const rotated = rotate(currentPiece.shape);
        let offset = 0;
        if (collides(rotated, currentPiece.x, currentPiece.y)) {
            if (!collides(rotated, currentPiece.x - 1, currentPiece.y)) offset = -1;
            else if (!collides(rotated, currentPiece.x + 1, currentPiece.y)) offset = 1;
            else return;
        }
        currentPiece.shape = rotated;
        currentPiece.x += offset;
        draw();
    }

    function move(dir) {
        if (!currentPiece || gameOver) return;
        if (!collides(currentPiece.shape, currentPiece.x + dir, currentPiece.y)) {
            currentPiece.x += dir;
            draw();
        }
    }

    function softDrop() {
        if (!currentPiece || gameOver) return;
        if (!collides(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
            currentPiece.y++;
            dropCounter = 0;
            draw();
        } else {
            lockPiece();
        }
    }

    function hardDrop() {
        if (!currentPiece || gameOver) return;
        while (!collides(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
            currentPiece.y++;
        }
        lockPiece();
    }

    function lockPiece() {
        merge();
        clearLines();
        spawnPiece();
        draw();
    }

    function clearLines() {
        let cleared = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r].every(cell => cell)) {
                board.splice(r, 1);
                board.unshift(Array(COLS).fill(null));
                cleared++;
                r++;
            }
        }
        if (cleared > 0) {
            const points = [0, 100, 300, 500, 800];
            score += points[cleared] * level;
            lines += cleared;
            level = Math.floor(lines / 10) + 1;
            dropInterval = Math.max(100, 500 - (level - 1) * 40);
            updateScoreboard();
        }
    }

    function updateScoreboard() {
        scoreSpan.textContent = score;
        linesSpan.textContent = lines;
        levelSpan.textContent = level;
    }

    function drawCell(context, x, y, size, color) {
        context.fillStyle = color;
        context.fillRect(x * size, y * size, size, size);
        context.fillStyle = 'rgba(255,255,255,0.25)';
        context.fillRect(x * size, y * size, size, size * 0.15);
        context.fillStyle = 'rgba(0,0,0,0.3)';
        context.fillRect(x * size, y * size + size * 0.85, size, size * 0.15);
        context.strokeStyle = 'rgba(0,0,0,0.5)';
        context.lineWidth = 1;
        context.strokeRect(x * size, y * size, size, size);
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Сетка
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.10)';
        ctx.lineWidth = 1;
        for (let c = 1; c < COLS; c++) {
            ctx.beginPath();
            ctx.moveTo(c * blockSize, 0);
            ctx.lineTo(c * blockSize, canvas.height);
            ctx.stroke();
        }
        for (let r = 1; r < ROWS; r++) {
            ctx.beginPath();
            ctx.moveTo(0, r * blockSize);
            ctx.lineTo(canvas.width, r * blockSize);
            ctx.stroke();
        }

        // Заполненные клетки
        board.forEach((row, r) => {
            row.forEach((type, c) => {
                if (type) drawCell(ctx, c, r, blockSize, COLORS[type]);
            });
        });

        // Текущая фигура
        if (currentPiece) {
            currentPiece.shape.forEach((row, r) => {
                row.forEach((val, c) => {
                    if (val) {
                        const x = currentPiece.x + c;
                        const y = currentPiece.y + r;
                        if (y >= 0) drawCell(ctx, x, y, blockSize, COLORS[currentPiece.type]);
                    }
                });
            });
        }
    }

    function drawNext() {
        nctx.fillStyle = '#000';
        nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (!nextPiece) return;

        const shape = nextPiece.shape;
        const cell = Math.floor(Math.min(
            nextCanvas.width / (shape[0].length + 1),
            nextCanvas.height / (shape.length + 1)
        ));
        const offsetX = (nextCanvas.width - shape[0].length * cell) / 2;
        const offsetY = (nextCanvas.height - shape.length * cell) / 2;

        shape.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val) {
                    const x = offsetX + c * cell;
                    const y = offsetY + r * cell;
                    nctx.fillStyle = COLORS[nextPiece.type];
                    nctx.fillRect(x, y, cell, cell);
                    nctx.fillStyle = 'rgba(255,255,255,0.25)';
                    nctx.fillRect(x, y, cell, cell * 0.15);
                    nctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    nctx.lineWidth = 1;
                    nctx.strokeRect(x, y, cell, cell);
                }
            });
        });
    }

    function update(time = 0) {
        if (gameOver) return;
        const delta = time - lastTime;
        lastTime = time;

        dropCounter += delta;
        if (dropCounter > dropInterval) {
            softDrop();
            dropCounter = 0;
        }
        draw();
        requestAnimationFrame(update);
    }

    function endGame() {
        gameOver = true;
        document.getElementById('winnerText').textContent = 'Игра окончена! Очки: ' + score;
        document.getElementById('winScreen').style.display = 'flex';
    }

    function resetGame() {
        resizeCanvas();
        board = createBoard();
        score = 0; lines = 0; level = 1;
        dropInterval = 500; dropCounter = 0;
        gameOver = false;
        currentPiece = null;
        nextPiece = randomPiece();
        spawnPiece();
        updateScoreboard();
        document.getElementById('winScreen').style.display = 'none';
        draw();
        lastTime = performance.now();
        requestAnimationFrame(update);
    }

    // ---------- УПРАВЛЕНИЕ ----------
    document.getElementById('btnLeft').addEventListener('pointerdown', e => { e.preventDefault(); move(-1); });
    document.getElementById('btnRight').addEventListener('pointerdown', e => { e.preventDefault(); move(1); });
    document.getElementById('btnRotate').addEventListener('pointerdown', e => { e.preventDefault(); rotatePiece(); });
    document.getElementById('btnDown').addEventListener('pointerdown', e => { e.preventDefault(); softDrop(); });
    document.getElementById('btnDrop').addEventListener('pointerdown', e => { e.preventDefault(); hardDrop(); });

    window.addEventListener('keydown', e => {
        if (gameOver) return;
        if (e.key === 'ArrowLeft'  || e.key === 'a') { e.preventDefault(); move(-1); }
        if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); move(1); }
        if (e.key === 'ArrowDown'  || e.key === 's') { e.preventDefault(); hardDrop(); }
        if (e.key === 'ArrowUp'    || e.key === 'w') { e.preventDefault(); rotatePiece(); }
        if (e.key === ' ')                           { e.preventDefault(); hardDrop(); }
    });

    window.addEventListener('resize', () => {
        const prevBlock = blockSize;
        resizeCanvas();
        if (blockSize !== prevBlock) draw();
    });

    // ---------- СТАРТ ----------
    resetGame();
</script>
</body>
</html>
