<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lines 98</title>
<link rel="icon" type="image/png" href="res/favicon-64.png" sizes="64x64">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a14;
    font-family: 'Courier New', monospace;
    color: #ecf0f1;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  h1 {
    margin: 10px 0;
    font-size: clamp(18px, 4vw, 24px);
    letter-spacing: 2px;
    color: #0ff;
    text-shadow: 0 0 12px rgba(0,255,255,0.6);
  }
  #hud {
    display: flex;
    gap: 30px;
    font-size: clamp(13px, 3vw, 16px);
    margin-bottom: 10px;
    color: #0ff;
    text-shadow: 0 0 8px rgba(0,255,255,0.4);
    align-items: center;
  }
  #hud b { color: #fff; }
  #best.new-record {
    color: #f1c40f;
    text-shadow: 0 0 12px #f1c40f;
    animation: pulse 0.6s ease-in-out 3;
    display: inline-block;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }
  #resetBest {
    background: none;
    border: 1px solid #0ff;
    color: #0ff;
    border-radius: 4px;
    padding: 0 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    margin-left: 4px;
    transition: all 0.15s;
  }
  #resetBest:hover { background: rgba(0,255,255,0.2); }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(9, clamp(30px, 9vw, 44px));
    grid-template-rows: repeat(9, clamp(30px, 9vw, 44px));
    gap: 2px;
    padding: 6px;
    background: #0f1620;
    border-radius: 8px;
    border: 2px solid #0ff;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
  }
  .cell {
    width: 100%;
    height: 100%;
    background: #1a252f;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }
  .cell:hover { background: #253544; }
  .cell.path { background: #7f8c8d; }
  .ball {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    transition: transform 0.15s;
    position: relative;
    pointer-events: none;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5), inset 3px 3px 6px rgba(255,255,255,0.35);
  }
  .ball.selected {
    transform: scale(1.15);
    outline: 2px solid #0ff;
    outline-offset: 1px;
    box-shadow: 0 0 12px #0ff, inset -3px -3px 6px rgba(0,0,0,0.5), inset 3px 3px 6px rgba(255,255,255,0.35);
  }
  #next {
    display: flex;
    gap: 10px;
    margin: 14px 0;
    align-items: center;
    font-size: clamp(12px, 3vw, 14px);
    color: #0ff;
  }
  #next .ball { width: 26px; height: 26px; }
  #restart {
    background: #0ff;
    color: #000;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: clamp(13px, 3vw, 15px);
    font-weight: bold;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    transition: all 0.15s ease;
  }
  #restart:hover { background: #0cf; box-shadow: 0 0 28px rgba(0, 255, 255, 0.9); }
  #restart:active { transform: scale(0.95); }

  /* ===== Кнопка "Меню" ===== */
  .back-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 8px 16px;
    font-size: clamp(13px, 3vw, 16px);
    background: rgba(0, 255, 255, 0.15);
    color: #0ff;
    border: 2px solid #0ff;
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    border-radius: 10px;
    text-decoration: none;
    font-family: inherit;
    font-weight: bold;
    z-index: 25;
    backdrop-filter: blur(6px);
    transition: all 0.15s ease;
    user-select: none;
  }
  .back-btn:active {
    background: rgba(0, 255, 255, 0.4);
    color: #000;
    transform: scale(0.95);
  }

  #gameover {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-radius: 8px;
    font-size: clamp(16px, 4vw, 22px);
    text-align: center;
    padding: 20px;
    color: #0ff;
    text-shadow: 0 0 12px rgba(0,255,255,0.6);
    z-index: 10;
  }
  #gameover.show { display: flex; }
  #gameover small { color: #fff; font-size: 0.6em; margin-top: 10px; }
  #gameover .record { color: #f1c40f; text-shadow: 0 0 12px #f1c40f; margin-top: 6px; }
</style>
</head>
<body>

<a href="../index.html" class="back-btn">← Меню</a>

<h1>LINES 98</h1>
<div id="hud">
  <div>Очки: <b id="score">0</b></div>
  <div>Рекорд: <b id="best">0</b><button id="resetBest" title="Сбросить рекорд">×</button></div>
</div>
<div id="board"></div>
<div id="next">Следующие: <span id="nextBalls"></span></div>
<button id="restart">Новая игра</button>

<script>
// ============================================================
//                    ЗВУКИ
// ============================================================
const SOUNDS = {
    kickFig : { src: '../res/tetris/1/kick-fig-1.mp3' , volume: 0.45, pool: 2 },
    kickSide: { src: '../res/tetris/1/kick-side-1.mp3', volume: 0.45, pool: 2 },
    linedel : { src: '../res/tetris/1/linedel-1.mp3'  , volume: 0.55, pool: 2 },
    move    : { src: '../res/tetris/1/move-1.mp3'     , volume: 0.35, pool: 3 },
    rot     : { src: '../res/tetris/1/rot-1.mp3'      , volume: 0.35, pool: 3 },
    death   : { src: '../res/tetris/1/death.mp3'      , volume: 0.55, pool: 1 },
};

const audioUnlocked = { value: false };

function createSound(src, volume, poolSize = 2) {
    const pool = Array.from({ length: poolSize }, () => {
        const a = new Audio(src);
        a.preload = 'auto';
        a.volume = volume;
        return a;
    });
    let idx = 0;

    return {
        play() {
            if (!audioUnlocked.value) return;
            const a = pool[idx];
            idx = (idx + 1) % poolSize;
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (_) {}
        },
        warmup() {
            const a = pool[0];
            const prev = a.volume;
            a.volume = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
            setTimeout(() => {
                try { a.pause(); a.currentTime = 0; } catch (_) {}
                a.volume = prev;
            }, 60);
        },
    };
}

const sounds = Object.fromEntries(
    Object.entries(SOUNDS).map(([name, cfg]) => [
        name,
        createSound(cfg.src, cfg.volume, cfg.pool),
    ])
);

function unlockAudio() {
    if (audioUnlocked.value) return;
    audioUnlocked.value = true;
    Object.values(sounds).forEach(s => s.warmup());
}
['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, unlockAudio, { passive: true });
});

// ============================================================
//                    ИГРА LINES
// ============================================================
const SIZE = 9;
const COLORS = ['#900', '#dd0', '#060', '#0f0', '#0ff', '#607', '#00f'];
const BALLS_PER_TURN = 3;
const LINE_LEN = 5;

let grid = [];
let cells = [];
let score = 0;
let selected = null;
let nextColors = [];
let gameOver = false;
let pathPreview = [];

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const nextEl  = document.getElementById('nextBalls');
const gameOverEl = document.createElement('div');
gameOverEl.id = 'gameover';
boardEl.appendChild(gameOverEl);

// ============================================================
//                    РЕКОРД (localStorage)
// ============================================================
const BEST_KEY = 'lines_best';

function loadBest() {
  try {
    const raw = localStorage.getItem(BEST_KEY);
    const n = parseInt(raw, 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  } catch (e) {
    return 0;
  }
}

function saveBest(value) {
  try {
    localStorage.setItem(BEST_KEY, String(value));
  } catch (e) {
    // localStorage недоступен (приватный режим / запрет cookies)
  }
}

let best = loadBest();
bestEl.textContent = best;

function updateBest() {
  if (score > best) {
    best = score;
    saveBest(best);
    bestEl.textContent = best;
    bestEl.classList.add('new-record');
    setTimeout(() => bestEl.classList.remove('new-record'), 2000);
    return true;
  }
  return false;
}

document.getElementById('resetBest').addEventListener('click', () => {
  if (!confirm('Сбросить рекорд?')) return;
  best = 0;
  saveBest(0);
  bestEl.textContent = '0';
});

// ---------- Инициализация ----------
function initGrid() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  cells = [];
  boardEl.querySelectorAll('.cell').forEach(c => c.remove());
  for (let y = 0; y < SIZE; y++) {
    cells[y] = [];
    for (let x = 0; x < SIZE; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.dataset.x = x;
      c.dataset.y = y;
      c.addEventListener('click', () => onCellClick(x, y));
      boardEl.appendChild(c);
      cells[y][x] = c;
    }
  }
}

function startGame() {
  gameOver = false;
  score = 0;
  selected = null;
  pathPreview = [];
  gameOverEl.classList.remove('show');
  scoreEl.textContent = 0;
  initGrid();
  nextColors = randomColors();
  spawnNextBalls();
  renderNext();
  renderAll();
}

function randomColors() {
  const arr = [];
  for (let i = 0; i < BALLS_PER_TURN; i++) {
    arr.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
  }
  return arr;
}

function renderNext() {
  nextEl.innerHTML = '';
  nextColors.forEach(c => {
    const b = document.createElement('div');
    b.className = 'ball';
    b.style.background = c;
    nextEl.appendChild(b);
  });
}

function emptyCells() {
  const list = [];
  for (let y = 0; y < SIZE; y++)
    for (let x = 0; x < SIZE; x++)
      if (!grid[y][x]) list.push({ x, y });
  return list;
}

function spawnNextBalls() {
  const empties = emptyCells();
  if (empties.length === 0) { endGame(); return false; }
  const placed = [];
  for (let i = 0; i < BALLS_PER_TURN; i++) {
    const remaining = emptyCells().filter(e => !placed.some(p => p.x === e.x && p.y === e.y));
    if (remaining.length === 0) break;
    const pos = remaining[Math.floor(Math.random() * remaining.length)];
    grid[pos.y][pos.x] = nextColors[i];
    placed.push(pos);
  }
  if (placed.length > 0) sounds.kickFig.play();
  placed.forEach(p => {
    const ball = cells[p.y][p.x].querySelector('.ball');
    if (ball) {
      ball.style.transform = 'scale(0)';
      requestAnimationFrame(() => ball.style.transform = 'scale(1)');
    }
  });
  return placed.length > 0;
}

function renderAll() {
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const cell = cells[y][x];
      const color = grid[y][x];
      let ball = cell.querySelector('.ball');
      if (color) {
        if (!ball) {
          ball = document.createElement('div');
          ball.className = 'ball';
          cell.appendChild(ball);
        }
        ball.style.background = color;
      } else if (ball) {
        ball.remove();
      }
      cell.classList.toggle('path', pathPreview.some(p => p.x === x && p.y === y));
      const isSel = selected && selected.x === x && selected.y === y;
      if (ball) ball.classList.toggle('selected', isSel);
    }
  }
}

function findPath(from, to) {
  if (grid[from.y][from.x] === null) return null;
  if (grid[to.y][to.x] !== null) return null;
  if (from.x === to.x && from.y === to.y) return null;

  const visited = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
  const prev = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  const queue = [from];
  visited[from.y][from.x] = true;
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  while (queue.length) {
    const cur = queue.shift();
    if (cur.x === to.x && cur.y === to.y) {
      const path = [];
      let p = { x: to.x, y: to.y };
      while (p) { path.push(p); p = prev[p.y][p.x]; }
      path.reverse();
      return path;
    }
    for (const [dx, dy] of dirs) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE) continue;
      if (visited[ny][nx]) continue;
      if (grid[ny][nx] !== null) continue;
      visited[ny][nx] = true;
      prev[ny][nx] = cur;
      queue.push({ x: nx, y: ny });
    }
  }
  return null;
}

function checkLines() {
  const toRemove = new Set();
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const color = grid[y][x];
      if (!color) continue;
      for (const [dx, dy] of dirs) {
        const px = x - dx, py = y - dy;
        if (px >= 0 && py >= 0 && px < SIZE && py < SIZE && grid[py][px] === color) continue;

        let len = 0;
        let cx = x, cy = y;
        const cellsInLine = [];
        while (cx >= 0 && cy >= 0 && cx < SIZE && cy < SIZE && grid[cy][cx] === color) {
          cellsInLine.push({ x: cx, y: cy });
          len++;
          cx += dx; cy += dy;
        }
        if (len >= LINE_LEN) {
          cellsInLine.forEach(p => toRemove.add(p.x + ',' + p.y));
        }
      }
    }
  }
  return [...toRemove].map(s => {
    const [x, y] = s.split(',').map(Number);
    return { x, y };
  });
}

function onCellClick(x, y) {
  if (gameOver) return;

  if (!selected) {
    if (grid[y][x]) {
      selected = { x, y };
      pathPreview = [];
      renderAll();
      sounds.rot.play();
    }
    return;
  }

  if (grid[y][x]) {
    selected = { x, y };
    pathPreview = [];
    renderAll();
    sounds.rot.play();
    return;
  }

  const path = findPath(selected, { x, y });
  if (!path) {
    selected = null;
    pathPreview = [];
    renderAll();
    sounds.kickSide.play();
    return;
  }

  const color = grid[selected.y][selected.x];
  grid[selected.y][selected.x] = null;
  grid[y][x] = color;
  selected = null;
  pathPreview = [];
  renderAll();

  sounds.move.play();

  const lines = checkLines();
  if (lines.length > 0) {
    removeLines(lines);
  } else {
    nextTurn();
  }
}

function removeLines(lines) {
  sounds.linedel.play();

  lines.forEach(p => {
    const ball = cells[p.y][p.x].querySelector('.ball');
    if (ball) ball.style.transform = 'scale(0)';
  });

  score += lines.length * 5 + (lines.length >= 5 ? (lines.length - 5) * 5 : 0);
  scoreEl.textContent = score;
  updateBest();

  setTimeout(() => {
    lines.forEach(p => { grid[p.y][p.x] = null; });
    renderAll();
    const more = checkLines();
    if (more.length > 0) {
      removeLines(more);
    } else {
      if (emptyCells().length === 0) endGame();
    }
  }, 250);
}

function nextTurn() {
  if (!spawnNextBalls()) { endGame(); return; }
  nextColors = randomColors();
  renderNext();
  renderAll();
  const lines = checkLines();
  if (lines.length > 0) removeLines(lines);
  if (emptyCells().length === 0) endGame();
}

function endGame() {
  gameOver = true;
  sounds.death.play();

  const newRecord = updateBest();

  gameOverEl.innerHTML =
    `Игра окончена!<br>` +
    `Очки: <b>${score}</b><br>` +
    `Рекорд: <b>${best}</b>` +
    (newRecord ? `<div class="record">🏆 Новый рекорд!</div>` : '') +
    `<small>Нажмите «Новая игра»</small>`;
  gameOverEl.classList.add('show');
}

document.getElementById('restart').addEventListener('click', startGame);
startGame();
</script>
</body>
</html>
