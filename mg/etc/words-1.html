<!--
ТЗ: Игра «Слова» (2 игрока, оффлайн) — 40 пунктов
Игра запускается из локального HTML-файла без сервера и интернета.
Словарь подключается отдельным скриптом как window.WORDS (Set).
При отсутствии словаря показывается понятная ошибка запуска.
Поиск по словарю — точное совпадение, с нормализацией регистра и «ё/е».
Игра рассчитана на двух игроков на одном устройстве, по очереди.
На старте Игрок 1 вводит слово из словаря длиной 5–12 букв.
Длина стартового слова задаёт размер квадратного поля N×N.
Поле адаптивно масштабируется под экран; клетки — квадратные.
Стартовое слово размещается горизонтально в середине поля.
Стартовое слово принадлежит Игроку 1 и очков ему не приносит.
Первым ходит Игрок 1; активный игрок подсвечен в HUD.
За один ход игрок ставит на поле ровно одну букву.
Буква ставится в пустую клетку, соседнюю (4-соседство) с любой буквой.
Диагональное соседство при постановке буквы запрещено.
Буква вводится прямо в клетке: физическая или экранная клавиатура.
Ввод не-русской буквы игнорируется, клетка остаётся в режиме ввода.
Отмена ввода: повторный клик по клетке, Esc, Backspace или Enter.
После ввода буква подсвечивается как «ожидающая» и мигает.
Игрок кликами собирает слово из букв на поле по порядку.
Слово может идти по ломаной линии только по 4-соседству.
Порядок кликов задаёт порядок букв: слева/справа, сверху/снизу.
Клик по соседу первой буквы добавляет её в начало слова.
Клик по соседу последней буквы добавляет её в конец слова.
Повторный клик по выбранной клетке убирает её из слова.
Буква игрока может стоять в любом месте слова, не только первой.
Превью слова показывается под полем через разделитель «·».
Кнопка «Принять» активна, когда выделено минимум две буквы.
Принятое слово проверяется по словарю; повтор слов запрещён.
За принятое слово игроку начисляются очки, равные длине слова.
После успеха буква фиксируется, счёт растёт, ход переходит сопернику.
При успехе таймер сбрасывается; новый ход начинается без таймера.
Если слова нет в словаре — буква убирается, запускается таймер 60 с.
По истечении таймера буква убирается, ход переходит сопернику.
Если слово уже было в игре — ошибка, ход не меняется, буква остаётся.
Кнопка «Сброс» очищает выделение; «Убрать букву» снимает pending.
Клетки игроков различаются цветом; счёт обоих виден в HUD.
Звуки берутся из res/tetris/1/ через SoundKit; есть кнопка mute.
Кнопка «← Меню» освобождает звуковые ресурсы (kit.dispose()).
Есть кнопка полноэкранного режима для мобильных устройств.
Стиль — неоновый «киан/чёрный».
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Игра «Слова»</title>
<link rel="icon" type="image/png" href="../res/favicon-64.png" sizes="64x64">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        background-color: #0a0a14;
        font-family: 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
    }

    .game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        height: 100%;
        position: relative;
        padding: 70px 10px 20px;
        overflow-y: auto;
        touch-action: manipulation;
    }

/* ================= ТАБЛО СЧЁТА ================= */
.scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: clamp(8px, 2vw, 18px);
    width: min(96vw, 640px);
    margin-bottom: clamp(10px, 2vh, 18px);
    align-items: stretch;
    z-index: 20;
    position: relative;
}

.player-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.8vh, 14px) clamp(8px, 2vw, 16px);
    border-radius: 14px;
    background: rgba(0, 255, 255, 0.04);
    border: 2px solid rgba(0, 255, 255, 0.25);
    box-shadow:
        inset 0 0 18px rgba(0, 255, 255, 0.08),
        0 0 14px rgba(0, 255, 255, 0.15);
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
}

/* Активный игрок — всегда розовое сияние, независимо от номера */
.player-panel.active {
    border-color: #f0f;
    background: rgba(255, 0, 255, 0.12);
    box-shadow:
        inset 0 0 26px rgba(255, 0, 255, 0.35),
        0 0 28px rgba(255, 0, 255, 0.7),
        0 0 60px rgba(255, 0, 255, 0.4);
    animation: glowPulseActive 2s ease-in-out infinite alternate;
}

@keyframes glowPulseActive {
    from { box-shadow:
        inset 0 0 22px rgba(255, 0, 255, 0.3),
        0 0 22px rgba(255, 0, 255, 0.55),
        0 0 50px rgba(255, 0, 255, 0.3); }
    to   { box-shadow:
        inset 0 0 30px rgba(255, 0, 255, 0.45),
        0 0 34px rgba(255, 0, 255, 0.85),
        0 0 80px rgba(255, 0, 255, 0.55); }
}

.player-label {
    font-size: clamp(9px, 2.2vw, 12px);
    letter-spacing: 3px;
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    opacity: 0.75;
    margin-bottom: 4px;
    white-space: nowrap;
}


/* БОЛЬШИЕ ОБЪЁМНЫЕ ЦИФРЫ */
.player-score {
    font-size: clamp(28px, 9vw, 52px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 1px;
    color: #0ff;
    text-shadow:
        0 1px 0 #066,
        0 2px 0 #055,
        0 3px 0 #044,
        0 4px 0 #033,
        0 5px 0 #022,
        0 6px 0 #011,
        0 0 12px #0ff,
        0 0 24px #0ff,
        0 0 42px #0ff;
    transition: transform 0.2s ease;
}


/* Подсветка цифр активного игрока */
/* Цифры активного игрока — розовые и пульсируют */
.player-panel.active .player-score {
    color: #f0f;
    text-shadow:
        0 1px 0 #606,
        0 2px 0 #505,
        0 3px 0 #404,
        0 4px 0 #303,
        0 5px 0 #202,
        0 6px 0 #101,
        0 0 12px #f0f,
        0 0 24px #f0f,
        0 0 42px #f0f;
    animation: scorePulse 1.6s ease-in-out infinite alternate;
}

@keyframes scorePulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
}

.player-panel.active .player-label {
    color: #f0f;
    text-shadow:
        0 0 8px #f0f,
        0 0 16px #f0f,
        0 0 28px #f0f;
    opacity: 1;
    animation: labelGlow 1.6s ease-in-out infinite alternate;
}

/* Центральный блок — ход + таймер */
.board-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 10px;
    min-width: 70px;
    text-align: center;
}
.turn-label {
    font-size: clamp(8px, 2vw, 11px);
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 2px;
}
.turn-name {
    font-size: clamp(16px, 4.5vw, 24px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fc0;
    text-shadow: 0 0 12px #fc0, 0 0 22px #fc0;
    margin-bottom: 6px;
}
.timer-value {
    font-size: clamp(13px, 3.4vw, 18px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 16px #0ff;
    min-height: 1em;
}
.timer-value.warning {
    color: #f0f;
    text-shadow: 0 0 10px #f0f, 0 0 22px #f0f;
    animation: timerBlink 0.6s step-end infinite;
}
@keyframes timerBlink {
    50% { opacity: 0.35; }
}

    .status {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        color: #0ff;
        font-size: clamp(11px, 3vw, 16px);
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px #0ff;
        white-space: nowrap;
        z-index: 20;
        pointer-events: none;
        max-width: 96vw;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    .status.thinking { animation: statusPulse 1.1s ease-in-out infinite; }
    .status.bad { color: #f0f; text-shadow: 0 0 12px #f0f; }
    .status.ok  { color: #0f0; text-shadow: 0 0 12px #0f0; }
    .status.timer-on { color: #fc0; text-shadow: 0 0 12px #fc0; }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
    }

    /* ================= ДОСКА (адаптивный N×N) ================= */
    .board {
        display: grid;
        gap: clamp(4px, 1.2vw, 8px);
        width: min(92vw, 60vh, 520px);
        aspect-ratio: 1 / 1;
        padding: clamp(6px, 1.6vw, 10px);
        background: rgba(0, 255, 255, 0.04);
        border: 2px solid #0ff;
        border-radius: 14px;
        box-shadow:
            0 0 30px rgba(0, 255, 255, 0.4),
            inset 0 0 30px rgba(0, 255, 255, 0.08);
        position: relative;
    }

    .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-family: inherit;
        font-size: clamp(14px, 4vw, 26px);
        font-weight: bold;
        user-select: none;
        -webkit-user-select: none;
        color: #0ff;
        text-shadow: 0 0 10px #0ff, 0 0 22px #0ff;
        background: rgba(0, 255, 255, 0.12);
        border: 2px solid rgba(0, 255, 255, 0.45);
        box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.15);
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.2s ease;
        will-change: transform;
        position: relative;
        z-index: 1;
    }

    .cell.empty {
        background: transparent;
        border: 2px dashed rgba(0, 255, 255, 0.2);
        box-shadow: none;
        color: transparent;
        text-shadow: none;
        cursor: default;
    }

    .cell.placeable {
        cursor: pointer;
        background: rgba(0, 255, 255, 0.06);
        border-color: rgba(0, 255, 255, 0.55);
        box-shadow: inset 0 0 14px rgba(0, 255, 255, 0.25);
    }
    .cell.placeable:hover {
        background: rgba(0, 255, 255, 0.18);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.4);
    }

    .cell.letter { cursor: pointer; }
    .cell.letter:hover {
        background: rgba(0, 255, 255, 0.2);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.3);
    }

    .cell.pending {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.15);
        box-shadow: inset 0 0 20px rgba(255, 200, 0, 0.35);
        animation: pendingPulse 1s ease-in-out infinite;
    }
    @keyframes pendingPulse {
        0%, 100% { box-shadow: inset 0 0 18px rgba(255, 200, 0, 0.25); }
        50%      { box-shadow: inset 0 0 28px rgba(255, 200, 0, 0.7); }
    }

    /* Режим ввода буквы прямо в клетке */
    .cell.typing {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.18);
        box-shadow: inset 0 0 22px rgba(255, 200, 0, 0.4), 0 0 18px rgba(255, 200, 0, 0.5);
        outline: none;
        font-size: clamp(16px, 4.5vw, 28px);
    }
    .cell.typing::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #fc0;
        margin-left: 2px;
        animation: caretBlink 0.8s step-end infinite;
        vertical-align: text-bottom;
    }
    @keyframes caretBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
    }

    .cell.selected {
        color: #000 !important;
        text-shadow: none !important;
        background: #0ff !important;
        border-color: #0ff !important;
        box-shadow: 0 0 22px rgba(0, 255, 255, 0.9) !important;
        transform: scale(0.96);
    }

    .cell.owner-0 { color: #9cf; }
    .cell.owner-1 { color: #fcf; }

    .preview {
        text-align: center;
        font-size: clamp(14px, 3.6vw, 18px);
        letter-spacing: 3px;
        color: #fc0;
        text-shadow: 0 0 10px #fc0;
        min-height: 26px;
        margin-top: clamp(10px, 2vh, 16px);
        font-weight: bold;
    }

    .controls {
        display: flex;
        gap: 8px;
        margin-top: clamp(10px, 2vh, 16px);
        flex-wrap: wrap;
        justify-content: center;
        max-width: 96vw;
    }

    .btn {
        padding: clamp(8px, 2vh, 12px) clamp(12px, 3vw, 18px);
        font-family: inherit;
        font-size: clamp(11px, 2.8vw, 14px);
        letter-spacing: 1.5px;
        background: #0ff;
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 0 30px rgba(0, 255, 255, 0.9); }
    .btn.secondary {
        background: transparent; color: #0ff;
        border: 2px solid #0ff;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    }
    .btn.warn {
        background: transparent; color: #fc0;
        border: 2px solid #fc0;
        box-shadow: 0 0 12px rgba(255, 200, 0, 0.4);
    }
    .btn.danger {
        background: transparent; color: #f0f;
        border: 2px solid #f0f;
        box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
    }
    .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
    }

    .corner-btn {
        position: absolute;
        top: 10px;
        padding: 7px 14px;
        font-family: inherit;
        font-size: clamp(12px, 3vw, 15px);
        background: rgba(0, 255, 255, 0.15);
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        text-decoration: none;
        z-index: 25;
        user-select: none;
        -webkit-user-select: none;
        line-height: 1;
        transition: all 0.15s ease;
    }
    .corner-btn:active {
        background: rgba(0, 255, 255, 0.4);
        color: #000;
    }
    .back-btn { left: 10px; }
    .fs-btn   { right: 10px; display: inline-flex; align-items: center; gap: 6px; }
    .mute-btn { right: 62px; display: inline-flex; align-items: center; gap: 6px; }

    /* ============ СТАРТОВЫЙ ЭКРАН ============ */
    .start-screen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 30;
        text-align: center;
        padding: 20px;
        gap: 18px;
    }
    .start-screen.hidden { display: none; }
    .start-screen h2 {
        color: #0ff;
        font-size: clamp(20px, 6vw, 28px);
        text-shadow: 0 0 20px #0ff;
        letter-spacing: 2px;
    }
    .start-screen p {
        color: #fff;
        font-size: clamp(13px, 3.6vw, 16px);
        text-shadow: 0 0 10px #0ff;
        max-width: 520px;
        line-height: 1.4;
    }
    .start-screen input {
        padding: 12px 16px;
        font-family: inherit;
        font-size: clamp(15px, 4vw, 18px);
        background: rgba(0, 255, 255, 0.08);
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 10px;
        text-align: center;
        letter-spacing: 4px;
        outline: none;
        box-shadow: 0 0 18px rgba(0, 255, 255, 0.3);
        width: min(280px, 80vw);
        text-transform: lowercase;
    }
    .start-screen input:focus {
        box-shadow: 0 0 28px rgba(0, 255, 255, 0.7);
    }
    .start-screen .error {
        color: #f0f;
        text-shadow: 0 0 10px #f0f;
        font-size: clamp(12px, 3.2vw, 14px);
        min-height: 20px;
    }

    /* ============ ЭКРАН РЕЗУЛЬТАТА ============ */
    .result-screen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 35;
        text-align: center;
        padding: 20px;
        gap: 18px;
    }
    .result-screen.visible { display: flex; }
    .result-screen h2 {
        color: #0ff;
        font-size: clamp(22px, 7vw, 34px);
        text-shadow: 0 0 20px #0ff;
        letter-spacing: 3px;
    }
    .result-screen p {
        color: #fff;
        font-size: clamp(14px, 4vw, 18px);
        text-shadow: 0 0 10px #0ff;
    }
    .result-screen button {
        padding: 14px 30px;
        font-family: inherit;
        font-size: clamp(15px, 4vw, 19px);
        background: #0ff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
    
    body.paused .board {
        filter: grayscale(0.6) brightness(0.7);
        pointer-events: none;
    }
    body.paused .controls {
        opacity: 0.4;
        pointer-events: none;
    }
</style>
</head>

<a href="../index-games-4.html" class="corner-btn back-btn" id="backBtn">← Меню</a>

<div class="game-wrapper">

<!-- ЗВУКИ (как в tetris.html) -->

<script src="russian_nouns.txt.js"></script>

<script>
(() => {
'use strict';

// ============================================================
//                       ЗВУК
// ============================================================
let kit = null;
try {
    if (typeof SoundKit !== 'undefined') {
        kit = SoundKit.createSoundKit({
            move    : { src: '../res/tetris/1/move-1.mp3',      volume: 0.3, pool: 3 },
            rot     : { src: '../res/tetris/1/rot-1.mp3',       volume: 0.3, pool: 3 },
            kickFig : { src: '../res/tetris/1/kick-fig-1.mp3',  volume: 0.4, pool: 2 },
            kickSide: { src: '../res/tetris/1/kick-side-1.mp3', volume: 0.4, pool: 2 },
            linedel : { src: '../res/tetris/1/linedel-1.mp3',   volume: 0.5, pool: 2 },
            death   : { src: '../res/tetris/1/death.mp3',       volume: 0.1, pool: 1 },
            click   : { src: '../res/dzin-1.mp3'        ,       volume: 0.5, pool: 3 },
        });
        kit.autoUnlock();
    }
} catch (e) {
    console.warn('SoundKit не инициализирован:', e);
    kit = null;
}

function sfx(name) {
    if (!kit || !kit.sounds[name]) return;
    try { kit.sounds[name].play(); } catch (e) {}
}

// ============================================================
//                       СЛОВАРЬ
// ============================================================
const WORD_SET = (window.WORDS instanceof Set)
    ? window.WORDS
    : new Set(window.WORDS || []);
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е');
const hasWord = s => WORD_SET.has(norm(s));

// ============================================================
//                       КОНСТАНТЫ
// ============================================================
const MIN_START_LEN = 5;
const MAX_START_LEN = 12;
const TURN_SECONDS  = 60;

const DEFAULT_STATUS = 'Поставьте букву в соседнюю клетку';
const PLAYER_NAMES   = ['◀︎--', '--▶︎'];
const PLAYER_FULL    = ['Игрок-1', 'Игрок-2'];

// ============================================================
//                       DOM
// ============================================================
const boardEl     = document.getElementById('board');
const statusEl    = document.getElementById('status');
const previewEl   = document.getElementById('preview');
const score0El    = document.getElementById('score0');
const score1El    = document.getElementById('score1');
const turnNameEl  = document.getElementById('turnName');
const timerEl     = document.getElementById('timer');
const acceptBtn   = document.getElementById('btnAccept');
const clearBtn    = document.getElementById('btnClear');
const cancelBtn   = document.getElementById('btnCancelLetter');
const startScreen = document.getElementById('startScreen');
const startWordIn = document.getElementById('startWord');
const startError  = document.getElementById('startError');
const resultScreen= document.getElementById('resultScreen');
const resultStats = document.getElementById('resultStats');

// ============================================================
//                       СОСТОЯНИЕ
// ============================================================
const state = {
    size: 0,
    board: [],
    currentPlayer: 0,
    scores: [0, 0],
    phase: 'idle',       // 'idle' | 'input' | 'select' | 'finished'
    pending: null,
    typing: null,        // { r, c } — клетка в режиме ввода
    selection: [],
    usedWords: new Set(),
    timerId: null,
    timeLeft: 0,
    startTime: 0,
    moves: 0,
    
    paused: false,          // ← новое: вкладка неактивна
    pausedAt: 0,            // ← новое: когда ушли с вкладки
    wasTimerRunning: false, // ← новое: таймер шёл в момент паузы
};

let cells = [];

// ============================================================
//                       СТАТУС
// ============================================================
let statusResetTimer = null;

function showStatus(text, cls = '', autoResetMs = 0) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    if (statusResetTimer) {
        clearTimeout(statusResetTimer);
        statusResetTimer = null;
    }
    if (autoResetMs > 0) {
        statusResetTimer = setTimeout(() => {
            statusResetTimer = null;
            if (state.phase !== 'finished') showStatus(DEFAULT_STATUS, '');
        }, autoResetMs);
    }
}

// ============================================================
//                       ПОЛЕ
// ============================================================
function initBoard() {
    state.board = Array.from({ length: state.size }, () =>
        Array(state.size).fill(null));
    state.currentPlayer = 0;
    state.scores = [0, 0];
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.usedWords = new Set();
    state.moves = 0;
    stopTimer();
}

function placeStartWord(word) {
    const size   = state.size;
    const midRow = (size >> 1) - (size % 2 === 0 ? 1 : 0);
    const midCol = (size - word.length) >> 1;

    for (let i = 0; i < word.length; i++) {
        state.board[midRow][midCol + i] = { letter: word[i], owner: 0 };
    }

    state.currentPlayer = 0;
}

function inBounds(r, c) {
    return r >= 0 && r < state.size && c >= 0 && c < state.size;
}

function isAdjacentToLetter(r, c) {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && state.board[nr][nc]) return true;
    }
    return false;
}

function buildBoardDom() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
    boardEl.style.gridTemplateRows    = `repeat(${state.size}, 1fr)`;
    cells = [];
    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const d = document.createElement('div');
            d.className = 'cell empty';
            d.dataset.r = r;
            d.dataset.c = c;
            d.addEventListener('click', () => onCellClick(r, c));
            boardEl.appendChild(d);
            cells.push(d);
        }
    }
}

function render() {
    const selectedSet = new Set(state.selection.map(p => p.r + ',' + p.c));

    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const idx = r * state.size + c;
            const d = cells[idx];
            const cell = state.board[r][c];
            const isPending = state.pending && state.pending.r === r && state.pending.c === c;
            const isTyping  = state.typing  && state.typing.r === r  && state.typing.c === c;
            const isSelected = selectedSet.has(r + ',' + c);

            d.className = 'cell';

            if (cell) {
                d.classList.add('letter', 'owner-' + cell.owner);
                d.textContent = cell.letter;
            } else if (isPending) {
                d.classList.add('pending');
                d.textContent = state.pending.letter;
            } else if (isTyping) {
                d.classList.add('typing');
                d.textContent = '';   // курсор рисуется через ::after
            } else {
                d.classList.add('empty');
                d.textContent = '';
                if (state.phase === 'input' && isAdjacentToLetter(r, c)) {
                    d.classList.add('placeable');
                }
            }

            if (isSelected) d.classList.add('selected');
        }
    }
    renderPreview();
    renderHud();
    renderButtons();
}

function renderPreview() {
    const word = getSelectedWord();
    previewEl.textContent = word ? word.split('').join('·') : '\u00A0';
}

function renderHud() {
    score0El.textContent = state.scores[0];
    score1El.textContent = state.scores[1];
    turnNameEl.textContent = PLAYER_NAMES[state.currentPlayer];

    // Подсветка активной панели
    const panel0 = document.getElementById('panel0');
    const panel1 = document.getElementById('panel1');
    if (panel0) panel0.classList.toggle('active', state.currentPlayer === 0);
    if (panel1) panel1.classList.toggle('active', state.currentPlayer === 1);

    // Таймер
    if (state.timeLeft > 0) {
        timerEl.textContent = formatTime(state.timeLeft * 1000);
        timerEl.classList.toggle('warning', state.timeLeft <= 10);
    } else {
        timerEl.textContent = '—';
        timerEl.classList.remove('warning');
    }
}

function renderButtons() {
    acceptBtn.disabled = !(state.phase === 'select' && state.selection.length >= 2);
    clearBtn.disabled  = state.selection.length === 0;
    cancelBtn.disabled = !state.pending;
}

function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
}

// ============================================================
//                   КЛИКИ ПО КЛЕТКАМ
// ============================================================
function onCellClick(r, c) {
    // Клик в другом месте — сбрасываем прежний ввод
    if (state.typing && !(state.typing.r === r && state.typing.c === c)) {
        state.typing = null;
    }
    if (state.paused) return;

    if (state.phase === 'input') {
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        const isEmpty = !cell && !isPending;

        if (!isEmpty) return;

        // Повторный клик по той же клетке — выйти из ввода
        if (state.typing && state.typing.r === r && state.typing.c === c) {
            state.typing = null;
            render();
            return;
        }

        if (!isAdjacentToLetter(r, c)) return;

        // Включаем режим ввода в клетке
        state.typing = { r, c };
        sfx('click'); 
        render();
        focusTypingInput();
        return;
    }

    if (state.phase === 'select') {
        if (state.typing) {
            state.typing = null;
            render();
            return;
        }
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        if (cell || isPending) toggleCell(r, c);
    }
}

// ============================================================
//                   ВВОД БУКВЫ ПРЯМО В КЛЕТКЕ
// ============================================================
function commitTypedLetter(letter) {
    if (!state.typing) return;
    const { r, c } = state.typing;
    state.pending = { r, c, letter };
    state.typing = null;
    state.phase = 'select';
    state.selection = [];
    showStatus('Кликайте клетки по порядку слова — свою букву тоже', 'timer-on', 0);
    sfx('click');
    render();
}

// Скрытый input для вызова системной клавиатуры на мобильных
const hiddenInput = document.createElement('input');
hiddenInput.type = 'text';
hiddenInput.autocomplete = 'off';
hiddenInput.style.cssText =
    'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0;';
document.body.appendChild(hiddenInput);

hiddenInput.addEventListener('input', () => {
    if (state.paused) { hiddenInput.value = ''; return; }
    if (!state.typing) { hiddenInput.value = ''; return; }
    const letter = norm(hiddenInput.value.trim()).slice(-1);
    hiddenInput.value = '';
    if (/^[а-я]$/.test(letter)) commitTypedLetter(letter);
});

function focusTypingInput() {
    if ('ontouchstart' in window) {
        // Небольшая задержка помогает Safari на iOS
        setTimeout(() => { try { hiddenInput.focus(); } catch (e) {} }, 0);
    }
}

document.addEventListener('keydown', e => {
    if (state.paused) return; 
    if (!state.typing) return;

    if (e.key === 'Escape') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }
    if (e.key === 'Backspace' || e.key === 'Enter') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }

    const letter = norm(e.key).trim();
    if (!/^[а-я]$/.test(letter)) return;    // игнорируем не-буквы
    e.preventDefault();
    commitTypedLetter(letter);
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseGame();
    } else {
        resumeGame();
    }
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
    pauseGame();
});

window.addEventListener('focus', () => {
    resumeGame();
});

// ============================================================
//                   СБОР СЛОВА (ломаная)
// ============================================================
function toggleCell(r, c) {
    const idx = state.selection.findIndex(p => p.r === r && p.c === c);

    // Повторный клик по уже выбранной клетке — убрать её
    if (idx >= 0) {
        state.selection.splice(idx, 1);
        sfx('kickSide');
        render();
        return;
    }

    // Первая клетка — можно любую
    if (state.selection.length === 0) {
        state.selection.push({ r, c });
        sfx('click');
        render();
        return;
    }

    // Каждая следующая должна быть 4-соседом предыдущей — и ТОЛЬКО В КОНЕЦ
    const last = state.selection[state.selection.length - 1];
    const isNeighbor =
        (Math.abs(last.r - r) + Math.abs(last.c - c)) === 1;

    if (!isNeighbor) {
        showStatus('Кликните клетку рядом с последней выбранной (не по диагонали)', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    state.selection.push({ r, c });   // ← всегда в конец, порядок = порядок кликов
    sfx('move');
    render();
}

function getSelectedWord() {
    return state.selection.map(({ r, c }) => {
        if (state.pending && state.pending.r === r && state.pending.c === c) {
            return state.pending.letter;
        }
        const cell = state.board[r][c];
        return cell ? cell.letter : '';
    }).join('');
}

// ============================================================
//                   ПРИНЯТИЕ СЛОВА
// ============================================================
function onAccept() {
    const word = getSelectedWord();

    if (word.length < 2) {
        showStatus('Выделите минимум 2 буквы', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    // В отправленном слове обязана быть введённая буква игрока
    if (state.pending) {
        const inWord = state.selection.some(
            p => p.r === state.pending.r && p.c === state.pending.c
        );
        if (!inWord) {
            showStatus('В отправленном слове должна быть ваша новая буква', 'bad', 2000);
            sfx('kickFig');
            return;
        }
    }

    // Слова нет в словаре — буква убирается, тикает таймер
    if (!hasWord(word)) {
        showStatus(`Слова «${word}» нет в словаре. Буква убрана. ${TURN_SECONDS} с на новый вариант`, 'bad', 0);
        sfx('kickFig');
        if (state.pending) state.board[state.pending.r][state.pending.c] = null;
        state.pending = null;
        state.selection = [];
        state.phase = 'input';
        startTimer();
        render();
        return;
    }

    // Слово уже было — не принимаем
    if (state.usedWords.has(word)) {
        showStatus(`Слово «${word}» уже было в игре. Придумайте другое`, 'bad', 0);
        sfx('kickFig');
        return;
    }

    // Успех
    if (state.pending) {
        const { r, c, letter } = state.pending;
        state.board[r][c] = { letter, owner: state.currentPlayer };
    }
    state.scores[state.currentPlayer] += word.length;
    state.usedWords.add(word);
    state.moves++;
    sfx('linedel');
    showStatus(`+${word.length} очков за «${word}»`, 'ok', 2500);

    stopTimer();
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    render();
    startTimer();
    setTimeout(() => {
        if (state.phase !== 'finished') showStatus(DEFAULT_STATUS, '');
    }, 2500);
}

function onClear() {
    const had = state.selection.length > 0;
    state.selection = [];
    if (had) {
        sfx('kickSide');
        showStatus('Выделение сброшено', '', 1500);
    }
    render();
}

function cancelPendingLetter() {
    if (!state.pending) return;
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    sfx('kickSide');
    showStatus('Буква убрана. Выберите другую клетку', '', 1600);
    render();
}

function switchPlayer() {
    state.currentPlayer = 1 - state.currentPlayer;
}

// ============================================================
//                   ТАЙМЕР
// ============================================================
function startTimer() {
    stopTimer();
    state.timeLeft = TURN_SECONDS;
    state.startTime = Date.now();
    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, TURN_SECONDS - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            onTimeout();
        }
    }, 250);
}

function stopTimer() {
    if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
    }
    //state.timeLeft = 0;
}

function pauseGame() {
    if (state.paused) return;
    state.paused = true;
    state.pausedAt = Date.now();
    state.wasTimerRunning = state.timerId !== null;

    // Останавливаем таймер, но запоминаем оставшееся время
    if (state.timerId) {
        stopTimer();
        // stopTimer() обнуляет timeLeft — восстановим
        state.timeLeft = state.pausedTimeLeft ?? state.timeLeft;
    }
    showStatus('Пауза (вкладка неактивна)', 'timer-on', 0);
    
    document.body.classList.add('paused');
}

function resumeGame() {
    if (!state.paused) return;
    state.paused = false;

    // Если таймер шёл до паузы — возобновляем
    if (state.wasTimerRunning && state.timeLeft > 0) {
        resumeTimer(state.timeLeft);
    }
    state.wasTimerRunning = false;

    if (state.phase !== 'finished') {
        showStatus(DEFAULT_STATUS, '');
    }
    document.body.classList.remove('paused');
}

function resumeTimer(leftSeconds) {
    if (state.timerId) return;
    state.timeLeft = leftSeconds;
    state.startTime = Date.now() - (TURN_SECONDS - leftSeconds) * 1000;

    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, TURN_SECONDS - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            state.timeLeft = 0;
            onTimeout();
        }
    }, 250);
}

function onTimeout() {
    showStatus('Время вышло! Буква убрана, ход переходит', 'bad', 2500);
    sfx('death');
    if (state.pending) state.board[state.pending.r][state.pending.c] = null;
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    sfx('rot');
    render();
    startTimer(); 
}

// ============================================================
//                   СТАРТ / РЕСТАРТ
// ============================================================
function startGame() {
    const raw = norm(startWordIn.value.trim());
    startError.textContent = '';

    if (!raw) { startError.textContent = 'Введите слово'; sfx('kickFig'); return; }
    if (!/^[а-я]+$/.test(raw)) { startError.textContent = 'Только русские буквы'; sfx('kickFig'); return; }
    if (raw.length < MIN_START_LEN || raw.length > MAX_START_LEN) {
        startError.textContent = `Длина от ${MIN_START_LEN} до ${MAX_START_LEN} букв`;
        sfx('kickFig');
        return;
    }
    if (!WORD_SET.size) {
        startError.textContent = 'Словарь не загружен (russian_nouns.txt.js)';
        sfx('kickFig');
        return;
    }
    if (!hasWord(raw)) {
        startError.textContent = 'Такого слова нет в словаре';
        sfx('kickFig');
        return;
    }

    state.size = raw.length;
    initBoard();
    state.paused = false;
    state.wasTimerRunning = false;
    placeStartWord(raw);
    buildBoardDom();
    state.phase = 'input';
    startScreen.classList.add('hidden');
    resultScreen.classList.remove('visible');
    showStatus(`Стартовое слово «${raw}». Ход: ${PLAYER_FULL[state.currentPlayer]}`, '', 3000);
    sfx('rot');
    render();
    startTimer();
}

function restartGame() {
    resultScreen.classList.remove('visible');
    startScreen.classList.remove('hidden');
    startWordIn.value = '';
    startError.textContent = '';
    stopTimer();
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.paused = false;
    state.wasTimerRunning = false;
    boardEl.innerHTML = '';
    previewEl.textContent = '\u00A0';
    showStatus('Введите стартовое слово', '');
    
}

// ============================================================
//                   ОБРАБОТЧИКИ
// ============================================================
document.getElementById('btnStart').addEventListener('click', startGame);
startWordIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        startGame();
        return;
    }
    // Озвучка набора буквы в поле стартового слова
    const k = norm(e.key).trim();
    if (/^[а-я]$/.test(k)) sfx('click');
});

acceptBtn.addEventListener('click', onAccept);
clearBtn.addEventListener('click', onClear);
cancelBtn.addEventListener('click', cancelPendingLetter);

// ============================================================
//                   ПОЛНЫЙ ЭКРАН
// ============================================================
const fsBtn  = document.getElementById('btnFullscreen');
const fsIcon = document.getElementById('fsIcon');
const fsTarget = document.documentElement;

function isFullscreen() {
    return document.fullscreenElement ||
           document.webkitFullscreenElement ||
           document.msFullscreenElement;
}
function updateFsIcon() {
    fsIcon.textContent = isFullscreen() ? '⤡' : '⛶';
}
function toggleFullscreen() {
    if (!isFullscreen()) {
        const req = fsTarget.requestFullscreen ||
                    fsTarget.webkitRequestFullscreen ||
                    fsTarget.msRequestFullscreen;
        if (req) {
            const p = req.call(fsTarget);
            if (p && p.catch) p.catch(() => {});
        }
    } else {
        const exit = document.exitFullscreen ||
                     document.webkitExitFullscreen ||
                     document.msExitFullscreen;
        if (exit) {
            const p = exit.call(document);
            if (p && p.catch) p.catch(() => {});
        }
    }
}
fsBtn.addEventListener('click', toggleFullscreen);
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
    .forEach(evt => document.addEventListener(evt, updateFsIcon));

updateFsIcon();

// ============================================================
//                   КНОПКА MUTE
// ============================================================
const muteBtn = document.getElementById('btnMute');
let muted = false;
if (muteBtn) {
    muteBtn.addEventListener('click', e => {
        e.stopPropagation();
        muted = !muted;
        if (kit && typeof kit.setMuted === 'function') kit.setMuted(muted);
        muteBtn.textContent = muted ? '🔇' : '🔊';
    });
}

// ============================================================
//                   ОЧИСТКА ЗВУКОВ ПРИ УХОДЕ
// ============================================================
const backBtn = document.getElementById('backBtn');
if (backBtn) {
    backBtn.addEventListener('click', () => {
        if (kit && typeof kit.dispose === 'function') kit.dispose();
    });
}

// ============================================================
//                   ЭКСПОРТ
// ============================================================
window.restartGame = restartGame;

// Проверка словаря
if (!window.WORDS) {
    console.warn('Словарь не найден: подключите russian_nouns.txt.js до основного скрипта.');
    startError.textContent = 'Словарь не загружен';
} else {
    console.log('Словарь загружен, слов:', WORD_SET.size);
}

})();
</script>
</body>
</html>
