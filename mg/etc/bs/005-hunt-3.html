// ============================================================
// CLASS: Дыхание охотника (покачивание + пар изо рта)
// ============================================================
class Breathing {
  constructor(scene, camera, gun) {
    this.scene = scene;
    this.camera = camera;
    this.gun = gun;

    this.time = 0;
    this.breathPhase = 0;

    // Параметры дыхания
    this.breathSpeed = 1.4;       // «частота» дыхания (рад/сек)
    this.breathAmp = 0.015;       // амплитуда покачивания ружья (рад)

    // Параметры пара
    this.steamInterval = 3.0;     // раз в 3 сек — облачко пара
    this.steamTimer = 0;

    // Пул частиц пара
    this.steamPool = [];
    this.steamActive = false;
    for (let i = 0; i < 6; i++) {
      this.steamPool.push(this.createSteamParticle());
    }

    // Лёгкое покачивание при ходьбе
    this.walkBob = 0;
    this.lastPos = new THREE.Vector3().copy(camera.position);

        // Покачивание камеры (для применения в animate)
    this.cameraBobY = 0;
    this.cameraRoll = 0;
    this.cameraYaw = 0;
    this.cameraPitch = 0;

    // Параметры дыхания камеры
    this.camBreathAmp = 0.012;
    this.camBreathBobAmp = 0.015;
    this.camBreathPhase = Math.PI / 2;
  }

  createSteamParticle() {
    const geo = new THREE.SphereGeometry(0.04, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      depthTest: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.renderOrder = 100;
    // Крепим к камере, чтобы пар всегда был перед лицом
    this.camera.add(mesh);
    return {
      mesh: mesh,
      life: 0,
      maxLife: 1.2,
      velocity: new THREE.Vector3(),
      active: false
    };
  }

  // Выпустить пар изо рта (один выдох)
  emitSteam() {
    // Найти свободную частицу
    let free = null;
    for (let i = 0; i < this.steamPool.length; i++) {
      if (!this.steamPool[i].active) {
        free = this.steamPool[i];
        break;
      }
    }
    if (!free) return;

    free.active = true;
    free.life = 0;
    // Позиция перед камерой (немного вниз и вперёд — как изо рта)
    free.mesh.position.set(
      (Math.random() - 0.5) * 0.05,
      -0.12 + Math.random() * 0.03,
      -0.35
    );
    free.mesh.scale.setScalar(1);
    free.mesh.visible = true;
    free.mesh.material.opacity = 0;
    // Скорость: медленно вперёд и вниз
    free.velocity.set(
      (Math.random() - 0.5) * 0.1,
      -0.05 - Math.random() * 0.05,
      -0.15 - Math.random() * 0.1
    );
  }

  update(dt, isMoving) {
    this.time += dt;

    // ==========================================
    // 1. Покачивание ружья (дыхание + ходьба)
    // ==========================================
    this.breathPhase += dt * this.breathSpeed;

    // Базовое покачивание от дыхания
    let breathY = Math.sin(this.breathPhase) * this.breathAmp;
    let breathX = Math.sin(this.breathPhase * 0.5) * this.breathAmp * 0.4;

    // Дополнительное покачивание при ходьбе
    if (isMoving) {
      this.walkBob += dt * 10;
      breathY += Math.sin(this.walkBob) * 0.01;
      breathX += Math.cos(this.walkBob * 0.5) * 0.015;
    } else {
      // Плавно затухает
      this.walkBob *= 0.95;
    }

    // Применяем только к модели ружья (не к камере, чтобы прицел не дёргался)
    if (this.gun && this.gun.model) {
      // Сохраняем базовую позицию ружья (из buildModel)
      const baseY = -0.22;
      const baseX = 0.24;

      const recoilY = this.gun.recoil * 0.05;  // ← отдача тоже добавляет вверх
      const recoilX = 0;
      
      // Небольшое смещение от дыхания
      this.gun.model.position.y = baseY + breathY;
      this.gun.model.position.x = baseX + breathX;
      
      // Лёгкий наклон от дыхания
      this.gun.model.rotation.z = 0.02 + breathX * 2;
    }

    // ==========================================
    // 1b. Покачивание КАМЕРЫ от дыхания
    // ==========================================
    this.camBreathPhase += dt * this.breathSpeed;

    const camRoll  = Math.sin(this.camBreathPhase) * this.camBreathAmp;
    const camBobY  = Math.sin(this.camBreathPhase * 0.8) * this.camBreathBobAmp;
    const camYaw   = Math.sin(this.camBreathPhase * 0.5) * this.camBreathAmp * 0.6;
    const camPitch = Math.sin(this.camBreathPhase * 0.7) * this.camBreathAmp * 0.4;

    let walkRoll = 0, walkBobY = 0, walkPitch = 0;
    if (isMoving) {
      walkRoll  = Math.sin(this.walkBob * 1.0) * 0.004;
      walkBobY  = Math.abs(Math.sin(this.walkBob)) * 0.008;
      walkPitch = Math.sin(this.walkBob * 2) * 0.003;  // ← добавить
    }

    // Сохраняем для применения в animate()
    this.cameraBobY  = camBobY + walkBobY;
    this.cameraRoll  = camRoll + walkRoll;
    this.cameraYaw   = camYaw;
    this.cameraPitch = camPitch + walkPitch;

    // ==========================================
    // 2. Пар изо рта — раз в N секунд
    // ==========================================
    this.steamTimer += dt;
    if (this.steamTimer > this.steamInterval) {
      this.steamTimer = 0;
      //this.emitSteam();
    }

    // Обновляем частицы пара
    for (let i = 0; i < this.steamPool.length; i++) {
      const p = this.steamPool[i];
      if (!p.active) continue;

      p.life += dt;
      
      // Движение
      p.mesh.position.addScaledVector(p.velocity, dt);
      
      // Затухание и рост
      const t = p.life / p.maxLife;
      p.mesh.material.opacity = Math.sin(t * Math.PI) * 0.5; // плавное появление/исчезновение
      p.mesh.scale.setScalar(1 + t * 3);
      
      // Немного «колыхания»
      p.mesh.position.x += Math.sin(p.life * 4) * dt * 0.05;
      
      if (p.life >= p.maxLife) {
        p.active = false;
        p.mesh.visible = false;
      }
    }
  }
}

const grass = new ENV.Grass(scene, terrain, renderer, {
  count : 60000, // начните с 40к до 80к
  radius: 600
});

// Вода — заполняет низины рельефа
const water = new ENV.Water(scene, {
  level: ENV.WATER_LEVEL,
  size: 600
});

// Пул гильз
const shellPool = [];
const SHELL_POOL_SIZE = 12;
for (let i = 0; i < SHELL_POOL_SIZE; i++) {
  shellPool.push(new GUN1.Shell(scene, terrain));
}
let shellIndex = 0;
function getShell() {
  const s = shellPool[shellIndex];
  shellIndex = (shellIndex + 1) % SHELL_POOL_SIZE;
  return s;
}

// ============================================================
// ИГРОВАЯ ЛОГИКА
// ============================================================
const sky      = new ENV.Sky(scene);
const nature   = new ENV.Nature(scene, terrain);
const conifers = new ENV.Conifers(scene, terrain, {
    count   : 140,  // сколько ёлок
    minH    :   6,  // ниже — не сажаем (там лиственные)
    maxH    :  45,  // выше — голый камень/снег
    maxSlope: 0.6,
    radius  : 220,  // радиус от центра карты
});

// Утки могут спавниться и возле ёлок
if (conifers.spawnPoints) {
  nature.spawnPoints.push(...conifers.spawnPoints);
}

const gun       = new GUN1.Gun(camera, envMap);;
const breathing = new Breathing(scene, camera, gun);
const lodge     = new HOUSES.Lodge(scene, terrain, 0, 12);  // ← координаты можно менять

const ducks = [];
let score = 0;
let timeSinceSpawn = 0;
const spawnInterval = 1.6; 

const bulletPool = [];
const BULLET_POOL_SIZE = 8;
for (let i = 0; i < BULLET_POOL_SIZE; i++) {
  bulletPool.push(new GUN1.Bullet(scene));
}
let bulletIndex = 0;
function getBullet() {
  const b = bulletPool[bulletIndex];
  bulletIndex = (bulletIndex + 1) % BULLET_POOL_SIZE;
  return b;
}

const playerVel = new THREE.Vector3();

const START_X   = -1.52;
const START_Z   =  24.69;

const playerPos = new THREE.Vector3(
  START_X,
  1.7 + terrain.getHeightAt(START_X, START_Z),
  START_Z
);

const START_YAW_DEG   = -38.7;
const START_PITCH_DEG =   7.2;

const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const mouseSensitivity = 0.0022;
euler.y = THREE.MathUtils.degToRad(START_YAW_DEG);
euler.x = THREE.MathUtils.degToRad(START_PITCH_DEG);
euler.z = 0;   // roll на старте — 0
camera.quaternion.setFromEuler(euler);

const keys = {};

function getAimEndPoint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const maxDist = 250;
  let closestDist = Infinity;
  let hitPoint = null;

  ducks.forEach(duck => {
    if (!duck.alive) return;
    const box = duck.getBoundingBox();
    const p = raycaster.ray.intersectBox(box, new THREE.Vector3());
    if (p) {
      const d = p.distanceTo(camera.position);
      if (d < closestDist && d < maxDist) {
        closestDist = d;
        hitPoint = p;
      }
    }
  });

  if (!hitPoint) {
    const hits = raycaster.intersectObject(terrain.mesh, false);
    if (hits.length > 0 && hits[0].distance < maxDist) {
      hitPoint = hits[0].point;
    }
  }

  if (!hitPoint) {
    hitPoint = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, maxDist);
  }

  return hitPoint;
}

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

let touchLookId = null;
let touchLookStart = { x: 0, y: 0 };

document.addEventListener('mousemove', e => {
  if (!isTouch && document.pointerLockElement === renderer.domElement) {
    euler.y -= e.movementX * mouseSensitivity;
    euler.x -= e.movementY * mouseSensitivity;
    euler.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, euler.x));
    camera.quaternion.setFromEuler(euler);
  }
});

renderer.domElement.addEventListener('touchstart', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX > window.innerWidth * 0.35 && touchLookId === null) {
      touchLookId = t.identifier;
      touchLookStart.x = t.clientX;
      touchLookStart.y = t.clientY;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchLookId) {
      const dx = t.clientX - touchLookStart.x;
      const dy = t.clientY - touchLookStart.y;
      euler.y -= dx * 0.005;
      euler.x -= dy * 0.005;
      euler.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, euler.x));
      camera.quaternion.setFromEuler(euler);
      touchLookStart.x = t.clientX;
      touchLookStart.y = t.clientY;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchLookId) {
      touchLookId = null;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('click', () => {
  if (isTouch) return;

  if (cursorEnabled) {
    setCursorEnabled(false);
  }

  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  } else {
    shoot();
  }
});

const flashEl = document.getElementById('flash');
let flashTimer = 0;

function shoot() {
  gun.fire();

  flashEl.style.opacity = '0.6';
  flashTimer = 0.08;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  let closestHit = null;
  let closestDist = Infinity;

  ducks.forEach(duck => {
    if (!duck.alive) return;
    const box = duck.getBoundingBox();
    const hit = raycaster.ray.intersectBox(box, new THREE.Vector3());
    if (hit) {
      const dist = hit.distanceTo(camera.position);
      if (dist < closestDist && dist < 120) {
        closestDist = dist;
        closestHit = duck;
      }
    }
  });

// Трассер
const muzzleWorld = gun.getMuzzlePosition();
const start = muzzleWorld.clone().lerp(camera.position, 0.15);
const end = getAimEndPoint();
getBullet().fire(start, end);

// Гильза
const ejectPos = gun.getEjectPosition();
const ejectDirWorld = gun.getEjectDirection(); // уже нормализованный, в мире

// Базовая скорость выброса (м/с) — подберите под масштаб сцены
const ejectSpeed = 2.5 + Math.random() * 1.0;

// Мировой вектор скорости
const ejectVel = ejectDirWorld.multiplyScalar(ejectSpeed);

// Небольшой случайный разброс (в локальных осях ружья, чтобы не «ломать» направление)
// Проще — просто добавить маленький случайный мировой шум:
ejectVel.x += (Math.random() - 0.5) * 0.6;
ejectVel.y += (Math.random() - 0.5) * 0.4;
ejectVel.z += (Math.random() - 0.5) * 0.6;

getShell().fire(ejectPos, ejectVel);

  if (closestHit) {
    closestHit.hit();
    score++;
    document.getElementById('score').textContent = 'Утки: ' + score;
  } else {
    if (window.SNDS && SNDS.damag) SNDS.damag.play();
  }
}

function spawnDuck() {
  if (nature.spawnPoints.length === 0) return;

  const SPAWN_RADIUS_MIN = 15;
  const SPAWN_RADIUS_MAX = 35; 

  const candidates = [];
  for (let i = 0; i < nature.spawnPoints.length; i++) {
    const sp = nature.spawnPoints[i];
    const dx = sp.x - camera.position.x;
    const dz = sp.z - camera.position.z;
    const distSq = dx * dx + dz * dz;
    
    // Не спавним уток прямо в воде
    const h = terrain.getHeightAt(sp.x, sp.z);
    if (h < ENV.WATER_LEVEL + 0.5) continue;   // <-- добавить
    
    if (distSq >= SPAWN_RADIUS_MIN * SPAWN_RADIUS_MIN &&
        distSq <= SPAWN_RADIUS_MAX * SPAWN_RADIUS_MAX) {
      candidates.push(sp);
    }
  }

  let spawnPos;
  if (candidates.length > 0) {
    const sp = candidates[Math.floor(Math.random() * candidates.length)];
    spawnPos = new THREE.Vector3(sp.x, terrain.getHeightAt(sp.x, sp.z) + 1.5, sp.z);
  } else {
    const angle = Math.random() * Math.PI * 2;
    const dist = SPAWN_RADIUS_MIN + Math.random() * (SPAWN_RADIUS_MAX - SPAWN_RADIUS_MIN);
    const px = camera.position.x + Math.cos(angle) * dist;
    const pz = camera.position.z + Math.sin(angle) * dist;
    spawnPos = new THREE.Vector3(px, terrain.getHeightAt(px, pz) + 1.5, pz);
  }

  const target = camera.position.clone();
  ducks.push(new ANIMALS.Duck(scene, terrain, spawnPos, target));
}

function updatePlayer(dt) {
  const speed = keys['ShiftLeft'] ? 4 : 2;
  const dir = new THREE.Vector3();

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0));

  if (keys['KeyW']) dir.add(forward);
  if (keys['KeyS']) dir.sub(forward);
  if (keys['KeyD']) dir.add(right);
  if (keys['KeyA']) dir.sub(right);

  if (isTouch && (joyVector.x !== 0 || joyVector.y !== 0)) {
    dir.add(forward.clone().multiplyScalar(-joyVector.y));
    dir.add(right.clone().multiplyScalar(joyVector.x));
  }

  if (dir.lengthSq() > 0) dir.normalize().multiplyScalar(speed);

  playerVel.lerp(dir, Math.min(1, dt * 12));
  playerPos.addScaledVector(playerVel, dt);

  const maxR = 140;
  if (playerPos.length() > maxR) {
    playerPos.setLength(maxR);
  }

  const groundY = terrain.getHeightAt(playerPos.x, playerPos.z);
  playerPos.y = groundY + 1.7;

  cameraPivot.position.copy(playerPos);
}

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };

if (isTouch && joyZone) {
  joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = joyZone.getBoundingClientRect();
    joyCenter.x = rect.left + rect.width / 2;
    joyCenter.y = rect.top + rect.height / 2;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (joyId === null) {
        joyId = e.changedTouches[i].identifier;
        joyVector.x = 0;
        joyVector.y = 0;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) {
        let dx = t.clientX - joyCenter.x;
        let dy = t.clientY - joyCenter.y;
        const maxRadius = 40;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > maxRadius) {
          dx = dx / len * maxRadius;
          dy = dy / len * maxRadius;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVector.x = dx / maxRadius;
        joyVector.y = dy / maxRadius;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyId = null;
        joyVector.x = 0;
        joyVector.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  }, { passive: false });
}

const shootBtn = document.getElementById('shoot-btn');
if (isTouch && shootBtn) {
  shootBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    shoot();
  }, { passive: false });
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  sky.update(dt);
  water.update(dt);
  const isMoving = playerVel.lengthSq() > 0.5;
  breathing.update(dt, isMoving);
  gun.update(dt);
  lodge.update(dt);
  updatePlayer(dt);
  grass.update(dt, camera);
 

  // В animate() после updatePlayer:
  // В animate() после updatePlayer:
  cameraPivot.position.y = playerPos.y + breathing.cameraBobY;
  cameraPivot.rotation.z = breathing.cameraRoll;
  cameraPivot.rotation.x = 0;   // сброс — мышь управляет camera.rotation.x
  cameraPivot.rotation.y = 0;   // сброс — мышь управляет camera.rotation.y

  timeSinceSpawn += dt;
  if (timeSinceSpawn > spawnInterval) {
    timeSinceSpawn = 0;
    if (ducks.filter(d => d.alive).length < 8) {
      spawnDuck();
    }
  }

  for (let i = ducks.length - 1; i >= 0; i--) {
    const d = ducks[i];
    d.update(dt);
    if (d.removeMe) {
      d.dispose();
      ducks.splice(i, 1);
    }
  }

  for (let i = 0; i < bulletPool.length; i++) {
    bulletPool[i].update(dt);
  }

  for (let i = 0; i < shellPool.length; i++) {
    shellPool[i].update(dt);
  }

  if (flashTimer > 0) {
    flashTimer -= dt;
    if (flashTimer <= 0) {
      flashEl.style.opacity = '0';
    } else {
      flashEl.style.opacity = Math.max(0, flashTimer / 0.08 * 0.6);
    }
  }

  renderer.render(scene, camera);
}

function resizeRenderer() {
  // visualViewport корректно отдаёт размер даже с адресной строкой
  const w = window.visualViewport
    ? window.visualViewport.width
    : window.innerWidth;
  const h = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', resizeRenderer);
window.addEventListener('orientationchange', () => {
  // на повороте экрана ждём немного, чтобы браузер обновил размеры
  setTimeout(resizeRenderer, 100);
});

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeRenderer);
    window.visualViewport.addEventListener('scroll', resizeRenderer);
}

animate();

// ===== Кастомный неоновый курсор + Ctrl =====
const neonCursor = document.getElementById('neon-cursor');
const rootEl = document.documentElement;

let cursorEnabled = false;   // по умолчанию — стандартный курсор
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

function setCursorEnabled(on) {
  cursorEnabled = on;
  rootEl.classList.toggle('neon-cursor', on);
  if (neonCursor) neonCursor.classList.toggle('visible', on);

  if (on) {
    // Снимаем pointer lock — курсор должен быть свободен, чтобы дотянуться до кнопок
    if (document.pointerLockElement) document.exitPointerLock();
  }
}

// Отслеживаем позицию мыши (даже когда курсор скрыт — на всякий случай)
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (neonCursor) {
    neonCursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
  }
}, { passive: true });

// Ctrl — переключение видимости курсора.
// Используем keydown/keyup, чтобы Ctrl не «залипал» при переключении окна.
window.addEventListener('keydown', (e) => {
  // e.ctrlKey === true на keydown Control
  if (e.key === 'Control' && !e.repeat) {
    setCursorEnabled(!cursorEnabled);
  }
});

window.addEventListener('keyup', (e) => {
  // На отпускании Ctrl тоже можно, но обычно хватает toggle по keydown.
  // Если хотите "пока зажат — скрыт", раскомментируйте:
  // if (e.key === 'Control') setCursorEnabled(false);
});

// При потере фокуса окна — вернуть стандартный курсор (иначе Ctrl может «застрять»)
window.addEventListener('blur', () => setCursorEnabled(false));
