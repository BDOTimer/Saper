// ============================================================
// CLASS: Дыхание охотника (покачивание + пар изо рта)
// ============================================================
class Breathing {
  constructor(scene, camera, gun) {
    this.scene = scene;
    this.camera = camera;
    this.gun = gun;

    this.time = 0;
    this.breathPhase = 0;

    // Параметры дыхания
    this.breathSpeed = 1.4;       // «частота» дыхания (рад/сек)
    this.breathAmp = 0.015;       // амплитуда покачивания ружья (рад)

    // Параметры пара
    this.steamInterval = 3.0;     // раз в 3 сек — облачко пара
    this.steamTimer = 0;

    // Пул частиц пара
    this.steamPool = [];
    this.steamActive = false;
    for (let i = 0; i < 6; i++) {
      this.steamPool.push(this.createSteamParticle());
    }

    // Лёгкое покачивание при ходьбе
    this.walkBob = 0;
    this.lastPos = new THREE.Vector3().copy(camera.position);

        // Покачивание камеры (для применения в animate)
    this.cameraBobY = 0;
    this.cameraRoll = 0;
    this.cameraYaw = 0;
    this.cameraPitch = 0;

    // Параметры дыхания камеры
    this.camBreathAmp = 0.012;
    this.camBreathBobAmp = 0.015;
    this.camBreathPhase = Math.PI / 2;
  }

  createSteamParticle() {
    const geo = new THREE.SphereGeometry(0.04, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      depthTest: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.renderOrder = 100;
    // Крепим к камере, чтобы пар всегда был перед лицом
    this.camera.add(mesh);
    return {
      mesh: mesh,
      life: 0,
      maxLife: 1.2,
      velocity: new THREE.Vector3(),
      active: false
    };
  }

  // Выпустить пар изо рта (один выдох)
  emitSteam() {
    // Найти свободную частицу
    let free = null;
    for (let i = 0; i < this.steamPool.length; i++) {
      if (!this.steamPool[i].active) {
        free = this.steamPool[i];
        break;
      }
    }
    if (!free) return;

    free.active = true;
    free.life = 0;
    // Позиция перед камерой (немного вниз и вперёд — как изо рта)
    free.mesh.position.set(
      (Math.random() - 0.5) * 0.05,
      -0.12 + Math.random() * 0.03,
      -0.35
    );
    free.mesh.scale.setScalar(1);
    free.mesh.visible = true;
    free.mesh.material.opacity = 0;
    // Скорость: медленно вперёд и вниз
    free.velocity.set(
      (Math.random() - 0.5) * 0.1,
      -0.05 - Math.random() * 0.05,
      -0.15 - Math.random() * 0.1
    );
  }

  update(dt, isMoving) {
    this.time += dt;

    // ==========================================
    // 1. Покачивание ружья (дыхание + ходьба)
    // ==========================================
    this.breathPhase += dt * this.breathSpeed;

    // Базовое покачивание от дыхания
    let breathY = Math.sin(this.breathPhase) * this.breathAmp;
    let breathX = Math.sin(this.breathPhase * 0.5) * this.breathAmp * 0.4;

    // Дополнительное покачивание при ходьбе
    if (isMoving) {
      this.walkBob += dt * 10;
      breathY += Math.sin(this.walkBob) * 0.01;
      breathX += Math.cos(this.walkBob * 0.5) * 0.015;
    } else {
      // Плавно затухает
      this.walkBob *= 0.95;
    }

    // Применяем только к модели ружья (не к камере, чтобы прицел не дёргался)
    if (this.gun && this.gun.model) {
      // Сохраняем базовую позицию ружья (из buildModel)
      const baseY = -0.22;
      const baseX = 0.24;

      const recoilY = this.gun.recoil * 0.05;  // ← отдача тоже добавляет вверх
      const recoilX = 0;
      
      // Небольшое смещение от дыхания
      this.gun.model.position.y = baseY + breathY;
      this.gun.model.position.x = baseX + breathX;
      
      // Лёгкий наклон от дыхания
      this.gun.model.rotation.z = 0.02 + breathX * 2;
    }

    // ==========================================
    // 1b. Покачивание КАМЕРЫ от дыхания
    // ==========================================
    this.camBreathPhase += dt * this.breathSpeed;

    const camRoll = Math.sin(this.camBreathPhase) * this.camBreathAmp;
    const camBobY = Math.sin(this.camBreathPhase * 0.8) * this.camBreathBobAmp;
    const camYaw = Math.sin(this.camBreathPhase * 0.5) * this.camBreathAmp * 0.6;
    const camPitch = Math.sin(this.camBreathPhase * 0.7) * this.camBreathAmp * 0.4;

    let walkRoll = 0, walkBobY = 0, walkPitch = 0;
    if (isMoving) {
      walkRoll = Math.sin(this.walkBob * 1.0) * 0.004;
      walkBobY = Math.abs(Math.sin(this.walkBob)) * 0.008;
      walkPitch = Math.sin(this.walkBob * 2) * 0.003;  // ← добавить
    }

    // Сохраняем для применения в animate()
    this.cameraBobY = camBobY + walkBobY;
    this.cameraRoll = camRoll + walkRoll;
    this.cameraYaw = camYaw;
     this.cameraPitch = camPitch + walkPitch;

    // ==========================================
    // 2. Пар изо рта — раз в N секунд
    // ==========================================
    this.steamTimer += dt;
    if (this.steamTimer > this.steamInterval) {
      this.steamTimer = 0;
      //this.emitSteam();
    }

    // Обновляем частицы пара
    for (let i = 0; i < this.steamPool.length; i++) {
      const p = this.steamPool[i];
      if (!p.active) continue;

      p.life += dt;
      
      // Движение
      p.mesh.position.addScaledVector(p.velocity, dt);
      
      // Затухание и рост
      const t = p.life / p.maxLife;
      p.mesh.material.opacity = Math.sin(t * Math.PI) * 0.5; // плавное появление/исчезновение
      p.mesh.scale.setScalar(1 + t * 3);
      
      // Немного «колыхания»
      p.mesh.position.x += Math.sin(p.life * 4) * dt * 0.05;
      
      if (p.life >= p.maxLife) {
        p.active = false;
        p.mesh.visible = false;
      }
    }
  }
}

// ============================================================
// ЛАНДШАФТ — процедурный (более холмистый)
// ============================================================
class Terrain {
  constructor(scene, opts = {}) {
    this.scene = scene;
    this.size = opts.size ?? 400;
    this.segments = opts.segments ?? 160;   // плотнее сетка = больше деталей
    this.height = opts.height ?? 18;        // выше холмы
    this.seed = opts.seed ?? 12345;
    this.generate();
  }

  // --- Стабильный value-noise ---
  rand(x, y) {
    let n = Math.sin(x * 12.9898 + y * 78.233 + this.seed) * 43758.5453;
    return n - Math.floor(n);
  }

  noise2D(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = this.rand(xi, yi);
    const b = this.rand(xi + 1, yi);
    const c = this.rand(xi, yi + 1);
    const d = this.rand(xi + 1, yi + 1);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  }

  // --- Многослойный шум (fractal brownian motion) ---
  fbm(x, y, octaves = 5, persistence = 0.5, lacunarity = 2.0) {
    let sum = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
      sum += this.noise2D(x * freq, y * freq) * amp;
      max += amp;
      amp *= persistence;
      freq *= lacunarity;
    }
    return sum / max;
  }

  heightAt(x, z) {
    // Масштабы (чем больше — тем крупнее холмы)
    const sx = x / 55;
    const sz = z / 55;

    // 1) Основные холмы — крупный шум, амплитуда 1
    let base = (this.fbm(sx, sz, 5) - 0.5) * 2.0;

    // 2) Мелкие бугры — средний шум, амплитуда 0.35
    let hills = (this.fbm(sx * 2.7, sz * 2.7, 3) - 0.5) * 0.35;

    // 3) Овраги — вычитаем из рельефа там, где шум «низкий»
    let gullies = (this.fbm(sx * 1.3 + 100, sz * 1.3 + 100, 3) - 0.5);
    gullies = Math.max(0, -gullies) * 1.6; // только отрицательные зоны

    let h = base + hills - gullies;

    // 4) Маска: возле центра — плоская равнина (для удобства), к краям — всё выше
    const distFromCenter = Math.sqrt(x * x + z * z);
    const flatZone   = 30;    // радиус ровной площадки
    const transition = 100;  // за сколько метров до "полного" рельефа

    let reliefMask;
    if (distFromCenter < flatZone) {
      reliefMask = 0.2;   // лёгкие бугры даже в центре
    } else {
      reliefMask = Math.min(1, 0.15 + (distFromCenter - flatZone) / transition);
    }

    // 5) По краям карты — горы выше (для красивого горизонта)
    const edgeBoost = Math.max(0, (distFromCenter - 80) / 100) * 1.2;

    return h * this.height * reliefMask + edgeBoost * this.height;
  }

  generate() {
    const geo = new THREE.PlaneGeometry(
      this.size, this.size, this.segments, this.segments
    );
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      pos.setY(i, this.heightAt(x, z));
    }
    geo.computeVertexNormals();

    // Материал с вершинными цветами
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      vertexColors: true,
      roughness: 0.9,
      metalness: 0.0
    });

    const colors = new Float32Array(pos.count * 3);

    // Палитра по высоте
    const cWater  = new THREE.Color(0x2e4a25); // тёмно-зелёная низина
    const cGrass  = new THREE.Color(0x5a9b3a); // трава
    const cGrass2 = new THREE.Color(0x3d6b2a); // тёмная трава
    const cRock   = new THREE.Color(0x8a8470); // камень/сухая земля
    const cSnow   = new THREE.Color(0xd8d8d0); // светлые вершины (лёгкая «пыль»)

    const tmp = new THREE.Color();
    const maxH = this.height * 2.2; // примерный максимум
    const minH = -this.height * 0.6;

    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      const t = Math.min(1, Math.max(0, (y - minH) / (maxH - minH)));

      if (t < 0.25) {
        tmp.copy(cWater).lerp(cGrass, t / 0.25);
      } else if (t < 0.6) {
        tmp.copy(cGrass).lerp(cGrass2, (t - 0.25) / 0.35);
      } else if (t < 0.85) {
        tmp.copy(cGrass2).lerp(cRock, (t - 0.6) / 0.25);
      } else {
        tmp.copy(cRock).lerp(cSnow, (t - 0.85) / 0.15);
      }

      // Небольшая шумовая вариация для «живости»
      const v = 0.9 + 0.2 * this.noise2D(i * 0.13, i * 0.17);
      colors[i * 3]     = tmp.r * v;
      colors[i * 3 + 1] = tmp.g * v;
      colors[i * 3 + 2] = tmp.b * v;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.receiveShadow = true;
    this.mesh.castShadow = false;
    this.mesh.position.y = 0;
    this.scene.add(this.mesh);
  }

  getHeightAt(x, z) {
    return this.heightAt(x, z);
  }
}

const WATER_LEVEL = -2.5;  // тот же, что и в Water
class Water {
  constructor(scene, opts = {}) {
    this.scene = scene;
    this.level = opts.level ?? -2.5;      // уровень воды (по Y)
    this.size = opts.size ?? 600;         // размер плоскости
    this.segments = opts.segments ?? 1;   // 1 = плоскость без сетки (рябь в шейдере)
    this.time = 0;

    // Материал с шейдером — «живая» вода
    const geo = new THREE.PlaneGeometry(this.size, this.size, 64, 64);
    geo.rotateX(-Math.PI / 2);

    // Немного «волнистая» геометрия для отражения (для мелкой ряби в бликах)
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      pos.setY(i, Math.sin(x * 0.1) * 0.05 + Math.cos(z * 0.1) * 0.05);
    }
    geo.computeVertexNormals();

    this.material = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        uTime:    { value: 0 },
        uColorShallow: { value: new THREE.Color(0x3a7a9a) }, // светлая ближняя вода
        uColorDeep:    { value: new THREE.Color(0x0e2a44) }, // тёмная глубина
        uSunDir:  { value: new THREE.Vector3(0.5, 1.0, 0.4).normalize() },
        uSunColor:{ value: new THREE.Color(0xfff5cc) },
        uFogColor: { value: new THREE.Color(0xa0c8e8) },
        uFogNear: { value: 40.0 },
        uFogFar:  { value: 200.0 }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec2 vUv;

        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;

          // Лёгкая волна в нормали — для бликов
          vec3 n = normalize(normalMatrix * normal);
          vNormal = n;

          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3  uColorShallow;
        uniform vec3  uColorDeep;
        uniform vec3  uSunDir;
        uniform vec3  uSunColor;
        uniform vec3  uFogColor;
        uniform float uFogNear;
        uniform float uFogFar;

        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec2 vUv;

        // Простой 2D шум для ряби
        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        void main() {
          // Рябь — две волны разной частоты и скорости
          float n1 = noise(vWorldPos.xz * 0.25 + uTime * 0.05);
          float n2 = noise(vWorldPos.xz * 0.6  - uTime * 0.03);
          float ripple = n1 * 0.6 + n2 * 0.4;

          // Цвет воды: от глубокого к светлому
          vec3 water = mix(uColorDeep, uColorShallow, ripple);

          // Блик от солнца (упрощённая модель Фонга)
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          vec3 normal  = normalize(vNormal + vec3(ripple * 0.1, 0.0, ripple * 0.1));
          float diff = max(dot(normal, uSunDir), 0.0);
          vec3 spec = uSunColor * pow(diff, 64.0) * 0.8;

          // Прозрачность зависит от угла — у горизонта прозрачнее
          float alpha = 0.78 + 0.15 * ripple;

          vec3 color = water + spec;

          // Туман
          float dist = length(cameraPosition - vWorldPos);
          float fogFactor = smoothstep(uFogNear, uFogFar, dist);
          color = mix(color, uFogColor, fogFactor);
          alpha = mix(alpha, 1.0, fogFactor * 0.4);

          gl_FragColor = vec4(color, alpha);
        }
      `
    });

    this.mesh = new THREE.Mesh(geo, this.material);
    this.mesh.position.y = this.level;
    this.mesh.renderOrder = 1;
    this.scene.add(this.mesh);
  }

  update(dt) {
    this.time += dt;
    this.material.uniforms.uTime.value = this.time;
  }
}

// ============================================================
// CLASS: Небо + Солнце + Облака
// ============================================================
class Sky {
  constructor(scene) {
    this.scene = scene;
    this.clouds = [];
    this.createSkyDome();
    this.createSun();
    this.createClouds();
  }

  createSkyDome() {
    const geo = new THREE.SphereGeometry(300, 32, 32);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x2a6dd4) },
        bottomColor: { value: new THREE.Color(0xa8d8f0) },
        offset: { value: 20 },
        exponent: { value: 0.6 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + offset).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0);
        }`
    });
    this.scene.add(new THREE.Mesh(geo, mat));
  }

  createSun() {
    const sunGeo = new THREE.SphereGeometry(8, 16, 16);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
    this.sun = new THREE.Mesh(sunGeo, sunMat);
    this.sun.position.set(120, 140, 100);
    this.scene.add(this.sun);

    const glowGeo = new THREE.SphereGeometry(14, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({ 
      color: 0xffdd88, transparent: true, opacity: 0.3 
    });
    this.sunGlow = new THREE.Mesh(glowGeo, glowMat);
    this.sunGlow.position.copy(this.sun.position);
    this.scene.add(this.sunGlow);
  }

  createClouds() {
    const cloudMat = new THREE.MeshLambertMaterial({ 
      color: 0xffffff, transparent: true, opacity: 0.85 
    });
    for (let i = 0; i < 12; i++) {
      const cloudGroup = new THREE.Group();
      const parts = 3 + Math.floor(Math.random() * 4);
      for (let j = 0; j < parts; j++) {
        const size = 4 + Math.random() * 5;
        const geo = new THREE.SphereGeometry(size, 8, 8);
        const part = new THREE.Mesh(geo, cloudMat);
        part.position.set(
          (j - parts/2) * 6 + Math.random() * 3,
          Math.random() * 2,
          Math.random() * 4
        );
        cloudGroup.add(part);
      }
      cloudGroup.position.set(
        (Math.random() - 0.5) * 300,
        50 + Math.random() * 30,
        (Math.random() - 0.5) * 300
      );
      cloudGroup.userData.speed = 0.02 + Math.random() * 0.05;
      this.clouds.push(cloudGroup);
      this.scene.add(cloudGroup);
    }
  }

  update(dt) {
    this.clouds.forEach(c => {
      c.position.x += c.userData.speed * dt * 5;
      if (c.position.x > 180) c.position.x = -180;
    });
  }
}

// ============================================================
// CLASS: Природа (деревья + кусты + камни + камыши)
// ============================================================
class Nature {
  constructor(scene) {
    this.scene = scene;
    this.spawnPoints = []; 
    this.createForest();
  }

  // Проверка: точка под водой?
  isUnderwater(x, z, margin = 0.3) {
    const h = terrain.getHeightAt(x, z);
    return h < WATER_LEVEL + margin;
  }

  // Проверка: точка на берегу / крутом склоне — не сажаем
  isOnSlope(x, z, maxSlope = 0.6) {
    // считаем разницу высот по X и Z
    const eps = 1.0;
    const hL = terrain.getHeightAt(x - eps, z);
    const hR = terrain.getHeightAt(x + eps, z);
    const hU = terrain.getHeightAt(x, z - eps);
    const hD = terrain.getHeightAt(x, z + eps);
    const dx = (hR - hL) / (2 * eps);
    const dz = (hD - hU) / (2 * eps);
    const slope = Math.sqrt(dx * dx + dz * dz);
    return slope > maxSlope;
  }

  createTree(x, z, scale = 1) {
    const group = new THREE.Group();
    
    const trunkGeo = new THREE.CylinderGeometry(0.4*scale, 0.6*scale, 4*scale, 8);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1e });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 2*scale;
    trunk.castShadow = true;
    group.add(trunk);

    const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e5c1e });
    for (let i = 0; i < 4; i++) {
      const size = (1.8 + Math.random()*0.8) * scale;
      const leafGeo = new THREE.SphereGeometry(size, 8, 8);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(
        (Math.random()-0.5) * 2*scale,
        4*scale + Math.random()*1.5*scale,
        (Math.random()-0.5) * 2*scale
      );
      leaf.castShadow = true;
      group.add(leaf);
    }
    
    group.position.set(x, terrain.getHeightAt(x, z), z);
    group.userData.type = 'tree';
    return group;
  }

  createBush(x, z, scale = 1) {
    const group = new THREE.Group();
    const bushMat = new THREE.MeshLambertMaterial({ color: 0x3a7a2a });
    for (let i = 0; i < 5; i++) {
      const size = (0.6 + Math.random()*0.5) * scale;
      const geo = new THREE.SphereGeometry(size, 6, 6);
      const b = new THREE.Mesh(geo, bushMat);
      b.position.set(
        (Math.random()-0.5) * 1.5*scale,
        size*0.7,
        (Math.random()-0.5) * 1.5*scale
      );
      b.castShadow = true;
      group.add(b);
    }
    group.position.set(x, terrain.getHeightAt(x, z), z);
    group.userData.type = 'bush';
    return group;
  }

  createRock(x, z, scale = 1) {
    const geo = new THREE.DodecahedronGeometry(scale, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0x777777 });
    const rock = new THREE.Mesh(geo, mat);
    // Камни могут торчать из воды — сажаем их на дно, а не на поверхность воды
    const floorY = terrain.getHeightAt(x, z);
    rock.position.set(x, floorY + scale*0.5, z);
    rock.scale.set(
      1 + Math.random()*0.4,
      0.6 + Math.random()*0.3,
      1 + Math.random()*0.4
    );
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    rock.userData.type = 'rock';
    return rock;
  }

  createReeds(x, z, clusterScale = 1) {
    const group = new THREE.Group();
    
    // Немного разные оттенки зелёного — камыш не бывает однотонным
    const reedMats = [
      new THREE.MeshLambertMaterial({ color: 0x8b9a3a }), // жёлто-зелёный
      new THREE.MeshLambertMaterial({ color: 0x7a8a2a }), // темнее
      new THREE.MeshLambertMaterial({ color: 0x9aab4a }), // светлее
      new THREE.MeshLambertMaterial({ color: 0x6b7a2a })  // тёмный
    ];

    // Количество стеблей в кусте — зависит от масштаба заросли
    const count = Math.floor((12 + Math.random() * 10) * clusterScale);
    
    // Радиус, в котором растут стебли (плотная куртина)
    const clusterRadius = 1.2 * clusterScale;

    for (let i = 0; i < count; i++) {
      const h = (1.5 + Math.random() * 2.0) * clusterScale; // высота стебля
      const r = 0.03 + Math.random() * 0.02;                // толщина
      
      const geo = new THREE.CylinderGeometry(r * 0.7, r, h, 4);
      const mat = reedMats[Math.floor(Math.random() * reedMats.length)];
      const reed = new THREE.Mesh(geo, mat);

      // Случайное положение внутри куртины (диск)
      const angle = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random()) * clusterRadius;
      reed.position.set(
        Math.cos(angle) * rad,
        h / 2,
        Math.sin(angle) * rad
      );
      
      // Наклон — камыш обычно наклоняется
      reed.rotation.z = (Math.random() - 0.5) * 0.4;
      reed.rotation.x = (Math.random() - 0.5) * 0.2;

      group.add(reed);

      // Иногда добавляем «метёлку» (верхушку камыша)
      if (Math.random() < 0.4) {
        const tipGeo = new THREE.ConeGeometry(0.05 * clusterScale, 0.25 * clusterScale, 5);
        const tipMat = new THREE.MeshLambertMaterial({ color: 0x6a5a2a }); // коричневая метёлка
        const tip = new THREE.Mesh(tipGeo, tipMat);
        tip.position.set(
          reed.position.x,
          h + 0.1 * clusterScale,
          reed.position.z
        );
        tip.rotation.z = reed.rotation.z;
        group.add(tip);
      }
    }

    group.position.set(x, terrain.getHeightAt(x, z), z);
    group.userData.type = 'reeds';
    return group;
  }

  createForest() {
    // --- Деревья: не ближе 1 м от воды и не на крутых склонах ---
    let treeAttempts = 0;
    let treesPlaced = 0;
    while (treesPlaced < 80 && treeAttempts < 600) {

      treeAttempts++;
      const angle = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 110;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist; 

      // Пропускаем, если под водой или на крутом склоне
      if (this.isUnderwater(x, z, 1.0)) continue;
      if (this.isOnSlope(x, z, 0.55)) continue;

      const tree = this.createTree(x, z, 0.8 + Math.random()*0.6);
      this.scene.add(tree);
      treesPlaced++;
      if (Math.random() < 0.5) this.spawnPoints.push({x, z});
    }

    // --- Кусты: не под водой, но на склонах можно ---
    let bushAttempts = 0;
    let bushesPlaced = 0;
    while (bushesPlaced < 60 && bushAttempts < 500) {
      bushAttempts++;
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 90;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      if (this.isUnderwater(x, z, 0.6)) continue;

      this.scene.add(this.createBush(x, z, 0.7 + Math.random()*0.6));
      bushesPlaced++;
      if (Math.random() < 0.4) this.spawnPoints.push({x, z});
    }

    // --- Камни: можно и в воде, и на берегу ---
    for (let i = 0; i < 20; i++) {
      const x = (Math.random()-0.5) * 200;
      const z = (Math.random()-0.5) * 200;
      if (Math.abs(x) < 3 && Math.abs(z) < 3) continue;
      this.scene.add(this.createRock(x, z, 0.5 + Math.random()*1.2));
    }

    // ==================================================
    // КАМЫШИ — плотные заросли по береговой линии
    // ==================================================
    
    // 1) Сканируем сетку по всей карте и находим точки, где рельеф
    //    находится "у самой воды" (мелководье / берег)
    const reedsCandidates = [];
    const scanStep = 2.0;  // шаг сетки (2 м)
    const scanRange = 110; // до 180 м от центра

    for (let x = -scanRange; x <= scanRange; x += scanStep) {
      for (let z = -scanRange; z <= scanRange; z += scanStep) {
        const h = terrain.getHeightAt(x, z);
        // Мелководье: 0..1.8 м над уровнем воды
        if (h > WATER_LEVEL - 0.1 && h < WATER_LEVEL + 1.8) {
          reedsCandidates.push({ x, z, h });
        }
      }
    }

    console.log('Найдено точек для камыша:', reedsCandidates.length);

    // 2) Перемешиваем и берём 150 зарослей (было 30)
    for (let i = reedsCandidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [reedsCandidates[i], reedsCandidates[j]] = [reedsCandidates[j], reedsCandidates[i]];
    }

    const REEDS_COUNT = 220; // ← больше зарослей!
    let reedsPlaced = 0;
    
    for (let i = 0; i < reedsCandidates.length && reedsPlaced < REEDS_COUNT; i++) {
      const c = reedsCandidates[i];
      
      // Пропускаем точки слишком близко к другим зарослям
      let tooClose = false;
      for (let j = 0; j < reedsPlaced; j++) {
        // (простая проверка по индексу — можно улучшить, но и так работает)
      }
      
      // Размер заросли — от 0.8 до 1.8, редко — большие плантации
      const clusterScale = Math.random() < 0.2 ? 1.8 : 0.7 + Math.random() * 0.7;
      
      // Случайное смещение внутри клетки (чтобы не было "сетки")
      const offsetX = (Math.random() - 0.5) * scanStep;
      const offsetZ = (Math.random() - 0.5) * scanStep;
      
      const reeds = this.createReeds(c.x + offsetX, c.z + offsetZ, clusterScale);
      this.scene.add(reeds);
      reedsPlaced++;
    }

    console.log('Посажено зарослей камыша:', reedsPlaced);
  }
}

// ============================================================
// CLASS: Домик лесника
// ============================================================
class Lodge {
  constructor(scene, x, z) {
    this.scene = scene;
    this.x = x;
    this.z = z;
    this.group = new THREE.Group();
    this.smokeParticles = [];
    this.build();
  }

  build() {
    const yBase = terrain.getHeightAt(this.x, this.z);
    this.group.position.set(this.x, yBase, this.z);

    // ================================================
    // МАТЕРИАЛЫ
    // ================================================
    const logMat = new THREE.MeshStandardMaterial({
      color: 0x6b4423, roughness: 0.85, metalness: 0.05
    });
    const logDarkMat = new THREE.MeshStandardMaterial({
      color: 0x4a2f18, roughness: 0.9, metalness: 0.05
    });
    const roofMat = new THREE.MeshStandardMaterial({
      color: 0x3a2518, roughness: 0.95, metalness: 0.02
    });
    const roofEdgeMat = new THREE.MeshStandardMaterial({
      color: 0x2a1a0e, roughness: 0.95
    });
    const stoneMat = new THREE.MeshStandardMaterial({
      color: 0x7a7a72, roughness: 0.95, metalness: 0.05
    });
    const windowGlowMat = new THREE.MeshBasicMaterial({ color: 0xffcc55 });
    const windowFrameMat = new THREE.MeshStandardMaterial({
      color: 0x3a2518, roughness: 0.9
    });
    const doorMat = new THREE.MeshStandardMaterial({
      color: 0x5a3818, roughness: 0.85
    });
    const handleMat = new THREE.MeshStandardMaterial({
      color: 0xc9a227, roughness: 0.4, metalness: 0.8
    });
    const woodPlankMat = new THREE.MeshStandardMaterial({
      color: 0x7a5a2a, roughness: 0.9
    });

    // ================================================
    // РАЗМЕРЫ ДОМИКА
    // ================================================
    const W = 7.0;        // ширина
    const D = 6.0;        // глубина
    const H = 4.0;        // высота стен
    const logR = 0.25;    // радиус бревна
    const logStep = 0.5;  // шаг между брёвнами

    // ================================================
    // ФУНДАМЕНТ (беловатый, уходит в землю)
    // ================================================
    const foundationMat = new THREE.MeshStandardMaterial({
      color: 0x607080,       // беловато-серый, как бутовый камень
      roughness: 0.95,
      metalness: 0.02
    });

    // Высота: 0.7 м над землёй + 1.5 м в землю = 2.2 м всего
    const foundationTopVisible = 0.9;  // сколько торчит над землёй
    const foundationIntoGround = 2.0;  // сколько уходит в землю
    const foundationHeight = foundationTopVisible + foundationIntoGround;

    // Позиция: центр фундамента ниже поверхности, чтобы нижняя часть была в земле
    const foundationCenterY = foundationTopVisible - foundationHeight / 2;

    const foundation = new THREE.Mesh(
      new THREE.BoxGeometry(W + 0.6, foundationHeight, D + 0.6),
      foundationMat
    );
    foundation.position.set(0, foundationCenterY, 0);
    foundation.castShadow = true;
    foundation.receiveShadow = true;
    this.group.add(foundation);

    // --- Камни-булыжники на видимой части фундамента (декор) ---
    // Только в верхней зоне, чтобы они не торчали из-под земли
    for (let i = 0; i < 28; i++) {
      const rockR = 0.12 + Math.random() * 0.12;
      const rockGeo = new THREE.DodecahedronGeometry(rockR);
      const rock = new THREE.Mesh(rockGeo, foundationMat);
      
      // Сторона: перед / зад / лево / право
      const side = Math.floor(Math.random() * 4);
      let rx, rz;
      if (side === 0) {         // перед
        rx = (Math.random() - 0.5) * (W + 0.4);
        rz = (D/2 + 0.25) + (Math.random() - 0.5) * 0.1;
      } else if (side === 1) {  // зад
        rx = (Math.random() - 0.5) * (W + 0.4);
        rz = -(D/2 + 0.25) + (Math.random() - 0.5) * 0.1;
      } else if (side === 2) {  // право
        rx = (W/2 + 0.25) + (Math.random() - 0.5) * 0.1;
        rz = (Math.random() - 0.5) * (D + 0.4);
      } else {                  // лево
        rx = -(W/2 + 0.25) + (Math.random() - 0.5) * 0.1;
        rz = (Math.random() - 0.5) * (D + 0.4);
      }
      
      // Видимая часть — от низа (y=0) до верха фундамента (y=foundationTopVisible)
      rock.position.set(
        rx,
        0.05 + Math.random() * foundationTopVisible,
        rz
      );
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      this.group.add(rock);
    }

    // ================================================
    // СРУБ — стены из брёвен
    // ================================================
    const logRows = Math.floor(H / logStep);

    // --- Передняя и задняя стены ---
    for (let row = 0; row < logRows; row++) {
      const y = 0.6 + row * logStep;
      
      // Передняя стена (Z = +D/2)
      const logFront = new THREE.Mesh(
        new THREE.CylinderGeometry(logR, logR, W, 8),
        row % 2 === 0 ? logMat : logDarkMat
      );
      logFront.rotation.z = Math.PI / 2;
      logFront.position.set(0, y, D/2 - logR);
      logFront.castShadow = true;
      this.group.add(logFront);

      // Задняя стена (Z = -D/2)
      const logBack = logFront.clone();
      logBack.position.set(0, y, -D/2 + logR);
      this.group.add(logBack);
    }

    // --- Левая и правая стены (короче, чтобы не пересекались в углах) ---
    for (let row = 0; row < logRows; row++) {
      const y = 0.6 + row * logStep + logStep/2; // сдвиг на пол-бревна
      
      // Правая стена (X = +W/2)
      const logRight = new THREE.Mesh(
        new THREE.CylinderGeometry(logR, logR, D - 4*logR, 8),
        row % 2 === 0 ? logDarkMat : logMat
      );
      logRight.rotation.x = Math.PI / 2;
      logRight.position.set(W/2 - logR, y, 0);
      logRight.castShadow = true;
      this.group.add(logRight);

      // Левая стена (X = -W/2)
      const logLeft = logRight.clone();
      logLeft.position.set(-W/2 + logR, y, 0);
      this.group.add(logLeft);
    }

    // ================================================
    // ДВЕРЬ (на передней стене, справа)
    // ================================================
    const doorW = 1.0;
    const doorH = 2.0;
    const doorX = W/2 - 1.5;
    
    // Проём (тёмный прямоугольник — невидимый, но даёт визуальную тень)
    const doorFrame = new THREE.Mesh(
      new THREE.BoxGeometry(doorW + 0.15, doorH + 0.15, 0.1),
      windowFrameMat
    );
    doorFrame.position.set(doorX, 0.6 + doorH/2, D/2 + 0.01);
    this.group.add(doorFrame);

    // Сама дверь
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(doorW, doorH, 0.12),
      doorMat
    );
    door.position.set(doorX, 0.6 + doorH/2, D/2 + 0.05);
    door.castShadow = true;
    this.group.add(door);

    // Доски на двери (вертикальные линии)
    for (let i = 0; i < 3; i++) {
      const plank = new THREE.Mesh(
        new THREE.BoxGeometry(0.02, doorH - 0.1, 0.02),
        logDarkMat
      );
      plank.position.set(
        doorX - doorW/2 + 0.2 + i * 0.3,
        0.6 + doorH/2,
        D/2 + 0.12
      );
      this.group.add(plank);
    }

    // Ручка
    const handle = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 8, 8),
      handleMat
    );
    handle.position.set(doorX + doorW/2 - 0.15, 0.6 + doorH/2, D/2 + 0.12);
    this.group.add(handle);

    // ================================================
    // ОКНА (два — слева от двери и на правой стене)
    // ================================================
    const windowW = 0.9;
    const windowH = 0.9;

    // --- Окно на передней стене ---
    this.createWindow(
      -W/2 + 1.5, 0.6 + 1.8, D/2 + 0.02,
      windowW, windowH, 'front', windowFrameMat, windowGlowMat
    );

    // --- Окно на правой стене ---
    this.createWindow(
      W/2 + 0.02, 0.6 + 1.8, 0,
      windowW, windowH, 'right', windowFrameMat, windowGlowMat
    );

    // ================================================
    // КРЫША (двускатная)
    // ================================================
    const roofH = 2.5;
    const roofOverhang = 0.6;

    // Два ската
    const roofGeo = new THREE.BoxGeometry(
      Math.sqrt((W/2 + roofOverhang) * (W/2 + roofOverhang) + roofH * roofH),
      0.15,
      D + roofOverhang * 2
    );

    // Правый скат
    const roofRight = new THREE.Mesh(roofGeo, roofMat);
    roofRight.position.set(W/4, 0.3 + H + roofH/2, 0);
    roofRight.rotation.z = -Math.atan2(roofH, W/2 + roofOverhang);
    roofRight.castShadow = true;
    this.group.add(roofRight);

    // Левый скат
    const roofLeft = new THREE.Mesh(roofGeo, roofMat);
    roofLeft.position.set(-W/4, 0.3 + H + roofH/2, 0);
    roofLeft.rotation.z = Math.atan2(roofH, W/2 + roofOverhang);
    roofLeft.castShadow = true;
    this.group.add(roofLeft);

    // Конёк крыши (верхнее бревно)
    const ridge = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.9, D + roofOverhang * 2, 8),
      roofEdgeMat
    );
    ridge.rotation.x = Math.PI / 2;
    ridge.position.set(0, 0.6 + H + roofH + 0.05, 0);
    ridge.castShadow = true;
    this.group.add(ridge);

    // Франтоны (треугольники на торцах крыши)
    for (const side of [-1, 1]) {
      const shape = new THREE.Shape();
      shape.moveTo(-W/2 - roofOverhang, 0);
      shape.lineTo(W/2 + roofOverhang, 0);
      shape.lineTo(0, roofH);
      shape.lineTo(-W/2 - roofOverhang, 0);
      
      const extrudeGeo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.1, bevelEnabled: false
      });
      const gable = new THREE.Mesh(extrudeGeo, logDarkMat);
      gable.position.set(0, 0.3 + H, side * (D/2 - 0.05));
      gable.castShadow = true;
      this.group.add(gable);
    }

    // ================================================
    // ТРУБА (на крыше, смещена к левому скату)
    // ================================================
    const chimneyX = -W/4;
    const chimneyBase = 0.6 + H + roofH * 0.7;
    
    const chimney = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 2.5, 0.6),
      stoneMat
    );
    chimney.position.set(chimneyX, chimneyBase + 0.4, 0);
    chimney.castShadow = true;
    this.group.add(chimney);

    // Тёмное отверстие трубы сверху
    const chimneyTop = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.05, 0.5),
      new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
    );
    chimneyTop.position.set(chimneyX, chimneyBase + 1.8, 0);
    this.group.add(chimneyTop);

    // ================================================
    // КРЫЛЬЦО (ступеньки перед дверью)
    // ================================================
    const porchSteps = 3;
    for (let i = 0; i < porchSteps; i++) {
      const step = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.2, 0.4),
        woodPlankMat
      );
      step.position.set(
        doorX,
        0.6 - i * 0.2,
        D/2 + 0.3 + i * 0.4
      );
      step.castShadow = true;
      step.receiveShadow = true;
      this.group.add(step);
    }

    // Навес над крыльцом
    const porchRoof = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.1, 1.2),
      roofMat
    );
    porchRoof.position.set(doorX, 0.6 + doorH + 0.4, D/2 + 0.6);
    porchRoof.rotation.x = -0.15;
    porchRoof.castShadow = true;
    this.group.add(porchRoof);

    // Два столбика для навеса
    for (const dx of [-0.7, 0.7]) {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, doorH + 0.4, 8),
        logDarkMat
      );
      post.position.set(doorX + dx, 0.6 + (doorH + 0.4)/2, D/2 + 1.1);
      post.castShadow = true;
      this.group.add(post);
    }

    // ================================================
    // ПОЛЕННИЦА (рядом с дверью)
    // ================================================
    const woodpileX = doorX - 1.8;
    const woodpileZ = D/2 + 1.0;
    
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 4; col++) {
        const log = new THREE.Mesh(
          new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8),
          row % 2 === 0 ? logMat : logDarkMat
        );
        log.rotation.x = Math.PI / 2;
        log.position.set(
          woodpileX + (col - 1.5) * 0.32,
          0.6 + row * 0.3 + 0.15,
          woodpileZ
        );
        log.castShadow = true;
        this.group.add(log);
      }
    }

    // ================================================
    // СКАМЕЙКА возле домика
    // ================================================
    const benchX = doorX + 1.5;
    const benchZ = D/2 + 1.2;
    
    // Сиденье
    const benchSeat = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.1, 0.4),
      woodPlankMat
    );
    benchSeat.position.set(benchX, 0.6 + 0.5, benchZ);
    benchSeat.castShadow = true;
    this.group.add(benchSeat);

    // Ножки
    for (const dx of [-0.6, 0.6]) {
      const leg = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.5, 0.35),
        logDarkMat
      );
      leg.position.set(benchX + dx, 0.6 + 0.25, benchZ);
      this.group.add(leg);
    }

    // ================================================
    // СВЕТ ИЗ ОКНА (point light)
    // ================================================
    const windowLight = new THREE.PointLight(0xffaa44, 0.6, 8);
    windowLight.position.set(-W/2 + 1.5, 0.6 + 1.8, D/2 + 0.5);
    this.group.add(windowLight);

    // ================================================
    // СКРЫТАЯ ЛАМПОЧКА ВНУТРИ (для эффекта "кто-то дома")
    // ================================================
    const insideLight = new THREE.PointLight(0xff8844, 0.3, 6);
    insideLight.position.set(0, 1.5, 0);
    this.group.add(insideLight);

    // ================================================
    // ДЫМ ИЗ ТРУБЫ
    // ================================================
    this.smokeOrigin = new THREE.Vector3(chimneyX, chimneyBase + 2.1, 0);
    this.createSmoke();

    // Всё в тени
    this.group.traverse(o => { if (o.isMesh) o.castShadow = true; });
    
    this.scene.add(this.group);
  }

  createWindow(x, y, z, w, h, face, frameMat, glowMat) {
    // Рама
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.15, h + 0.15, 0.08),
      frameMat
    );
    
    let framePos;
    if (face === 'front') {
      framePos = new THREE.Vector3(x, y, z);
      frame.position.copy(framePos);
    } else if (face === 'right') {
      framePos = new THREE.Vector3(x, y, z);
      frame.position.copy(framePos);
      frame.rotation.y = Math.PI / 2;
    }
    this.group.add(frame);

    // Светящееся стекло
    const glow = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, 0.05),
      glowMat
    );
    
    if (face === 'front') {
      glow.position.set(x, y, z + 0.05);
    } else if (face === 'right') {
      glow.position.set(x + 0.05, y, z);
      glow.rotation.y = Math.PI / 2;
    }
    this.group.add(glow);

    // Переплёт (крест)
    const barH = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.03, 0.02),
      frameMat
    );
    const barV = new THREE.Mesh(
      new THREE.BoxGeometry(0.03, h, 0.02),
      frameMat
    );
    
    if (face === 'front') {
      barH.position.set(x, y, z + 0.08);
      barV.position.set(x, y, z + 0.08);
    } else if (face === 'right') {
      barH.position.set(x + 0.08, y, z);
      barH.rotation.y = Math.PI / 2;
      barV.position.set(x + 0.08, y, z);
      barV.rotation.y = Math.PI / 2;
    }
    this.group.add(barH);
    this.group.add(barV);
  }

  createSmoke() {
    // Простые частицы дыма — маленькие серые сферы, поднимающиеся вверх
    const smokeMat = new THREE.MeshBasicMaterial({
      color: 0xcccccc,
      transparent: true,
      opacity: 0.5,
      depthWrite: false
    });

    for (let i = 0; i < 8; i++) {
      const geo = new THREE.SphereGeometry(0.15 + Math.random()*0.1, 6, 6);
      const particle = new THREE.Mesh(geo, smokeMat.clone());
      particle.position.copy(this.smokeOrigin);
      particle.position.y += i * 0.15;
      particle.position.x += (Math.random() - 0.5) * 0.2;
      particle.position.z += (Math.random() - 0.5) * 0.2;
      particle.userData.life = i * 0.3;
      particle.userData.speed = 0.3 + Math.random() * 0.2;
      this.smokeParticles.push(particle);
      this.group.add(particle);
    }
  }

  update(dt) {
    // Анимация дыма
    for (let i = 0; i < this.smokeParticles.length; i++) {
      const p = this.smokeParticles[i];
      p.userData.life += dt;
      
      // Дым поднимается
      p.position.y += p.userData.speed * dt;
      // Немного дрейфует в сторону
      p.position.x += Math.sin(p.userData.life * 2) * dt * 0.2;
      p.position.z += Math.cos(p.userData.life * 1.5) * dt * 0.15;
      
      // Растёт и истончается
      const scale = 1 + p.userData.life * 0.5;
      p.scale.setScalar(scale);
      
      // Прозрачность уменьшается
      p.material.opacity = Math.max(0, 0.5 - p.userData.life * 0.15);
      
      // Если дым "умер" — перезапускаем
      if (p.userData.life > 3.5) {
        p.userData.life = 0;
        p.position.copy(this.smokeOrigin);
        p.position.x += (Math.random() - 0.5) * 0.2;
        p.position.z += (Math.random() - 0.5) * 0.2;
        p.scale.setScalar(1);
        p.material.opacity = 0.5;
      }
    }
  }
}

// ============================================================
// CLASS: Пуля (трассер)
// ============================================================
class Bullet {
  constructor(scene) {
    this.scene = scene;
    this.active = false;
    this.life = 0;
    this.maxLife = 0.18; 
    this.speed = 600;    

    this.start = new THREE.Vector3();
    this.end = new THREE.Vector3();
    this.dir = new THREE.Vector3();
    this.totalDist = 0;
    this.traveled = 0;

    const geo = new THREE.CylinderGeometry(0.05, 0.05, 1, 6);
    geo.rotateX(Math.PI / 2);
    geo.translate(0, 0, -0.5);

    const mat = new THREE.MeshBasicMaterial({
      color: 0xffdd66, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });

    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.visible = false;
    this.scene.add(this.mesh);

    const headGeo = new THREE.SphereGeometry(0.04, 8, 8);
    const headMat = new THREE.MeshBasicMaterial({
      color: 0xffffcc, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.head = new THREE.Mesh(headGeo, headMat);
    this.head.visible = false;
    this.scene.add(this.head);

    const sparkGeo = new THREE.SphereGeometry(0.15, 8, 8);
    const sparkMat = new THREE.MeshBasicMaterial({
      color: 0xffaa33, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.spark = new THREE.Mesh(sparkGeo, sparkMat);
    this.spark.visible = false;
    this.scene.add(this.spark);
  }

  fire(start, end) {
    this.start.copy(start);
    this.end.copy(end);
    this.dir.subVectors(end, start);
    this.totalDist = this.dir.length();
    if (this.totalDist < 0.001) return;
    this.dir.normalize();
    this.traveled = 0;
    this.life = 0;
    this.active = true;

    this.mesh.visible = true;
    this.head.visible = true;
    this.mesh.material.opacity = 1;
    this.head.material.opacity = 1;
    this.spark.visible = false;
    this.head.position.copy(start);
  }

  update(dt) {
    if (!this.active) return;

    this.life += dt;
    this.traveled += this.speed * dt;

    const headPos = new THREE.Vector3();
    const progress = Math.min(1, this.traveled / this.totalDist);

    headPos.copy(this.start).addScaledVector(this.dir, this.traveled);
    if (progress >= 1) headPos.copy(this.end);
    this.head.position.copy(headPos);

    const trailLen = Math.min(this.traveled, 6.0); 
    const tailPos = new THREE.Vector3().copy(headPos).addScaledVector(this.dir, -trailLen);

    this.mesh.position.copy(tailPos);
    this.mesh.lookAt(headPos);
    this.mesh.scale.set(1, 1, trailLen);

    const t = this.life / this.maxLife;
    const fade = 1 - t;
    this.mesh.material.opacity = Math.max(0, fade);
    this.head.material.opacity = Math.max(0, fade);

    if (progress >= 1) {
      this.spark.position.copy(this.end);
      this.spark.visible = true;
      const sparkT = Math.min(1, (this.life - this.totalDist / this.speed) / 0.12);
      this.spark.material.opacity = Math.max(0, 1 - sparkT);
      this.spark.scale.setScalar(1 + sparkT * 2);
    }

    if (this.life > this.maxLife) {
      this.active = false;
      this.mesh.visible = false;
      this.head.visible = false;
      this.spark.visible = false;
    }
  }
}

// ============================================================
// CLASS: Ружьё — держатель готовой модели из gun.compile.js
// ============================================================
//import { buildGun, GUN_PARAMS } from "./gun.compile.js";

class Gun {
  constructor(camera, envMap = null) {
    this.camera = camera;
    this.recoil = 0;

    // 🔫 Собираем ружьё из gun.compile.js
    this.model = buildGun(envMap);

    // Базовая позиция в руках (справа снизу, как в FPS)
    this.model.position.set(0.24, -0.22, -0.30);
    this.model.rotation.y = 0.0;
    this.model.rotation.z = 0.02;

    // Крепим к камере
    camera.add(this.model);
  }

  // Позиция дула в мире (для трассера)
  getMuzzlePosition() {
    const v = new THREE.Vector3(0, 0.03, -1.7);
    this.model.localToWorld(v);
    return v;
  }

  // Точка выброса гильзы (справа сверху на коробке)
  getEjectPosition() {
    const v = new THREE.Vector3(0.02, 0.015, 0.05); //0.020, 0.015, 0.050
    this.model.localToWorld(v);
    return v;
  }

  // Направление выброса гильзы
  getEjectDirection() {
    const dir = new THREE.Vector3(1, 0.8, 0.2).normalize();
    return dir.transformDirection(this.model.matrixWorld);
  }

  fire() {
    this.recoil = 1.0;
    if (window.SNDS && SNDS.shoot) SNDS.shoot.play();
    setTimeout(() => {
      if (window.SNDS && SNDS.dzin) SNDS.dzin.play();
    }, 180);
  }

  update(dt) {
    if (this.recoil > 0) {
      this.recoil -= dt * 6;
      if (this.recoil < 0) this.recoil = 0;
    }
    const r = this.recoil;

    this.model.position.z = -0.30 + r * 0.14;
    this.model.rotation.x = r * 0.22;
    // X и Y — обновляются в Breathing
  }
}

// ============================================================
// CLASS: Утка
// ============================================================
class Duck {
  constructor(scene, spawnPos, targetPos) {
    this.scene = scene;
    this.alive = true;
    this.falling = false;
    this.removeMe = false;
    this.fallSpeed = 0;
    this.fallRotSpeed = 0;
    this.life = 0;
    this.wingPhase = Math.random() * Math.PI * 2;

    this.group = new THREE.Group();
    this.buildModel();
    this.group.position.copy(spawnPos);
    this.group.position.y = Math.max(2, spawnPos.y + 2 + Math.random()*2);
    this.scene.add(this.group);

    this.velocity = new THREE.Vector3(
      (Math.random() - 0.3) * 6,
      2 + Math.random() * 3,
      (Math.random() - 0.5) * 6
    );
    this.targetPos = targetPos.clone();
    this.wanderTimer = 0;
  }

  buildModel() {
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x4a3a2a });
    const headMat = new THREE.MeshLambertMaterial({ color: 0x2a5a3a });
    const beakMat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
    const wingMat = new THREE.MeshLambertMaterial({ color: 0x6a5a4a });

    const bodyGeo = new THREE.SphereGeometry(0.28, 10, 8);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.scale.set(1.5, 0.9, 1);
    this.group.add(body);

    const neckGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.25, 8);
    const neck = new THREE.Mesh(neckGeo, headMat);
    neck.position.set(0.35, 0.12, 0);
    neck.rotation.z = -0.5;
    this.group.add(neck);

    const headGeo = new THREE.SphereGeometry(0.15, 10, 8);
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.set(0.5, 0.22, 0);
    this.group.add(head);

    const beakGeo = new THREE.ConeGeometry(0.06, 0.2, 6);
    const beak = new THREE.Mesh(beakGeo, beakMat);
    beak.rotation.z = -Math.PI/2;
    beak.position.set(0.68, 0.2, 0);
    this.group.add(beak);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const eyeGeo = new THREE.SphereGeometry(0.025, 6, 6);
    const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
    eye1.position.set(0.55, 0.26, 0.08);
    this.group.add(eye1);
    const eye2 = eye1.clone();
    eye2.position.z = -0.08;
    this.group.add(eye2);

    this.wingL = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.4, 0.7),
      wingMat
    );
    this.wingL.position.set(0, 0.15, 0.35);
    this.group.add(this.wingL);

    this.wingR = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.4, 0.7),
      wingMat
    );
    this.wingR.position.set(0, 0.15, -0.35);
    this.group.add(this.wingR);

    const tailGeo = new THREE.ConeGeometry(0.15, 0.3, 6);
    const tail = new THREE.Mesh(tailGeo, bodyMat);
    tail.rotation.z = Math.PI/2;
    tail.position.set(-0.45, 0.05, 0);
    this.group.add(tail);

    this.group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  }

  getBoundingBox() {
    return new THREE.Box3().setFromObject(this.group);
  }

  hit() {
    if (!this.alive) return false;
    this.alive = false;
    this.falling = true;
    this.fallSpeed = 2;
    this.fallRotSpeed = (Math.random() - 0.5) * 8;
    if (window.SNDS && SNDS.death) SNDS.death.play();
    return true;
  }

  update(dt) {
    if (this.alive) {
      this.life += dt;
      
      this.wanderTimer += dt;
      if (this.wanderTimer > 1.2) {
        this.wanderTimer = 0;
        this.velocity.x += (Math.random() - 0.5) * 4;
        this.velocity.z += (Math.random() - 0.5) * 4;
        this.velocity.y += Math.random() * 1;
      }
      this.velocity.y -= dt * 1.5; 

      this.group.position.addScaledVector(this.velocity, dt);

      const horiz = new THREE.Vector3(this.velocity.x, 0, this.velocity.z);
      if (horiz.lengthSq() > 0.01) {
        this.group.rotation.y = Math.atan2(-this.velocity.z, this.velocity.x);
      }

      this.wingPhase += dt * 18;
      const flap = Math.sin(this.wingPhase) * 0.9;
      this.wingL.rotation.x = flap;
      this.wingR.rotation.x = -flap;

      if (this.group.position.y > 35 || this.group.position.length() > 150) {
        this.removeMe = true;
      }
    } else if (this.falling) {
      this.fallSpeed += dt * 25;
      this.group.position.y -= this.fallSpeed * dt;
      this.group.rotation.x += this.fallRotSpeed * dt;
      this.group.rotation.z += this.fallRotSpeed * 0.7 * dt;

      this.wingL.rotation.x = -1.5;
      this.wingR.rotation.x = 1.5;

      const groundY = terrain.getHeightAt(this.group.position.x, this.group.position.z) + 0.3;
      if (this.group.position.y <= groundY) {
        this.group.position.y = groundY;
        this.falling = false;
        setTimeout(() => { this.removeMe = true; }, 800);
      }
    }
  }

  dispose() {
    this.scene.remove(this.group);
    this.group.traverse(o => {
      if (o.isMesh) {
        o.geometry.dispose();
        if (o.material.dispose) o.material.dispose();
      }
    });
  }
}

// CLASS: Гильза

class Shell {
  constructor(scene) {
    this.scene = scene;
    this.active = false;
    this.life = 0;
    this.maxLife = 3.0;
    this.landed = false;

    this.velocity = new THREE.Vector3();
    this.angularVel = new THREE.Vector3();
    
    const matPlastic = new THREE.MeshStandardMaterial({ 
      color: 0xdd1111, roughness: 0.3, metalness: 0.2 
    });
    const matBrass = new THREE.MeshStandardMaterial({ 
      color: 0xffcc33, roughness: 0.2, metalness: 0.9 
    });

    this.mesh = new THREE.Group();
    
    const bodyGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.08, 8);
    bodyGeo.rotateZ(Math.PI / 2);
    const body = new THREE.Mesh(bodyGeo, matPlastic);
    body.position.x = -0.01;
    this.mesh.add(body);

    const baseGeo = new THREE.CylinderGeometry(0.026, 0.026, 0.02, 8);
    baseGeo.rotateZ(Math.PI / 2);
    const base = new THREE.Mesh(baseGeo, matBrass);
    base.position.x = 0.03;
    this.mesh.add(base);

    this.mesh.visible = false;
    this.mesh.castShadow = true;
    this.scene.add(this.mesh);
  }

  fire(startPos, startVel) {
    this.active = true;
    this.life = 0;
    this.landed = false;
    this.mesh.visible = true;
    this.mesh.position.copy(startPos);
    this.mesh.scale.set(1, 1, 1);
    this.velocity.copy(startVel);
    
    this.angularVel.set(
      (Math.random() - 0.5) * 25,
      (Math.random() - 0.5) * 25,
      (Math.random() - 0.5) * 25
    );
    this.mesh.rotation.set(0, 0, 0);
  }

  update(dt) {
    if (!this.active) return;

    this.life += dt;

    if (!this.landed) {
      this.velocity.y -= 15.0 * dt; 
      this.mesh.position.addScaledVector(this.velocity, dt);
      
      this.mesh.rotation.x += this.angularVel.x * dt;
      this.mesh.rotation.y += this.angularVel.y * dt;
      this.mesh.rotation.z += this.angularVel.z * dt;
      
      const groundY = terrain.getHeightAt(this.mesh.position.x, this.mesh.position.z) + 0.03;
      if (this.mesh.position.y <= groundY) {
        this.mesh.position.y = groundY;
        this.landed = true;
        this.velocity.set(0, 0, 0);
        this.angularVel.set(0, 0, 0);
        this.mesh.rotation.set(Math.PI / 2, Math.random() * Math.PI, 0);
        
        if (window.SNDS && SNDS.dzin) SNDS.dzin.play();
      }
    } else {
      if (this.life > this.maxLife - 0.5) {
        const scale = Math.max(0.01, (this.maxLife - this.life) / 0.5);
        this.mesh.scale.set(scale, scale, scale);
      }
    }

    if (this.life > this.maxLife) {
      this.active = false;
      this.mesh.visible = false;
    }
  }
}

const keys = {};
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const mouseSensitivity = 0.0022;
euler.y = THREE.MathUtils.degToRad(-47);
camera.quaternion.setFromEuler(euler);

function getAimEndPoint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const maxDist = 250;
  let closestDist = Infinity;
  let hitPoint = null;

  ducks.forEach(duck => {
    if (!duck.alive) return;
    const box = duck.getBoundingBox();
    const p = raycaster.ray.intersectBox(box, new THREE.Vector3());
    if (p) {
      const d = p.distanceTo(camera.position);
      if (d < closestDist && d < maxDist) {
        closestDist = d;
        hitPoint = p;
      }
    }
  });

  if (!hitPoint) {
    const hits = raycaster.intersectObject(terrain.mesh, false);
    if (hits.length > 0 && hits[0].distance < maxDist) {
      hitPoint = hits[0].point;
    }
  }

  if (!hitPoint) {
    hitPoint = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, maxDist);
  }

  return hitPoint;
}

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

let touchLookId = null;
let touchLookStart = { x: 0, y: 0 };

document.addEventListener('mousemove', e => {
  if (!isTouch && document.pointerLockElement === renderer.domElement) {
    euler.y -= e.movementX * mouseSensitivity;
    euler.x -= e.movementY * mouseSensitivity;
    euler.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, euler.x));
    camera.quaternion.setFromEuler(euler);
  }
});

renderer.domElement.addEventListener('touchstart', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.clientX > window.innerWidth * 0.35 && touchLookId === null) {
      touchLookId = t.identifier;
      touchLookStart.x = t.clientX;
      touchLookStart.y = t.clientY;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchLookId) {
      const dx = t.clientX - touchLookStart.x;
      const dy = t.clientY - touchLookStart.y;
      euler.y -= dx * 0.005;
      euler.x -= dy * 0.005;
      euler.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, euler.x));
      camera.quaternion.setFromEuler(euler);
      touchLookStart.x = t.clientX;
      touchLookStart.y = t.clientY;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchLookId) {
      touchLookId = null;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('click', () => {
  if (isTouch) return;
  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  } else {
    shoot();
  }
});

const flashEl = document.getElementById('flash');

      if (dist < closestDist && dist < 120) {

        closestHit = duck;
      }
    }
  });

// Трассер
const muzzleWorld = gun.getMuzzlePosition();
const start = muzzleWorld.clone().lerp(camera.position, 0.15);
const end = getAimEndPoint();

// Гильза

ejectVel.x += (Math.random() - 0.5) * 0.8;
ejectVel.y += 2.6 + (Math.random());
ejectVel.z  = -1.6;

getShell().fire(ejectPos, ejectVel);

  if (closestHit) {

function spawnDuck() {
  if (nature.spawnPoints.length === 0) return;

  const SPAWN_RADIUS_MIN = 15;
  const SPAWN_RADIUS_MAX = 35; 

  const candidates = [];
  for (let i = 0; i < nature.spawnPoints.length; i++) {
    const sp = nature.spawnPoints[i];
    const dx = sp.x - camera.position.x;
    const dz = sp.z - camera.position.z;
    const distSq = dx * dx + dz * dz;
    
    // Не спавним уток прямо в воде
    const h = terrain.getHeightAt(sp.x, sp.z);
    if (h < WATER_LEVEL + 0.5) continue;   // <-- добавить
    
    if (distSq >= SPAWN_RADIUS_MIN * SPAWN_RADIUS_MIN &&
        distSq <= SPAWN_RADIUS_MAX * SPAWN_RADIUS_MAX) {
      candidates.push(sp);
    }
  }

  let spawnPos;
  if (candidates.length > 0) {
    const sp = candidates[Math.floor(Math.random() * candidates.length)];
    spawnPos = new THREE.Vector3(sp.x, terrain.getHeightAt(sp.x, sp.z) + 1.5, sp.z);
  } else {
    const angle = Math.random() * Math.PI * 2;
    const dist = SPAWN_RADIUS_MIN + Math.random() * (SPAWN_RADIUS_MAX - SPAWN_RADIUS_MIN);
    const px = camera.position.x + Math.cos(angle) * dist;
    const pz = camera.position.z + Math.sin(angle) * dist;
    spawnPos = new THREE.Vector3(px, terrain.getHeightAt(px, pz) + 1.5, pz);
  }

  const target = camera.position.clone();
  ducks.push(new Duck(scene, spawnPos, target));
}

const playerVel = new THREE.Vector3();
const playerPos = new THREE.Vector3(0, 1.7 + terrain.getHeightAt(0, 0), 0);

function updatePlayer(dt) {
  const speed = keys['ShiftLeft'] ? 14 : 8;
  const dir = new THREE.Vector3();

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0));

  if (keys['KeyW']) dir.add(forward);
  if (keys['KeyS']) dir.sub(forward);
  if (keys['KeyD']) dir.add(right);
  if (keys['KeyA']) dir.sub(right);

  if (isTouch && (joyVector.x !== 0 || joyVector.y !== 0)) {
    dir.add(forward.clone().multiplyScalar(-joyVector.y));
    dir.add(right.clone().multiplyScalar(joyVector.x));
  }

  if (dir.lengthSq() > 0) dir.normalize().multiplyScalar(speed);

  playerVel.lerp(dir, Math.min(1, dt * 12));
  playerPos.addScaledVector(playerVel, dt);

  const maxR = 140;
  if (playerPos.length() > maxR) {
    playerPos.setLength(maxR);
  }

  const groundY = terrain.getHeightAt(playerPos.x, playerPos.z);
  playerPos.y = groundY + 1.7;

  cameraPivot.position.copy(playerPos);
}

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };

if (isTouch && joyZone) {
  joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = joyZone.getBoundingClientRect();
    joyCenter.x = rect.left + rect.width / 2;
    joyCenter.y = rect.top + rect.height / 2;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (joyId === null) {
        joyId = e.changedTouches[i].identifier;
        joyVector.x = 0;
        joyVector.y = 0;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) {
        let dx = t.clientX - joyCenter.x;
        let dy = t.clientY - joyCenter.y;
        const maxRadius = 40;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > maxRadius) {
          dx = dx / len * maxRadius;
          dy = dy / len * maxRadius;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVector.x = dx / maxRadius;
        joyVector.y = dy / maxRadius;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyId = null;
        joyVector.x = 0;
        joyVector.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  }, { passive: false });
}

const shootBtn = document.getElementById('shoot-btn');
if (isTouch && shootBtn) {
  shootBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    shoot();
  }, { passive: false });
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  sky.update(dt);
  const isMoving = playerVel.lengthSq() > 0.5;
  breathing.update(dt, isMoving);
  gun.update(dt);
  lodge.update(dt);
  updatePlayer(dt);

  // В animate() после updatePlayer:
  // В animate() после updatePlayer:
  cameraPivot.position.y = playerPos.y + breathing.cameraBobY;
  cameraPivot.rotation.z = breathing.cameraRoll;
  cameraPivot.rotation.x = 0;   // сброс — мышь управляет camera.rotation.x
  cameraPivot.rotation.y = 0;   // сброс — мышь управляет camera.rotation.y

  timeSinceSpawn += dt;
  if (timeSinceSpawn > spawnInterval) {
    timeSinceSpawn = 0;
    if (ducks.filter(d => d.alive).length < 8) {
      spawnDuck();
    }
  }

  for (let i = ducks.length - 1; i >= 0; i--) {
    const d = ducks[i];
    d.update(dt);
    if (d.removeMe) {
      d.dispose();
      ducks.splice(i, 1);
    }
  }

  for (let i = 0; i < bulletPool.length; i++) {
    bulletPool[i].update(dt);
  }

  for (let i = 0; i < shellPool.length; i++) {
    shellPool[i].update(dt);
  }

  if (flashTimer > 0) {
    flashTimer -= dt;
    if (flashTimer <= 0) {
      flashEl.style.opacity = '0';
    } else {
      flashEl.style.opacity = Math.max(0, flashTimer / 0.08 * 0.6);
    }
  }

  renderer.render(scene, camera);
}

function resizeRenderer() {
  // visualViewport корректно отдаёт размер даже с адресной строкой
  const w = window.visualViewport
    ? window.visualViewport.width
    : window.innerWidth;
  const h = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', resizeRenderer);
window.addEventListener('orientationchange', () => {
  // на повороте экрана ждём немного, чтобы браузер обновил размеры
  setTimeout(resizeRenderer, 100);
});

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeRenderer);
    window.visualViewport.addEventListener('scroll', resizeRenderer);
}

animate();
