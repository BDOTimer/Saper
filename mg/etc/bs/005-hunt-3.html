    varying vec3 vWorldPosition;

      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + offset).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0);

function getAimEndPoint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  // утки приоритетнее по дистанции — берём общего кандидата
  const duckHit = duckPool.raycast(raycaster, 250);
  const pigHit  = pigPool.raycast(raycaster, 250);

  const origin = raycaster.ray.origin;
  const distDuck = duckHit ? origin.distanceTo(duckHit.group.position) : Infinity;
  const distPig  = pigHit  ? origin.distanceTo(pigHit.group.position)  : Infinity;

  if (distDuck <= distPig && duckHit) {
    return duckHit.getBoundingBox().getCenter(new THREE.Vector3());
  }
  if (pigHit) {
    return pigHit.getBoundingBox().getCenter(new THREE.Vector3());
  }

  // иначе — земля / maxDist
  return duckPool.raycastPoint(raycaster, terrain.mesh, 250);
}

function shoot() {
  gun.fire();

  flashEl.style.opacity = '0.6';
  flashTimer = 0.08;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const duckHit = duckPool.raycast(raycaster, 120);
  const pigHit  = pigPool.raycast(raycaster, 150);

  // Трассер
  const muzzleWorld = gun.getMuzzlePosition();
  const start = muzzleWorld.clone(); 
  const end = getAimEndPoint();
  bulletPool.fire(start, end);

  // Гильза
  const ejectPos = gun.getEjectPosition();
  const ejectDirWorld = gun.getEjectDirection(); // уже нормализованный, в мире

  // Базовая скорость выброса (м/с) — подберите под масштаб сцены
  const ejectSpeed = 2.5 + Math.random() * 1.0;

  // Мировой вектор скорости
  const ejectVel = ejectDirWorld.multiplyScalar(ejectSpeed);

  // Небольшой случайный разброс (в локальных осях ружья, чтобы не «ломать» направление)
  // Проще — просто добавить маленький случайный мировой шум:
  ejectVel.x += (Math.random() - 0.5) * 0.6;
  ejectVel.y += (Math.random() - 0.5) * 0.4;
  ejectVel.z += (Math.random() - 0.5) * 0.6;

  shellPool.fire(ejectPos, ejectVel);

  const distDuck = duckHit
    ? raycaster.ray.origin.distanceTo(duckHit.group.position)
    : Infinity;
  const distPig = pigHit
    ? raycaster.ray.origin.distanceTo(pigHit.group.position)
    : Infinity;

  if (duckHit && distDuck <= distPig) {
    duckPool.kill(duckHit);
  } else if (pigHit) {
    pigPool.kill(pigHit);
  } else {
    if (window.SNDS && SNDS.damag) SNDS.damag.play();
  }
}

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');

if (isTouch && joyZone) {
  joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = joyZone.getBoundingClientRect();
    joyCenter.x = rect.left + rect.width / 2;
    joyCenter.y = rect.top + rect.height / 2;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (joyId === null) {
        joyId = e.changedTouches[i].identifier;
        joyVector.x = 0;
        joyVector.y = 0;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) {
        let dx = t.clientX - joyCenter.x;
        let dy = t.clientY - joyCenter.y;
        const maxRadius = 40;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > maxRadius) {
          dx = dx / len * maxRadius;
          dy = dy / len * maxRadius;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVector.x = dx / maxRadius;
        joyVector.y = dy / maxRadius;
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyId = null;
        joyVector.x = 0;
        joyVector.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  }, { passive: false });
}

const shootBtn = document.getElementById('shoot-btn');
if (isTouch && shootBtn) {
  shootBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    shoot();
  }, { passive: false });
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  sky.update(dt);
  water.update(dt);

  const isMoving = player.isMoving();
  breathing.update(dt, isMoving);
  gun.update(dt);
  lodge.update(dt);
  player.update(dt, breathing);
  grass.update(dt, camera);

  duckPool.updateSpawner(dt, camera);
  duckPool.update(dt);

  pigPool.updateSpawner(dt, camera);
  pigPool.update(dt);

  bulletPool.update(dt);
  shellPool.update (dt);

  if (flashTimer > 0) {
    flashTimer -= dt;
    if (flashTimer <= 0) {
      flashEl.style.opacity = '0';
    } else {
      flashEl.style.opacity = Math.max(0, flashTimer / 0.08 * 0.6);
    }
  }

  renderer.render(scene, camera);
}

function resizeRenderer() {
  // visualViewport корректно отдаёт размер даже с адресной строкой
  const w = window.visualViewport
    ? window.visualViewport.width
    : window.innerWidth;
  const h = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', resizeRenderer);
window.addEventListener('orientationchange', () => {
  // на повороте экрана ждём немного, чтобы браузер обновил размеры
  setTimeout(resizeRenderer, 100);
});

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeRenderer);
    window.visualViewport.addEventListener('scroll', resizeRenderer);
}

animate();

// ===== Кастомный неоновый курсор + Ctrl =====
const neonCursor = document.getElementById('neon-cursor');
const rootEl = document.documentElement;

let cursorEnabled = false;      // по умолчанию — стандартный курсор
let mouseX = window.innerWidth  / 2;
let mouseY = window.innerHeight / 2;

renderer.domElement.addEventListener('click', () => {
  if (isTouch) return;

  if (cursorEnabled) {
    setCursorEnabled(false);
  }

  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  } else {
    shoot();
  }
});

function setCursorEnabled(on) {
  cursorEnabled = on;
  rootEl.classList.toggle('neon-cursor', on);
  if (neonCursor) neonCursor.classList.toggle('visible', on);

  if (on) {
    // Снимаем pointer lock — курсор должен быть свободен, чтобы дотянуться до кнопок
    if (document.pointerLockElement) document.exitPointerLock();
  }
}

// Отслеживаем позицию мыши (даже когда курсор скрыт — на всякий случай)
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (neonCursor) {
    neonCursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
  }
}, { passive: true });

// Ctrl — переключение видимости курсора.
// Используем keydown/keyup, чтобы Ctrl не «залипал» при переключении окна.
window.addEventListener('keydown', (e) => {
  // e.ctrlKey === true на keydown Control
  if (e.key === 'Control' && !e.repeat) {
    setCursorEnabled(!cursorEnabled);
  }
});

window.addEventListener('keyup', (e) => {
  // На отпускании Ctrl тоже можно, но обычно хватает toggle по keydown.
  // Если хотите "пока зажат — скрыт", раскомментируйте:
  // if (e.key === 'Control') setCursorEnabled(false);
});

// При потере фокуса окна — вернуть стандартный курсор (иначе Ctrl может «застрять»)
window.addEventListener('blur', () => setCursorEnabled(false));

// ===== F4 — отладка: позиция игрока + поворот камеры =====
window.addEventListener('keydown', (e) => {
  if (e.code !== 'F4') return;
  e.preventDefault();   // иначе браузер может открыть что-то своё

  // Позиция игрока (мировые координаты)
  const p = player.getDebugInfo();
  console.log(
    `%c[F4] Позиция: [ x=${p.x.toFixed(2)}  y=${p.y.toFixed(2)}  z=${p.z.toFixed(2)} ] ` +
    `| Поворот: [` +
    `yaw=${p.yawDeg.toFixed(1)}°  ` +
    `pitch=${p.pitchDeg.toFixed(1)}°  ` +
    `roll=${p.rollDeg.toFixed(1)}° ]`,
    'color:#0ff; font-weight:bold;'
  );
});

</script>
