<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassiopeia Radio + Planet</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#000;}
  canvas{display:block;position:fixed;inset:0;z-index:0;}

  /* ===== UI поверх сцены: радио СВЕРХУ ===== */
  .ui{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;
    align-items:center;
    justify-content:flex-start;      /* радио прижато к верху */
    gap:24px;
    padding-top:32px;
    font-family:"Courier New",monospace;
    color:#33ff88;
    user-select:none;
    pointer-events:none;
  }
  .ui > *{pointer-events:auto;}

  /* ===== Большая зелёная кнопка ===== */
  .play-btn{
    width:180px;height:180px;
    border-radius:50%;
    border:2px solid #33ff88;
    background:radial-gradient(circle at 50% 40%,
      rgba(51,255,136,.28) 0%,
      rgba(4,26,14,.95) 70%);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 0 1px rgba(51,255,136,.35),
      0 0 30px rgba(0,255,136,.55),
      0 0 80px rgba(0,255,136,.25),
      inset 0 0 40px rgba(0,255,136,.18);
    transition:all .2s ease;
    padding:0;
  }
  .play-btn:hover{
    box-shadow:
      0 0 0 2px rgba(51,255,136,.7),
      0 0 46px rgba(0,255,136,.8),
      0 0 110px rgba(0,255,136,.4),
      inset 0 0 60px rgba(0,255,136,.3);
  }
  .play-btn:active{transform:scale(.96);}

  .play-btn::before{
    content:"";
    width:0;height:0;
    border-left:56px solid #a8ffd0;
    border-top:34px solid transparent;
    border-bottom:34px solid transparent;
    margin-left:14px;
    filter:drop-shadow(0 0 12px #00ff88);
    transition:all .2s ease;
  }
  .play-btn.playing::before{
    width:44px;height:64px;
    border:none;margin-left:0;
    background:
      linear-gradient(#a8ffd0,#a8ffd0) left/14px 100% no-repeat,
      linear-gradient(#a8ffd0,#a8ffd0) right/14px 100% no-repeat;
    filter:drop-shadow(0 0 12px #00ff88);
  }

  /* ===== Ряд громкости ===== */
  .volume-row{
    display:flex;align-items:center;gap:14px;
    width:min(270px,84vw);
  }

  .mute-btn{
    flex:0 0 auto;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    border:1px solid #33ff88;
    border-radius:4px;
    background:rgba(0,0,0,.35);
    cursor:pointer;padding:0;
    box-shadow:
      0 0 0 1px rgba(51,255,136,.2),
      inset 0 0 12px rgba(0,255,136,.1);
    transition:all .18s ease;
  }
  .mute-btn:hover{
    background:rgba(51,255,136,.12);
    box-shadow:
      0 0 0 1px rgba(51,255,136,.6),
      0 0 18px rgba(0,255,136,.45),
      inset 0 0 16px rgba(0,255,136,.2);
  }
  .mute-btn::before{
    content:"";
    width:9px;height:13px;
    background:#a8ffd0;
    clip-path:polygon(0 35%,35% 35%,75% 0,75% 100%,35% 65%,0 65%);
    filter:drop-shadow(0 0 4px #00ff88);
  }
  .mute-btn::after{
    content:"";
    position:absolute;left:50%;top:50%;
    width:14px;height:14px;
    transform:translate(-50%,-50%);
    border:2px solid #a8ffd0;
    border-left-color:transparent;
    border-top-color:transparent;
    border-bottom-color:transparent;
    border-radius:50%;
    opacity:.85;
    filter:drop-shadow(0 0 4px #00ff88);
  }
  .mute-btn.muted::after{
    width:0;height:0;border:none;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:2px solid #ff5555;
    transform:translate(-50%,-50%) rotate(-45deg);
    border-radius:0;opacity:1;
    filter:drop-shadow(0 0 4px #ff5555);
  }
  .mute-btn.muted::before{
    background:#ff5555;
    filter:drop-shadow(0 0 4px #ff5555);
  }

  .volume-slider{
    flex:1 1 auto;
    -webkit-appearance:none;appearance:none;
    height:10px;border-radius:2px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(51,255,136,.35);
    box-shadow:inset 0 0 8px rgba(0,255,136,.1);
    outline:none;cursor:pointer;margin:0;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:2px;
    background:#a8ffd0;
    box-shadow:0 0 10px #00ff88;
    cursor:pointer;transition:all .15s ease;
    margin-top:-1px;
  }
  .volume-slider::-webkit-slider-thumb:hover{
    background:#f4ffe8;box-shadow:0 0 18px #00ff88;
  }
  .volume-slider::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:2px;
    background:#a8ffd0;box-shadow:0 0 10px #00ff88;cursor:pointer;
  }
  .volume-slider::-moz-range-track{
    height:10px;border-radius:2px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(51,255,136,.35);
  }
  .volume-slider::-moz-range-progress{
    height:10px;border-radius:2px;
    background:linear-gradient(90deg,rgba(51,255,136,.35),#33ff88);
    box-shadow:0 0 8px rgba(0,255,136,.6);
  }

  .volume-value{
    flex:0 0 auto;min-width:40px;text-align:right;
    font-size:13px;letter-spacing:2px;color:#a8ffd0;
    text-shadow:0 0 6px rgba(0,255,136,.6);
    font-variant-numeric:tabular-nums;
  }

  /* ===== Тонкая кнопка-ссылка на сайт радио ===== */
.station-link{
  display:inline-block;
  padding:6px 16px;
  font-family:"Courier New",monospace;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#a8ffd0;
  text-decoration:none;
  border:1px solid rgba(51,255,136,.5);
  border-radius:4px;
  background:rgba(0,0,0,.35);
  box-shadow:
    0 0 0 1px rgba(51,255,136,.15),
    inset 0 0 10px rgba(0,255,136,.08);
  text-shadow:0 0 6px rgba(0,255,136,.6);
  transition:all .18s ease;
  white-space:nowrap;
}
.station-link:hover{
  color:#eafff2;
  background:rgba(51,255,136,.12);
  border-color:#33ff88;
  box-shadow:
    0 0 0 1px rgba(51,255,136,.6),
    0 0 18px rgba(0,255,136,.45),
    inset 0 0 14px rgba(0,255,136,.2);
}
.station-link:active{
  transform:scale(.97);
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- UI: радио сверху -->
<div class="ui">
  <audio id="radio-audio" preload="none" crossorigin="anonymous">
    <source src="https://stream.cassiopeia-station.ru:5015/stream" type="audio/mpeg">
  </audio>

  <button id="play-toggle" class="play-btn" aria-label="Play / Stop"></button>

  <div class="volume-row">
    <button id="mute-toggle" class="mute-btn" aria-label="Mute"></button>
    <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
    <span id="volume-value" class="volume-value">70%</span>
  </div>

  <a id="station-link" class="station-link"
   href="https://cassiopeia-station.ru/"
   target="_blank" rel="noopener noreferrer">
  Радио «Cassiopeia Station»
  </a>
</div>

<script src="./planet.js"></script>

<script type="module">
import * as THREE from "three";
window.THREE = THREE;

import { EffectComposer }  from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass }      from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ============================================================
   ВСТАВЬТЕ СЮДА ВАШ planet.js ЦЕЛИКОМ
   ============================================================ */
// >>>>>> PLANET.JS BEGIN <<<<<<

// ... (сюда копируете содержимое planet.js без изменений) ...

// >>>>>> PLANET.JS END <<<<<<

/* ============================================================
   СЦЕНА
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
// Туман сильно уменьшен — иначе на больших dist он «съедал» планету.
scene.fog = new THREE.FogExp2(0x02040a, 0.000015);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.01, 2000
);

/* ---- Звёзды на фоне ---- */
{
  const g = new THREE.BufferGeometry();
  const N = 3000;
  const arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r  = 20000 + Math.random() * 40000;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    arr[i*3+0] = r * Math.sin(ph) * Math.cos(th);
    arr[i*3+1] = r * Math.cos(ph);
    arr[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  const m = new THREE.PointsMaterial({
    color:0xffffff, size:60, sizeAttenuation:true,
    transparent:true, opacity:0.85, depthWrite:false,
  });
  scene.add(new THREE.Points(g, m));
}

/* ---- Bloom ---- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.9, 0.7, 0.82
);
composer.addPass(bloom);

/* ============================================================
   ЗВЕЗДА-ИСТОЧНИК СВЕТА
   ============================================================ */
const STAR_POS   = new THREE.Vector3(-4000, 3500, -3500);
const STAR_LIGHT = new THREE.Color(1.0, 0.95, 0.85);

{
  const starMesh = new THREE.Mesh(
    new THREE.SphereGeometry(120, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff2c8 })
  );
  starMesh.position.copy(STAR_POS);
  scene.add(starMesh);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(260, 32, 32),
    new THREE.MeshBasicMaterial({
      color:0xffe08a, transparent:true, opacity:0.18,
      blending:THREE.AdditiveBlending, depthWrite:false,
    })
  );
  halo.position.copy(STAR_POS);
  scene.add(halo);

  const point = new THREE.PointLight(0xfff2c8, 1.6, 0, 0);
  point.position.copy(STAR_POS);
  scene.add(point);
  scene.add(new THREE.AmbientLight(0x223044, 0.35));
}

/* ============================================================
   ОДНА СЛУЧАЙНАЯ ПЛАНЕТА
   ============================================================ */
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeFakeStar(seed) {
  const economies = ["Industrial","Mining","Agricultural","Refinery","High-Tech","Tourism"];
  const rng = mulberry32(seed);
  return {
    id: (seed >>> 0) & 0x7fffffff,
    seed: seed >>> 0,
    name: "STAR-" + ((seed >>> 0) % 9999).toString().padStart(4, "0"),
    economy: economies[Math.floor(rng() * economies.length)],
    tech: 1 + Math.floor(rng() * 15),
    danger: rng(),
    population: Math.floor(rng() * 5_000_000_000),
  };
}

let currentHandle = null;

function spawnPlanet() {
  if (currentHandle) {
    scene.remove(currentHandle.mesh);
    PLANET.dispose(currentHandle);
    currentHandle = null;
  }

  const seed     = (Math.random() * 0xffffffff) >>> 0;
  const fakeStar = makeFakeStar(seed);

  /* ---- Планета в мировом начале координат ---- */
  const handle = PLANET.generate(fakeStar, 0, {
    position:       new THREE.Vector3(0, 0, 0),
    starPosition:   STAR_POS,
    starLightColor: STAR_LIGHT,
    textureSize:    512,
    seed,
  });

  const r = handle.params.radius;

  /* ---- Смещаем САМУ ПЛАНЕТУ вниз по мировым Y ----
     Это надёжнее, чем играть с lookAt камеры. */
  // Насколько ниже камеры должна быть планета:
  // -r * 0.55 → верхний край планеты примерно в нижней трети экрана
  // Увеличивайте по модулю (например, -r * 0.75), чтобы спрятать сильнее.
  // Уменьшайте (например, -r * 0.35), чтобы показать больше.
  handle.mesh.position.set(0, -r * 0.55, 500);

  /* ---- Ориентация ---- */
  const rng = mulberry32(seed ^ 0x9e3779b1);
  const tiltZ = (rng() - 0.5) * 0.2;
  const tiltY = (rng() - 0.5) * 0.2;
  handle.mesh.rotation.set(0, tiltY, tiltZ);

  scene.add(handle.mesh);
  currentHandle = handle;

  /* ---- Камера: смотрит почти горизонтально на уровень «чуть выше планеты» ---- */
  camera.position.set(0, r * 0.35, r * 3.2);
  camera.lookAt(0, r * 0.35, 0);   // взгляд горизонтальный, без задирания

  bloom.strength  = 0.9;
  bloom.radius    = 0.7;
  bloom.threshold = 0.82;

  console.log("[planet] params:", handle.params,
              "position.y =", handle.mesh.position.y.toFixed(1),
              "radius =", r.toFixed(1));
}

/* ============================================================
   ЛЕТЯЩИЕ НА КАМЕРУ ЗВЁЗДЫ — НА ВСЁ ОКНО БРАУЗЕРА
   ============================================================ */
const warpStars = (() => {
  const COUNT   = 900;
  const Z_NEAR  = 1.0;       // ближняя граница в пространстве камеры (перед камерой)
  const Z_FAR   = 90.0;      // дальняя граница
  const SIZE    = 0.9;       // размер точки

  const positions = new Float32Array(COUNT * 3);
  const speeds    = new Float32Array(COUNT);   // единиц/сек по Z

  // Заполняем X/Y по полю зрения на глубине z (чтобы покрыть весь экран)
  function randomXY(z) {
    const vHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * z;
    const hHalf = vHalf * camera.aspect;
    return {
      x: (Math.random() * 2 - 1) * hHalf * 1.05,
      y: (Math.random() * 2 - 1) * vHalf * 1.05,
    };
  }

  function resetStar(i, randomZ = true) {
    const z = randomZ
      ? Z_FAR - Math.random() * (Z_FAR - Z_NEAR)
      : Z_FAR - Math.random() * 3.0;    // спавним чуть ближе дальнего края
    const { x, y } = randomXY(z);
    positions[i * 3 + 0] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = -z;          // в пространстве камеры -Z = вперёд
    speeds[i] = 8 + Math.random() * 22; // единиц/сек (к камере)
  }

  for (let i = 0; i < COUNT; i++) resetStar(i, true);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: 0xaad4ff,
    size: SIZE,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    depthTest: false,                // чтобы звёзды не резались планетой
    blending: THREE.AdditiveBlending,
  });

  // Добавляем в отдельную группу, которую каждый кадр ставим на камеру
  const group = new THREE.Group();
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  group.add(points);
  scene.add(group);

  // Трейлы
  const trailGeo = new THREE.BufferGeometry();
  const trailPos = new Float32Array(COUNT * 6);
  trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPos, 3));
  const trailMat = new THREE.LineBasicMaterial({
    color: 0x88bbff,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
  });
  const trails = new THREE.LineSegments(trailGeo, trailMat);
  trails.frustumCulled = false;
  group.add(trails);

  function update(dt) {
    // Группа всегда совпадает с камерой — звёзды живут в её локальной системе
    group.position.copy(camera.position);
    group.quaternion.copy(camera.quaternion);

    const p = geo.attributes.position.array;
    const t = trailGeo.attributes.position.array;

    for (let i = 0; i < COUNT; i++) {
      const ix = i * 3;

      // Двигаем к камере: -Z в локальных координатах камеры = вперёд,
      // значит увеличиваем Z (становится менее отрицательным)
      p[ix + 2] += speeds[i] * dt;

      // Хвост — точка чуть позади (дальше по -Z)
      t[i * 6 + 0] = p[ix + 0];
      t[i * 6 + 1] = p[ix + 1];
      t[i * 6 + 2] = p[ix + 2] - Math.min(3.0, speeds[i] * dt * 8);
      t[i * 6 + 3] = p[ix + 0];
      t[i * 6 + 4] = p[ix + 1];
      t[i * 6 + 5] = p[ix + 2];

      // Пролетела за камеру — респавним у дальней границы
      if (p[ix + 2] > -Z_NEAR) {
        const z = Z_FAR - Math.random() * 3.0;
        const { x, y } = randomXY(z);
        p[ix + 0] = x;
        p[ix + 1] = y;
        p[ix + 2] = -z;
        speeds[i] = 8 + Math.random() * 22;
        // обнуляем хвост, чтобы не было длинной линии через весь экран
        t[i * 6 + 0] = t[i * 6 + 3] = p[ix + 0];
        t[i * 6 + 1] = t[i * 6 + 4] = p[ix + 1];
        t[i * 6 + 2] = t[i * 6 + 5] = p[ix + 2];
      }
    }

    geo.attributes.position.needsUpdate = true;
    trailGeo.attributes.position.needsUpdate = true;
  }

  // При ресайзе пересчитываем X/Y под новый аспект (иначе звёзды "сползут")
  function handleResize() {
    const p = geo.attributes.position.array;
    for (let i = 0; i < COUNT; i++) {
      const z = -p[i * 3 + 2];       // положительная глубина
      const { x, y } = randomXY(z);
      p[i * 3 + 0] = x;
      p[i * 3 + 1] = y;
    }
    geo.attributes.position.needsUpdate = true;
  }

  return { update, handleResize, group, points, trails };
})();

/* ============================================================
   ЦИКЛ
   ============================================================ */
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1);

  warpStars.update(dt);

  if (currentHandle) {
    /* Вращение вокруг оси X — «навстречу» смотрящему (+Z).
       Положительный знак = верх планеты катится к камере. */
    currentHandle.mesh.rotation.x += dt * (currentHandle.params.spinSpeed * 0.6);
  }

  composer.render();
}

/* ============================================================
   РЕСАЙЗ + радио
   ============================================================ */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---- Радио ---- */
const audio   = document.getElementById('radio-audio');
const btnPlay = document.getElementById('play-toggle');
const btnMute = document.getElementById('mute-toggle');
const slider  = document.getElementById('volume-slider');
const valEl   = document.getElementById('volume-value');

btnPlay.addEventListener('click', () => {
  if (audio.paused) {
    audio.play().catch(err => console.error('Ошибка воспроизведения:', err));
  } else {
    audio.pause();
  }
});
audio.addEventListener('play',  () => btnPlay.classList.add('playing'));
audio.addEventListener('pause', () => btnPlay.classList.remove('playing'));

let lastVolume = 0.7;
audio.volume = lastVolume;
slider.value = String(Math.round(lastVolume * 100));
valEl.textContent = slider.value + '%';

slider.addEventListener('input', () => {
  const v = Number(slider.value) / 100;
  audio.volume = v;
  valEl.textContent = slider.value + '%';
  if (v > 0 && audio.muted) {
    audio.muted = false;
    btnMute.classList.remove('muted');
  }
  if (v > 0) lastVolume = v;
});

btnMute.addEventListener('click', () => {
  audio.muted = !audio.muted;
  btnMute.classList.toggle('muted', audio.muted);
  if (!audio.muted && audio.volume === 0) {
    audio.volume = lastVolume;
    slider.value = String(Math.round(lastVolume * 100));
    valEl.textContent = slider.value + '%';
  }
});

function paintTrack() {
  const pct = slider.value + '%';
  slider.style.background =
    `linear-gradient(90deg, #33ff88 0%, #33ff88 ${pct}, rgba(0,0,0,.4) ${pct}, rgba(0,0,0,.4) 100%)`;
}
slider.addEventListener('input', paintTrack);
paintTrack();

/* ---- Старт ---- */
spawnPlanet();
tick();


window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  warpStars.handleResize();          // ← добавить
});
