<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>РЕДАКТОР</title>
<link rel="icon" type="image/png" href="../../../res/favicon-64.png" sizes="64x64">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #ddd; }
  #app { position: fixed; inset: 0; display: flex; }

  /* ============================================================
     ЛЕВАЯ ПАНЕЛЬ — ДЕРЕВО НОДОВ
     ============================================================ */
  #left-panel {
    width: 280px; min-width: 200px; max-width: 50vw;
    background: #181a1f; border-right: 1px solid #2a2d34;
    display: flex; flex-direction: column;
    resize: horizontal; overflow: hidden;
    --tree-scale: 1;
  }
  .section-head {
    margin: 0; padding: 8px 12px; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; color: #8fa8c8;
    border-bottom: 1px solid #2a2d34; background: #1d2027;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none; flex: 0 0 auto;
  }
  .section-head .hint { font-size: 10px; color: #556; text-transform: none; letter-spacing: 0; }

  #tree {
    flex: 1 1 auto; overflow: auto; padding: 6px 0;
    font-size: calc(13px * var(--tree-scale));
    line-height: calc(1.5 * var(--tree-scale));
  }

  /* ============================================================
     ЦЕНТР — ВЬЮПОРТ
     ============================================================ */
  #viewport { flex: 1 1 auto; position: relative; min-width: 200px; }
  #viewport canvas { display: block; }

  /* ============================================================
     ПРАВАЯ ПАНЕЛЬ — ТРАНСФОРМАЦИИ (70%) + ДЕТАЛИ (30%)
     ============================================================ */
  #right-panel {
    width: 340px; min-width: 260px; max-width: 60vw;
    background: #181a1f; border-left: 1px solid #2a2d34;
    display: flex; flex-direction: column;
    resize: horizontal; overflow: hidden;
  }

  /* Трансформации: 70% */
  #transform-wrap {
    flex: 7 1 0;
    min-height: 120px;
    display: flex; flex-direction: column;
    border-bottom: 1px solid #2a2d34;
    overflow: hidden;
  }
  #transform-panel { flex: 1 1 auto; overflow: auto; padding: 8px 12px; }

  /* Детали: 30% */
  #params-wrap {
    flex: 3 1 0;
    min-height: 80px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #params { flex: 1 1 auto; overflow: auto; padding: 8px 12px; }

  /* Контейнер всех трансформаций */
  #transform-panel {
    padding: 8px 12px;
  }

   /* --- ШАПКА: X Y Z --- */
  .xform-header {
    display: grid;
    grid-template-columns: 70px 1fr 1fr 1fr;   /* метка | X | Y | Z */
    gap: 4px 6px;
    align-items: center;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid #2a2d34;
  }
  .xform-header .label  { color: #8fa8c8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .xform-header .axis-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .xform-header .axis-x { color: #ff6060; }
  .xform-header .axis-y { color: #60ff60; }
  .xform-header .axis-z { color: #6080ff; }

  /* --- СТРОКА ТРАНСФОРМА: Position / Rotation / Scale --- */
  .xform-section {
    display: grid;
    grid-template-columns: 80px 1fr 1fr 1fr;
    gap: 6px 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .xform-section .label {
    color: #8fa8c8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .xform-section input[type=number] {
    width: 100%; box-sizing: border-box;
    background: #1d2027; color: #dde;
    border: 1px solid #2a2d34; border-radius: 4px;
    padding: 6px 8px; font-size: 14px; font-family: inherit;
    text-align: right;
    min-height: 28px;
  }
  .xform-section input[type=number]:focus { outline: none; border-color: #5aa0e0; }

  /* ✅ УВЕЛИЧЕННЫЕ СПИННЕРЫ (стрелки вверх/вниз) */
  .xform-section input[type=number]::-webkit-inner-spin-button,
  .xform-section input[type=number]::-webkit-outer-spin-button {
    opacity: 1;
    height: 28px;
    width: 18px;
    cursor: pointer;
  }

  /* Для Firefox — спиннеры там всегда видимы, но увеличим сам инпут */
  .xform-section input[type=number] {
    appearance: auto;
    -moz-appearance: number-input;
  }

.xform-empty {
  color: #667;
  font-size: 13px;      /* было 12px */
  padding: 10px 0;      /* было 6px 0 */
  line-height: 1.5;
}

  /* ---------- Строки параметров ---------- */
  .param-row { margin-bottom: 10px; }
  .param-row label { display: flex; justify-content: space-between; font-size: 12px; color: #aab; margin-bottom: 3px; }
  .param-row .val { color: #e8a55a; font-variant-numeric: tabular-nums; }
  .param-row input[type=range] { width: 100%; accent-color: #5aa0e0; }

  /* ---------- Ноды дерева ---------- */
  .node { padding: 2px 12px; cursor: pointer; white-space: nowrap; border-left: 3px solid transparent; }
  .node:hover { background: #22262e; }
  .node.selected { background: #1f3a52; border-left-color: #5aa0e0; color: #fff; }
  .node .depth { color: #556; margin-right: 4px; }
  .node .type { color: #6a8; font-size: 0.85em; margin-left: 6px; }

  /* ---------- Кнопки ---------- */
  #buttons {
    padding: 10px 12px; border-top: 1px solid #2a2d34;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: #16181d; flex: 0 0 auto;
  }
  #buttons .full { grid-column: 1 / -1; }
  button {
    padding: 8px 10px; background: #2a3a52; color: #dde;
    border: 1px solid #3a4d6a; border-radius: 4px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  button:hover { background: #35496a; }
  button.primary { background: #2e6a3e; border-color: #3f8a52; color: #eaffea; }
  button.primary:hover { background: #3a8050; }

  /* ---------- Вьюер ---------- */
  #viewer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  #viewer-overlay.open { display: flex; }
  #viewer-box {
    width: 80vw; max-width: 1000px; height: 75vh;
    background: #0d0f12; border: 1px solid #2a2d34; border-radius: 6px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #viewer-head { padding: 8px 12px; background: #1d2027; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  #viewer-head button { flex: none; padding: 4px 12px; }
  #viewer-content {
    flex: 1; margin: 0; padding: 12px; overflow: auto;
    font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.5;
    color: #c8e0c8; white-space: pre; background: #0a0c0e;
  }
</style>
</head>
<body>

<div id="app">
  <!-- ЛЕВАЯ ПАНЕЛЬ: ДЕРЕВО -->
  <div id="left-panel">
    <h3 class="section-head">Дерево нодов <span class="hint">Ctrl+колесо</span></h3>
    <div id="tree"></div>
  </div>

  <!-- ЦЕНТР: ВЬЮПОРТ -->
  <div id="viewport"></div>

  <!-- ПРАВАЯ ПАНЕЛЬ: ТРАНСФОРМАЦИИ (70%) + ДЕТАЛИ (30%) + КНОПКИ -->
  <div id="right-panel">
    <div id="transform-wrap">
      <h3 class="section-head">Трансформации</h3>
      <div id="transform-panel">
        <div class="xform-empty">Выберите ноду в дереве…</div>
      </div>
    </div>

    <div id="params-wrap">
      <h3 class="section-head">Детали</h3>
      <div id="params">
        <div class="xform-empty">Выберите деталь в дереве…</div>
      </div>
    </div>

    <div id="buttons">
      <button id="btn-rotate-y">Поворот Y</button>
      <button id="btn-rotate-z">Поворот Z</button>
      <button id="btn-scale-minus">Масштаб −</button>
      <button id="btn-scale-plus">Масштаб +</button>
      <button id="btn-compile" class="primary full">Компилировать</button>
      <button id="btn-load" class="full">Загрузить .js…</button>
    </div>
  </div>
</div>

<!-- Вьюер -->
<div id="viewer-overlay">
  <div id="viewer-box">
    <div id="viewer-head">
      <span>virtual://gun.compile.js</span>
      <div style="display:flex; gap:8px;">
        <button id="viewer-save" class="primary">Сохранить…</button>
        <button id="viewer-close">Закрыть</button>
      </div>
    </div>
    <pre id="viewer-content"></pre>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "app/": "./?v=0.4.7.2/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  window.THREE = THREE;
  window.dispatchEvent(new Event("three-ready"));
</script>

<script src="../snd/etc-sound-lib.js"></script>

<script type="module">
import * as THREE from "three";
import { OrbitControls    } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment  } from "three/addons/environments/RoomEnvironment.js";
import { SelectionOutline } from "./app/selection-outline.js";
import { SelectionSync    } from "./app/selection-sync.js";
import { TransformGizmo   } from "./app/transform-gizmo.js";

import * as COMPILED from "./app/gun.compile.js";


// ============================================================
// Сцена
// ============================================================
const viewport = document.getElementById('viewport');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131a);

const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.01, 100);
camera.position.set(1.4, 0.9, 1.6);

const outline = new SelectionOutline(renderer, scene, camera, viewport, {
  color: 0xff2a2a, edgeStrength: 6, edgeThickness: 1.5,
});

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
const envMap = envRT.texture;
scene.environment = envMap;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enablePan = false;
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.update();

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x302520, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 5, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffd9b0, 1.0);
fill.position.set(-4, 2, -3);
scene.add(fill);

// ============================================================
// Сетка + оси XYZ
// ============================================================
const GRID_Y = -0.5;
const AXES_Y_LIFT = 0.003;
const AXIS_LEN = 1.0;
const AXIS_RADIUS = 0.0009;

const grid = new THREE.GridHelper(6, 24, 0x2a3a4a, 0x1a2530);
grid.position.y = GRID_Y;
scene.add(grid);

function makeAxis(color, dir, length = AXIS_LEN, radius = AXIS_RADIUS) {
  const mat = new THREE.MeshBasicMaterial({
    color, depthWrite: false, depthTest: false, transparent: true, opacity: 1.0,
  });
  const geo = new THREE.CylinderGeometry(radius, radius, length, 6, 1);
  const mesh = new THREE.Mesh(geo, mat);
  if (dir.x !== 0) mesh.rotation.z = -Math.PI / 2 * Math.sign(dir.x);
  else if (dir.z !== 0) mesh.rotation.x = Math.PI / 2 * Math.sign(dir.z);
  const half = dir.clone().multiplyScalar(length / 2);
  mesh.position.copy(half);
  mesh.position.y += GRID_Y + AXES_Y_LIFT;
  mesh.renderOrder = 1;
  return mesh;
}
scene.add(makeAxis(0xff3030, new THREE.Vector3(1, 0, 0)));
scene.add(makeAxis(0x30ff30, new THREE.Vector3(0, 1, 0)));
scene.add(makeAxis(0x3080ff, new THREE.Vector3(0, 0, 1)));

function makeAxisArrow(color, dir, length = AXIS_LEN) {
  const r = 0.008, h = 0.06;
  const g = new THREE.ConeGeometry(r, h, 4);
  const m = new THREE.MeshBasicMaterial({ color, depthWrite: false });
  const cone = new THREE.Mesh(g, m);
  if (dir.x !== 0) cone.rotation.z = -Math.PI / 2 * Math.sign(dir.x);
  else if (dir.z !== 0) cone.rotation.x = Math.PI / 2 * Math.sign(dir.z);
  cone.position.copy(dir).multiplyScalar(length);
  cone.position.y += GRID_Y + AXES_Y_LIFT;
  cone.renderOrder = 1;
  return cone;
}
scene.add(makeAxisArrow(0xff3030, new THREE.Vector3(1, 0, 0)));
scene.add(makeAxisArrow(0x30ff30, new THREE.Vector3(0, 1, 0)));
scene.add(makeAxisArrow(0x3080ff, new THREE.Vector3(0, 0, 1)));

// ... renderer, scene, camera, outline, envMap, controls, lights, grid, axes ...

// ============================================================
// ФАБРИКА: собрать «gun» из скомпилированного модуля
// ============================================================
function createGunFromCompiled(mod, envMap, gunRoot) {
  const { GUN_PARAMS, buildGun, applyParams } = mod;

  const params = {};
  for (const [key, meta] of Object.entries(GUN_PARAMS || {})) {
    params[key] = {
      value: meta.value,
      min:   meta.min   ?? 0,
      max:   meta.max   ?? (meta.value * 2 || 1),
      step:  meta.step  ?? 0.001,
      label: meta.label ?? key,
    };
  }

  const model = buildGun(envMap);
  model.userData.fromFile = true;
  model.position.set(0, 0, 0);
  model.rotation.set(0, 0, 0);

  return {
    model,
    params,
    _compiledApplyParams: applyParams,
    setOverride() {},
    applyParams() {
      if (this._compiledApplyParams) this._compiledApplyParams(this.model, this.params);
    },
    update() {},
  };
}

// ============================================================
// Ружьё
// ============================================================
const gunRoot = new THREE.Group();
scene.add(gunRoot);

const gun = createGunFromCompiled(COMPILED, envMap, gunRoot);
gunRoot.add(gun.model);

// ... дальше sync, gizmo, всё остальное ...


gun.model.position.set(0, 0, 0);
gun.model.rotation.set(0, 0, 0);

const gizmo = new TransformGizmo(scene, {
  size: 0.22,        // чуть больше мушки, но меньше ствола
  axisRadius: 0.001,
});

// ============================================================
// SelectionSync — путь выбранного объекта + обводка
// ============================================================
const sync = new SelectionSync(gun.model, {
  onSelect: (obj) => {
    gizmo.attach(obj === gun.model ? null : obj);   // ← корень без гизмо
    outline.select(obj);
    highlightTreeRow(obj);
  },
  onClear: () => {
    outline.clear();
    unhighlightTreeRow();
    gizmo.detach();
  },
  onResync: (fresh) => {
    gizmo.attach(fresh === gun.model ? null : fresh);
    outline.select(fresh);
    highlightTreeRow(fresh);

  },
  onResyncFailed: () => {
    outline.clear();
    unhighlightTreeRow();
    gizmo.detach();
  },
});

// ============================================================
// Зум вьюпорта
// ============================================================
const ZOOM_MIN = 0.25, ZOOM_MAX = 6.0, ZOOM_STEP = 1.25, WHEEL_SENSITIVITY = 0.0025;
const zoomState = { current: 1.0, target: 1.0, speed: 10.0 };
function setTargetZoom(v) { zoomState.target = THREE.MathUtils.clamp(v, ZOOM_MIN, ZOOM_MAX); }
function addTargetZoom(f) { setTargetZoom(zoomState.target * f); }

document.getElementById('btn-scale-plus').addEventListener('click', () => addTargetZoom(ZOOM_STEP));
document.getElementById('btn-scale-minus').addEventListener('click', () => addTargetZoom(1 / ZOOM_STEP));

viewport.addEventListener('wheel', (e) => {
  e.preventDefault(); e.stopPropagation();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  else if (e.deltaMode === 2) dy *= 100;
  dy = THREE.MathUtils.clamp(dy, -100, 100);
  addTargetZoom(Math.exp(-dy * WHEEL_SENSITIVITY));
}, { passive: false });

controls.enableZoom = false;

// ============================================================
// ДЕРЕВО НОДОВ
// ============================================================
const treeEl = document.getElementById('tree');
const paramsEl = document.getElementById('params');
const transformPanel = document.getElementById('transform-panel');

function buildTree() {
  treeEl.innerHTML = '';
  treeEl.appendChild(makeNodeRow('Ружьё', gun.model, 0, 'group', true));
  gun.model.children.forEach(child => {
    if (child.isGroup) {
      treeEl.appendChild(makeNodeRow(child.name || child.type, child, 1, 'group'));
      child.children.forEach(gc => {
        treeEl.appendChild(makeNodeRow(gc.name || gc.type, gc, 2, gc.type));
      });
    } else {
      treeEl.appendChild(makeNodeRow(child.name || child.type, child, 1, child.type));
    }
  });
}

function makeNodeRow(name, obj, depth, type, root = false) {
  const row = document.createElement('div');
  row.className = 'node';
  row.dataset.uuid = obj.uuid;
  row.innerHTML = `<span class="depth">${'│ '.repeat(depth)}${root ? '◉' : '•'}</span>${name}<span class="type">${type}</span>`;
  row.addEventListener('click', () => selectNode(obj, row));
  return row;
}

function highlightTreeRow(obj) {
  document.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
  const row = [...treeEl.querySelectorAll('.node')].find(n => n.dataset.uuid === obj.uuid);
  if (row) row.classList.add('selected');
}
function unhighlightTreeRow() {
  document.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
}

function selectNode(obj, row) {
  if (row) {
    document.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
    row.classList.add('selected');
  }
  sync.select(obj);
  renderTransformFor(obj);
  renderParamsFor(obj);
}

// ============================================================
// СУБ-ОКНО ТРАНСФОРМАЦИЙ (position / rotation / scale)
// ============================================================
function renderTransformFor(obj) {
  transformPanel.innerHTML = '';

  if (!obj || obj === gun.model) {
    transformPanel.innerHTML = `<div class="xform-empty">Трансформации корня редактируются в коде. Выберите дочернюю ноду.</div>`;
    return;
  }

  // ===== ШАПКА X Y Z (рисуется ОДИН раз) =====
  const header = document.createElement('div');
  header.className = 'xform-header';
  header.innerHTML = `
    <div class="label"></div>
    <div class="axis-label axis-x">X</div>
    <div class="axis-label axis-y">Y</div>
    <div class="axis-label axis-z">Z</div>
  `;
  transformPanel.appendChild(header);

  // ===== Хелпер для строки трансформации =====
  // принимает: title, объект с геттерами/сеттерами по x/y/z, onChange, step
  const makeSection = (title, vector, onChange, step = 0.01) => {
    const row = document.createElement('div');
    row.className = 'xform-section';

    // левая метка
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = title;
    row.appendChild(label);

    // три поля
    ['x', 'y', 'z'].forEach((axis) => {
      const input = document.createElement('input');
      input.type = 'number';
      input.step = String(step);
      input.value = Number(vector[axis]).toFixed(3);

      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!isFinite(v)) return;
        vector[axis] = v;
        onChange();
      });
      row.appendChild(input);
    });

    return row;
  };

  // Position
  transformPanel.appendChild(makeSection('Position', obj.position, () => {
    saveTransformOverride(obj);
  }, 0.01));

  // Rotation° (в градусах)
  const rotDeg = {
    get x() { return THREE.MathUtils.radToDeg(obj.rotation.x); },
    get y() { return THREE.MathUtils.radToDeg(obj.rotation.y); },
    get z() { return THREE.MathUtils.radToDeg(obj.rotation.z); },
    set x(v) { obj.rotation.x = THREE.MathUtils.degToRad(v); },
    set y(v) { obj.rotation.y = THREE.MathUtils.degToRad(v); },
    set z(v) { obj.rotation.z = THREE.MathUtils.degToRad(v); },
  };
  transformPanel.appendChild(makeSection('Rotation°', rotDeg, () => {
    saveTransformOverride(obj);
  }, 1.0));

  // Scale
  transformPanel.appendChild(makeSection('Scale', obj.scale, () => {
    saveTransformOverride(obj);
  }, 0.05));
}

function saveTransformOverride(obj) {
  const name = obj.name;
  if (!name || !gun.setOverride) return;
  gun.setOverride(name, {
    p: obj.position.clone(),
    r: obj.rotation.clone(),
    s: obj.scale.clone(),
  });
}

// ============================================================
// СУБ-ОКНО ДЕТАЛЕЙ — только параметры выбранной ноды
// ============================================================
/**
 * Маппинг «имя группы → список ключей параметров».
 * Если выбрана нода внутри группы — показываем параметры её родительской группы.
 * Если выбран корень — показываем все параметры.
 */
const PARAMS_BY_GROUP = {
  barrels:  ['barrelLen', 'barrelRadius', 'barrelSpread', 'ribThick'],
  receiver: ['receiverW', 'receiverH', 'receiverL'],
  stock:    ['stockNeckW', 'stockNeckL'],
  forend:   ['forendW', 'forendH', 'forendL'],
  sights:   ['sightSize', 'barrelRadius'],
  trigger:  [],
};

function resolveGroupName(obj) {
  // Идём вверх по parent дочерних групп gun.model
  let cur = obj;
  while (cur && cur !== gun.model) {
    if (cur.parent === gun.model) {
      return cur.name || null;   // имя топ-уровневой группы
    }
    cur = cur.parent;
  }
  return null;
}

function renderParamsFor(obj) {
  paramsEl.innerHTML = '';

  if (!obj) {
    paramsEl.innerHTML = `<div class="xform-empty">Выберите деталь в дереве…</div>`;
    return;
  }

  // Корень — показываем ВСЕ параметры
  let keys;
  if (obj === gun.model) {
    keys = Object.keys(gun.params);
  } else {
    const groupName = resolveGroupName(obj);
    keys = groupName ? (PARAMS_BY_GROUP[groupName] || []) : [];
  }

  if (!keys.length) {
    paramsEl.innerHTML = `<div class="xform-empty">У детали «${obj.name || obj.type}» нет редактируемых параметров.</div>`;
    return;
  }

  keys.forEach(key => {
    const p = gun.params[key];
    if (!p) return;
    const row = document.createElement('div');
    row.className = 'param-row';
    row.innerHTML = `
      <label>${p.label}<span class="val">${p.value.toFixed(3)}</span></label>
      <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}" />
    `;
    const input = row.querySelector('input');
    const valEl = row.querySelector('.val');

    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      p.value = v;
      valEl.textContent = v.toFixed(3);

      if (gun.model.userData.fromFile && gun._compiledApplyParams) {
        gun._compiledApplyParams(gun.model, gun.params);
      } else {
        gun.applyParams();
      }

      buildTree();
      sync.resync();
      renderTransformFor(sync.getSelected());
      syncSlidersForKey(key);
    });

    paramsEl.appendChild(row);
  });
}

function syncSlidersForKey(key) {
  const p = gun.params[key];
  if (!p) return;
  paramsEl.querySelectorAll('.param-row').forEach(row => {
    const labelEl = row.querySelector('label');
    const input = row.querySelector('input');
    const valEl = row.querySelector('.val');
    if (!input || !labelEl) return;
    if (labelEl.firstChild && labelEl.firstChild.textContent === p.label) {
      if (document.activeElement !== input) input.value = p.value;
      if (valEl) valEl.textContent = p.value.toFixed(3);
    }
  });
}

const TREE_SCALE_MIN = 0.7, TREE_SCALE_MAX = 1.4;
let treeScale = 1.0;
function applyTreeScale() { leftPanel.style.setProperty('--tree-scale', treeScale.toFixed(3)); }

// ============================================================
// Компиляция
// ============================================================
function compileGunSource() {
  const p = gun.params;

  // -------- Собираем материалы из gun.model --------
  const materialMap = new Map();   // uuid -> {varName, def}
  let matIdx = 0;

  const f = (n) => Number.isFinite(n) ? Number(n).toFixed(6) : '0';

  const registerMaterial = (mat) => {
    if (!mat) return 'null';
    if (materialMap.has(mat.uuid)) return materialMap.get(mat.uuid).varName;
    const varName = `mat_${matIdx++}`;
    const def = {
      name: mat.name || null,
      type: mat.type || 'MeshStandardMaterial',
      props: {},
    };
    if (mat.color?.isColor)      def.props.color = '0x' + mat.color.getHexString();
    if (mat.emissive?.isColor)   def.props.emissive = '0x' + mat.emissive.getHexString();
    for (const k of ['metalness', 'roughness', 'opacity', 'envMapIntensity']) {
      if (typeof mat[k] === 'number') def.props[k] = mat[k];
    }
    if (typeof mat.transparent === 'boolean') def.props.transparent = mat.transparent;
    if (typeof mat.depthWrite === 'boolean')  def.props.depthWrite = mat.depthWrite;
    if (typeof mat.depthTest === 'boolean')   def.props.depthTest  = mat.depthTest;
    if (typeof mat.side === 'number')         def.props.side       = mat.side;
    if (typeof mat.flatShading === 'boolean') def.props.flatShading = mat.flatShading;

    materialMap.set(mat.uuid, { varName, def });
    return varName;
  };

  // -------- Собираем геометрию --------
  const serializeGeometry = (g) => {
    const t = g.type;
    const pr = g.parameters || {};
    switch (t) {
      case 'BoxGeometry':
        return `new THREE.BoxGeometry(${f(pr.width)}, ${f(pr.height)}, ${f(pr.depth)})`;
      case 'CylinderGeometry':
        return `new THREE.CylinderGeometry(${f(pr.radiusTop)}, ${f(pr.radiusBottom)}, ${f(pr.height)}, ${pr.radialSegments|0}, ${pr.heightSegments|0})`;
      case 'SphereGeometry':
        return `new THREE.SphereGeometry(${f(pr.radius)}, ${pr.widthSegments|0}, ${pr.heightSegments|0})`;
      case 'ConeGeometry':
        return `new THREE.ConeGeometry(${f(pr.radius)}, ${f(pr.height)}, ${pr.radialSegments|0})`;
      case 'TorusGeometry':
        return `new THREE.TorusGeometry(${f(pr.radius)}, ${f(pr.tube)}, ${pr.radialSegments|0}, ${pr.tubularSegments|0}, ${f(pr.arc)})`;
      case 'PlaneGeometry':
        return `new THREE.PlaneGeometry(${f(pr.width)}, ${f(pr.height)})`;
      case 'CircleGeometry':
        return `new THREE.CircleGeometry(${f(pr.radius)}, ${pr.segments|0})`;
      default:
        return `/* ${t} не сериализован */ new THREE.BufferGeometry()`;
    }
  };

  // -------- Рекурсивный обход Object3D --------
  const modelLines = [];
  const serializeObject = (obj, varName) => {
    const children = obj.children.filter(c => !c.userData?.isHelper);
    children.forEach((child, i) => {
      const cv = `${varName}_${i}`;

      if (child.isGroup) {
        modelLines.push(`    const ${cv} = new THREE.Group();`);
        if (child.name) modelLines.push(`    ${cv}.name = ${JSON.stringify(child.name)};`);
        modelLines.push(`    ${cv}.position.set(${f(child.position.x)}, ${f(child.position.y)}, ${f(child.position.z)});`);
        modelLines.push(`    ${cv}.rotation.set(${f(child.rotation.x)}, ${f(child.rotation.y)}, ${f(child.rotation.z)});`);
        modelLines.push(`    ${cv}.scale.set(${f(child.scale.x)}, ${f(child.scale.y)}, ${f(child.scale.z)});`);
        serializeObject(child, cv);
        modelLines.push(`    ${varName}.add(${cv});`);
        return;
      }

      if (child.isMesh) {
        const mVar = registerMaterial(child.material);
        const geo = serializeGeometry(child.geometry);
        modelLines.push(`    const ${cv} = new THREE.Mesh(${geo}, ${mVar});`);
        if (child.name) modelLines.push(`    ${cv}.name = ${JSON.stringify(child.name)};`);
        modelLines.push(`    ${cv}.position.set(${f(child.position.x)}, ${f(child.position.y)}, ${f(child.position.z)});`);
        modelLines.push(`    ${cv}.rotation.set(${f(child.rotation.x)}, ${f(child.rotation.y)}, ${f(child.rotation.z)});`);
        modelLines.push(`    ${cv}.scale.set(${f(child.scale.x)}, ${f(child.scale.y)}, ${f(child.scale.z)});`);
        if (child.castShadow)    modelLines.push(`    ${cv}.castShadow = true;`);
        if (child.receiveShadow) modelLines.push(`    ${cv}.receiveShadow = true;`);
        modelLines.push(`    ${varName}.add(${cv});`);
      }
    });
  };

  serializeObject(gun.model, 'root');

  // -------- Собираем файл --------
  const L = [];
  L.push('// ============================================================');
  L.push('// PROCEDURAL GUN — полный снимок модели');
  L.push('// Сгенерировано: ' + new Date().toISOString());
  L.push('// ============================================================');
  L.push('');
  L.push('import * as THREE from "three";');
  L.push('');

  // -------- GUN_PARAMS --------
  L.push('// ============================================================');
  L.push('// ПАРАМЕТРЫ (используются для UI-редактирования)');
  L.push('// ============================================================');
  L.push('export const GUN_PARAMS = {');
  for (const [key, meta] of Object.entries(p)) {
    const parts = [`value: ${meta.value}`];
    if (typeof meta.min   === 'number') parts.push(`min: ${meta.min}`);
    if (typeof meta.max   === 'number') parts.push(`max: ${meta.max}`);
    if (typeof meta.step  === 'number') parts.push(`step: ${meta.step}`);
    if (typeof meta.label === 'string') parts.push(`label: ${JSON.stringify(meta.label)}`);
    L.push(`  ${key}: { ${parts.join(', ')} },`);
  }
  L.push('};');
  L.push('');

  // -------- MATERIALS --------
  L.push('// ============================================================');
  L.push('// МАТЕРИАЛЫ (создаются один раз на уровне модуля)');
  L.push('// ============================================================');
  for (const { varName, def } of materialMap.values()) {
    const ctor = `THREE.${def.type}`;
    L.push(`const ${varName} = new ${ctor}({`);
    for (const [k, v] of Object.entries(def.props)) {
      L.push(`  ${k}: ${typeof v === 'string' ? v : v},`);
    }
    L.push(`});`);
    if (def.name) L.push(`${varName}.name = ${JSON.stringify(def.name)};`);
    L.push('');
  }
  // экспортируем как объект для удобства
  L.push('export const MATERIALS = {');
  for (const { varName } of materialMap.values()) {
    L.push(`  ${varName},`);
  }
  L.push('};');
  L.push('');

  // -------- buildGun --------
  L.push('// ============================================================');
  L.push('// СБОРКА — возвращает THREE.Group с текущим состоянием');
  L.push('// ============================================================');
  L.push('export function buildGun(envMap = null) {');
  L.push('  const root = new THREE.Group();');
  L.push('  root.name = "gun";');
  L.push('');
  for (const line of modelLines) L.push(line);
  L.push('');
  L.push('  // опциональная подстановка envMap');
  L.push('  if (envMap) {');
  L.push('    root.traverse(o => {');
  L.push('      if (o.isMesh && o.material) {');
  L.push('        o.material.envMap = envMap;');
  L.push('        o.material.needsUpdate = true;');
  L.push('      }');
  L.push('    });');
  L.push('  }');
  L.push('  return root;');
  L.push('}');
  L.push('');

  // -------- applyParams --------
  L.push('// ============================================================');
  L.push('// ПРИМЕНЕНИЕ ПАРАМЕТРОВ — мутирует существующие меши');
  L.push('// (нужно для редактора: слайдеры двигают ПАРАМЕТРЫ, а не пересобирают всё)');
  L.push('// ============================================================');
  L.push('export function applyParams(root, params = GUN_PARAMS) {');
  L.push('  const P = params;');
  L.push('  const get = (k) => P[k]?.value ?? GUN_PARAMS[k]?.value;');
  L.push('  const r = (name) => root.getObjectByName(name);');
  L.push('');
  L.push('  // стволы');
  L.push('  const barrelL = r("barrelL"), barrelR = r("barrelR");');
  L.push('  const rib = r("rib");');
  L.push('  const muzzleL = r("muzzleL"), muzzleR = r("muzzleR");');
  L.push('  const barrelLen = get("barrelLen");');
  L.push('  const barrelRadius = get("barrelRadius");');
  L.push('  const spread = get("barrelSpread");');
  L.push('  if (barrelL) {');
  L.push('    barrelL.geometry.dispose();');
  L.push('    barrelL.geometry = new THREE.CylinderGeometry(barrelRadius, barrelRadius * 1.05, barrelLen, 16);');
  L.push('    barrelL.position.x = -spread;');
  L.push('  }');
  L.push('  if (barrelR) {');
  L.push('    barrelR.geometry.dispose();');
  L.push('    barrelR.geometry = new THREE.CylinderGeometry(barrelRadius, barrelRadius * 1.05, barrelLen, 16);');
  L.push('    barrelR.position.x = spread;');
  L.push('  }');
  L.push('  if (rib) {');
  L.push('    rib.geometry.dispose();');
  L.push('    rib.geometry = new THREE.BoxGeometry(0.028, get("ribThick"), barrelLen);');
  L.push('    rib.position.set(0, barrelRadius * 0.95, -0.95);');
  L.push('  }');
  L.push('  const zMuzzle = -0.95 - barrelLen / 2;');
  L.push('  if (muzzleL) { muzzleL.geometry.dispose(); muzzleL.geometry = new THREE.TorusGeometry(barrelRadius * 0.95, 0.006, 8, 16); muzzleL.position.set(-spread, 0, zMuzzle); }');
  L.push('  if (muzzleR) { muzzleR.geometry.dispose(); muzzleR.geometry = new THREE.TorusGeometry(barrelRadius * 0.95, 0.006, 8, 16); muzzleR.position.set(spread, 0, zMuzzle); }');
  L.push('');
  L.push('  // мушка');
  L.push('  const dot = r("frontSightDot");');
  L.push('  if (dot) {');
  L.push('    dot.geometry.dispose();');
  L.push('    dot.geometry = new THREE.SphereGeometry(get("sightSize"), 10, 10);');
  L.push('    dot.position.set(0, barrelRadius + get("sightSize") * 3, -0.95 - barrelLen / 2 + 0.04);');
  L.push('  }');
  L.push('');
  L.push('  // ствольная коробка');
  L.push('  const receiver = r("receiverBody");');
  L.push('  if (receiver) {');
  L.push('    receiver.geometry.dispose();');
  L.push('    receiver.geometry = new THREE.BoxGeometry(get("receiverW"), get("receiverH"), get("receiverL"));');
  L.push('  }');
  L.push('');
  L.push('  // приклад');
  L.push('  const stock = r("stockNeck");');
  L.push('  if (stock) {');
  L.push('    stock.geometry.dispose();');
  L.push('    stock.geometry = new THREE.BoxGeometry(get("stockNeckW"), get("stockNeckW"), get("stockNeckL"));');
  L.push('  }');
  L.push('');
  L.push('  // цевьё');
  L.push('  const forend = r("forendBody");');
  L.push('  if (forend) {');
  L.push('    forend.geometry.dispose();');
  L.push('    forend.geometry = new THREE.BoxGeometry(get("forendW"), get("forendH"), get("forendL"));');
  L.push('  }');
  L.push('}');
  L.push('');

  // -------- dispose --------
  L.push('// ============================================================');
  L.push('// УБОРКА (только геометрия — материалы общие на модуль)');
  L.push('// ============================================================');
  L.push('export function dispose(root) {');
  L.push('  root.traverse(o => {');
  L.push('    if (o.isMesh) o.geometry?.dispose();');
  L.push('  });');
  L.push('}');
  L.push('');
  L.push('// Конец файла.');

  return L.join('\n');
}

const overlay = document.getElementById('viewer-overlay');
const viewerContent = document.getElementById('viewer-content');

let lastCompiledSource = '';

document.getElementById('btn-compile').addEventListener('click', () => {

  viewerContent.textContent = lastCompiledSource;
  overlay.classList.add('open');
});

// ============================================================
// Сохранение скомпилированного файла (скачивание)
// ============================================================
const DEFAULT_FILENAME = 'gun.compile.js';

function sanitizeFilename(name) {
  // trim
  name = (name || '').trim();
  if (!name) return null;

  // нормализация Unicode + удаление невидимых символов
  name = name.normalize('NFC')
             .replace(/[\u0000-\u001F\u007F\u200B-\u200F\u2028-\u202F\uFEFF]/g, '');

  // запрещённые символы в файловых системах
  name = name.replace(/[\/\\:*?"<>|]/g, '_');

  // не только точки/пробелы
  if (/^[.\s]+$/.test(name)) return null;

  // убираем точки/пробелы в конце (Windows-недопустимо)
  name = name.replace(/[.\s]+$/, '');

  // гарантируем .js
  if (!/\.js$/i.test(name)) name += '.js';

  return name;
}

function saveCompiledFile() {
  const content = lastCompiledSource || compileGunSource();

  // Спросить имя файла (по умолчанию gun.compile.js)
  const raw = prompt('Имя файла:', DEFAULT_FILENAME);
  if (raw === null) return;   // отмена
  const filename = sanitizeFilename(raw);
  if (!filename) {
    alert('Недопустимое имя файла.');
    return;
  }

  // --- Скачивание через Blob + <a download> ---
  const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';

  document.body.appendChild(a);
  a.click();
  a.remove();

  // освободить память через секунду
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Кнопка «Сохранить…» в окне вьюера
document.getElementById('viewer-save').addEventListener('click', saveCompiledFile);

// ============================================================
// Загрузка из файла
// ============================================================
async function loadGunFromFile(file) {
  const source = await file.text();
  const blob = new Blob([source], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  let mod;
  try {
    mod = await import(url);
  } finally {
    URL.revokeObjectURL(url);
  }

  const { GUN_PARAMS, buildGun, applyParams, dispose, MATERIALS } = mod;
  if (typeof buildGun !== 'function') {
    throw new Error('В файле нет экспорта buildGun(envMap)');
  }

  // 1. Собрать модель
  const newModel = buildGun(envMap);
  newModel.userData.fromFile = true;

  // 2. Обновить params
  gun.params = {};
  for (const [key, meta] of Object.entries(GUN_PARAMS || {})) {
    gun.params[key] = {
      value: meta.value,
      min:   meta.min   ?? 0,
      max:   meta.max   ?? (meta.value * 2 || 1),
      step:  meta.step  ?? 0.001,
      label: meta.label ?? key,
    };
  }

  // 3. Заменить модель
  if (gun.model.parent) gun.model.parent.remove(gun.model);
  gun.model = newModel;
  gun.model.position.set(0, 0, 0);
  gun.model.rotation.set(0, 0, 0);
  gunRoot.add(gun.model);

  // 4. Запомнить applyParams — чтобы слайдеры его дёргали
  gun._compiledApplyParams = applyParams;

  // 5. Обновить синхронизацию
  sync.setRoot(gun.model);
  sync.clear();
  buildTree();
  unhighlightTreeRow();
  renderTransformFor(null);
  renderParamsFor(null);
  gizmo.detach();
  outline.clear();
}

document.getElementById('viewer-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

// ============================================================
// Цикл рендера
// ============================================================
let last = performance.now();

function animate(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (Math.abs(zoomState.current - zoomState.target) > 1e-5) {
    const t = 1 - Math.exp(-zoomState.speed * dt);
    zoomState.current += (zoomState.target - zoomState.current) * t;
    camera.zoom = zoomState.current;
    camera.updateProjectionMatrix();
  } else if (zoomState.current !== zoomState.target) {
    zoomState.current = zoomState.target;
    camera.zoom = zoomState.current;
    camera.updateProjectionMatrix();
  }

  gun.update?.(dt);
  gizmo.update(); 
  controls.update();
  outline.render();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ============================================================
// Ресайз
// ============================================================
function onResize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  outline.resize?.();
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(viewport);

// ============================================================
// Старт
// ============================================================
applyTreeScale();
buildTree();

// ============================================================
// ЗАГРУЗКА .js ФАЙЛА
// ============================================================
const fileLoader = document.getElementById('file-loader');
const btnLoad = document.getElementById('btn-load');

if (btnLoad) {
  btnLoad.addEventListener('click', () => fileLoader.click());
}

fileLoader.addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    await loadGunFromFile(file);
  } catch (err) {
    console.error('Ошибка загрузки:', err);
    alert('Ошибка загрузки файла: ' + (err?.message || err));
  } finally {
    fileLoader.value = '';   // чтобы повторный выбор того же файла работал
  }
});

// Отладка
window.__editor = { THREE, renderer, scene, camera, controls, outline, sync, gun, gunRoot, gizmo };
