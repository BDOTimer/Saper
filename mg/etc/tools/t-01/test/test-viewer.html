<!-- test-viewer.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Gun Viewer (модуль) // NEON</title>
  <link rel="icon" type="image/png" href="../../../../res/favicon-64.png" sizes="64x64">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-top: #1a1a3a;
      --bg-mid: #0a0a18;
      --bg-bottom: #000000;
      --neon-color: #0ff;
      --neon-glow: rgba(0, 255, 255, 0.5);
      --neon-bg: rgba(0, 255, 255, 0.08);
      --neon-bg-hover: rgba(0, 255, 255, 0.25);
      --text-color: #0ff;
      --radial-glow: rgba(0, 255, 255, 0.18);
      --dropzone-bg: rgba(0, 255, 255, 0.08);
      --dropzone-border: #0ff;
    }

    body.light-theme {
      --bg-top: #fff;
      --bg-mid: #f0f0d0;
      --bg-bottom: #e0c9a6;
      --neon-color: #8d5524;
      --neon-glow: rgba(141, 85, 36, 0.5);
      --neon-bg: rgba(141, 85, 36, 0.08);
      --neon-bg-hover: rgba(141, 85, 36, 0.22);
      --text-color: #5d3a1a;
      --radial-glow: rgba(255, 255, 230, 0.7);
      --dropzone-bg: rgba(141, 85, 36, 0.08);
      --dropzone-border: #8d5524;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: var(--text-color);
      transition: color 0.4s ease;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 0%, var(--radial-glow) 0%, transparent 60%),
        linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      transition: background 0.5s ease;
    }

    .viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: transparent;
    }

    #drop-zone {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(600px, 90vw);
      padding: 15px 20px;
      background: var(--dropzone-bg);
      border: 2px dashed var(--dropzone-border);
      border-radius: 12px;
      color: var(--text-color);
      font-size: clamp(13px, 3vw, 16px);
      letter-spacing: 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px var(--neon-glow);
      z-index: 10;
      user-select: none;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    #drop-zone:hover, #drop-zone.dragover {
      background: var(--neon-bg-hover);
      border-style: solid;
      color: #fff;
      box-shadow: 0 0 30px var(--neon-glow), inset 0 0 20px var(--neon-bg);
    }

    body.light-theme #drop-zone:hover,
    body.light-theme #drop-zone.dragover { color: var(--text-color); }

    #status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--neon-color);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--text-color);
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
      max-width: 90%;
      box-shadow: 0 0 15px var(--neon-glow);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      white-space: pre-wrap;
    }

    body.light-theme #status { background: rgba(255, 255, 255, 0.5); }
    #status.success { border-color: #0f0; color: #0f0; box-shadow: 0 0 15px rgba(0,255,0,0.5); }
    body.light-theme #status.success { border-color: #008000; color: #008000; }
    #status.error { border-color: #f0f; color: #f0f; box-shadow: 0 0 15px rgba(255,0,255,0.5); }
    body.light-theme #status.error { border-color: #c000c0; color: #c000c0; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      color: var(--text-color);
      font-family: inherit;
      font-size: clamp(13px, 3vw, 15px);
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--neon-bg);
      border: 2px solid var(--neon-color);
      border-radius: 12px;
      box-shadow: 0 0 15px var(--neon-glow);
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(4px);
    }

    .btn:hover, .btn:active {
      background: var(--neon-bg-hover);
      color: #fff;
      box-shadow: 0 0 25px var(--neon-glow), inset 0 0 20px var(--neon-bg);
      transform: translateY(-2px);
    }

    body.light-theme .btn:hover,
    body.light-theme .btn:active { color: var(--text-color); }

    #reset-btn { position: absolute; bottom: 20px; right: 20px; z-index: 10; }
    #theme-toggle {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      width: 48px; height: 48px; padding: 0; font-size: 22px;
    }

    #float-btn {
        position: absolute;
        top: 80px;
        right: 20px;
        z-index: 10;
    }
  </style>
</head>
<body>

  <div class="viewer-container">
    <div id="drop-zone">[ ЗАГРУЗИТЬ МОДЕЛЬ .JS ]</div>
    <canvas id="canvas"></canvas>
    <div id="status">СТАТУС: ОЖИДАНИЕ ФАЙЛА...</div>
    <button id="reset-btn" class="btn">СБРОС КАМЕРЫ</button>
    <button id="theme-toggle" class="btn" title="Переключить тему">🌙</button>
    <button id="float-btn" class="btn">Вьюер ...</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { GunViewer } from './gun-viewer-v2.js';

    // URL модели по умолчанию — та, что грузится автоматически при старте.
    const DEFAULT_MODEL_URL = './gun.compile.js';

    const viewer = new GunViewer({
      canvas: document.getElementById('canvas'),
      dropZone: document.getElementById('drop-zone'),
      statusEl: document.getElementById('status'),
      resetBtn: document.getElementById('reset-btn'),
      themeToggle: document.getElementById('theme-toggle'),
      defaultModelUrl: DEFAULT_MODEL_URL,
      autoLoad: true,
    });

    const floatBtn = document.getElementById('float-btn');
    let isFloating = false;

    floatBtn.addEventListener('click', () => {
        isFloating = !isFloating;
        if (isFloating) {
            viewer.setViewport(60, 60);
            floatBtn.textContent = 'ПОЛНЫЙ ЭКРАН';
        } else {
            viewer.resetViewport();
            floatBtn.textContent = 'ПЛАШКА 60%';
        }
    });

    // Для отладки из консоли:
    window.viewer = viewer;

viewer.canvas.addEventListener('wheel', (e) => {
  console.log('WHEEL', e.deltaY, e.deltaMode, e.target === viewer.canvas);
}, { passive: true });
  </script>

</body>
</html>
