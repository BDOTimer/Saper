<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Overlay — file://</title>
<style>
  html,body{height:100%;margin:0;background:#000;}
</style>
</head>
<body>

<script src="radio-overlay.js"></script>
<script>

    document.addEventListener('click', function startRadio() {
        //RadioOverlay.play();
        document.removeEventListener('click', startRadio);
    }, { once: true });

    setTimeout(() => {
        // здесь ваша "лямбда" — функция
        console.log('прошло 5 секунды');
        RadioOverlay.play();
        RadioOverlay.setVolume(10);
    }, 3000);

    document.addEventListener('DOMContentLoaded', () => {
        const a = RadioOverlay.getAudioElement().addEventListener;
        a('play',  () => console.log('PLAY'));
        a('pause', () => console.log('PAUSE'));
    });
</script>

</body>
</html>
