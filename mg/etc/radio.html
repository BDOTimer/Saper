<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassiopeia Radio</title>
<style>
  html,body{height:100%;}
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    background: radial-gradient(ellipse at center,
              rgba(0,40,20,.55) 0%,
              rgba(0,0,0,.92) 70%),
              #000;
    font-family: "Courier New", monospace;
    color: #33ff88;
    user-select: none;
    overflow: hidden;
  }

  /* ===== Плашка под контролы ===== */
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;

    padding: 26px 32px 24px;
    border-radius: 22px;

    background:
      radial-gradient(ellipse at 50% 0%,
        rgba(51,255,136,.10) 0%,
        rgba(4,26,14,.85) 55%,
        rgba(0,0,0,.92) 100%);
    border: 1px solid rgba(51,255,136,.28);

    box-shadow:
      0 0 0 1px rgba(51,255,136,.12),
      0 18px 40px -12px rgba(0,0,0,.9),
      0 0 60px -10px rgba(0,255,136,.25),
      inset 0 1px 0 rgba(168,255,208,.10),
      inset 0 -20px 40px -20px rgba(0,255,136,.15);

    transform: scale(0.4);
    transform-origin: center center;
  }

  /* ===== Ссылка на сайт радио (внутри плашки) ===== */
  .station-link {
    display: inline-block;
    margin-top: 2px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(51,255,136,.45);
    background:
      radial-gradient(ellipse at 50% 0%,
        rgba(51,255,136,.10) 0%,
        rgba(4,26,14,.85) 100%);
    color: #a8ffd0;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 1.2px;
    text-decoration: none;
    text-shadow: 0 0 6px rgba(0,255,136,.6);
    box-shadow:
      0 0 0 1px rgba(51,255,136,.12),
      0 8px 20px -8px rgba(0,0,0,.9),
      0 0 28px -6px rgba(0,255,136,.35),
      inset 0 1px 0 rgba(168,255,208,.10);
    transition: all .2s ease;
    cursor: pointer;
    text-align: center;
  }
  .station-link:hover {
    color: #f4ffe8;
    border-color: rgba(51,255,136,.85);
    box-shadow:
      0 0 0 1px rgba(51,255,136,.6),
      0 8px 24px -8px rgba(0,0,0,.9),
      0 0 40px -4px rgba(0,255,136,.65),
      inset 0 1px 0 rgba(168,255,208,.18);
    transform: translateY(-1px);
  }
  .station-link:active {
    transform: translateY(0) scale(.98);
  }

  /* ===== Большая зелёная кнопка ===== */
  .play-btn {
    width: 180px; height: 100px;
    border-radius: 50%;
    border: 2px solid #33ff88;
    background: radial-gradient(circle at 50% 40%,
      rgba(51,255,136,.28) 0%,
      rgba(4,26,14,.95) 70%);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 1px rgba(51,255,136,.35),
      0 0 30px rgba(0,255,136,.55),
      0 0 80px rgba(0,255,136,.25),
      inset 0 0 40px rgba(0,255,136,.18);
    transition: all .2s ease;
    padding: 0;
  }
  .play-btn:hover {
    box-shadow:
      0 0 0 2px rgba(51,255,136,.7),
      0 0 46px rgba(0,255,136,.8),
      0 0 110px rgba(0,255,136,.4),
      inset 0 0 60px rgba(0,255,136,.3);
  }
  .play-btn:active { transform: scale(.96); }

  .play-btn::before {
    content: "";
    width: 0; height: 0;
    border-left: 56px solid #a8ffd0;
    border-top: 34px solid transparent;
    border-bottom: 34px solid transparent;
    margin-left: 14px;
    filter: drop-shadow(0 0 12px #00ff88);
    transition: all .2s ease;
  }
  .play-btn.playing::before {
    width: 44px; height: 64px;
    border: none; margin-left: 0;
    background:
      linear-gradient(#a8ffd0,#a8ffd0) left/14px 100% no-repeat,
      linear-gradient(#a8ffd0,#a8ffd0) right/14px 100% no-repeat;
    filter: drop-shadow(0 0 12px #00ff88);
  }

  /* ===== Ряд громкости ===== */
  .volume-row{
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(220px, 84vw);
  }

  .mute-btn{
    flex: 0 0 auto;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    border: 1px solid #33ff88;
    border-radius: 4px;
    background: rgba(0,0,0,.35);
    cursor: pointer;
    padding: 0;
    box-shadow:
      0 0 0 1px rgba(51,255,136,.2),
      inset 0 0 12px rgba(0,255,136,.1);
    transition: all .18s ease;
  }
  .mute-btn:hover{
    background: rgba(51,255,136,.12);
    box-shadow:
      0 0 0 1px rgba(51,255,136,.6),
      0 0 18px rgba(0,255,136,.45),
      inset 0 0 16px rgba(0,255,136,.2);
  }

  .mute-btn::before{
    content: "";
    width: 9px; height: 13px;
    background: #a8ffd0;
    clip-path: polygon(0 35%, 35% 35%, 75% 0, 75% 100%, 35% 65%, 0 65%);
    filter: drop-shadow(0 0 4px #00ff88);
  }
  .mute-btn::after{
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 14px;
    transform: translate(-50%, -50%);
    border: 2px solid #a8ffd0;
    border-left-color: transparent;
    border-top-color: transparent;
    border-bottom-color: transparent;
    border-radius: 50%;
    opacity: .85;
    filter: drop-shadow(0 0 4px #00ff88);
  }
  .mute-btn.muted::after{
    width: 0; height: 0;
    border: none;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 2px solid #ff5555;
    transform: translate(-50%,-50%) rotate(-45deg);
    border-radius: 0;
    opacity: 1;
    filter: drop-shadow(0 0 4px #ff5555);
  }
  .mute-btn.muted::before{
    background: #ff5555;
    filter: drop-shadow(0 0 4px #ff5555);
  }

  .volume-slider{
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(51,255,136,.35);
    box-shadow: inset 0 0 8px rgba(0,255,136,.1);
    outline: none;
    cursor: pointer;
    margin: 0;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border-radius: 2px;
    background: #a8ffd0;
    box-shadow: 0 0 10px #00ff88;
    cursor: pointer;
    transition: all .15s ease;
    margin-top: -1px;
  }
  .volume-slider::-webkit-slider-thumb:hover{
    background: #f4ffe8;
    box-shadow: 0 0 18px #00ff88;
  }
  .volume-slider::-moz-range-thumb{
    width: 16px; height: 16px;
    border: none;
    border-radius: 2px;
    background: #a8ffd0;
    box-shadow: 0 0 10px #00ff88;
    cursor: pointer;
  }
  .volume-slider::-moz-range-track{
    height: 10px;
    border-radius: 2px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(51,255,136,.35);
  }
  .volume-slider::-moz-range-progress{
    height: 10px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(51,255,136,.35), #33ff88);
    box-shadow: 0 0 8px rgba(0,255,136,.6);
  }

  .volume-value{
    flex: 0 0 auto;
    min-width: 40px;
    text-align: right;
    font-size: 13px;
    letter-spacing: 2px;
    color: #a8ffd0;
    text-shadow: 0 0 6px rgba(0,255,136,.6);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

  <audio id="radio-audio" preload="none" crossorigin="anonymous">
    <source src="https://stream.cassiopeia-station.ru:5015/stream" type="audio/mpeg">
  </audio>

  <!-- Плашка с контролами: кнопка, громкость и ссылка — единое целое -->
  <div class="panel">
    <button id="play-toggle" class="play-btn" aria-label="Play / Stop"></button>

    <div class="volume-row">
      <button id="mute-toggle" class="mute-btn" aria-label="Mute"></button>
      <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
    </div>

    <a id="station-link" class="station-link"
       href="https://cassiopeia-station.ru/"
       target="_blank" rel="noopener noreferrer">
      Радио «Cassiopeia Station»
    </a>
  </div>

  <script>
    const audio   = document.getElementById('radio-audio');
    const btnPlay = document.getElementById('play-toggle');
    const btnMute = document.getElementById('mute-toggle');
    const slider  = document.getElementById('volume-slider');

    btnPlay.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(err => console.error('Ошибка воспроизведения:', err));
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play',  () => btnPlay.classList.add('playing'));
    audio.addEventListener('pause', () => btnPlay.classList.remove('playing'));

    let lastVolume = 0.7;
    audio.volume = lastVolume;
    slider.value = String(Math.round(lastVolume * 100));

    slider.addEventListener('input', () => {
      const v = Number(slider.value) / 100;
      audio.volume = v;
      if (v > 0 && audio.muted) {
        audio.muted = false;
        btnMute.classList.remove('muted');
      }
      if (v > 0) lastVolume = v;
    });

    btnMute.addEventListener('click', () => {
      audio.muted = !audio.muted;
      btnMute.classList.toggle('muted', audio.muted);
      if (!audio.muted && audio.volume === 0) {
        audio.volume = lastVolume;
        slider.value = String(Math.round(lastVolume * 100));
      }
    });

    function paintTrack() {
      const pct = slider.value + '%';
      slider.style.background =
        `linear-gradient(90deg, #33ff88 0%, #33ff88 ${pct}, rgba(0,0,0,.4) ${pct}, rgba(0,0,0,.4) 100%)`;
    }
    slider.addEventListener('input', paintTrack);
    paintTrack();
  </script>

</body>
</html>
