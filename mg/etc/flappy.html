<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird Remake</title>
<link rel="icon" type="image/png" href="../res/favicon-64.png" sizes="64x64">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a14;
    font-family: 'Courier New', monospace;
    color: #ecf0f1;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    touch-action: none;
    cursor: pointer;
  }

  /* ===== Кнопка "Меню" (как в Lines 98) ===== */
  .back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 8px 16px;
    font-size: clamp(13px, 3vw, 16px);
    background: rgba(0, 255, 255, 0.15);
    color: #0ff;
    border: 2px solid #0ff;
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    border-radius: 10px;
    text-decoration: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    z-index: 30;
    backdrop-filter: blur(6px);
    transition: all 0.15s ease;
    user-select: none;
  }
  .back-btn:active {
    background: rgba(0, 255, 255, 0.4);
    color: #000;
    transform: scale(0.95);
  }
  .back-btn:hover {
    background: rgba(0, 255, 255, 0.3);
  }

  #hud {
    position: fixed;
    left: 50%; bottom: 12px;
    transform: translateX(-50%);
    display: flex; gap: 16px;
    align-items: center; flex-wrap: wrap; justify-content: center;
    padding: 8px 14px;
    background: rgba(0,0,0,0.45);
    border-radius: 10px;
    color: #fff; font-size: 14px;
    backdrop-filter: blur(6px);
    z-index: 20;
    max-width: calc(100vw - 24px);
  }
  #hud label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  input[type=range] { width: 110px; accent-color: #ffcc00; }
  #hud b { color: #ffcc00; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<a href="../../index.html" class="back-btn">← Меню</a>

<div id="hud">
  <span>Очки: <b id="score">0</b></span>
  <label>Сложность (сек/экран):
    <input type="range" id="difficulty" min="0.8" max="6" step="0.1" value="2.5">
    <b id="diffVal">2.5</b>
  </label>
  <span>Рекорд: <b id="best">0</b></span>
</div>

<script>
(() => {
  // ============================================================
  //                    ЗВУКИ
  // ============================================================
  const SOUNDS = {
    kickFig : { src: '../res/tetris/1/kick-fig-1.mp3' , volume: 0.45, pool: 2 },
    kickSide: { src: '../res/tetris/1/kick-side-1.mp3', volume: 0.45, pool: 2 },
    linedel : { src: '../res/tetris/1/linedel-1.mp3'  , volume: 0.55, pool: 2 },
    move    : { src: '../res/tetris/1/move-1.mp3'     , volume: 0.35, pool: 3 },
    rot     : { src: '../res/tetris/1/rot-1.mp3'      , volume: 0.35, pool: 3 },
    death   : { src: '../res/tetris/1/death.mp3'      , volume: 0.55, pool: 1 },
  };

  const audioPools = {};
  for (const key in SOUNDS) {
    const def = SOUNDS[key];
    const arr = [];
    for (let i = 0; i < (def.pool || 1); i++) {
      const a = new Audio();
      a.src = def.src;
      a.preload = 'auto';
      a.volume = def.volume ?? 1;
      a.addEventListener('error', () => {
        console.warn(`[sound] Не удалось загрузить ${key}: ${def.src}`);
      });
      try { a.load(); } catch (e) {}
      arr.push(a);
    }
    audioPools[key] = { list: arr, idx: 0 };
  }

  let audioCtx = null;
  function synthFallback(name) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const map = {
        move:     { f: 660, d: 0.06, type: 'square' },
        kickFig:  { f: 880, d: 0.10, type: 'triangle' },
        kickSide: { f: 440, d: 0.05, type: 'square' },
        rot:      { f: 520, d: 0.10, type: 'sawtooth' },
        linedel:  { f: 990, d: 0.25, type: 'triangle' },
        death:    { f: 140, d: 0.40, type: 'sawtooth' },
      };
      const m = map[name] || { f: 440, d: 0.1, type: 'sine' };
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = m.type;
      o.frequency.setValueAtTime(m.f, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, m.f * 0.5), t + m.d);
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + m.d);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + m.d + 0.02);
    } catch (e) {}
  }

  function playSound(name) {
    const pool = audioPools[name];
    if (!pool) return;
    const a = pool.list[pool.idx];
    pool.idx = (pool.idx + 1) % pool.list.length;
    if (a.error || a.readyState === 0) { synthFallback(name); return; }
    try {
      if (a.readyState >= 1) a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => synthFallback(name));
    } catch (e) { synthFallback(name); }
  }

  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    for (const key in audioPools) {
      const a = audioPools[key].list[0];
      try {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
           .catch(() => { a.muted = false; });
        } else {
          a.pause(); a.currentTime = 0; a.muted = false;
        }
      } catch (e) { a.muted = false; }
    }
  }

  // ============================================================
  //                    ИГРА
  // ============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let S = 1;
  let bird, PIPE_W, GAP, PIPE_MIN_TOP, GRAVITY, FLAP_VELOCITY, MAX_FALL, GROUND_H;

  let pipes = [];
  let score = 0;
  let best = +(localStorage.getItem('flappy_best') || 0);
  let spawnTimer = 0;
  let running = false;
  let gameOver = false;
  let elapsed = 0;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const diffInput = document.getElementById('difficulty');
  const diffVal = document.getElementById('diffVal');
  bestEl.textContent = best;

  let difficulty = parseFloat(diffInput.value);
  let worldSpeed = 0;
  let pipeGapPx = 0;

  function updateSpeed() {
    worldSpeed = W / Math.max(0.3, difficulty);
    pipeGapPx = W * 0.55;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    S = H / 600;

    PIPE_W = Math.max(48, 70 * S);
    GAP = Math.max(110, 160 * S);
    PIPE_MIN_TOP = Math.max(40, 80 * S);
    GROUND_H = Math.max(24, 40 * S);

    GRAVITY = 1800 * S;
    FLAP_VELOCITY = -560 * S;
    MAX_FALL = 900 * S;

    updateSpeed();

    if (bird) {
      bird.r = Math.max(10, 14 * S);
      bird.x = W * 0.25;
      bird.y = Math.min(Math.max(bird.y, bird.r), H - GROUND_H - bird.r);
    } else {
      bird = { x: W * 0.25, y: H / 2, r: Math.max(10, 14 * S), vy: 0 };
    }

    pipes = pipes.map(p => ({
      ...p,
      top: Math.min(Math.max(p.top, PIPE_MIN_TOP), H - GROUND_H - GAP - PIPE_MIN_TOP)
    })).map(p => ({ ...p, bottom: p.top + GAP }));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  function reset() {
    bird.y = H / 2;
    bird.vy = 0;
    pipes = [makePipe(W + PIPE_W)];
    score = 0;
    scoreEl.textContent = '0';
    spawnTimer = 0;
    elapsed = 0;
    gameOver = false;
    running = false;
  }

  function makePipe(x) {
    const playableTop = PIPE_MIN_TOP;
    const playableBottom = H - GROUND_H - PIPE_MIN_TOP - GAP;
    const top = playableTop + Math.random() * Math.max(1, playableBottom - playableTop);
    return { x, top, bottom: top + GAP, passed: false };
  }

  function flap() {
    if (gameOver) { reset(); return; }
    if (!running) running = true;
    bird.vy = FLAP_VELOCITY;
    playSound('move');
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      unlockAudio();
      flap();
    }
  });
  canvas.addEventListener('mousedown', () => { unlockAudio(); flap(); });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    unlockAudio();
    flap();
  }, { passive: false });

  diffInput.addEventListener('pointerdown', () => unlockAudio());
  diffInput.addEventListener('input', () => {
    difficulty = parseFloat(diffInput.value);
    diffVal.textContent = difficulty.toFixed(1);
    updateSpeed();
    playSound('kickSide');
  });
  diffInput.addEventListener('change', () => playSound('rot'));

  function update(dt) {
    elapsed += dt;

    if (gameOver) {
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      if (bird.y + bird.r > H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r;
        bird.vy = 0;
      }
      return;
    }
    if (!running) return;

    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;

    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
    if (bird.y + bird.r > H - GROUND_H) { bird.y = H - GROUND_H - bird.r; die(); }

    const dx = worldSpeed * dt;
    const spawnIntervalSec = pipeGapPx / worldSpeed;
    spawnTimer += dt;
    if (spawnTimer >= spawnIntervalSec) {
      spawnTimer -= spawnIntervalSec;
      pipes.push(makePipe(W + PIPE_W));
    }

    for (const p of pipes) {
      p.x -= dx;
      if (
        circleRect(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, p.top) ||
        circleRect(bird.x, bird.y, bird.r, p.x, p.bottom, PIPE_W, (H - GROUND_H) - p.bottom)
      ) die();

      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scoreEl.textContent = score;
        playSound('kickFig');
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -20);
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    if (gameOver) return;
    gameOver = true;
    running = false;
    playSound('death');
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('flappy_best', best);
      setTimeout(() => playSound('linedel'), 350);
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8fd3e8');
    grad.addColorStop(1, '#c8f0d8');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawClouds();

    ctx.fillStyle = '#deb887';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#8b6b45';
    const stripe = 40 * S;
    const gOff = (elapsed * worldSpeed) % stripe;
    for (let x = -stripe + gOff; x < W; x += stripe) {
      ctx.fillRect(x, H - GROUND_H, stripe * 0.5, Math.max(4, 8 * S));
    }

    for (const p of pipes) {
      const capH = Math.max(16, 24 * S);
      const capOver = Math.max(2, 4 * S);

      ctx.fillStyle = '#5cb85c';
      ctx.strokeStyle = '#3a7d3a';
      ctx.lineWidth = Math.max(1.5, 3 * S);

      ctx.fillRect(p.x, 0, PIPE_W, p.top);
      ctx.strokeRect(p.x, 0, PIPE_W, p.top);
      ctx.fillStyle = '#4cae4c';
      ctx.fillRect(p.x - capOver, p.top - capH, PIPE_W + capOver * 2, capH);
      ctx.strokeRect(p.x - capOver, p.top - capH, PIPE_W + capOver * 2, capH);

      const bottomH = (H - GROUND_H) - p.bottom;
      ctx.fillStyle = '#5cb85c';
      ctx.fillRect(p.x, p.bottom, PIPE_W, bottomH);
      ctx.strokeRect(p.x, p.bottom, PIPE_W, bottomH);
      ctx.fillStyle = '#4cae4c';
      ctx.fillRect(p.x - capOver, p.bottom, PIPE_W + capOver * 2, capH);
      ctx.strokeRect(p.x - capOver, p.bottom, PIPE_W + capOver * 2, capH);
    }

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.max(-0.5, Math.min(0.9, bird.vy / (900 * S))));
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#c99a00';
    ctx.lineWidth = Math.max(1.5, 2 * S);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bird.r * 0.4, -bird.r * 0.3, bird.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(bird.r * 0.55, -bird.r * 0.3, bird.r * 0.18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.moveTo(bird.r * 0.8, 0);
    ctx.lineTo(bird.r * 1.4, bird.r * 0.15);
    ctx.lineTo(bird.r * 0.8, bird.r * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // ===== Инфо-панель — в правом верхнем углу =====
    const fs = Math.max(12, 14 * S);
    ctx.font = `bold ${fs}px Arial`;
    const pad = Math.max(8, 12 * S);
    const infoW = Math.max(150, 170 * S);
    const infoH = fs * 2 + pad * 2;

    const infoX = W - infoW - pad;
    const infoY = pad;

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(infoX, infoY, infoW, infoH);
    ctx.fillStyle = '#fff';
    ctx.fillText(`Время: ${elapsed.toFixed(1)} c`, infoX + pad, infoY + fs + 2);
    ctx.fillText(`Сложн.: ${difficulty.toFixed(1)} c`, infoX + pad, infoY + fs * 2 + 4);
    // ===== конец панели =====

    if (!running && !gameOver) {
      const boxH = Math.max(80, 100 * S);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, H / 2 - boxH / 2, W, boxH);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.max(18, 22 * S)}px Arial`;
      ctx.fillText('ПРОБЕЛ / тап', W / 2, H / 2 - 5);
      ctx.font = `${Math.max(12, 16 * S)}px Arial`;
      ctx.fillText('Сложность — внизу', W / 2, H / 2 + 20 * S);
      ctx.textAlign = 'start';
    }

    if (gameOver) {
      const boxH = Math.max(120, 140 * S);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, H / 2 - boxH / 2, W, boxH);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.max(24, 30 * S)}px Arial`;
      ctx.fillText('GAME OVER', W / 2, H / 2 - 15);
      ctx.font = `${Math.max(16, 20 * S)}px Arial`;
      ctx.fillText(`Очки: ${score}`, W / 2, H / 2 + 15);
      ctx.font = `${Math.max(12, 16 * S)}px Arial`;
      ctx.fillText('Нажмите, чтобы заново', W / 2, H / 2 + 42);
      ctx.textAlign = 'start';
    }
  }

  function drawClouds() {
    const t = elapsed * worldSpeed * 0.15;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    const count = 6;
    for (let i = 0; i < count; i++) {
      const seed = i * 137.5;
      const baseX = ((seed * 13) % W);
      const y = (seed * 7) % (H * 0.5);
      const size = Math.max(30, (40 + (i % 3) * 20) * S);
      const x = ((baseX - t) % (W + size * 2) + W + size * 2) % (W + size * 2) - size;
      ctx.beginPath();
      ctx.arc(x, y + size * 0.3, size * 0.5, 0, Math.PI * 2);
      ctx.arc(x + size * 0.4, y + size * 0.2, size * 0.6, 0, Math.PI * 2);
      ctx.arc(x + size * 0.9, y + size * 0.3, size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
