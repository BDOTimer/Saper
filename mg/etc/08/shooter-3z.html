<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИГРА ШУТЕР: ГОРОД РУИН — ЗАГРУЗКА</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
        }
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.5;
            z-index: 0;
            filter: brightness(0.6) contrast(1.2);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 100, 0, 0.5);
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Кнопка должна получать клики, поэтому pointer-events: auto */
        .btn-start {
            pointer-events: auto;
            margin-top: 30px;
            padding: 16px 55px;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #1a0e00;
            background: linear-gradient(180deg, #ffcc66 0%, #ff9900 50%, #cc6600 100%);
            border: 3px solid #ffe0a0;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff8800, 0 0 60px rgba(255, 100, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.5);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            animation: btnPulse 2s infinite;
        }
        .btn-start:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #ffaa00, 0 0 90px rgba(255, 140, 0, 0.9), inset 0 2px 10px rgba(255, 255, 255, 0.8);
            filter: brightness(1.15);
        }
        .btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px #ff8800, inset 0 4px 12px rgba(0, 0, 0, 0.4);
        }
        .btn-start:disabled {
            cursor: default;
            filter: grayscale(0.7) brightness(0.6);
            animation: none;
            box-shadow: 0 0 10px #553300;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 25px #ff8800, 0 0 60px rgba(255, 100, 0, 0.6), inset 0 2px 6px rgba(255,255,255,0.5); }
            50%      { box-shadow: 0 0 40px #ffaa33, 0 0 90px rgba(255, 140, 0, 0.9), inset 0 2px 10px rgba(255,255,255,0.8); }
        }
        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            color: #ffaa33;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300, 0 0 10px #000;
            animation: flicker 3s infinite alternate;
            font-weight: 900;
            border-bottom: 3px solid #ffaa33;
            padding-bottom: 15px;
            display: inline-block;
        }
        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2rem);
            letter-spacing: 4px;
            margin: 10px 0;
            color: #ddd;
            text-shadow: 0 0 15px #000, 0 0 30px #ff4400;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 25px;
            border-radius: 8px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 170, 51, 0.3);
            animation: pulse 2.5s infinite;
        }
        .wait {
            font-size: clamp(1rem, 3vw, 1.6rem);
            letter-spacing: 6px;
            margin-top: 40px;
            color: #ffaa33;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 30px;
            border-radius: 40px;
            border: 2px solid #ffaa33;
            box-shadow: 0 0 30px #ff6600;
            animation: blink 1.8s infinite;
            font-weight: bold;
        }
        .dots-anim::after {
            content: '...';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotAnim 1.5s infinite steps(1);
        }
        #status {
            margin-top: 20px;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            letter-spacing: 4px;
            color: #ffcc66;
            min-height: 1.5em;
            text-shadow: 0 0 20px #ff6600;
            transition: opacity 0.4s;
        }
        @keyframes flicker {
            0% { opacity: 0.9; text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300; }
            25% { opacity: 1; text-shadow: 0 0 40px #ffaa00, 0 0 80px #ff4400; }
            50% { opacity: 0.95; text-shadow: 0 0 20px #ff5500, 0 0 50px #ff2200; }
            75% { opacity: 1; text-shadow: 0 0 50px #ff8800, 0 0 90px #ff6600; }
            100% { opacity: 0.9; text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300; }
        }
        @keyframes pulse {
            0% { transform: scale(1); border-color: rgba(255, 170, 51, 0.3); }
            50% { transform: scale(1.02); border-color: rgba(255, 170, 51, 0.8); }
            100% { transform: scale(1); border-color: rgba(255, 170, 51, 0.3); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes dotAnim {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.7;
            pointer-events: none;
        }
        
        .btn-start {
    /* ... существующие стили ... */
    display: inline-block;      /* добавьте */
    text-decoration: none;      /* добавьте */
    line-height: normal;        /* добавьте */
}
    </style>
</head>
<body>
    <!-- Фоновая заставка из fon.jpg -->
    <div id="bg"></div>

    <!-- Текст-заглушка и кнопка -->
    <div id="overlay">
        <h1>РУИНЫ</h1>
        <div class="subtitle">ИГРА ШУТЕР: "ГОРОД РУИН" СГЕНЕРИРОВАНА.</div>
        <div class="wait">... готово ...<span class="dots-anim"></span></div>
        <a id="startBtn" class="btn-start" href="z/index.html">ЗАПУСТИТЬ</a>
        <div id="status"></div>
    </div>

    <!-- Импорт three.js и скрипт сцены -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Настройка сцены ---
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffaa66, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const backLight = new THREE.PointLight(0x4466ff, 0.8);
        backLight.position.set(-5, 0, -5);
        scene.add(backLight);

        const ruinLight = new THREE.PointLight(0xff6600, 1.5, 20);
        ruinLight.position.set(2, 1, 2);
        scene.add(ruinLight);

        // --- Руины ---
        const ruinGroup = new THREE.Group();

        function createDebris(posX, posY, posZ, scaleX, scaleY, scaleZ, rotY, color) {
            const geometry = new THREE.BoxGeometry(scaleX, scaleY, scaleZ);
            const positionAttribute = geometry.attributes.position;
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = positionAttribute.getX(i);
                const y = positionAttribute.getY(i);
                const z = positionAttribute.getZ(i);
                positionAttribute.setXYZ(
                    i,
                    x + (Math.random() - 0.5) * 0.2,
                    y + (Math.random() - 0.5) * 0.2,
                    z + (Math.random() - 0.5) * 0.2
                );
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.8,
                metalness: 0.2,
                emissive: new THREE.Color(0x221100),
                flatShading: false
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(posX, posY, posZ);
            mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        const wall1 = createDebris(-1.5, 0.5, -1, 2.5, 1.8, 0.4, 0.3, 0x8a7a6a);
        ruinGroup.add(wall1);

        const wall2 = createDebris(1.8, 0.3, -0.5, 1.2, 1.2, 0.5, -0.5, 0x7a6a5a);
        ruinGroup.add(wall2);

        const columnGeo = new THREE.CylinderGeometry(0.3, 0.4, 2.5, 8);
        const columnMat = new THREE.MeshStandardMaterial({ color: 0x9a8a7a, roughness: 0.9, emissive: new THREE.Color(0x221100) });
        const column = new THREE.Mesh(columnGeo, columnMat);
        column.position.set(0.5, 1.2, 1.5);
        column.castShadow = true;
        column.receiveShadow = true;
        ruinGroup.add(column);

        for (let i = 0; i < 25; i++) {
            const x = (Math.random() - 0.5) * 6;
            const z = (Math.random() - 0.5) * 6;
            const y = Math.random() * 0.6;
            const sx = 0.2 + Math.random() * 0.6;
            const sy = 0.1 + Math.random() * 0.4;
            const sz = 0.2 + Math.random() * 0.6;
            const rot = Math.random() * Math.PI;
            const col = new THREE.Color().setHSL(0.08 + Math.random()*0.1, 0.3, 0.35 + Math.random()*0.2);
            const debris = createDebris(x, y, z, sx, sy, sz, rot, col);
            ruinGroup.add(debris);
        }

        const pillarLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.0, 0.4), new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 }));
        pillarLeft.position.set(-1.8, 1.0, 1.8);
        pillarLeft.castShadow = true;
        pillarLeft.receiveShadow = true;
        ruinGroup.add(pillarLeft);

        const pillarRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.0, 0.4), new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 }));
        pillarRight.position.set(1.8, 1.0, 1.8);
        pillarRight.castShadow = true;
        pillarRight.receiveShadow = true;
        ruinGroup.add(pillarRight);

        const archTop = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.3, 0.5), new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.9 }));
        archTop.position.set(0, 2.0, 1.8);
        archTop.rotation.z = 0.1;
        archTop.castShadow = true;
        archTop.receiveShadow = true;
        ruinGroup.add(archTop);

        scene.add(ruinGroup);

        // --- Частицы пыли ---
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 800;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 20;
            posArray[i+1] = (Math.random() - 0.5) * 10 + 2;
            posArray[i+2] = (Math.random() - 0.5) * 20;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffaa66,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        scene.fog = new THREE.FogExp2(0x000000, 0.05);

        // --- Анимация ---
        let time = 0;
        let running = true;

        function animate() {
            if (!running) return;
            requestAnimationFrame(animate);
            time += 0.005;

            camera.position.x = 7 * Math.sin(time * 0.3);
            camera.position.z = 7 * Math.cos(time * 0.3);
            camera.position.y = 3 + Math.sin(time * 0.8) * 0.5;
            camera.lookAt(0, 0.5, 0);

            ruinGroup.rotation.y = Math.sin(time * 0.2) * 0.1;
            ruinLight.intensity = 1.2 + Math.sin(time * 5) * 0.5;

            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0002;

            renderer.render(scene, camera);
        }

        animate();

        // --- Обработка изменения размера окна ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Кнопка "ЗАПУСТИТЬ" ---
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const overlayEl = document.getElementById('overlay');

        startBtn.addEventListener('click', () => {
            // Блокируем кнопку, чтобы не нажимали повторно
            startBtn.disabled = true;
            startBtn.textContent = 'ЗАГРУЗКА...';
            statusEl.textContent = 'ИНИЦИАЛИЗАЦИЯ ГЕНЕРАТОРА РУИН...';

            // Небольшая имитация загрузки
            const messages = [
                'ИНИЦИАЛИЗАЦИЯ ГЕНЕРАТОРА РУИН...',
                'ЗАГРУЗКА ТЕКСТУР...',
                'СБОРКА ГЕОМЕТРИИ...',
                'ПОДГОТОВКА ОРУЖИЯ...',
                'ПОЧТИ ГОТОВО...'
            ];
            let step = 0;
            const interval = setInterval(() => {
                step++;
                if (step < messages.length) {
                    statusEl.textContent = messages[step];
                } else {
                    clearInterval(interval);
                    statusEl.innerHTML = '⚠ РУИНЫ ВСЁ ЕЩЁ В ГЕНЕРАЦИИ...<br>ЗАПУСК НЕВОЗМОЖЕН. ЖДИТЕ ОБНОВЛЕНИЯ.';
                    startBtn.textContent = 'НЕДОСТУПНО';
                    // Возвращаем кнопку в исходное состояние через несколько секунд
                    setTimeout(() => {
                        startBtn.disabled = false;
                        startBtn.textContent = 'ЗАПУСТИТЬ';
                        statusEl.textContent = '';
                    }, 4000);
                }
            }, 900);
        });
    </script>
</body>
</html>
