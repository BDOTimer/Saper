<!--
ТЗ: Игра «Слова» (2 игрока, оффлайн) — 40 пунктов
Игра запускается из локального HTML-файла без сервера и интернета.
Словарь подключается отдельным скриптом как window.WORDS (Set).
При отсутствии словаря показывается понятная ошибка запуска.
Поиск по словарю — точное совпадение, с нормализацией регистра и «ё/е».
Игра рассчитана на двух игроков на одном устройстве, по очереди.
На старте Игрок 1 вводит слово из словаря длиной 5–12 букв.
Длина стартового слова задаёт размер квадратного поля N×N.
Поле адаптивно масштабируется под экран; клетки — квадратные.
Стартовое слово размещается горизонтально в середине поля.
Стартовое слово принадлежит Игроку 1 и очков ему не приносит.
Первым ходит Игрок 1; активный игрок подсвечен в HUD.
За один ход игрок ставит на поле ровно одну букву.
Буква ставится в пустую клетку, соседнюю (4-соседство) с любой буквой.
Диагональное соседство при постановке буквы запрещено.
Буква вводится прямо в клетке: физическая или экранная клавиатура.
Ввод не-русской буквы игнорируется, клетка остаётся в режиме ввода.
Отмена ввода: повторный клик по клетке, Esc, Backspace или Enter.
После ввода буква подсвечивается как «ожидающая» и мигает.
Игрок кликами собирает слово из букв на поле по порядку.
Слово может идти по ломаной линии только по 4-соседству.
Порядок кликов задаёт порядок букв: слева/справа, сверху/снизу.
Клик по соседу первой буквы добавляет её в начало слова.
Клик по соседу последней буквы добавляет её в конец слова.
Повторный клик по выбранной клетке убирает её из слова.
Буква игрока может стоять в любом месте слова, не только первой.
Превью слова показывается под полем через разделитель «·».
Кнопка «Принять» активна, когда выделено минимум две буквы.
Принятое слово проверяется по словарю; повтор слов запрещён.
За принятое слово игроку начисляются очки, равные длине слова.
После успеха буква фиксируется, счёт растёт, ход переходит сопернику.
При успехе таймер сбрасывается; новый ход начинается без таймера.
Если слова нет в словаре — буква убирается, запускается таймер 60 с.
По истечении таймера буква убирается, ход переходит сопернику.
Если слово уже было в игре — ошибка, ход не меняется, буква остаётся.
Кнопка «Сброс» очищает выделение; «Убрать букву» снимает pending.
Клетки игроков различаются цветом; счёт обоих виден в HUD.
Звуки берутся из res/tetris/1/ через SoundKit; есть кнопка mute.
Кнопка «← Меню» освобождает звуковые ресурсы (kit.dispose()).
Есть кнопка полноэкранного режима для мобильных устройств.
Стиль — неоновый «киан/чёрный».
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Игра «Слова»</title>
<link rel="icon" type="image/png" href="../../res/favicon-64.png" sizes="64x64">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        background-color: #0a0a14;
        font-family: 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
    }

    .game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        height: 100%;
        position: relative;
        padding: 70px 10px 14px;
        overflow-y: auto;
        touch-action: manipulation;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 255, 255, 0.35) transparent;
    }
    .game-wrapper::-webkit-scrollbar { width: 6px; }
    .game-wrapper::-webkit-scrollbar-track { background: transparent; }
    .game-wrapper::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.35);
        border-radius: 999px;
        box-shadow: 0 0 6px rgba(0, 255, 255, 0.45);
    }

/* ================= ТАБЛО СЧЁТА ================= */
.scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: clamp(8px, 2vw, 18px);
    width: min(96vw, 640px);
    margin-bottom: clamp(10px, 2vh, 18px);
    align-items: stretch;
    z-index: 20;
    position: relative;
}

.player-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.8vh, 14px) clamp(8px, 2vw, 16px);
    border-radius: 14px;
    background: rgba(0, 255, 255, 0.04);
    border: 2px solid rgba(0, 255, 255, 0.25);
    box-shadow:
        inset 0 0 18px rgba(0, 255, 255, 0.08),
        0 0 14px rgba(0, 255, 255, 0.15);
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
}

/* Активный игрок — всегда розовое сияние, независимо от номера */
.player-panel.active {
    border-color: #f0f;
    background: rgba(255, 0, 255, 0.12);
    box-shadow:
        inset 0 0 26px rgba(255, 0, 255, 0.35),
        0 0 28px rgba(255, 0, 255, 0.7),
        0 0 60px rgba(255, 0, 255, 0.4);
    animation: glowPulseActive 2s ease-in-out infinite alternate;
}

@keyframes glowPulseActive {
    from { box-shadow:
        inset 0 0 22px rgba(255, 0, 255, 0.3),
        0 0 22px rgba(255, 0, 255, 0.55),
        0 0 50px rgba(255, 0, 255, 0.3); }
    to   { box-shadow:
        inset 0 0 30px rgba(255, 0, 255, 0.45),
        0 0 34px rgba(255, 0, 255, 0.85),
        0 0 80px rgba(255, 0, 255, 0.55); }
}

.player-label {
    font-size: clamp(9px, 2.2vw, 12px);
    letter-spacing: 3px;
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    opacity: 0.75;
    margin-bottom: 4px;
    white-space: nowrap;
}


/* БОЛЬШИЕ ОБЪЁМНЫЕ ЦИФРЫ */
.player-score {
    font-size: clamp(28px, 9vw, 52px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 1px;
    color: #0ff;
    text-shadow:
        0 1px 0 #066,
        0 2px 0 #055,
        0 3px 0 #044,
        0 4px 0 #033,
        0 5px 0 #022,
        0 6px 0 #011,
        0 0 12px #0ff,
        0 0 24px #0ff,
        0 0 42px #0ff;
    transition: transform 0.2s ease;
}


/* Подсветка цифр активного игрока */
/* Цифры активного игрока — розовые и пульсируют */
.player-panel.active .player-score {
    color: #f0f;
    text-shadow:
        0 1px 0 #606,
        0 2px 0 #505,
        0 3px 0 #404,
        0 4px 0 #303,
        0 5px 0 #202,
        0 6px 0 #101,
        0 0 12px #f0f,
        0 0 24px #f0f,
        0 0 42px #f0f;
    animation: scorePulse 1.6s ease-in-out infinite alternate;
}

@keyframes scorePulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
}

.player-panel.active .player-label {
    color: #f0f;
    text-shadow:
        0 0 8px #f0f,
        0 0 16px #f0f,
        0 0 28px #f0f;
    opacity: 1;
    animation: labelGlow 1.6s ease-in-out infinite alternate;
}

/* Центральный блок — ход + таймер */
.board-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 10px;
    min-width: 70px;
    text-align: center;
}
.turn-label {
    font-size: clamp(8px, 2vw, 11px);
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 2px;
}
.turn-name {
    font-size: clamp(16px, 4.5vw, 24px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fc0;
    text-shadow: 0 0 12px #fc0, 0 0 22px #fc0;
    margin-bottom: 6px;
}
.timer-value {
    font-size: clamp(13px, 3.4vw, 18px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 16px #0ff;
    min-height: 1em;
}
.timer-value.warning {
    color: #f0f;
    text-shadow: 0 0 10px #f0f, 0 0 22px #f0f;
    animation: timerBlink 0.6s step-end infinite;
}
.timer-value.off {
    color: rgba(0, 255, 255, 0.35);
    text-shadow: 0 0 8px rgba(0, 255, 255, 0.35);
}
@keyframes timerBlink {
    50% { opacity: 0.35; }
}

    .status {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        color: #0ff;
        font-size: clamp(11px, 3vw, 16px);
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px #0ff;
        white-space: nowrap;
        z-index: 20;
        pointer-events: none;
        max-width: 96vw;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    .status.thinking { animation: statusPulse 1.1s ease-in-out infinite; }
    .status.bad { color: #f0f; text-shadow: 0 0 12px #f0f; }
    .status.ok  { color: #0f0; text-shadow: 0 0 12px #0f0; }
    .status.timer-on { color: #fc0; text-shadow: 0 0 12px #fc0; }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
    }

    /* ================= СПИСКИ СЛОВ ПО БОКАМ ================= */
    .play-area {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: clamp(10px, 2vw, 22px);
        width: min(96vw, 1060px);
    }

    .game-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 0 1 520px;
        width: 100%;
        max-width: min(520px, 92vw);
        min-width: 0;
    }

    .word-panel {
        --accent: 0, 255, 255;
        --accent-solid: #0ff;
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1 1 140px;
        min-width: 0;
        max-width: 230px;
        padding: 12px 10px 10px;
        border-radius: 16px;
        border: 2px solid rgba(var(--accent), 0.28);
        background:
            linear-gradient(180deg, rgba(var(--accent), 0.09), transparent 45%),
            repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.018) 0 1px,
                transparent 1px 4px
            ),
            rgba(3, 7, 16, 0.72);
        box-shadow:
            0 0 22px rgba(var(--accent), 0.14),
            inset 0 0 28px rgba(var(--accent), 0.05);
        overflow: hidden;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .word-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--accent-solid), transparent);
        box-shadow: 0 0 12px var(--accent-solid);
        opacity: 0.7;
        pointer-events: none;
    }
    .word-panel::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        background: linear-gradient(180deg, transparent, rgba(3, 7, 16, 0.78));
        pointer-events: none;
    }
    .word-panel.active::before { opacity: 1; }
    .word-panel.active .word-panel-name {
        text-shadow:
            0 0 10px rgba(var(--accent), 0.95),
            0 0 22px rgba(var(--accent), 0.55);
    }
    .word-panel-1 {
        --accent: 255, 0, 255;
        --accent-solid: #f0f;
    }
    .word-panel.active {
        border-color: rgba(var(--accent), 0.75);
        box-shadow:
            0 0 30px rgba(var(--accent), 0.35),
            0 0 60px rgba(var(--accent), 0.12),
            inset 0 0 34px rgba(var(--accent), 0.1);
    }
    .word-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 3px 9px;
        border-bottom: 1px solid rgba(var(--accent), 0.18);
    }
    .word-panel-name {
        display: flex;
        align-items: center;
        min-width: 0;
        color: var(--accent-solid);
        font-size: clamp(9px, 1.6vw, 11px);
        font-weight: bold;
        letter-spacing: 1.8px;
        text-shadow: 0 0 10px rgba(var(--accent), 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .word-panel-name::before {
        content: '';
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--accent-solid);
        box-shadow: 0 0 8px var(--accent-solid), 0 0 16px rgba(var(--accent), 0.7);
        opacity: 0.65;
    }
    .word-panel.active .word-panel-name::before {
        opacity: 1;
        animation: panelDot 1.4s ease-in-out infinite alternate;
    }
    @keyframes panelDot {
        from { transform: scale(0.85); }
        to   { transform: scale(1.15); }
    }
    .word-panel-count {
        flex: 0 0 auto;
        min-width: 24px;
        padding: 2px 7px;
        border: 1px solid rgba(var(--accent), 0.4);
        border-radius: 999px;
        background: rgba(var(--accent), 0.1);
        color: var(--accent-solid);
        font-size: 10px;
        font-weight: bold;
        line-height: 1.35;
        text-align: center;
        text-shadow: 0 0 8px rgba(var(--accent), 0.8);
    }
    .word-list {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        margin-top: 9px;
        padding: 1px 2px 18px 0;
        overflow-x: hidden;
        overflow-y: auto;
        list-style: none;
        scrollbar-width: thin;
        scrollbar-color: rgba(var(--accent), 0.45) rgba(0, 0, 0, 0.2);
    }
    .word-list::-webkit-scrollbar { width: 5px; }
    .word-list::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 999px;
    }
    .word-list::-webkit-scrollbar-thumb {
        background: rgba(var(--accent), 0.45);
        border-radius: 999px;
        box-shadow: 0 0 6px rgba(var(--accent), 0.5);
    }
    .word-list-empty {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 8px 6px;
        border: 1px dashed rgba(var(--accent), 0.18);
        border-radius: 10px;
        color: rgba(var(--accent), 0.4);
        font-size: 10px;
        letter-spacing: 1px;
        text-align: center;
    }
    .word-item {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border: 1px solid rgba(var(--accent), 0.16);
        border-left: 3px solid rgba(var(--accent), 0.7);
        border-radius: 9px;
        background: rgba(var(--accent), 0.055);
        box-shadow: inset 0 0 12px rgba(var(--accent), 0.05);
        transition: background 0.18s ease, border-color 0.18s ease,
                    box-shadow 0.18s ease, transform 0.18s ease;
    }
    .word-item:hover {
        background: rgba(var(--accent), 0.12);
        border-color: rgba(var(--accent), 0.38);
        box-shadow: inset 0 0 16px rgba(var(--accent), 0.1),
                    0 0 12px rgba(var(--accent), 0.18);
        transform: translateX(2px);
    }
    .word-item.word-enter {
        animation: wordEnter 0.38s cubic-bezier(0.2, 0.85, 0.25, 1) both;
    }
    @keyframes wordEnter {
        from { opacity: 0; transform: translateY(7px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .word-text {
        min-width: 0;
        overflow: hidden;
        color: #e8ffff;
        font-size: clamp(11px, 1.5vw, 14px);
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(var(--accent), 0.55);
        white-space: nowrap;
        text-overflow: ellipsis;
    }
    .word-points {
        flex: 0 0 auto;
        color: var(--accent-solid);
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.6px;
        text-shadow: 0 0 8px rgba(var(--accent), 0.75);
        opacity: 0.85;
        white-space: nowrap;
    }
    .word-item.start-word {
        border-left-style: dashed;
        background: rgba(var(--accent), 0.025);
    }
    .word-item.start-word .word-text {
        font-style: italic;
        opacity: 0.8;
    }
    .word-points.start {
        padding: 1px 5px;
        border: 1px solid rgba(var(--accent), 0.28);
        border-radius: 999px;
        font-size: 8px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        opacity: 0.65;
    }

    /* ================= ДОСКА (адаптивный N×N) ================= */
    .board {
        display: grid;
        gap: clamp(4px, 1.2vw, 8px);
        width: min(100%, 60vh, 520px);
        aspect-ratio: 1 / 1;
        padding: clamp(6px, 1.6vw, 10px);
        background: rgba(0, 255, 255, 0.04);
        border: 2px solid #0ff;
        border-radius: 14px;
        box-shadow:
            0 0 30px rgba(0, 255, 255, 0.4),
            inset 0 0 30px rgba(0, 255, 255, 0.08);
        position: relative;
    }

    .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-family: inherit;
        font-size: clamp(14px, 4vw, 26px);
        font-weight: bold;
        user-select: none;
        -webkit-user-select: none;
        color: #0ff;
        text-shadow: 0 0 10px #0ff, 0 0 22px #0ff;
        background: rgba(0, 255, 255, 0.12);
        border: 2px solid rgba(0, 255, 255, 0.45);
        box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.15);
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.2s ease;
        will-change: transform;
        position: relative;
        z-index: 1;
    }

    .cell.empty {
        background: transparent;
        border: 2px dashed rgba(0, 255, 255, 0.2);
        box-shadow: none;
        color: transparent;
        text-shadow: none;
        cursor: default;
    }

    .cell.placeable {
        cursor: pointer;
        background: rgba(0, 255, 255, 0.06);
        border-color: rgba(0, 255, 255, 0.55);
        box-shadow: inset 0 0 14px rgba(0, 255, 255, 0.25);
    }
    .cell.placeable:hover {
        background: rgba(0, 255, 255, 0.18);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.4);
    }

    .cell.letter { cursor: pointer; }
    .cell.letter:hover {
        background: rgba(0, 255, 255, 0.2);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.3);
    }

    .cell.pending {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.15);
        box-shadow: inset 0 0 20px rgba(255, 200, 0, 0.35);
        animation: pendingPulse 1s ease-in-out infinite;
    }
    @keyframes pendingPulse {
        0%, 100% { box-shadow: inset 0 0 18px rgba(255, 200, 0, 0.25); }
        50%      { box-shadow: inset 0 0 28px rgba(255, 200, 0, 0.7); }
    }

    /* Режим ввода буквы прямо в клетке */
    .cell.typing {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.18);
        box-shadow: inset 0 0 22px rgba(255, 200, 0, 0.4), 0 0 18px rgba(255, 200, 0, 0.5);
        outline: none;
        font-size: clamp(16px, 4.5vw, 28px);
    }
    .cell.typing::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #fc0;
        margin-left: 2px;
        animation: caretBlink 0.8s step-end infinite;
        vertical-align: text-bottom;
    }
    @keyframes caretBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
    }

    .cell.selected {
        color: #000 !important;
        text-shadow: none !important;
        background: #0ff !important;
        border-color: #0ff !important;
        box-shadow: 0 0 22px rgba(0, 255, 255, 0.9) !important;
        transform: scale(0.96);
    }

    .cell.owner-0 { color: #9cf; }
    .cell.owner-1 { color: #fcf; }

    .preview {
        text-align: center;
        font-size: clamp(14px, 3.6vw, 18px);
        letter-spacing: 3px;
        color: #fc0;
        text-shadow: 0 0 10px #fc0;
        min-height: 26px;
        margin-top: clamp(10px, 2vh, 16px);
        font-weight: bold;
    }

    .controls {
        display: flex;
        gap: 8px;

    /* ============ СТАРТОВЫЙ ЭКРАН ============ */

    .result-screen {

</style>

<!-- ЗВУКИ (как в tetris.html) -->
<script src="../../js/sound-lib.js"></script>

<!-- СЛОВАРЬ: window.WORDS = new Set([...]) -->
<script src="russian_nouns.txt.js"></script>

<!-- ИИ: window.ComputerBrain -->
<script src="computer-brain.js"></script>

<script>
(() => {
'use strict';

// ============================================================
//                       ЗВУК
// ============================================================
let kit = null;
try {
    if (typeof SoundKit !== 'undefined') {
        kit = SoundKit.createSoundKit({
            move    : { src: '../../res/tetris/1/move-1.mp3',      volume: 0.3, pool: 3 },
            rot     : { src: '../../res/tetris/1/rot-1.mp3',       volume: 0.3, pool: 3 },
            kickFig : { src: '../../res/tetris/1/kick-fig-1.mp3',  volume: 0.4, pool: 2 },
            kickSide: { src: '../../res/tetris/1/kick-side-1.mp3', volume: 0.4, pool: 2 },
            linedel : { src: '../../res/tetris/1/linedel-1.mp3',   volume: 0.5, pool: 2 },
            death   : { src: '../../res/tetris/1/death.mp3',       volume: 0.1, pool: 1 },
            click   : { src: '../../res/dzin-1.mp3'        ,       volume: 0.5, pool: 3 },
        });
        kit.autoUnlock();
    }
} catch (e) {
    console.warn('SoundKit не инициализирован:', e);
    kit = null;
}

function sfx(name) {
    if (!kit || !kit.sounds[name]) return;
    try { kit.sounds[name].play(); } catch (e) {}
}

// ============================================================
//                       СЛОВАРЬ
// ============================================================
const WORD_SET = (window.WORDS instanceof Set)
    ? window.WORDS
    : new Set(window.WORDS || []);
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е');
const hasWord = s => WORD_SET.has(norm(s));

const AI_AVAILABLE = typeof window.ComputerBrain === 'function';
const AI_LETTERS = 'абвгдежзийклмнопрстуфхцчшщъыьэюя'.split('');

// ============================================================
//                       КОНСТАНТЫ
// ============================================================
const MIN_START_LEN = 5;
const MAX_START_LEN = 12;
const MIN_TIMER_SECONDS = 20;
const DEFAULT_TIMER_SECONDS = 60;

const DEFAULT_STATUS = 'Поставьте букву в соседнюю клетку';
const PLAYER_NAMES   = ['◀︎--', '--▶︎'];
const PLAYER_FULL    = ['Игрок-1', 'Игрок-2'];

// ============================================================
//                       DOM
// ============================================================
const boardEl     = document.getElementById('board');
const statusEl    = document.getElementById('status');
const previewEl   = document.getElementById('preview');
const score0El    = document.getElementById('score0');
const score1El    = document.getElementById('score1');
const turnNameEl  = document.getElementById('turnName');
const timerEl     = document.getElementById('timer');
const acceptBtn   = document.getElementById('btnAccept');
const clearBtn    = document.getElementById('btnClear');
const cancelBtn   = document.getElementById('btnCancelLetter');
const startScreen = document.getElementById('startScreen');
const startWordIn = document.getElementById('startWord');
const startError  = document.getElementById('startError');
const turnSecondsIn = document.getElementById('turnSeconds');
const resultScreen= document.getElementById('resultScreen');
const resultStats = document.getElementById('resultStats');
const modeSelectEl = document.getElementById('modeSelect');
const modeCards   = modeSelectEl
    ? Array.from(modeSelectEl.querySelectorAll('.mode-card'))
    : [];
const panel0Label = document.querySelector('#panel0 .player-label');
const panel1Label = document.querySelector('#panel1 .player-label');
const wordPanel0El = document.getElementById('wordPanel0');
const wordPanel1El = document.getElementById('wordPanel1');
const wordPanel0Name = document.getElementById('wordPanel0Name');
const wordPanel1Name = document.getElementById('wordPanel1Name');
const wordList0El = document.getElementById('wordList0');
const wordList1El = document.getElementById('wordList1');
const wordCount0El = document.getElementById('wordCount0');
const wordCount1El = document.getElementById('wordCount1');

// ============================================================
//                       СОСТОЯНИЕ
// ============================================================
const state = {
    size: 0,
    board: [],
    currentPlayer: 0,
    scores: [0, 0],
    phase: 'idle',       // 'idle' | 'input' | 'select' | 'finished'
    pending: null,
    typing: null,        // { r, c } — клетка в режиме ввода
    selection: [],
    usedWords: new Set(),
    playerWords: [[], []],
    turnSeconds: DEFAULT_TIMER_SECONDS,
    timerId: null,
    timeLeft: 0,
    startTime: 0,
    moves: 0,
    
    paused: false,          // ← новое: вкладка неактивна
    pausedAt: 0,            // ← новое: когда ушли с вкладки
    wasTimerRunning: false, // ← новое: таймер шёл в момент паузы
    pendingTimerStart: false,

    mode: 'human',          // 'human' | 'computer'
    aiBusy: false,
};

let cells = [];

// ============================================================
//                   НАСТРОЙКА ТАЙМЕРА
// ============================================================
function normalizeTurnSeconds(value) {
    const number = Number(String(value).trim());
    if (!Number.isFinite(number) || number < MIN_TIMER_SECONDS) return 0;
    return Math.floor(number);
}

function applyTimerInput() {
    if (!turnSecondsIn) return state.turnSeconds;
    const seconds = normalizeTurnSeconds(turnSecondsIn.value);
    turnSecondsIn.value = String(seconds);
    return seconds;
}

if (turnSecondsIn) {
    turnSecondsIn.addEventListener('change', applyTimerInput);
    turnSecondsIn.addEventListener('blur', applyTimerInput);
}

// ============================================================
//                       СТАТУС
// ============================================================
let statusResetTimer = null;

function showStatus(text, cls = '', autoResetMs = 0) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    if (statusResetTimer) {
        clearTimeout(statusResetTimer);
        statusResetTimer = null;
    }
    if (autoResetMs > 0) {
        statusResetTimer = setTimeout(() => {
            statusResetTimer = null;
            if (state.phase !== 'finished' && !state.aiBusy) {
                showStatus(DEFAULT_STATUS, '');
            }
        }, autoResetMs);
    }
}

// ============================================================
//                   ИМЕНА ИГРОКОВ
// ============================================================
function playerShortName(index) {
    return (index === 1 && state.mode === 'computer')
        ? 'ИИ'
        : PLAYER_NAMES[index];
}

function playerFullName(index) {
    return (index === 1 && state.mode === 'computer')
        ? 'Компьютер'
        : PLAYER_FULL[index];
}

function updatePlayerLabels() {
    if (panel0Label) panel0Label.textContent = 'ИГРОК 1';
    if (panel1Label) {
        panel1Label.textContent = state.mode === 'computer'
            ? 'КОМПЬЮТЕР'
            : 'ИГРОК 2';
    }
    if (wordPanel0Name) wordPanel0Name.textContent = 'ИГРОК 1';
    if (wordPanel1Name) {
        wordPanel1Name.textContent = state.mode === 'computer'
            ? 'КОМПЬЮТЕР'
            : 'ИГРОК 2';
    }
    if (wordList0El) wordList0El.setAttribute('aria-label', 'Слова Игрока 1');
    if (wordList1El) {
        wordList1El.setAttribute(
            'aria-label',
            state.mode === 'computer' ? 'Слова Компьютера' : 'Слова Игрока 2'
        );
    }
}

// ============================================================
//                       ПОЛЕ
// ============================================================
function initBoard() {
    state.board = Array.from({ length: state.size }, () =>
        Array(state.size).fill(null));
    state.currentPlayer = 0;
    state.scores = [0, 0];
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.usedWords = new Set();
    state.playerWords = [[], []];
    state.moves = 0;
    stopTimer();
}

function placeStartWord(word) {
    const size   = state.size;
    const midRow = (size >> 1) - (size % 2 === 0 ? 1 : 0);
    const midCol = (size - word.length) >> 1;

    for (let i = 0; i < word.length; i++) {
        state.board[midRow][midCol + i] = { letter: word[i], owner: 0 };
    }

    state.currentPlayer = 0;
    state.usedWords.add(word);
    state.playerWords[0].push({ word, points: 0, start: true });
}

function inBounds(r, c) {
    return r >= 0 && r < state.size && c >= 0 && c < state.size;
}

function isAdjacentToLetter(r, c) {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && state.board[nr][nc]) return true;
    }
    return false;
}

function buildBoardDom() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
    boardEl.style.gridTemplateRows    = `repeat(${state.size}, 1fr)`;
    cells = [];
    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const d = document.createElement('div');
            d.className = 'cell empty';
            d.dataset.r = r;
            d.dataset.c = c;
            d.addEventListener('click', () => onCellClick(r, c));
            boardEl.appendChild(d);
            cells.push(d);
        }
    }
}

function render() {
    const selectedSet = new Set(state.selection.map(p => p.r + ',' + p.c));

    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const idx = r * state.size + c;
            const d = cells[idx];
            const cell = state.board[r][c];
            const isPending = state.pending && state.pending.r === r && state.pending.c === c;
            const isTyping  = state.typing  && state.typing.r === r  && state.typing.c === c;
            const isSelected = selectedSet.has(r + ',' + c);

            d.className = 'cell';

            if (cell) {
                d.classList.add('letter', 'owner-' + cell.owner);
                d.textContent = cell.letter;
            } else if (isPending) {
                d.classList.add('pending');
                d.textContent = state.pending.letter;
            } else if (isTyping) {
                d.classList.add('typing');
                d.textContent = '';   // курсор рисуется через ::after
            } else {
                d.classList.add('empty');
                d.textContent = '';
                if (state.phase === 'input' && isAdjacentToLetter(r, c)) {
                    d.classList.add('placeable');
                }
            }

            if (isSelected) d.classList.add('selected');
        }
    }
    renderPreview();
    renderHud();
    renderButtons();
}

function renderPreview() {
    const word = getSelectedWord();
    previewEl.textContent = word ? word.split('').join('·') : '\u00A0';
}

function renderWordList(player, listEl, countEl, animateLast) {
    if (!listEl) return;

    const entries = state.playerWords[player] || [];
    if (countEl) countEl.textContent = entries.length;
    listEl.innerHTML = '';

    if (entries.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'word-list-empty';
        empty.textContent = 'пока нет слов';
        listEl.appendChild(empty);
        return;
    }

    entries.forEach((entry, index) => {
        const item = document.createElement('li');
        item.className = 'word-item' +
            (entry.start ? ' start-word' : '') +
            (animateLast && index === entries.length - 1 ? ' word-enter' : '');

        const text = document.createElement('span');
        text.className = 'word-text';
        text.textContent = entry.word;
        text.title = entry.word;

        const points = document.createElement('span');
        points.className = 'word-points' + (entry.start ? ' start' : '');
        points.textContent = entry.start ? 'старт' : '+' + entry.points;

        item.append(text, points);
        listEl.appendChild(item);
    });

    listEl.scrollTop = listEl.scrollHeight;
}

function renderWordLists(animatePlayer = null) {
    renderWordList(0, wordList0El, wordCount0El, animatePlayer === 0);
    renderWordList(1, wordList1El, wordCount1El, animatePlayer === 1);
}

function renderHud() {
    score0El.textContent = state.scores[0];
    score1El.textContent = state.scores[1];
    turnNameEl.textContent = playerShortName(state.currentPlayer);

    // Подсветка активной панели
    const panel0 = document.getElementById('panel0');
    const panel1 = document.getElementById('panel1');
    if (panel0) panel0.classList.toggle('active', state.currentPlayer === 0);
    if (panel1) panel1.classList.toggle('active', state.currentPlayer === 1);
    if (wordPanel0El) {
        wordPanel0El.classList.toggle('active', state.currentPlayer === 0);
    }
    if (wordPanel1El) {
        wordPanel1El.classList.toggle('active', state.currentPlayer === 1);
    }

    // Таймер
    if (state.timeLeft > 0) {
        timerEl.textContent = formatTime(state.timeLeft * 1000);
        timerEl.classList.toggle('warning', state.timeLeft <= 10);
        timerEl.classList.remove('off');
    } else {
        timerEl.textContent = state.turnSeconds > 0 ? '—' : '∞';
        timerEl.classList.remove('warning');
        timerEl.classList.toggle('off', state.turnSeconds <= 0);
    }
}

function renderButtons() {
    const locked = state.aiBusy;
    acceptBtn.disabled = locked || !(state.phase === 'select' && state.selection.length >= 2);
    clearBtn.disabled  = locked || state.selection.length === 0;
    cancelBtn.disabled = locked || !state.pending;
    document.body.classList.toggle('ai-busy', locked);
}

function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
}

// ============================================================
//                   КЛИКИ ПО КЛЕТКАМ
// ============================================================
function onCellClick(r, c) {
    if (state.aiBusy) return;
    // Клик в другом месте — сбрасываем прежний ввод
    if (state.typing && !(state.typing.r === r && state.typing.c === c)) {
        state.typing = null;
    }
    if (state.paused) return;

    if (state.phase === 'input') {
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        const isEmpty = !cell && !isPending;

        if (!isEmpty) return;

        // Повторный клик по той же клетке — выйти из ввода
        if (state.typing && state.typing.r === r && state.typing.c === c) {
            state.typing = null;
            render();
            return;
        }

        if (!isAdjacentToLetter(r, c)) return;

        // Включаем режим ввода в клетке
        state.typing = { r, c };
        sfx('click'); 
        render();
        focusTypingInput();
        return;
    }

    if (state.phase === 'select') {
        if (state.typing) {
            state.typing = null;
            render();
            return;
        }
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        if (cell || isPending) toggleCell(r, c);
    }
}

// ============================================================
//                   ВВОД БУКВЫ ПРЯМО В КЛЕТКЕ
// ============================================================
function commitTypedLetter(letter) {
    if (!state.typing) return;
    const { r, c } = state.typing;
    state.pending = { r, c, letter };
    state.typing = null;
    state.phase = 'select';
    state.selection = [];
    showStatus('Кликайте клетки по порядку слова — свою букву тоже', 'timer-on', 0);
    sfx('click');
    render();
}

// Скрытый input для вызова системной клавиатуры на мобильных
const hiddenInput = document.createElement('input');
hiddenInput.type = 'text';
hiddenInput.autocomplete = 'off';
hiddenInput.style.cssText =
    'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0;';
document.body.appendChild(hiddenInput);

hiddenInput.addEventListener('input', () => {
    if (state.paused || state.aiBusy) { hiddenInput.value = ''; return; }
    if (!state.typing) { hiddenInput.value = ''; return; }
    const letter = norm(hiddenInput.value.trim()).slice(-1);
    hiddenInput.value = '';
    if (/^[а-я]$/.test(letter)) commitTypedLetter(letter);
});

function focusTypingInput() {
    if ('ontouchstart' in window) {
        // Небольшая задержка помогает Safari на iOS
        setTimeout(() => { try { hiddenInput.focus(); } catch (e) {} }, 0);
    }
}

document.addEventListener('keydown', e => {
    if (state.paused || state.aiBusy) return;
    if (!state.typing) return;

    if (e.key === 'Escape') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }
    if (e.key === 'Backspace' || e.key === 'Enter') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }

    const letter = norm(e.key).trim();
    if (!/^[а-я]$/.test(letter)) return;    // игнорируем не-буквы
    e.preventDefault();
    commitTypedLetter(letter);
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseGame();
    } else {
        resumeGame();
    }
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
    pauseGame();
});

window.addEventListener('focus', () => {
    resumeGame();
});

// ============================================================
//                   СБОР СЛОВА (ломаная)
// ============================================================
function toggleCell(r, c) {
    const idx = state.selection.findIndex(p => p.r === r && p.c === c);

    // Повторный клик по уже выбранной клетке — убрать её
    if (idx >= 0) {
        state.selection.splice(idx, 1);
        sfx('kickSide');
        render();
        return;
    }

    // Первая клетка — можно любую
    if (state.selection.length === 0) {
        state.selection.push({ r, c });
        sfx('click');
        render();
        return;
    }

    // Каждая следующая должна быть 4-соседом предыдущей — и ТОЛЬКО В КОНЕЦ
    const last = state.selection[state.selection.length - 1];
    const isNeighbor =
        (Math.abs(last.r - r) + Math.abs(last.c - c)) === 1;

    if (!isNeighbor) {
        showStatus('Кликните клетку рядом с последней выбранной (не по диагонали)', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    state.selection.push({ r, c });   // ← всегда в конец, порядок = порядок кликов
    sfx('move');
    render();
}

function getSelectedWord() {
    return state.selection.map(({ r, c }) => {
        if (state.pending && state.pending.r === r && state.pending.c === c) {
            return state.pending.letter;
        }
        const cell = state.board[r][c];
        return cell ? cell.letter : '';
    }).join('');
}

// ============================================================
//                   ПРИНЯТИЕ СЛОВА
// ============================================================
function onAccept() {
    if (state.aiBusy) return;
    const word = getSelectedWord();

    if (word.length < 2) {
        showStatus('Выделите минимум 2 буквы', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    // В отправленном слове обязана быть введённая буква игрока
    if (state.pending) {
        const inWord = state.selection.some(
            p => p.r === state.pending.r && p.c === state.pending.c
        );
        if (!inWord) {
            showStatus('В отправленном слове должна быть ваша новая буква', 'bad', 2000);
            sfx('kickFig');
            return;
        }
    }

    // Слова нет в словаре — буква убирается, тикает таймер
    if (!hasWord(word)) {
        const retryNote = state.turnSeconds > 0
            ? ` ${state.turnSeconds} с на новый вариант`
            : '';
        showStatus(`Слова «${word}» нет в словаре. Буква убрана.${retryNote}`, 'bad', 0);
        sfx('kickFig');
        if (state.pending) state.board[state.pending.r][state.pending.c] = null;
        state.pending = null;
        state.selection = [];
        state.phase = 'input';
        startTimer();
        render();
        return;
    }

    // Слово уже было — не принимаем
    if (state.usedWords.has(word)) {
        showStatus(`Слово «${word}» уже было в игре. Придумайте другое`, 'bad', 0);
        sfx('kickFig');
        return;
    }

    // Успех
    if (state.pending) {
        const { r, c, letter } = state.pending;
        state.board[r][c] = { letter, owner: state.currentPlayer };
    }
    state.scores[state.currentPlayer] += word.length;
    state.usedWords.add(word);
    state.playerWords[state.currentPlayer].push({
        word,
        points: word.length,
    });
    state.moves++;
    renderWordLists(state.currentPlayer);
    sfx('linedel');
    showStatus(`+${word.length} очков за «${word}»`, 'ok', 2500);

    stopTimer();
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    beginTurn(350);
    setTimeout(() => {
        if (state.phase !== 'finished' && !state.aiBusy) {
            showStatus(DEFAULT_STATUS, '');
        }
    }, 2500);
}

function onClear() {
    if (state.aiBusy) return;
    const had = state.selection.length > 0;
    state.selection = [];
    if (had) {
        sfx('kickSide');
        showStatus('Выделение сброшено', '', 1500);
    }
    render();
}

function cancelPendingLetter() {
    if (state.aiBusy || !state.pending) return;
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    sfx('kickSide');
    showStatus('Буква убрана. Выберите другую клетку', '', 1600);
    render();
}

function switchPlayer() {
    state.currentPlayer = 1 - state.currentPlayer;
}

// ============================================================
//                   ТАЙМЕР
// ============================================================
function startTimer() {
    if (state.turnSeconds <= 0) {
        state.pendingTimerStart = false;
        stopTimer();
        state.timeLeft = 0;
        renderHud();
        return;
    }
    if (state.paused) {
        state.pendingTimerStart = true;
        return;
    }
    state.pendingTimerStart = false;
    stopTimer();
    state.timeLeft = state.turnSeconds;
    state.startTime = Date.now();
    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, state.turnSeconds - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            onTimeout();
        }
    }, 250);
}

function stopTimer() {
    if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
    }
    //state.timeLeft = 0;
}

function pauseGame() {
    if (state.paused) return;
    state.paused = true;
    state.pausedAt = Date.now();
    state.wasTimerRunning = state.timerId !== null;

    // Останавливаем таймер, но запоминаем оставшееся время
    if (state.timerId) {
        stopTimer();
        // stopTimer() обнуляет timeLeft — восстановим
        state.timeLeft = state.pausedTimeLeft ?? state.timeLeft;
    }
    showStatus('Пауза (вкладка неактивна)', 'timer-on', 0);
    
    document.body.classList.add('paused');
}

function resumeGame() {
    if (!state.paused) return;
    state.paused = false;

    if (state.pendingTimerStart) {
        state.pendingTimerStart = false;
        startTimer();
    } else if (state.wasTimerRunning && state.timeLeft > 0) {
        // Если таймер шёл до паузы — возобновляем
        resumeTimer(state.timeLeft);
    }
    state.wasTimerRunning = false;

    if (state.phase !== 'finished' && !state.aiBusy) {
        showStatus(DEFAULT_STATUS, '');
    }
    document.body.classList.remove('paused');
}

function resumeTimer(leftSeconds) {
    if (state.timerId || state.turnSeconds <= 0 || leftSeconds <= 0) return;
    state.timeLeft = leftSeconds;
    state.startTime = Date.now() - (state.turnSeconds - leftSeconds) * 1000;

    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, state.turnSeconds - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            state.timeLeft = 0;
            onTimeout();
        }
    }, 250);
}

function onTimeout() {
    if (state.aiBusy || state.turnSeconds <= 0) return;
    showStatus('Время вышло! Буква убрана, ход переходит', 'bad', 2500);
    sfx('death');
    if (state.pending) state.board[state.pending.r][state.pending.c] = null;
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    sfx('rot');
    beginTurn(350);
}

// ============================================================
//                   ХОД КОМПЬЮТЕРА
// ============================================================
let aiBrain = null;
let aiTimers = [];
let aiGeneration = 0;

function setAiBusy(value) {
    state.aiBusy = value;
    document.body.classList.toggle('ai-busy', value);
    renderButtons();
}

function clearAiTimers() {
    aiGeneration++;
    for (const id of aiTimers) clearTimeout(id);
    aiTimers = [];
}

function aiLater(fn, delay) {
    const generation = aiGeneration;
    const id = setTimeout(() => {
        aiTimers = aiTimers.filter(timer => timer !== id);
        if (generation !== aiGeneration) return;
        fn();
    }, delay);
    aiTimers.push(id);
    return id;
}

function getAiBrain() {
    if (aiBrain || !AI_AVAILABLE) return aiBrain;
    try {
        aiBrain = new window.ComputerBrain(WORD_SET);
    } catch (e) {
        console.warn('ComputerBrain: не удалось создать ИИ', e);
        aiBrain = null;
    }
    return aiBrain;
}

function warmUpAiBrain() {
    if (aiBrain || !AI_AVAILABLE) return;
    const build = () => getAiBrain();
    if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(build, { timeout: 1500 });
    } else {
        setTimeout(build, 150);
    }
}

function buildBoardMap() {
    const map = new Map();
    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const cell = state.board[r][c];
            if (cell) map.set(r + ',' + c, cell.letter);
        }
    }
    return map;
}

function validateAiMove(move) {
    if (!move || typeof move.word !== 'string' ||
        !Array.isArray(move.cells) || move.cells.length === 0) {
        return null;
    }

    const word = norm(move.word);
    if (word.length !== move.cells.length ||
        !hasWord(word) || state.usedWords.has(word)) {
        return null;
    }

    const cells = [];
    const seen = new Set();
    let newCell = null;
    let built = '';

    for (let i = 0; i < move.cells.length; i++) {
        const r = Number(move.cells[i] && move.cells[i].r);
        const c = Number(move.cells[i] && move.cells[i].c);

        if (!Number.isInteger(r) || !Number.isInteger(c) ||
            r < 0 || c < 0 || r >= state.size || c >= state.size) {
            return null;
        }

        const key = r + ',' + c;
        if (seen.has(key)) return null;
        seen.add(key);

        if (cells.length > 0) {
            const prev = cells[cells.length - 1];
            if (Math.abs(prev.r - r) + Math.abs(prev.c - c) !== 1) {
                return null;
            }
        }

        const boardCell = state.board[r][c];
        if (boardCell) {
            built += boardCell.letter;
        } else {
            if (newCell) return null;
            newCell = { r, c, letter: word[i] };
            built += word[i];
        }
        cells.push({ r, c });
    }

    if (!newCell || built !== word) return null;
    return { word, cells, newCell };
}

function beginTurn(delay = 0) {
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;

    const aiTurn = state.mode === 'computer' &&
        state.currentPlayer === 1 &&
        state.phase !== 'finished';

    setAiBusy(aiTurn);
    render();

    if (aiTurn) {
        aiLater(() => {
            if (!state.aiBusy || state.currentPlayer !== 1 ||
                state.mode !== 'computer') {
                return;
            }
            showStatus('Компьютер думает…', 'timer-on', 0);
            aiLater(runComputerMove, 450);
        }, Math.max(100, delay));
        return;
    }

    startTimer();
}

function runComputerMove() {
    if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
        state.phase === 'finished') {
        setAiBusy(false);
        return;
    }

    const brain = getAiBrain();
    if (!brain) {
        aiPass('ИИ недоступен');
        return;
    }

    let rawMove = null;
    try {
        rawMove = brain.findBestMove({
            board: buildBoardMap(),
            letters: AI_LETTERS,
            usedWords: state.usedWords,
            minLen: 2,
            size: state.size,
        });
    } catch (e) {
        console.warn('ComputerBrain: ошибка поиска хода', e);
    }

    const move = validateAiMove(rawMove);
    if (!move) {
        aiPass('Компьютер не нашёл слово');
        return;
    }

    animateComputerMove(move);
}

function animateComputerMove(move) {
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;
    state.selection = [];
    state.pending = {
        r: move.newCell.r,
        c: move.newCell.c,
        letter: move.newCell.letter,
    };
    state.phase = 'select';
    render();
    showStatus(`Компьютер ставит «${move.newCell.letter}»`, 'timer-on', 0);
    sfx('click');

    let index = 0;

    const selectNext = () => {
        if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
            state.phase !== 'select' || !state.pending) {
            setAiBusy(false);
            return;
        }

        if (index >= move.cells.length) {
            showStatus(`Компьютер: «${move.word}»`, 'ok', 0);
            aiLater(submitComputerMove, 420);
            return;
        }

        const cell = move.cells[index++];
        toggleCell(cell.r, cell.c);
        aiLater(selectNext, index === 1 ? 90 : 180);
    };

    aiLater(selectNext, 260);
}

function submitComputerMove() {
    if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
        state.phase !== 'select' || !state.pending) {
        setAiBusy(false);
        return;
    }

    const word = getSelectedWord();
    const hasPendingCell = state.selection.some(
        p => p.r === state.pending.r && p.c === state.pending.c
    );

    if (!hasWord(word) || state.usedWords.has(word) || !hasPendingCell) {
        aiPass('Компьютер не смог подтвердить слово');
        return;
    }

    setAiBusy(false);
    onAccept();
}

function aiPass(message) {
    setAiBusy(false);
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    showStatus(message + '. Ход переходит', 'bad', 2200);
    sfx('kickFig');
    render();
    beginTurn(400);
}

// ============================================================
//                   СТАРТ / РЕСТАРТ
// ============================================================
function startGame() {
    const raw = norm(startWordIn.value.trim());
    startError.textContent = '';

    if (!raw) { startError.textContent = 'Введите слово'; sfx('kickFig'); return; }
    if (!/^[а-я]+$/.test(raw)) { startError.textContent = 'Только русские буквы'; sfx('kickFig'); return; }
    if (raw.length < MIN_START_LEN || raw.length > MAX_START_LEN) {
        startError.textContent = `Длина от ${MIN_START_LEN} до ${MAX_START_LEN} букв`;
        sfx('kickFig');
        return;
    }
    if (!WORD_SET.size) {
        startError.textContent = 'Словарь не загружен (russian_nouns.txt.js)';
        sfx('kickFig');
        return;
    }
    if (!hasWord(raw)) {
        startError.textContent = 'Такого слова нет в словаре';
        sfx('kickFig');
        return;
    }
    if (state.mode === 'computer' && !AI_AVAILABLE) {
        startError.textContent = 'Модуль ИИ не загружен (computer-brain.js)';
        sfx('kickFig');
        return;
    }

    state.turnSeconds = applyTimerInput();
    clearAiTimers();
    setAiBusy(false);
    updatePlayerLabels();

    state.size = raw.length;
    initBoard();
    state.paused = false;
    state.wasTimerRunning = false;
    state.pendingTimerStart = false;
    placeStartWord(raw);
    buildBoardDom();
    renderWordLists(0);
    state.phase = 'input';
    startScreen.classList.add('hidden');
    resultScreen.classList.remove('visible');
    showStatus(
        `Стартовое слово «${raw}». Ход: ${playerFullName(state.currentPlayer)}`,
        '',
        3000
    );
    sfx('rot');
    render();
    beginTurn();

    if (state.mode === 'computer') warmUpAiBrain();
}

function restartGame() {
    clearAiTimers();
    setAiBusy(false);
    resultScreen.classList.remove('visible');
    startScreen.classList.remove('hidden');
    startWordIn.value = '';
    startError.textContent = '';
    stopTimer();
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.paused = false;
    state.wasTimerRunning = false;
    state.pendingTimerStart = false;
    state.timeLeft = 0;
    state.playerWords = [[], []];
    boardEl.innerHTML = '';
    previewEl.textContent = '\u00A0';
    renderWordLists();
    updatePlayerLabels();
    showStatus('Выберите соперника и введите стартовое слово', '');
}

// ============================================================
//                   ОБРАБОТЧИКИ
// ============================================================
function updateModeSelection() {
    for (const card of modeCards) {
        const selected = card.dataset.mode === state.mode;
        card.classList.toggle('selected', selected);
        card.setAttribute('aria-pressed', selected ? 'true' : 'false');
    }
    updatePlayerLabels();
    renderHud();
}

for (const card of modeCards) {
    if (card.dataset.mode === 'computer' && !AI_AVAILABLE) {
        card.disabled = true;
        const desc = card.querySelector('.mode-desc');
        if (desc) desc.textContent = 'недоступен';
        continue;
    }
    card.addEventListener('click', () => {
        if (card.disabled) return;
        state.mode = card.dataset.mode === 'computer' ? 'computer' : 'human';
        updateModeSelection();
        if (state.mode === 'computer') warmUpAiBrain();
        sfx('click');
    });
}

updateModeSelection();
renderWordLists();

document.getElementById('btnStart').addEventListener('click', startGame);
startWordIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        startGame();
        return;
    }
    // Озвучка набора буквы в поле стартового слова
    const k = norm(e.key).trim();
    if (/^[а-я]$/.test(k)) sfx('click');
});

acceptBtn.addEventListener('click', onAccept);
clearBtn.addEventListener('click', onClear);
cancelBtn.addEventListener('click', cancelPendingLetter);

// ============================================================
//                   ПОЛНЫЙ ЭКРАН
// ============================================================
const fsBtn  = document.getElementById('btnFullscreen');
const fsIcon = document.getElementById('fsIcon');
const fsTarget = document.documentElement;

function isFullscreen() {
    return document.fullscreenElement ||
           document.webkitFullscreenElement ||
           document.msFullscreenElement;
}
function updateFsIcon() {
    fsIcon.textContent = isFullscreen() ? '⤡' : '⛶';
}
function toggleFullscreen() {
    if (!isFullscreen()) {
        const req = fsTarget.requestFullscreen ||
                    fsTarget.webkitRequestFullscreen ||
                    fsTarget.msRequestFullscreen;
        if (req) {
            const p = req.call(fsTarget);
            if (p && p.catch) p.catch(() => {});
        }
    } else {
        const exit = document.exitFullscreen ||
                     document.webkitExitFullscreen ||
                     document.msExitFullscreen;
        if (exit) {
            const p = exit.call(document);
            if (p && p.catch) p.catch(() => {});
        }
    }
}
fsBtn.addEventListener('click', toggleFullscreen);
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
    .forEach(evt => document.addEventListener(evt, updateFsIcon));

updateFsIcon();

// ============================================================
//                   КНОПКА MUTE
// ============================================================
const muteBtn = document.getElementById('btnMute');
let muted = false;
if (muteBtn) {
    muteBtn.addEventListener('click', e => {
        e.stopPropagation();
        muted = !muted;
        if (kit && typeof kit.setMuted === 'function') kit.setMuted(muted);
        muteBtn.textContent = muted ? '🔇' : '🔊';
    });
}

// ============================================================
//                   ОЧИСТКА ЗВУКОВ ПРИ УХОДЕ
// ============================================================
const backBtn = document.getElementById('backBtn');
if (backBtn) {
    backBtn.addEventListener('click', () => {
        if (kit && typeof kit.dispose === 'function') kit.dispose();
    });
}

// ============================================================
//                   ЭКСПОРТ
// ============================================================
window.restartGame = restartGame;

// Проверка словаря
if (!window.WORDS) {
    console.warn('Словарь не найден: подключите russian_nouns.txt.js до основного скрипта.');
    startError.textContent = 'Словарь не загружен';
} else {
    console.log('Словарь загружен, слов:', WORD_SET.size);
}

})();
</script>
</body>
