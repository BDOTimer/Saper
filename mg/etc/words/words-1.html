<!--
ТЗ: Игра «Слова» (2 игрока, оффлайн) — 40 пунктов
Игра запускается из локального HTML-файла без сервера и интернета.
Словарь подключается отдельным скриптом как window.WORDS (Set).
При отсутствии словаря показывается понятная ошибка запуска.
Поиск по словарю — точное совпадение, с нормализацией регистра и «ё/е».
Игра рассчитана на двух игроков на одном устройстве, по очереди.
На старте Игрок 1 вводит слово из словаря длиной 5–12 букв.
Длина стартового слова задаёт размер квадратного поля N×N.
Поле адаптивно масштабируется под экран; клетки — квадратные.
Стартовое слово размещается горизонтально в середине поля.
Стартовое слово принадлежит Игроку 1 и очков ему не приносит.
Первым ходит Игрок 1; активный игрок подсвечен в HUD.
За один ход игрок ставит на поле ровно одну букву.
Буква ставится в пустую клетку, соседнюю (4-соседство) с любой буквой.
Диагональное соседство при постановке буквы запрещено.
Буква вводится прямо в клетке: физическая или экранная клавиатура.
Ввод не-русской буквы игнорируется, клетка остаётся в режиме ввода.
Отмена ввода: повторный клик по клетке, Esc, Backspace или Enter.
После ввода буква подсвечивается как «ожидающая» и мигает.
Игрок кликами собирает слово из букв на поле по порядку.
Слово может идти по ломаной линии только по 4-соседству.
Порядок кликов задаёт порядок букв: слева/справа, сверху/снизу.
Клик по соседу первой буквы добавляет её в начало слова.
Клик по соседу последней буквы добавляет её в конец слова.
Повторный клик по выбранной клетке убирает её из слова.
Буква игрока может стоять в любом месте слова, не только первой.
Превью слова показывается под полем через разделитель «·».
Кнопка «Принять» активна, когда выделено минимум две буквы.
Принятое слово проверяется по словарю; повтор слов запрещён.
За принятое слово игроку начисляются очки, равные длине слова.
После успеха буква фиксируется, счёт растёт, ход переходит сопернику.
При успехе таймер сбрасывается; новый ход начинается без таймера.
Если слова нет в словаре — буква убирается, запускается таймер 60 с.
По истечении таймера буква убирается, ход переходит сопернику.
Если слово уже было в игре — ошибка, ход не меняется, буква остаётся.
Кнопка «Сброс» очищает выделение; «Убрать букву» снимает pending.
Клетки игроков различаются цветом; счёт обоих виден в HUD.
Звуки берутся из res/tetris/1/ через SoundKit; есть кнопка mute.
Кнопка «← Меню» освобождает звуковые ресурсы (kit.dispose()).
Есть кнопка полноэкранного режима для мобильных устройств.
Стиль — неоновый «киан/чёрный».
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Игра «Слова»</title>
<link rel="icon" type="image/png" href="../../res/favicon-64.png" sizes="64x64">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
    }

    html { background-color: #04060d; }
    body { background-color: transparent; }

    /* ================= ФОН-ЗАСТАВКА ================= */
    #bgArt {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }
    .bg-veil {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
            repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
            radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 38%, rgba(2, 3, 8, 0.66) 100%),
            linear-gradient(180deg, rgba(3, 5, 12, 0.42), rgba(3, 5, 12, 0) 28%, rgba(3, 5, 12, 0.28) 100%),
            linear-gradient(rgba(4, 6, 14, 0.14), rgba(4, 6, 14, 0.14));
    }

    .game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        height: 100%;
        position: relative;
        padding: 70px 10px 14px;
        overflow-y: auto;
        touch-action: manipulation;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 255, 255, 0.35) transparent;
    }
    .game-wrapper::-webkit-scrollbar { width: 6px; }
    .game-wrapper::-webkit-scrollbar-track { background: transparent; }
    .game-wrapper::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.35);
        border-radius: 999px;
        box-shadow: 0 0 6px rgba(0, 255, 255, 0.45);
    }

/* ================= ТАБЛО СЧЁТА ================= */
.scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: clamp(8px, 2vw, 18px);
    width: min(96vw, 640px);
    margin-bottom: clamp(10px, 2vh, 18px);
    align-items: stretch;
    z-index: 20;
    position: relative;
}

.player-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.8vh, 14px) clamp(8px, 2vw, 16px);
    border-radius: 14px;
    background: rgba(0, 255, 255, 0.04);
    border: 2px solid rgba(0, 255, 255, 0.25);
    box-shadow:
        inset 0 0 18px rgba(0, 255, 255, 0.08),
        0 0 14px rgba(0, 255, 255, 0.15);
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
}

/* Активный игрок — всегда розовое сияние, независимо от номера */
.player-panel.active {
    border-color: #f0f;
    background: rgba(255, 0, 255, 0.12);
    box-shadow:
        inset 0 0 26px rgba(255, 0, 255, 0.35),
        0 0 28px rgba(255, 0, 255, 0.7),
        0 0 60px rgba(255, 0, 255, 0.4);
    animation: glowPulseActive 2s ease-in-out infinite alternate;
}

@keyframes glowPulseActive {
    from { box-shadow:
        inset 0 0 22px rgba(255, 0, 255, 0.3),
        0 0 22px rgba(255, 0, 255, 0.55),
        0 0 50px rgba(255, 0, 255, 0.3); }
    to   { box-shadow:
        inset 0 0 30px rgba(255, 0, 255, 0.45),
        0 0 34px rgba(255, 0, 255, 0.85),
        0 0 80px rgba(255, 0, 255, 0.55); }
}

.player-label {
    font-size: clamp(9px, 2.2vw, 12px);
    letter-spacing: 3px;
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    opacity: 0.75;
    margin-bottom: 4px;
    white-space: nowrap;
}


/* БОЛЬШИЕ ОБЪЁМНЫЕ ЦИФРЫ */
.player-score {
    font-size: clamp(28px, 9vw, 52px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 1px;
    color: #0ff;
    text-shadow:
        0 1px 0 #066,
        0 2px 0 #055,
        0 3px 0 #044,
        0 4px 0 #033,
        0 5px 0 #022,
        0 6px 0 #011,
        0 0 12px #0ff,
        0 0 24px #0ff,
        0 0 42px #0ff;
    transition: transform 0.2s ease;
}


/* Подсветка цифр активного игрока */
/* Цифры активного игрока — розовые и пульсируют */
.player-panel.active .player-score {
    color: #f0f;
    text-shadow:
        0 1px 0 #606,
        0 2px 0 #505,
        0 3px 0 #404,
        0 4px 0 #303,
        0 5px 0 #202,
        0 6px 0 #101,
        0 0 12px #f0f,
        0 0 24px #f0f,
        0 0 42px #f0f;
    animation: scorePulse 1.6s ease-in-out infinite alternate;
}

@keyframes scorePulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
}

.player-panel.active .player-label {
    color: #f0f;
    text-shadow:
        0 0 8px #f0f,
        0 0 16px #f0f,
        0 0 28px #f0f;
    opacity: 1;
    animation: labelGlow 1.6s ease-in-out infinite alternate;
}

/* Центральный блок — ход + таймер */
.board-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 10px;
    min-width: 70px;
    text-align: center;
}
.turn-label {
    font-size: clamp(8px, 2vw, 11px);
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 2px;
}
.turn-name {
    font-size: clamp(16px, 4.5vw, 24px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fc0;
    text-shadow: 0 0 12px #fc0, 0 0 22px #fc0;
    margin-bottom: 6px;
}
.timer-value {
    font-size: clamp(13px, 3.4vw, 18px);
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 16px #0ff;
    min-height: 1em;
}
.timer-value.warning {
    color: #f0f;
    text-shadow: 0 0 10px #f0f, 0 0 22px #f0f;
    animation: timerBlink 0.6s step-end infinite;
}
.timer-value.off {
    color: rgba(0, 255, 255, 0.35);
    text-shadow: 0 0 8px rgba(0, 255, 255, 0.35);
}
@keyframes timerBlink {
    50% { opacity: 0.35; }
}

    .status {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        color: #0ff;
        font-size: clamp(11px, 3vw, 16px);
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px #0ff;
        white-space: nowrap;
        z-index: 20;
        pointer-events: none;
        max-width: 96vw;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    .status.thinking { animation: statusPulse 1.1s ease-in-out infinite; }
    .status.bad { color: #f0f; text-shadow: 0 0 12px #f0f; }
    .status.ok  { color: #0f0; text-shadow: 0 0 12px #0f0; }
    .status.timer-on { color: #fc0; text-shadow: 0 0 12px #fc0; }

    @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
    }

    /* ================= СПИСКИ СЛОВ ПО БОКАМ ================= */
    .play-area {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: clamp(10px, 2vw, 22px);
        width: min(96vw, 1060px);
    }

    .game-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 0 1 520px;
        width: 100%;
        max-width: min(520px, 92vw);
        min-width: 0;
    }

    .word-panel {
        --accent: 0, 255, 255;
        --accent-solid: #0ff;
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1 1 140px;
        min-width: 0;
        max-width: 230px;
        padding: 12px 10px 10px;
        border-radius: 16px;
        border: 2px solid rgba(var(--accent), 0.28);
        background:
            linear-gradient(180deg, rgba(var(--accent), 0.09), transparent 45%),
            repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.018) 0 1px,
                transparent 1px 4px
            ),
            rgba(3, 7, 16, 0.72);
        box-shadow:
            0 0 22px rgba(var(--accent), 0.14),
            inset 0 0 28px rgba(var(--accent), 0.05);
        overflow: hidden;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .word-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--accent-solid), transparent);
        box-shadow: 0 0 12px var(--accent-solid);
        opacity: 0.7;
        pointer-events: none;
    }
    .word-panel::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        background: linear-gradient(180deg, transparent, rgba(3, 7, 16, 0.78));
        pointer-events: none;
    }
    .word-panel.active::before { opacity: 1; }
    .word-panel.active .word-panel-name {
        text-shadow:
            0 0 10px rgba(var(--accent), 0.95),
            0 0 22px rgba(var(--accent), 0.55);
    }
    .word-panel-1 {
        --accent: 255, 0, 255;
        --accent-solid: #f0f;
    }
    .word-panel.active {
        border-color: rgba(var(--accent), 0.75);
        box-shadow:
            0 0 30px rgba(var(--accent), 0.35),
            0 0 60px rgba(var(--accent), 0.12),
            inset 0 0 34px rgba(var(--accent), 0.1);
    }
    .word-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 3px 9px;
        border-bottom: 1px solid rgba(var(--accent), 0.18);
    }
    .word-panel-name {
        display: flex;
        align-items: center;
        min-width: 0;
        color: var(--accent-solid);
        font-size: clamp(9px, 1.6vw, 11px);
        font-weight: bold;
        letter-spacing: 1.8px;
        text-shadow: 0 0 10px rgba(var(--accent), 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .word-panel-name::before {
        content: '';
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--accent-solid);
        box-shadow: 0 0 8px var(--accent-solid), 0 0 16px rgba(var(--accent), 0.7);
        opacity: 0.65;
    }
    .word-panel.active .word-panel-name::before {
        opacity: 1;
        animation: panelDot 1.4s ease-in-out infinite alternate;
    }
    @keyframes panelDot {
        from { transform: scale(0.85); }
        to   { transform: scale(1.15); }
    }
    .word-panel-count {
        flex: 0 0 auto;
        min-width: 24px;
        padding: 2px 7px;
        border: 1px solid rgba(var(--accent), 0.4);
        border-radius: 999px;
        background: rgba(var(--accent), 0.1);
        color: var(--accent-solid);
        font-size: 10px;
        font-weight: bold;
        line-height: 1.35;
        text-align: center;
        text-shadow: 0 0 8px rgba(var(--accent), 0.8);
    }
    .word-list {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        margin-top: 9px;
        padding: 1px 2px 18px 0;
        overflow-x: hidden;
        overflow-y: auto;
        list-style: none;
        scrollbar-width: thin;
        scrollbar-color: rgba(var(--accent), 0.45) rgba(0, 0, 0, 0.2);
    }
    .word-list::-webkit-scrollbar { width: 5px; }
    .word-list::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 999px;
    }
    .word-list::-webkit-scrollbar-thumb {
        background: rgba(var(--accent), 0.45);
        border-radius: 999px;
        box-shadow: 0 0 6px rgba(var(--accent), 0.5);
    }
    .word-list-empty {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 8px 6px;
        border: 1px dashed rgba(var(--accent), 0.18);
        border-radius: 10px;
        color: rgba(var(--accent), 0.4);
        font-size: 10px;
        letter-spacing: 1px;
        text-align: center;
    }
    .word-item {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border: 1px solid rgba(var(--accent), 0.16);
        border-left: 3px solid rgba(var(--accent), 0.7);
        border-radius: 9px;
        background: rgba(var(--accent), 0.055);
        box-shadow: inset 0 0 12px rgba(var(--accent), 0.05);
        transition: background 0.18s ease, border-color 0.18s ease,
                    box-shadow 0.18s ease, transform 0.18s ease;
    }
    .word-item:hover {
        background: rgba(var(--accent), 0.12);
        border-color: rgba(var(--accent), 0.38);
        box-shadow: inset 0 0 16px rgba(var(--accent), 0.1),
                    0 0 12px rgba(var(--accent), 0.18);
        transform: translateX(2px);
    }
    .word-item.word-enter {
        animation: wordEnter 0.38s cubic-bezier(0.2, 0.85, 0.25, 1) both;
    }
    @keyframes wordEnter {
        from { opacity: 0; transform: translateY(7px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .word-text {
        min-width: 0;
        overflow: hidden;
        color: #e8ffff;
        font-size: clamp(11px, 1.5vw, 14px);
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(var(--accent), 0.55);
        white-space: nowrap;
        text-overflow: ellipsis;
    }
    .word-points {
        flex: 0 0 auto;
        color: var(--accent-solid);
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.6px;
        text-shadow: 0 0 8px rgba(var(--accent), 0.75);
        opacity: 0.85;
        white-space: nowrap;
    }
    .word-item.start-word {
        border-left-style: dashed;
        background: rgba(var(--accent), 0.025);
    }
    .word-item.start-word .word-text {
        font-style: italic;
        opacity: 0.8;
    }
    .word-points.start {
        padding: 1px 5px;
        border: 1px solid rgba(var(--accent), 0.28);
        border-radius: 999px;
        font-size: 8px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        opacity: 0.65;
    }

    /* ================= ДОСКА (адаптивный N×N) ================= */
    .board {
        display: grid;
        gap: clamp(4px, 1.2vw, 8px);
        width: min(100%, 60vh, 520px);
        aspect-ratio: 1 / 1;
        padding: clamp(6px, 1.6vw, 10px);
        background: rgba(2, 8, 16, 0.55);
        border: 2px solid #0ff;
        border-radius: 14px;
        box-shadow:
            0 0 30px rgba(0, 255, 255, 0.4),
            inset 0 0 30px rgba(0, 255, 255, 0.08);
        position: relative;
    }

    .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-family: inherit;
        font-size: clamp(14px, 4vw, 26px);
        font-weight: bold;
        user-select: none;
        -webkit-user-select: none;
        color: #0ff;
        text-shadow: 0 0 10px #0ff, 0 0 22px #0ff;
        background: rgba(0, 255, 255, 0.12);
        border: 2px solid rgba(0, 255, 255, 0.45);
        box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.15);
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.2s ease;
        will-change: transform;
        position: relative;
        z-index: 1;
    }

    .cell.empty {
        background: transparent;
        border: 2px dashed rgba(0, 255, 255, 0.2);
        box-shadow: none;
        color: transparent;
        text-shadow: none;
        cursor: default;
    }

    .cell.placeable {
        cursor: pointer;
        background: rgba(0, 255, 255, 0.06);
        border-color: rgba(0, 255, 255, 0.55);
        box-shadow: inset 0 0 14px rgba(0, 255, 255, 0.25);
    }
    .cell.placeable:hover {
        background: rgba(0, 255, 255, 0.18);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.4);
    }

    .cell.letter { cursor: pointer; }
    .cell.letter:hover {
        background: rgba(0, 255, 255, 0.2);
        box-shadow: inset 0 0 22px rgba(0, 255, 255, 0.3);
    }

    .cell.pending {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.15);
        box-shadow: inset 0 0 20px rgba(255, 200, 0, 0.35);
        animation: pendingPulse 1s ease-in-out infinite;
    }
    @keyframes pendingPulse {
        0%, 100% { box-shadow: inset 0 0 18px rgba(255, 200, 0, 0.25); }
        50%      { box-shadow: inset 0 0 28px rgba(255, 200, 0, 0.7); }
    }

    /* Режим ввода буквы прямо в клетке */
    .cell.typing {
        color: #fc0;
        text-shadow: 0 0 10px #fc0, 0 0 22px #fc0;
        border-color: #fc0;
        background: rgba(255, 200, 0, 0.18);
        box-shadow: inset 0 0 22px rgba(255, 200, 0, 0.4), 0 0 18px rgba(255, 200, 0, 0.5);
        outline: none;
        font-size: clamp(16px, 4.5vw, 28px);
    }
    .cell.typing::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #fc0;
        margin-left: 2px;
        animation: caretBlink 0.8s step-end infinite;
        vertical-align: text-bottom;
    }
    @keyframes caretBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }

    .cell.selected {
        color: #000 !important;
        text-shadow: none !important;
        background: #0ff !important;
        border-color: #0ff !important;

    }

    .cell.owner-0 { color: #9cf; }
    .cell.owner-1 { color: #fcf; }

    .preview {
        text-align: center;
        font-size: clamp(14px, 3.6vw, 18px);
        letter-spacing: 3px;
        color: #fc0;
        text-shadow: 0 0 10px #fc0;
        min-height: 26px;
        margin-top: clamp(10px, 2vh, 16px);
        font-weight: bold;
    }

    .controls {
        display: flex;
        gap: 8px;
        margin-top: clamp(10px, 2vh, 16px);
        flex-wrap: wrap;
        justify-content: center;
        max-width: 96vw;
    }

    .btn {
        padding: clamp(8px, 2vh, 12px) clamp(12px, 3vw, 18px);
        font-family: inherit;
        font-size: clamp(11px, 2.8vw, 14px);
        letter-spacing: 1.5px;
        background: #0ff;
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 0 30px rgba(0, 255, 255, 0.9); }
    .btn.secondary {
        background: transparent; color: #0ff;
        border: 2px solid #0ff;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    }
    .btn.warn {
        background: transparent; color: #fc0;
        border: 2px solid #fc0;
        box-shadow: 0 0 12px rgba(255, 200, 0, 0.4);
    }
    .btn.danger {
        background: transparent; color: #f0f;
        border: 2px solid #f0f;
        box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
    }
    .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
    }

    .corner-btn {
        position: absolute;
        top: 10px;
        padding: 7px 14px;
        font-family: inherit;
        font-size: clamp(12px, 3vw, 15px);
        background: rgba(0, 255, 255, 0.15);
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);

    .corner-btn:active {

    .back-btn { left: 10px; }
    .fs-btn   { right: 10px; display: inline-flex; align-items: center; gap: 6px; }
    .mute-btn { right: 62px; display: inline-flex; align-items: center; gap: 6px; }

    /* ============ СТАРТОВЫЙ ЭКРАН ============ */
    .start-screen {
        --start-w: min(340px, 84vw);
        position: absolute;
        inset: 0;
        background: rgba(3, 5, 12, 0.48);

        align-items: center;
        justify-content: center;
        flex-direction: column;

        gap: 18px;

    }

    /* Общая ширина: левые и правые края блоков на одной линии */

    .start-screen #startWord,
    .start-screen .timer-setting,
    .start-screen #btnStart {
        width: var(--start-w);
        max-width: 100%;
    }

    /* Объёмная кнопка «Начать игру»: тёмный торец снизу */

        background: linear-gradient(180deg, #8fffff 0%, #0ff 48%, #00c9c9 100%);

            0 5px 0 #007d7d,

        transform: translateY(3px);

            0 4px 12px rgba(0, 255, 255, 0.45);

    /* Пока открыта заставка, игровая раскладка не просвечивает */
    body:not(.in-game) .scoreboard,
    body:not(.in-game) .status,

        opacity: 0;
        pointer-events: none;
    }
    .start-screen h2 {
        color: #0ff;
        font-size: clamp(20px, 6vw, 28px);
        text-shadow: 0 0 20px #0ff;
        letter-spacing: 2px;
    }
    .start-screen p {
        color: #fff;
        font-size: clamp(13px, 3.6vw, 16px);
        text-shadow: 0 0 10px #0ff;
        max-width: 520px;
        line-height: 1.4;
    }
    .start-screen input {
        padding: 12px 16px;
        font-family: inherit;

    /* ============ ВЫБОР СОПЕРНИКА ============ */

    .mode-card {
        position: relative;
        display: flex;

    .mode-card::before {
        content: '';

    .mode-card[data-mode="computer"].selected {

    /* ============ НАСТРОЙКА ТАЙМЕРА ============ */
    .timer-setting {
        display: grid;
        grid-template-columns: auto auto;
        justify-content: center;
        align-items: center;
        column-gap: 14px;
        row-gap: 5px;

    .timer-setting label {
        color: #0ff;
        font-size: clamp(9px, 2.6vw, 11px);

    .timer-field {
        display: flex;
        align-items: center;
        gap: 7px;
    }
    .start-screen .timer-setting input {
        width: 78px;
        padding: 6px 8px;
        font-family: inherit;
        font-size: clamp(16px, 4vw, 20px);
        font-weight: bold;
        text-align: center;
        letter-spacing: 1px;
        color: #fc0;
        background: rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 200, 0, 0.45);
        border-radius: 9px;
        outline: none;
        box-shadow: inset 0 0 10px rgba(255, 200, 0, 0.08);
        text-transform: none;
        appearance: textfield;
        -webkit-appearance: none;
        -moz-appearance: textfield;
    }
    .start-screen .timer-setting input:focus {
        border-color: #fc0;
        box-shadow:
            0 0 18px rgba(255, 200, 0, 0.45),

    .timer-setting input::-webkit-outer-spin-button,
    .timer-setting input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    .timer-unit {
        color: rgba(255, 200, 0, 0.75);
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-shadow: 0 0 8px rgba(255, 200, 0, 0.45);
    }
    .timer-hint {
        grid-column: 1 / -1;
        color: rgba(160, 240, 255, 0.45);
        font-size: 10px;
        letter-spacing: 0.4px;
        text-align: center;
        white-space: nowrap;
    }

    /* ============ ЭКРАН РЕЗУЛЬТАТА ============ */
    .result-screen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 35;
        text-align: center;
        padding: 20px;
        gap: 18px;
    }
    .result-screen.visible { display: flex; }
    .result-screen h2 {
        color: #0ff;
        font-size: clamp(22px, 7vw, 34px);
        text-shadow: 0 0 20px #0ff;
        letter-spacing: 3px;
    }
    .result-screen p {
        color: #fff;
        font-size: clamp(14px, 4vw, 18px);
        text-shadow: 0 0 10px #0ff;
    }
    .result-screen button {
        padding: 14px 30px;
        font-family: inherit;
        font-size: clamp(15px, 4vw, 19px);
        background: #0ff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
    
    body.paused .board {
        filter: grayscale(0.6) brightness(0.7);
        pointer-events: none;
    }
    body.paused .controls {
        opacity: 0.4;
        pointer-events: none;
    }

    body.ai-busy .board {
        pointer-events: none;
    }
    body.ai-busy .controls {
        opacity: 0.4;
        pointer-events: none;
    }

    @media (max-width: 880px) {
        .play-area {
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-center {
            order: 3;
            flex: 1 1 100%;
            max-width: min(520px, 92vw);
        }
        .word-panel {
            order: 1;
            flex: 1 1 calc(50% - 5px);

        .word-panel-name { font-size: 10px; }
        .word-text { font-size: 12.5px; }

    }
</style>
</head>
