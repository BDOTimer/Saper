<script>
(() => {
'use strict';

// ============================================================
//                       ЗВУК
// ============================================================
let kit = null;
try {
    if (typeof SoundKit !== 'undefined') {
        kit = SoundKit.createSoundKit({
            move    : { src: '../../res/tetris/1/move-1.mp3',      volume: 0.3, pool: 3 },
            rot     : { src: '../../res/tetris/1/rot-1.mp3',       volume: 0.3, pool: 3 },
            kickFig : { src: '../../res/tetris/1/kick-fig-1.mp3',  volume: 0.4, pool: 2 },
            kickSide: { src: '../../res/tetris/1/kick-side-1.mp3', volume: 0.4, pool: 2 },
            linedel : { src: '../../res/tetris/1/linedel-1.mp3',   volume: 0.5, pool: 2 },
            death   : { src: '../../res/tetris/1/death.mp3',       volume: 0.1, pool: 1 },
            click   : { src: '../../res/dzin-1.mp3'        ,       volume: 0.5, pool: 3 },
        });
        kit.autoUnlock();
    }
} catch (e) {
    console.warn('SoundKit не инициализирован:', e);
    kit = null;
}

function sfx(name) {
    if (!kit || !kit.sounds[name]) return;
    try { kit.sounds[name].play(); } catch (e) {}
}

// ============================================================
//                       СЛОВАРЬ
// ============================================================
const WORD_SET = (window.WORDS instanceof Set)
    ? window.WORDS
    : new Set(window.WORDS || []);
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е');
const hasWord = s => WORD_SET.has(norm(s));

const AI_AVAILABLE = typeof window.ComputerBrain === 'function';
const AI_LETTERS = 'абвгдежзийклмнопрстуфхцчшщъыьэюя'.split('');

// ============================================================
//                       КОНСТАНТЫ
// ============================================================
const MIN_START_LEN = 5;
const MAX_START_LEN = 12;
const MIN_TIMER_SECONDS = 20;
const DEFAULT_TIMER_SECONDS = 60;

const DEFAULT_STATUS = 'Поставьте букву в соседнюю клетку';
const PLAYER_NAMES   = ['◀︎--', '--▶︎'];
const PLAYER_FULL    = ['Игрок-1', 'Игрок-2'];

// ============================================================
//                       DOM
// ============================================================
const boardEl     = document.getElementById('board');
const statusEl    = document.getElementById('status');
const previewEl   = document.getElementById('preview');
const score0El    = document.getElementById('score0');
const score1El    = document.getElementById('score1');
const turnNameEl  = document.getElementById('turnName');
const timerEl     = document.getElementById('timer');
const acceptBtn   = document.getElementById('btnAccept');
const clearBtn    = document.getElementById('btnClear');
const cancelBtn   = document.getElementById('btnCancelLetter');
const startScreen = document.getElementById('startScreen');
const startWordIn = document.getElementById('startWord');
const startError  = document.getElementById('startError');
const turnSecondsIn = document.getElementById('turnSeconds');
const resultScreen= document.getElementById('resultScreen');
const resultStats = document.getElementById('resultStats');
const modeSelectEl = document.getElementById('modeSelect');
const modeCards   = modeSelectEl
    ? Array.from(modeSelectEl.querySelectorAll('.mode-card'))
    : [];
const panel0Label = document.querySelector('#panel0 .player-label');
const panel1Label = document.querySelector('#panel1 .player-label');
const wordPanel0El = document.getElementById('wordPanel0');
const wordPanel1El = document.getElementById('wordPanel1');
const wordPanel0Name = document.getElementById('wordPanel0Name');
const wordPanel1Name = document.getElementById('wordPanel1Name');
const wordList0El = document.getElementById('wordList0');
const wordList1El = document.getElementById('wordList1');
const wordCount0El = document.getElementById('wordCount0');
const wordCount1El = document.getElementById('wordCount1');

// ============================================================
//                       СОСТОЯНИЕ
// ============================================================
const state = {
    size: 0,
    board: [],
    currentPlayer: 0,
    scores: [0, 0],
    phase: 'idle',       // 'idle' | 'input' | 'select' | 'finished'
    pending: null,
    typing: null,        // { r, c } — клетка в режиме ввода
    selection: [],
    usedWords: new Set(),
    playerWords: [[], []],
    turnSeconds: DEFAULT_TIMER_SECONDS,
    timerId: null,
    timeLeft: 0,
    startTime: 0,
    moves: 0,
    
    paused: false,          // ← новое: вкладка неактивна
    pausedAt: 0,            // ← новое: когда ушли с вкладки
    wasTimerRunning: false, // ← новое: таймер шёл в момент паузы
    pendingTimerStart: false,

    mode: 'human',          // 'human' | 'computer'
    aiBusy: false,
};

let cells = [];

// ============================================================
//                   НАСТРОЙКА ТАЙМЕРА
// ============================================================
function normalizeTurnSeconds(value) {
    const number = Number(String(value).trim());
    if (!Number.isFinite(number) || number < MIN_TIMER_SECONDS) return 0;
    return Math.floor(number);
}

function applyTimerInput() {
    if (!turnSecondsIn) return state.turnSeconds;
    const seconds = normalizeTurnSeconds(turnSecondsIn.value);
    turnSecondsIn.value = String(seconds);
    return seconds;
}

if (turnSecondsIn) {
    turnSecondsIn.addEventListener('change', applyTimerInput);
    turnSecondsIn.addEventListener('blur', applyTimerInput);
}

// ============================================================
//                       СТАТУС
// ============================================================
let statusResetTimer = null;

function showStatus(text, cls = '', autoResetMs = 0) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    if (statusResetTimer) {
        clearTimeout(statusResetTimer);
        statusResetTimer = null;
    }
    if (autoResetMs > 0) {
        statusResetTimer = setTimeout(() => {
            statusResetTimer = null;
            if (state.phase !== 'finished' && !state.aiBusy) {
                showStatus(DEFAULT_STATUS, '');
            }
        }, autoResetMs);
    }
}

// ============================================================
//                   ИМЕНА ИГРОКОВ
// ============================================================
function playerShortName(index) {
    return (index === 1 && state.mode === 'computer')
        ? 'ИИ'
        : PLAYER_NAMES[index];
}

function playerFullName(index) {
    return (index === 1 && state.mode === 'computer')
        ? 'Компьютер'
        : PLAYER_FULL[index];
}

function updatePlayerLabels() {
    if (panel0Label) panel0Label.textContent = 'ИГРОК 1';
    if (panel1Label) {
        panel1Label.textContent = state.mode === 'computer'
            ? 'КОМПЬЮТЕР'
            : 'ИГРОК 2';
    }
    if (wordPanel0Name) wordPanel0Name.textContent = 'ИГРОК 1';
    if (wordPanel1Name) {
        wordPanel1Name.textContent = state.mode === 'computer'
            ? 'КОМПЬЮТЕР'
            : 'ИГРОК 2';
    }
    if (wordList0El) wordList0El.setAttribute('aria-label', 'Слова Игрока 1');
    if (wordList1El) {
        wordList1El.setAttribute(
            'aria-label',
            state.mode === 'computer' ? 'Слова Компьютера' : 'Слова Игрока 2'
        );
    }
}

// ============================================================
//                       ПОЛЕ
// ============================================================
function initBoard() {
    state.board = Array.from({ length: state.size }, () =>
        Array(state.size).fill(null));
    state.currentPlayer = 0;
    state.scores = [0, 0];
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.usedWords = new Set();
    state.playerWords = [[], []];
    state.moves = 0;
    stopTimer();
}

function placeStartWord(word) {
    const size   = state.size;
    const midRow = (size >> 1) - (size % 2 === 0 ? 1 : 0);
    const midCol = (size - word.length) >> 1;

    for (let i = 0; i < word.length; i++) {
        state.board[midRow][midCol + i] = { letter: word[i], owner: 0 };
    }

    state.currentPlayer = 0;
    state.usedWords.add(word);
    state.playerWords[0].push({ word, points: 0, start: true });
}

function inBounds(r, c) {
    return r >= 0 && r < state.size && c >= 0 && c < state.size;
}

function isAdjacentToLetter(r, c) {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && state.board[nr][nc]) return true;
    }
    return false;
}

function buildBoardDom() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${state.size}, 1fr)`;
    boardEl.style.gridTemplateRows    = `repeat(${state.size}, 1fr)`;
    cells = [];
    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const d = document.createElement('div');
            d.className = 'cell empty';
            d.dataset.r = r;
            d.dataset.c = c;
            d.addEventListener('click', () => onCellClick(r, c));
            boardEl.appendChild(d);
            cells.push(d);
        }
    }
}

function render() {
    const selectedSet = new Set(state.selection.map(p => p.r + ',' + p.c));

    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const idx = r * state.size + c;
            const d = cells[idx];
            const cell = state.board[r][c];
            const isPending = state.pending && state.pending.r === r && state.pending.c === c;
            const isTyping  = state.typing  && state.typing.r === r  && state.typing.c === c;
            const isSelected = selectedSet.has(r + ',' + c);

            d.className = 'cell';

            if (cell) {
                d.classList.add('letter', 'owner-' + cell.owner);
                d.textContent = cell.letter;
            } else if (isPending) {
                d.classList.add('pending');
                d.textContent = state.pending.letter;
            } else if (isTyping) {
                d.classList.add('typing');
                d.textContent = '';   // курсор рисуется через ::after
            } else {
                d.classList.add('empty');
                d.textContent = '';
                if (state.phase === 'input' && isAdjacentToLetter(r, c)) {
                    d.classList.add('placeable');
                }
            }

            if (isSelected) d.classList.add('selected');
        }
    }
    renderPreview();
    renderHud();
    renderButtons();
}

function renderPreview() {
    const word = getSelectedWord();
    previewEl.textContent = word ? word.split('').join('·') : '\u00A0';
}

function renderWordList(player, listEl, countEl, animateLast) {
    if (!listEl) return;

    const entries = state.playerWords[player] || [];
    if (countEl) countEl.textContent = entries.length;
    listEl.innerHTML = '';

    if (entries.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'word-list-empty';
        empty.textContent = 'пока нет слов';
        listEl.appendChild(empty);
        return;
    }

    entries.forEach((entry, index) => {
        const item = document.createElement('li');
        item.className = 'word-item' +
            (entry.start ? ' start-word' : '') +
            (animateLast && index === entries.length - 1 ? ' word-enter' : '');

        const text = document.createElement('span');
        text.className = 'word-text';
        text.textContent = entry.word;
        text.title = entry.word;

        const points = document.createElement('span');
        points.className = 'word-points' + (entry.start ? ' start' : '');
        points.textContent = entry.start ? 'старт' : '+' + entry.points;

        item.append(text, points);
        listEl.appendChild(item);
    });

    listEl.scrollTop = listEl.scrollHeight;
}

function renderWordLists(animatePlayer = null) {
    renderWordList(0, wordList0El, wordCount0El, animatePlayer === 0);
    renderWordList(1, wordList1El, wordCount1El, animatePlayer === 1);
}

function renderHud() {
    score0El.textContent = state.scores[0];
    score1El.textContent = state.scores[1];
    turnNameEl.textContent = playerShortName(state.currentPlayer);

    // Подсветка активной панели
    const panel0 = document.getElementById('panel0');
    const panel1 = document.getElementById('panel1');
    if (panel0) panel0.classList.toggle('active', state.currentPlayer === 0);
    if (panel1) panel1.classList.toggle('active', state.currentPlayer === 1);
    if (wordPanel0El) {
        wordPanel0El.classList.toggle('active', state.currentPlayer === 0);
    }
    if (wordPanel1El) {
        wordPanel1El.classList.toggle('active', state.currentPlayer === 1);
    }

    // Таймер
    if (state.timeLeft > 0) {
        timerEl.textContent = formatTime(state.timeLeft * 1000);
        timerEl.classList.toggle('warning', state.timeLeft <= 10);
        timerEl.classList.remove('off');
    } else {
        timerEl.textContent = state.turnSeconds > 0 ? '—' : '∞';
        timerEl.classList.remove('warning');
        timerEl.classList.toggle('off', state.turnSeconds <= 0);
    }
}

function renderButtons() {
    const locked = state.aiBusy;
    acceptBtn.disabled = locked || !(state.phase === 'select' && state.selection.length >= 2);
    clearBtn.disabled  = locked || state.selection.length === 0;
    cancelBtn.disabled = locked || !state.pending;
    document.body.classList.toggle('ai-busy', locked);
}

function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
}

// ============================================================
//                   КЛИКИ ПО КЛЕТКАМ
// ============================================================
function onCellClick(r, c) {
    if (state.aiBusy) return;
    // Клик в другом месте — сбрасываем прежний ввод
    if (state.typing && !(state.typing.r === r && state.typing.c === c)) {
        state.typing = null;
    }
    if (state.paused) return;

    if (state.phase === 'input') {
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        const isEmpty = !cell && !isPending;

        if (!isEmpty) return;

        // Повторный клик по той же клетке — выйти из ввода
        if (state.typing && state.typing.r === r && state.typing.c === c) {
            state.typing = null;
            render();
            return;
        }

        if (!isAdjacentToLetter(r, c)) return;

        // Включаем режим ввода в клетке
        state.typing = { r, c };
        sfx('click'); 
        render();
        focusTypingInput();
        return;
    }

    if (state.phase === 'select') {
        if (state.typing) {
            state.typing = null;
            render();
            return;
        }
        const cell = state.board[r][c];
        const isPending = state.pending && state.pending.r === r && state.pending.c === c;
        if (cell || isPending) toggleCell(r, c);
    }
}

// ============================================================
//                   ВВОД БУКВЫ ПРЯМО В КЛЕТКЕ
// ============================================================
function commitTypedLetter(letter) {
    if (!state.typing) return;
    const { r, c } = state.typing;
    state.pending = { r, c, letter };
    state.typing = null;
    state.phase = 'select';
    state.selection = [];
    showStatus('Кликайте клетки по порядку слова — свою букву тоже', 'timer-on', 0);
    sfx('click');
    render();
}

// Скрытый input для вызова системной клавиатуры на мобильных
const hiddenInput = document.createElement('input');
hiddenInput.type = 'text';
hiddenInput.autocomplete = 'off';
hiddenInput.style.cssText =
    'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0;';
document.body.appendChild(hiddenInput);

hiddenInput.addEventListener('input', () => {
    if (state.paused || state.aiBusy) { hiddenInput.value = ''; return; }
    if (!state.typing) { hiddenInput.value = ''; return; }
    const letter = norm(hiddenInput.value.trim()).slice(-1);
    hiddenInput.value = '';
    if (/^[а-я]$/.test(letter)) commitTypedLetter(letter);
});

function focusTypingInput() {
    if ('ontouchstart' in window) {
        // Небольшая задержка помогает Safari на iOS
        setTimeout(() => { try { hiddenInput.focus(); } catch (e) {} }, 0);
    }
}

document.addEventListener('keydown', e => {
    if (state.paused || state.aiBusy) return;
    if (!state.typing) return;

    if (e.key === 'Escape') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }
    if (e.key === 'Backspace' || e.key === 'Enter') {
        e.preventDefault();
        state.typing = null;
        render();
        return;
    }

    const letter = norm(e.key).trim();
    if (!/^[а-я]$/.test(letter)) return;    // игнорируем не-буквы
    e.preventDefault();
    commitTypedLetter(letter);
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseGame();
    } else {
        resumeGame();
    }
});

window.addEventListener('blur', () => {
    if (state.typing) {
        state.typing = null;
        render();
    }
    pauseGame();
});

window.addEventListener('focus', () => {
    resumeGame();
});

// ============================================================
//                   СБОР СЛОВА (ломаная)
// ============================================================
function toggleCell(r, c) {
    const idx = state.selection.findIndex(p => p.r === r && p.c === c);

    // Повторный клик по уже выбранной клетке — убрать её
    if (idx >= 0) {
        state.selection.splice(idx, 1);
        sfx('kickSide');
        render();
        return;
    }

    // Первая клетка — можно любую
    if (state.selection.length === 0) {
        state.selection.push({ r, c });
        sfx('click');
        render();
        return;
    }

    // Каждая следующая должна быть 4-соседом предыдущей — и ТОЛЬКО В КОНЕЦ
    const last = state.selection[state.selection.length - 1];
    const isNeighbor =
        (Math.abs(last.r - r) + Math.abs(last.c - c)) === 1;

    if (!isNeighbor) {
        showStatus('Кликните клетку рядом с последней выбранной (не по диагонали)', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    state.selection.push({ r, c });   // ← всегда в конец, порядок = порядок кликов
    sfx('move');
    render();
}

function getSelectedWord() {
    return state.selection.map(({ r, c }) => {
        if (state.pending && state.pending.r === r && state.pending.c === c) {
            return state.pending.letter;
        }
        const cell = state.board[r][c];
        return cell ? cell.letter : '';
    }).join('');
}

// ============================================================
//                   ПРИНЯТИЕ СЛОВА
// ============================================================
function onAccept() {
    if (state.aiBusy) return;
    const word = getSelectedWord();

    if (word.length < 2) {
        showStatus('Выделите минимум 2 буквы', 'bad', 1600);
        sfx('kickFig');
        return;
    }

    // В отправленном слове обязана быть введённая буква игрока
    if (state.pending) {
        const inWord = state.selection.some(
            p => p.r === state.pending.r && p.c === state.pending.c
        );
        if (!inWord) {
            showStatus('В отправленном слове должна быть ваша новая буква', 'bad', 2000);
            sfx('kickFig');
            return;
        }
    }

    // Слова нет в словаре — буква убирается, тикает таймер
    if (!hasWord(word)) {
        const retryNote = state.turnSeconds > 0
            ? ` ${state.turnSeconds} с на новый вариант`
            : '';
        showStatus(`Слова «${word}» нет в словаре. Буква убрана.${retryNote}`, 'bad', 0);
        sfx('kickFig');
        if (state.pending) state.board[state.pending.r][state.pending.c] = null;
        state.pending = null;
        state.selection = [];
        state.phase = 'input';
        startTimer();
        render();
        return;
    }

    // Слово уже было — не принимаем
    if (state.usedWords.has(word)) {
        showStatus(`Слово «${word}» уже было в игре. Придумайте другое`, 'bad', 0);
        sfx('kickFig');
        return;
    }

    // Успех
    if (state.pending) {
        const { r, c, letter } = state.pending;
        state.board[r][c] = { letter, owner: state.currentPlayer };
    }
    state.scores[state.currentPlayer] += word.length;
    state.usedWords.add(word);
    state.playerWords[state.currentPlayer].push({
        word,
        points: word.length,
    });
    state.moves++;
    renderWordLists(state.currentPlayer);
    sfx('linedel');
    showStatus(`+${word.length} очков за «${word}»`, 'ok', 2500);

    stopTimer();
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    beginTurn(350);
    setTimeout(() => {
        if (state.phase !== 'finished' && !state.aiBusy) {
            showStatus(DEFAULT_STATUS, '');
        }
    }, 2500);
}

function onClear() {
    if (state.aiBusy) return;
    const had = state.selection.length > 0;
    state.selection = [];
    if (had) {
        sfx('kickSide');
        showStatus('Выделение сброшено', '', 1500);
    }
    render();
}

function cancelPendingLetter() {
    if (state.aiBusy || !state.pending) return;
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    sfx('kickSide');
    showStatus('Буква убрана. Выберите другую клетку', '', 1600);
    render();
}

function switchPlayer() {
    state.currentPlayer = 1 - state.currentPlayer;
}

// ============================================================
//                   ТАЙМЕР
// ============================================================
function startTimer() {
    if (state.turnSeconds <= 0) {
        state.pendingTimerStart = false;
        stopTimer();
        state.timeLeft = 0;
        renderHud();
        return;
    }
    if (state.paused) {
        state.pendingTimerStart = true;
        return;
    }
    state.pendingTimerStart = false;
    stopTimer();
    state.timeLeft = state.turnSeconds;
    state.startTime = Date.now();
    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, state.turnSeconds - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            onTimeout();
        }
    }, 250);
}

function stopTimer() {
    if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
    }
    //state.timeLeft = 0;
}

function pauseGame() {
    if (state.paused) return;
    state.paused = true;
    state.pausedAt = Date.now();
    state.wasTimerRunning = state.timerId !== null;

    // Останавливаем таймер, но запоминаем оставшееся время
    if (state.timerId) {
        stopTimer();
        // stopTimer() обнуляет timeLeft — восстановим
        state.timeLeft = state.pausedTimeLeft ?? state.timeLeft;
    }
    showStatus('Пауза (вкладка неактивна)', 'timer-on', 0);
    
    document.body.classList.add('paused');
}

function resumeGame() {
    if (!state.paused) return;
    state.paused = false;

    if (state.pendingTimerStart) {
        state.pendingTimerStart = false;
        startTimer();
    } else if (state.wasTimerRunning && state.timeLeft > 0) {
        // Если таймер шёл до паузы — возобновляем
        resumeTimer(state.timeLeft);
    }
    state.wasTimerRunning = false;

    if (state.phase !== 'finished' && !state.aiBusy) {
        showStatus(DEFAULT_STATUS, '');
    }
    document.body.classList.remove('paused');
}

function resumeTimer(leftSeconds) {
    if (state.timerId || state.turnSeconds <= 0 || leftSeconds <= 0) return;
    state.timeLeft = leftSeconds;
    state.startTime = Date.now() - (state.turnSeconds - leftSeconds) * 1000;

    renderHud();

    state.timerId = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        state.timeLeft = Math.max(0, state.turnSeconds - elapsed);
        renderHud();

        if (state.timeLeft <= 0) {
            stopTimer();
            state.timeLeft = 0;
            onTimeout();
        }
    }, 250);
}

function onTimeout() {
    if (state.aiBusy || state.turnSeconds <= 0) return;
    showStatus('Время вышло! Буква убрана, ход переходит', 'bad', 2500);
    sfx('death');
    if (state.pending) state.board[state.pending.r][state.pending.c] = null;
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    sfx('rot');
    beginTurn(350);
}

// ============================================================
//                   ХОД КОМПЬЮТЕРА
// ============================================================
let aiBrain = null;
let aiTimers = [];
let aiGeneration = 0;

function setAiBusy(value) {
    state.aiBusy = value;
    document.body.classList.toggle('ai-busy', value);
    renderButtons();
}

function clearAiTimers() {
    aiGeneration++;
    for (const id of aiTimers) clearTimeout(id);
    aiTimers = [];
}

function aiLater(fn, delay) {
    const generation = aiGeneration;
    const id = setTimeout(() => {
        aiTimers = aiTimers.filter(timer => timer !== id);
        if (generation !== aiGeneration) return;
        fn();
    }, delay);
    aiTimers.push(id);
    return id;
}

function getAiBrain() {
    if (aiBrain || !AI_AVAILABLE) return aiBrain;
    try {
        aiBrain = new window.ComputerBrain(WORD_SET);
    } catch (e) {
        console.warn('ComputerBrain: не удалось создать ИИ', e);
        aiBrain = null;
    }
    return aiBrain;
}

function warmUpAiBrain() {
    if (aiBrain || !AI_AVAILABLE) return;
    const build = () => getAiBrain();
    if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(build, { timeout: 1500 });
    } else {
        setTimeout(build, 150);
    }
}

function buildBoardMap() {
    const map = new Map();
    for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
            const cell = state.board[r][c];
            if (cell) map.set(r + ',' + c, cell.letter);
        }
    }
    return map;
}

function validateAiMove(move) {
    if (!move || typeof move.word !== 'string' ||
        !Array.isArray(move.cells) || move.cells.length === 0) {
        return null;
    }

    const word = norm(move.word);
    if (word.length !== move.cells.length ||
        !hasWord(word) || state.usedWords.has(word)) {
        return null;
    }

    const cells = [];
    const seen = new Set();
    let newCell = null;
    let built = '';

    for (let i = 0; i < move.cells.length; i++) {
        const r = Number(move.cells[i] && move.cells[i].r);
        const c = Number(move.cells[i] && move.cells[i].c);

        if (!Number.isInteger(r) || !Number.isInteger(c) ||
            r < 0 || c < 0 || r >= state.size || c >= state.size) {
            return null;
        }

        const key = r + ',' + c;
        if (seen.has(key)) return null;
        seen.add(key);

        if (cells.length > 0) {
            const prev = cells[cells.length - 1];
            if (Math.abs(prev.r - r) + Math.abs(prev.c - c) !== 1) {
                return null;
            }
        }

        const boardCell = state.board[r][c];
        if (boardCell) {
            built += boardCell.letter;
        } else {
            if (newCell) return null;
            newCell = { r, c, letter: word[i] };
            built += word[i];
        }
        cells.push({ r, c });
    }

    if (!newCell || built !== word) return null;
    return { word, cells, newCell };
}

function beginTurn(delay = 0) {
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;

    const aiTurn = state.mode === 'computer' &&
        state.currentPlayer === 1 &&
        state.phase !== 'finished';

    setAiBusy(aiTurn);
    render();

    if (aiTurn) {
        aiLater(() => {
            if (!state.aiBusy || state.currentPlayer !== 1 ||
                state.mode !== 'computer') {
                return;
            }
            showStatus('Компьютер думает…', 'timer-on', 0);
            aiLater(runComputerMove, 450);
        }, Math.max(100, delay));
        return;
    }

    startTimer();
}

function runComputerMove() {
    if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
        state.phase === 'finished') {
        setAiBusy(false);
        return;
    }

    const brain = getAiBrain();
    if (!brain) {
        aiPass('ИИ недоступен');
        return;
    }

    let rawMove = null;
    try {
        rawMove = brain.findBestMove({
            board: buildBoardMap(),
            letters: AI_LETTERS,
            usedWords: state.usedWords,
            minLen: 2,
            size: state.size,
        });
    } catch (e) {
        console.warn('ComputerBrain: ошибка поиска хода', e);
    }

    const move = validateAiMove(rawMove);
    if (!move) {
        aiPass('Компьютер не нашёл слово');
        return;
    }

    animateComputerMove(move);
}

function animateComputerMove(move) {
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;
    state.selection = [];
    state.pending = {
        r: move.newCell.r,
        c: move.newCell.c,
        letter: move.newCell.letter,
    };
    state.phase = 'select';
    render();
    showStatus(`Компьютер ставит «${move.newCell.letter}»`, 'timer-on', 0);
    sfx('click');

    let index = 0;

    const selectNext = () => {
        if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
            state.phase !== 'select' || !state.pending) {
            setAiBusy(false);
            return;
        }

        if (index >= move.cells.length) {
            showStatus(`Компьютер: «${move.word}»`, 'ok', 0);
            aiLater(submitComputerMove, 420);
            return;
        }

        const cell = move.cells[index++];
        toggleCell(cell.r, cell.c);
        aiLater(selectNext, index === 1 ? 90 : 180);
    };

    aiLater(selectNext, 260);
}

function submitComputerMove() {
    if (state.mode !== 'computer' || state.currentPlayer !== 1 ||
        state.phase !== 'select' || !state.pending) {
        setAiBusy(false);
        return;
    }

    const word = getSelectedWord();
    const hasPendingCell = state.selection.some(
        p => p.r === state.pending.r && p.c === state.pending.c
    );

    if (!hasWord(word) || state.usedWords.has(word) || !hasPendingCell) {
        aiPass('Компьютер не смог подтвердить слово');
        return;
    }

    setAiBusy(false);
    onAccept();
}

function aiPass(message) {
    setAiBusy(false);
    stopTimer();
    state.timeLeft = 0;
    state.typing = null;
    state.pending = null;
    state.selection = [];
    state.phase = 'input';
    switchPlayer();
    showStatus(message + '. Ход переходит', 'bad', 2200);
    sfx('kickFig');
    render();
    beginTurn(400);
}

// ============================================================
//                   СТАРТ / РЕСТАРТ
// ============================================================
function startGame() {
    const raw = norm(startWordIn.value.trim());
    startError.textContent = '';

    if (!raw) { startError.textContent = 'Введите слово'; sfx('kickFig'); return; }
    if (!/^[а-я]+$/.test(raw)) { startError.textContent = 'Только русские буквы'; sfx('kickFig'); return; }
    if (raw.length < MIN_START_LEN || raw.length > MAX_START_LEN) {
        startError.textContent = `Длина от ${MIN_START_LEN} до ${MAX_START_LEN} букв`;
        sfx('kickFig');
        return;
    }
    if (!WORD_SET.size) {
        startError.textContent = 'Словарь не загружен (russian_nouns.txt.js)';
        sfx('kickFig');
        return;
    }
    if (!hasWord(raw)) {
        startError.textContent = 'Такого слова нет в словаре';
        sfx('kickFig');
        return;
    }
    if (state.mode === 'computer' && !AI_AVAILABLE) {
        startError.textContent = 'Модуль ИИ не загружен (computer-brain.js)';
        sfx('kickFig');
        return;
    }

    state.turnSeconds = applyTimerInput();
    clearAiTimers();
    setAiBusy(false);
    updatePlayerLabels();

    state.size = raw.length;
    initBoard();
    state.paused = false;
    state.wasTimerRunning = false;
    state.pendingTimerStart = false;
    placeStartWord(raw);
    buildBoardDom();
    renderWordLists(0);
    state.phase = 'input';
    startScreen.classList.add('hidden');
    document.body.classList.add('in-game');
    resultScreen.classList.remove('visible');
    showStatus(
        `Стартовое слово «${raw}». Ход: ${playerFullName(state.currentPlayer)}`,
        '',
        3000
    );
    sfx('rot');
    render();
    beginTurn();

    if (state.mode === 'computer') warmUpAiBrain();
}

function restartGame() {
    clearAiTimers();
    setAiBusy(false);
    resultScreen.classList.remove('visible');
    startScreen.classList.remove('hidden');
    document.body.classList.remove('in-game');
    startWordIn.value = '';
    startError.textContent = '';
    stopTimer();
    state.phase = 'idle';
    state.pending = null;
    state.typing = null;
    state.selection = [];
    state.paused = false;
    state.wasTimerRunning = false;
    state.pendingTimerStart = false;
    state.timeLeft = 0;
    state.playerWords = [[], []];
    boardEl.innerHTML = '';
    previewEl.textContent = '\u00A0';
    renderWordLists();
    updatePlayerLabels();
    showStatus('Выберите соперника и введите стартовое слово', '');
}

// ============================================================
//                   ОБРАБОТЧИКИ
// ============================================================
function updateModeSelection() {
    for (const card of modeCards) {
        const selected = card.dataset.mode === state.mode;
        card.classList.toggle('selected', selected);
        card.setAttribute('aria-pressed', selected ? 'true' : 'false');
    }
    updatePlayerLabels();
    renderHud();
}

for (const card of modeCards) {
    if (card.dataset.mode === 'computer' && !AI_AVAILABLE) {
        card.disabled = true;
        const desc = card.querySelector('.mode-desc');
        if (desc) desc.textContent = 'недоступен';
        continue;
    }
    card.addEventListener('click', () => {
        if (card.disabled) return;
        state.mode = card.dataset.mode === 'computer' ? 'computer' : 'human';
        updateModeSelection();
        if (state.mode === 'computer') warmUpAiBrain();
        sfx('click');
    });
}

updateModeSelection();
renderWordLists();

document.getElementById('btnStart').addEventListener('click', startGame);
startWordIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        startGame();
        return;
    }
    // Озвучка набора буквы в поле стартового слова
    const k = norm(e.key).trim();
    if (/^[а-я]$/.test(k)) sfx('click');
});

acceptBtn.addEventListener('click', onAccept);
clearBtn.addEventListener('click', onClear);
cancelBtn.addEventListener('click', cancelPendingLetter);

// ============================================================
//                   ПОЛНЫЙ ЭКРАН
// ============================================================
const fsBtn  = document.getElementById('btnFullscreen');
const fsIcon = document.getElementById('fsIcon');
const fsTarget = document.documentElement;
const FS_PARAM = 'fs';
const IS_FS_TAB = new URLSearchParams(location.search).get(FS_PARAM) === '1';

function isFullscreen() {
    return document.fullscreenElement ||
           document.webkitFullscreenElement ||
           document.msFullscreenElement;
}
function updateFsIcon() {
    const fs = !!isFullscreen();
    fsIcon.textContent = fs ? '⤡' : '⛶';
    fsBtn.title = fs ? 'Выйти из полноэкранного режима' : 'Открыть на весь экран';
}
function requestFs(el) {
    const req = el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.msRequestFullscreen;
    if (!req) return Promise.reject(new Error('fullscreen unsupported'));
    try {
        return Promise.resolve(req.call(el));
    } catch (e) {
        return Promise.reject(e);
    }
}
function exitFs() {
    const exit = document.exitFullscreen ||
                 document.webkitExitFullscreen ||
                 document.msExitFullscreen;
    if (!exit) return;
    try {
        const p = exit.call(document);
        if (p && p.catch) p.catch(() => {});
    } catch (e) {}
}
function openFullscreenTab() {
    const base = location.href.split('#')[0];
    const sep = base.indexOf('?') === -1 ? '?' : '&';
    const win = window.open(base + sep + FS_PARAM + '=1', '_blank');
    if (!win) {
        requestFs(fsTarget).catch(() => {});
        return;
    }
    try { win.focus(); } catch (e) {}
}
function onFullscreenClick() {
    if (IS_FS_TAB) {
        if (isFullscreen()) exitFs();
        else requestFs(fsTarget).catch(() => {});
    } else {
        openFullscreenTab();
    }
}
fsBtn.addEventListener('click', onFullscreenClick);
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
    .forEach(evt => document.addEventListener(evt, updateFsIcon));

updateFsIcon();

/* Вкладка, открытая кнопкой: пробуем развернуть сразу, иначе — по первому клику */
if (IS_FS_TAB) {
    requestFs(fsTarget).catch(() => {});
    const unlock = e => {
        document.removeEventListener('pointerdown', unlock, true);
        document.removeEventListener('keydown', unlock, true);
        if (e.target && e.target.closest && e.target.closest('#btnFullscreen')) return;
        if (!isFullscreen()) requestFs(fsTarget).catch(() => {});
    };
    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('keydown', unlock, true);

    let hint = null;
    const hideHint = () => {
        if (!hint) return;
        const el = hint;
        hint = null;
        el.remove();
    };
    setTimeout(() => {
        if (isFullscreen() || hint) return;
        hint = document.createElement('div');
        hint.textContent = 'Нажмите в любом месте, чтобы развернуть игру на весь экран';
        hint.style.cssText = 'position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:40;max-width:90vw;padding:10px 16px;border:1px solid rgba(0,255,255,.55);border-radius:10px;background:rgba(3,10,18,.92);color:#0ff;font:13px/1.3 "Courier New",monospace;text-align:center;pointer-events:none;box-shadow:0 0 16px rgba(0,255,255,.28);opacity:0;transition:opacity .25s ease;';
        document.body.appendChild(hint);
        requestAnimationFrame(() => { if (hint) hint.style.opacity = '1'; });
        setTimeout(() => {
            if (!hint) return;
            hint.style.opacity = '0';
            const el = hint;
            hint = null;
            setTimeout(() => el.remove(), 300);
        }, 6000);
    }, 700);
    ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
        .forEach(evt => document.addEventListener(evt, () => { if (isFullscreen()) hideHint(); }));
}

// ============================================================
//                   КНОПКА MUTE
// ============================================================
const muteBtn = document.getElementById('btnMute');
let muted = false;
if (muteBtn) {
    muteBtn.addEventListener('click', e => {
        e.stopPropagation();
        muted = !muted;
        if (kit && typeof kit.setMuted === 'function') kit.setMuted(muted);
        muteBtn.textContent = muted ? '🔇' : '🔊';
    });
}

// ============================================================
//                   ОЧИСТКА ЗВУКОВ ПРИ УХОДЕ
// ============================================================
const backBtn = document.getElementById('backBtn');
if (backBtn) {
    backBtn.addEventListener('click', () => {
        if (kit && typeof kit.dispose === 'function') kit.dispose();
    });
}

// ============================================================
//                   ЭКСПОРТ
// ============================================================
window.restartGame = restartGame;

// Проверка словаря
if (!window.WORDS) {
    console.warn('Словарь не найден: подключите russian_nouns.txt.js до основного скрипта.');
    startError.textContent = 'Словарь не загружен';
} else {
    console.log('Словарь загружен, слов:', WORD_SET.size);
}

})();
</script>

<script>
/* ============================================================
   ФОН-ЗАСТАВКА
   Процедурный пиксель-арт: ночной город на левом берегу,
   пустое море в центре, закат и спокойная солнечная дорожка
   справа. Тонализм, сфумато, неоновый туман.
   Рисуется в низком разрешении и масштабируется без сглаживания.
   ============================================================ */
(function () {
    'use strict';

    const canvas = document.getElementById('bgArt');
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;

    const reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Ограниченная палитра: ночь, тёплый закат, неоновые акценты */
    const PALETTE = [
        [3, 5, 11], [6, 9, 18], [9, 14, 26], [13, 19, 35],
        [17, 25, 46], [23, 31, 57], [31, 35, 68], [42, 38, 74],
        [54, 39, 78], [70, 42, 82], [88, 47, 86], [108, 55, 90],
        [132, 66, 96], [164, 84, 105], [16, 44, 54], [21, 68, 76],
        [31, 102, 106], [58, 142, 142], [96, 200, 196], [140, 238, 230],
        [246, 88, 162], [255, 178, 110], [4, 7, 14],
        [92, 52, 50], [128, 62, 50], [168, 80, 52], [204, 104, 58],
        [232, 134, 70], [248, 168, 96], [255, 204, 140], [255, 232, 180],
        [150, 92, 110]
    ];

    const BAYER = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5]
    ];

    function rng(seed) {
        let a = seed >>> 0;
        return function () {
            a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function hash01(n) {
        n = Math.imul(n ^ (n >>> 16), 2246822507);
        n = Math.imul(n ^ (n >>> 13), 3266489909);
        return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    function makeCanvas(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        return c;
    }

    /* Квантование с упорядоченным дизерингом — «пиксельное» сфумато */
    function quantize(g, w, h, strength) {
        const img = g.getImageData(0, 0, w, h);
        const data = img.data;
        const n = PALETTE.length;
        for (let y = 0; y < h; y++) {
            const by = y & 3;
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) << 2;
                const d = (BAYER[by][x & 3] / 16 - 0.47) * strength;
                const r = data[i] + d;
                const gg = data[i + 1] + d;
                const b = data[i + 2] + d;
                let best = 0;
                let bestDist = Infinity;
                for (let p = 0; p < n; p++) {
                    const c = PALETTE[p];
                    const dr = r - c[0];
                    const dg = gg - c[1];
                    const db = b - c[2];
                    const dist = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = p;
                    }
                }
                const c = PALETTE[best];
                data[i] = c[0];
                data[i + 1] = c[1];
                data[i + 2] = c[2];
            }
        }
        g.putImageData(img, 0, 0);
    }

    let W = 0;
    let H = 0;
    let horizon = 0;
    let sunX = 0;
    let sunR = 0;
    let base = null;
    let fogLeft = null;
    let fogRight = null;
    let fogLeftY = 0;
    let fogRightY = 0;
    let blinkLights = [];

    function buildScene() {
        const vw = Math.max(240, window.innerWidth);
        const vh = Math.max(240, window.innerHeight);
        const aspect = vh / vw;

        W = Math.round(vw / 2.6);
        W = Math.max(220, Math.min(520, W));
        H = Math.round(W * aspect);
        if (H < 150) {
            H = 150;
            W = Math.max(160, Math.round(H / aspect));
        } else if (H > 920) {
            H = 920;
            W = Math.max(160, Math.round(H / aspect));
        }

        canvas.width = W;
        canvas.height = H;
        ctx.imageSmoothingEnabled = false;

        horizon = Math.round(H * 0.6);
        sunX = Math.round(W * 0.84);
        sunR = Math.max(8, Math.round(Math.min(W * 0.05, H * 0.09)));
        const sunY = horizon - Math.round(sunR * 0.12);
        const cityEnd = Math.round(W * 0.38);

        base = makeCanvas(W, H);
        const g = base.getContext('2d');
        const rand = rng(0xC0FFEE ^ (W * 131 + H * 17));
        blinkLights = [];

        /* Небо: ночь слева, тёплый закат справа */
        const sky = g.createLinearGradient(0, 0, 0, horizon);
        sky.addColorStop(0, '#05070f');
        sky.addColorStop(0.5, '#0b1124');
        sky.addColorStop(0.85, '#1a1735');
        sky.addColorStop(1, '#2a1d3f');
        g.fillStyle = sky;
        g.fillRect(0, 0, W, horizon + 1);

        const warmSky = g.createLinearGradient(W * 0.5, 0, W, 0);
        warmSky.addColorStop(0, 'rgba(150, 70, 80, 0)');
        warmSky.addColorStop(0.55, 'rgba(195, 95, 75, 0.12)');
        warmSky.addColorStop(1, 'rgba(245, 155, 85, 0.24)');
        g.fillStyle = warmSky;
        g.fillRect(0, 0, W, horizon + 1);

        /* Редкие звёзды — только в левой половине неба */
        g.fillStyle = 'rgba(150, 220, 225, 0.32)';
        const stars = Math.max(6, Math.round(W * H / 9000));
        for (let i = 0; i < stars; i++) {
            const sx = Math.floor(rand() * W * 0.62);
            const sy = Math.floor(rand() * horizon * 0.55);
            g.fillRect(sx, sy, 1, 1);
        }

        /* Дымка на линии горизонта (под солнцем) */
        const haze = g.createLinearGradient(0, horizon - H * 0.14, 0, horizon + H * 0.06);
        haze.addColorStop(0, 'rgba(60, 35, 70, 0)');
        haze.addColorStop(0.55, 'rgba(120, 70, 90, 0.24)');
        haze.addColorStop(1, 'rgba(50, 30, 55, 0)');
        g.fillStyle = haze;
        g.fillRect(0, horizon - H * 0.14, W, H * 0.2);

        /* Сфумато-ореол заката */
        const halo = g.createRadialGradient(sunX, sunY, sunR * 0.25, sunX, sunY, sunR * 5.2);
        halo.addColorStop(0, 'rgba(255, 215, 150, 0.75)');
        halo.addColorStop(0.4, 'rgba(250, 140, 80, 0.3)');
        halo.addColorStop(1, 'rgba(90, 45, 60, 0)');
        g.fillStyle = halo;
        g.fillRect(0, 0, W, horizon + 1);

        /* Солнце у горизонта */
        const disc = g.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
        disc.addColorStop(0, '#ffdf9a');
        disc.addColorStop(0.5, '#ffb066');
        disc.addColorStop(1, '#d95f42');
        g.fillStyle = disc;
        g.beginPath();
        g.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        g.fill();

        /* ---------- ГОРОД СЛЕВА ---------- */
        const reflections = [];
        function addBlink(x, y, color, glow) {
            if (blinkLights.length >= 12) return;
            const idx = blinkLights.length;
            blinkLights.push({
                x: x,
                y: y,
                color: color,
                w: 1,
                alpha: 0.55 + rand() * 0.35,
                period: 2.6 + (idx % 5) * 0.9,
                phase: rand() * 4,
                seed: (idx * 2654435761 + 12345) | 0,
                threshold: idx < 8 ? 0.12 : 0.78,
                glow: glow
            });
        }

        function skyline(opts) {
            const built = [];
            let x = -Math.floor(rand() * opts.maxW);
            while (x < cityEnd) {
                let bw = opts.minW + Math.floor(rand() * (opts.maxW - opts.minW + 1));
                if (x + bw > cityEnd) bw = cityEnd - x;
                if (bw < 5) break;
                let bh = opts.minH + Math.floor(rand() * (opts.maxH - opts.minH + 1));
                const cx = x + bw / 2;
                const falloff = 1 - 0.38 * (cx / cityEnd);
                bh = Math.round(bh * falloff);
                bh = Math.max(6, Math.min(bh, horizon - 2));
                const top = horizon - bh;

                g.globalAlpha = opts.alpha;
                g.fillStyle = opts.color;
                g.fillRect(x, top, bw, bh);
                g.globalAlpha = 1;

                if (rand() < 0.16) {
                    const ax = x + Math.floor(bw / 2);
                    const ah = 4 + Math.floor(rand() * Math.max(3, bh * 0.3));
                    g.fillStyle = opts.color;
                    g.fillRect(ax, top - ah, 1, ah);
                    if (rand() < 0.55) {
                        if (blinkLights.length < 10 && rand() < 0.5) {
                            addBlink(ax, top - ah, '#ff6a7a', true);
                        } else {
                            g.fillStyle = 'rgba(255, 100, 130, 0.8)';
                            g.fillRect(ax, top - ah, 1, 1);
                        }
                    }
                }

                if (opts.windows) {
                    for (let wy = top + 4; wy < horizon - 3; wy += 3) {
                        for (let wx = x + 2; wx < x + bw - 1; wx += 3) {
                            if (rand() > opts.wChance) continue;
                            const col = opts.wColors[(rand() * opts.wColors.length) | 0];
                            if (blinkLights.length < 12 && rand() < 0.035) {
                                addBlink(wx, wy, col.solid, false);
                                continue;
                            }
                            g.fillStyle = col.fill;
                            g.globalAlpha = 0.25 + rand() * 0.5;
                            g.fillRect(wx, wy, 1, 1);
                            if (col.reflect && rand() < 0.28 && reflections.length < 26) {
                                reflections.push({
                                    x: wx,
                                    rgb: col.rgb,
                                    len: Math.round(H * 0.06 + rand() * H * 0.1),
                                    alpha: 0.12 + rand() * 0.1
                                });
                            }
                        }
                    }
                    g.globalAlpha = 1;
                }

                built.push({ x: x, top: top, w: bw, h: bh });
                x += bw + Math.floor(rand() * 6);
            }
            return built;
        }

        skyline({
            minH: 12, maxH: Math.round(H * 0.18),
            minW: 7, maxW: 16,
            color: '#2b2344', alpha: 0.85, windows: false
        });

        skyline({
            minH: Math.round(H * 0.06), maxH: Math.round(H * 0.3),
            minW: 8, maxW: 22,
            color: '#171a31', alpha: 1, windows: true, wChance: 0.06,
            wColors: [
                { fill: 'rgba(120, 200, 215, 0.5)', solid: '#8fdfe6', rgb: '120, 210, 220', reflect: true },
                { fill: 'rgba(255, 180, 120, 0.4)', solid: '#ffcf8a', rgb: '255, 190, 120', reflect: true }
            ]
        });

        const front = skyline({
            minH: Math.round(H * 0.1), maxH: Math.round(H * 0.44),
            minW: 10, maxW: 30,
            color: '#070a15', alpha: 1, windows: true, wChance: 0.085,
            wColors: [
                { fill: 'rgba(120, 235, 230, 0.8)', solid: '#9ff5ee', rgb: '120, 240, 232', reflect: true },
                { fill: 'rgba(255, 200, 130, 0.7)', solid: '#ffd08a', rgb: '255, 200, 130', reflect: true },
                { fill: 'rgba(255, 120, 150, 0.6)', solid: '#ff8ab0', rgb: '255, 120, 160', reflect: true }
            ]
        });

        /* Неоновые вывески в городе */
        const candidates = front.filter(function (b) {
            return b.h > H * 0.12 && b.w > 12;
        });
        const signCount = Math.min(2, candidates.length);
        for (let i = 0; i < signCount; i++) {
            const b = candidates.splice(Math.floor(rand() * candidates.length), 1)[0];
            const neon = i % 2 === 0
                ? { rgb: '120, 240, 232', solid: '#8ff5ee' }
                : { rgb: '255, 110, 168', solid: '#ff7ab8' };
            const sx = b.x + 2 + Math.floor(rand() * Math.max(1, b.w - 6));
            const sy = b.top + 5 + Math.floor(rand() * Math.max(1, Math.round(b.h * 0.25)));
            const sw = 2;
            const sh = Math.max(7, Math.round(H * 0.04 + rand() * H * 0.05));
            const cx = sx + sw / 2;
            const cy = sy + sh / 2;
            const glow = g.createRadialGradient(cx, cy, 1, cx, cy, Math.max(sw, sh) * 1.6);
            glow.addColorStop(0, 'rgba(' + neon.rgb + ', 0.38)');
            glow.addColorStop(1, 'rgba(' + neon.rgb + ', 0)');
            g.fillStyle = glow;
            g.fillRect(sx - sh, sy - sh, sw + sh * 2, sh + sh * 2);
            g.fillStyle = neon.solid;
            g.fillRect(sx, sy, sw, sh);
            g.fillStyle = 'rgba(5, 8, 16, 0.55)';
            for (let yy = sy + 3; yy < sy + sh - 1; yy += 4) {
                g.fillRect(sx, yy, sw, 1);
            }
            reflections.push({ x: sx, rgb: neon.rgb, len: H * 0.14, alpha: 0.2 });
        }

        /* ---------- МОРЕ ---------- */
        const sea = g.createLinearGradient(0, horizon, 0, H);
        sea.addColorStop(0, '#141126');
        sea.addColorStop(0.3, '#090d1a');
        sea.addColorStop(1, '#03050c');
        g.fillStyle = sea;
        g.fillRect(0, horizon, W, H - horizon);

        /* Тёплый след заката на воде (мягкая эллиптическая основа) */
        const refH = H - horizon;
        g.save();
        g.translate(sunX, horizon);
        g.scale(1, Math.max(0.01, refH / (sunR * 2.2)));
        const sunRef = g.createRadialGradient(0, 0, 0, 0, 0, sunR * 1.7);
        sunRef.addColorStop(0, 'rgba(255, 185, 115, 0.3)');
        sunRef.addColorStop(0.45, 'rgba(225, 130, 85, 0.14)');
        sunRef.addColorStop(1, 'rgba(160, 80, 80, 0)');
        g.fillStyle = sunRef;
        g.fillRect(-sunR * 1.7, 0, sunR * 3.4, sunR * 2.2);
        g.restore();

        /* Отражения городских огней */
        for (let i = 0; i < reflections.length; i++) {
            const r = reflections[i];
            const ref = g.createLinearGradient(0, horizon, 0, horizon + r.len);
            ref.addColorStop(0, 'rgba(' + r.rgb + ',' + r.alpha.toFixed(2) + ')');
            ref.addColorStop(1, 'rgba(' + r.rgb + ',0)');
            g.fillStyle = ref;
            g.fillRect(r.x, horizon, 1, r.len);
        }

        /* Лёгкая рябь, центр моря остаётся спокойным */
        for (let y = horizon + 2; y < H; y += 3) {
            const depth = (y - horizon) / (H - horizon);
            const count = 2 + ((rand() * 3) | 0);
            for (let i = 0; i < count; i++) {
                let x;
                if (rand() < 0.7) {
                    x = rand() < 0.5
                        ? Math.floor(rand() * W * 0.36)
                        : Math.floor(W * 0.64 + rand() * W * 0.36);
                } else {
                    x = Math.floor(rand() * W);
                }
                const len = 2 + ((rand() * 6) | 0);
                g.fillStyle = 'rgba(95, 155, 165, ' + (0.05 + (1 - depth) * 0.05).toFixed(3) + ')';
                g.fillRect(x, y, len, 1);
            }
        }

        /* Линия горизонта */
        g.fillStyle = 'rgba(3, 5, 10, 0.7)';
        g.fillRect(0, horizon, W, 1);

        /* ---------- НАБЕРЕЖНАЯ НА ПЕРЕДНЕМ ПЛАНЕ ---------- */
        const quayColor = '#010206';
        const quayTop1 = Math.round(H * 0.84);
        const quayTop2 = Math.round(H * 0.88);
        const quayTop3 = Math.round(H * 0.91);
        const quayTop4 = Math.round(H * 0.94);
        const quayW1 = Math.round(W * 0.12);
        const quayW2 = Math.round(W * 0.2);
        const quayW3 = Math.round(W * 0.28);
        const quayW4 = Math.round(W * 0.34);
        g.fillStyle = quayColor;
        g.fillRect(0, quayTop1, quayW1, H);
        g.fillRect(0, quayTop2, quayW2, H);
        g.fillRect(0, quayTop3, quayW3, H);
        g.fillRect(0, quayTop4, quayW4, H);
        g.fillStyle = 'rgba(95, 185, 195, 0.34)';
        g.fillRect(0, quayTop1, quayW1, 1);
        g.fillRect(0, quayTop2, quayW2, 1);
        g.fillRect(0, quayTop3, quayW3, 1);
        g.fillRect(0, quayTop4, quayW4, 1);

        /* Фонари на набережной */
        const lampR = Math.max(6, Math.round(W * 0.024));
        const lamps = [
            { x: Math.round(W * 0.075), top: Math.round(H * 0.8) },
            { x: Math.round(W * 0.185), top: Math.round(H * 0.845) }
        ];
        for (let i = 0; i < lamps.length; i++) {
            const lamp = lamps[i];
            g.fillStyle = '#0b111c';
            g.fillRect(lamp.x, lamp.top, 1, quayTop2 - lamp.top);
            g.fillStyle = 'rgba(255, 210, 140, 0.28)';
            g.fillRect(lamp.x, lamp.top + 1, 1, Math.max(1, quayTop2 - lamp.top - 1));
            const glow = g.createRadialGradient(lamp.x, lamp.top, 0.5, lamp.x, lamp.top, lampR);
            glow.addColorStop(0, 'rgba(255, 205, 130, 0.65)');
            glow.addColorStop(0.5, 'rgba(255, 170, 100, 0.22)');
            glow.addColorStop(1, 'rgba(255, 150, 90, 0)');
            g.fillStyle = glow;
            g.fillRect(lamp.x - lampR, lamp.top - lampR, lampR * 2, lampR * 2);
            g.fillStyle = '#ffe2a8';
            g.fillRect(lamp.x, lamp.top, 1, 1);
            if (i === 1) addBlink(lamp.x, lamp.top, '#ffd08a', false);
        }

        quantize(g, W, H, 22);

        /* Туман: слева холодный, справа тёплый, к центру затухает */
        fogLeft = makeFog(
            Math.max(40, Math.round(W * 0.5)),
            Math.max(12, Math.round(H * 0.18)),
            '110, 200, 210', 0.16, 0.8, 0.04, 0.5
        );
        fogRight = makeFog(
            Math.max(40, Math.round(W * 0.45)),
            Math.max(12, Math.round(H * 0.2)),
            '240, 145, 100', 0.14, 2.3, 0.5, 0.04
        );
        fogLeftY = Math.round(horizon - H * 0.13);
        fogRightY = Math.round(horizon - H * 0.11);
    }

    /* Дрейфующие полосы тумана с затуханием к центру */
    function makeFog(w, h, rgb, alphaMax, phase, fadeIn, fadeOut) {
        const c = makeCanvas(w, h);
        const g = c.getContext('2d');
        for (let y = 0; y < h; y++) {
            const prof = Math.sin(Math.PI * y / h);
            const prof2 = prof * prof;
            const row = 0.55 + 0.45 * Math.sin(y * 0.75 + phase * 2.1);
            for (let x = 0; x < w; x += 2) {
                const nx = x / (w - 1);
                let mask = 1;
                if (fadeIn > 0) mask *= Math.min(1, nx / fadeIn);
                if (fadeOut > 0) mask *= Math.min(1, (1 - nx) / fadeOut);
                mask = mask * mask * (3 - 2 * mask);
                const xv = 0.65 + 0.35 * Math.sin((x / w) * Math.PI * 6 + y * 0.08 + phase);
                const q = Math.floor(prof2 * row * xv * mask * 4) / 4;
                if (q <= 0) continue;
                g.fillStyle = 'rgba(' + rgb + ',' + (q * alphaMax).toFixed(3) + ')';
                g.fillRect(x, y, 2, 1);
            }
        }
        return c;
    }

    /* Спокойная, но заметная солнечная дорожка на воде */
    function drawSunGlitter(t) {
        const waterH = H - horizon;
        if (waterH <= 0) return;
        const warm = ['#ffd08a', '#f7b06a', '#ff9d72', '#ffe2a8'];
        for (let y = horizon + 2; y < H; y += 2) {
            const depth = (y - horizon) / waterH;
            const fade = Math.pow(1 - depth, 1.25);
            const rowA = 0.1 + 0.4 * fade;
            const spread = sunR * (0.35 + depth * 1.9);
            const phase = t * 0.9 + y * 0.42;
            const qa = Math.round(rowA * 8) / 8;
            if (qa <= 0) continue;
            ctx.globalAlpha = qa;
            for (let k = -2; k <= 2; k++) {
                const off = Math.sin(phase + k * 1.9) * (1.5 + depth * 5);
                const x = Math.round(sunX + k * spread * 0.42 + off);
                const len = 2 + ((k + 2) % 3) * 2 + Math.round((1 - depth) * 2);
                ctx.fillStyle = warm[(Math.abs(k) + (y >> 1)) & 3];
                ctx.fillRect(x, y, len, 1);
            }
        }
        ctx.globalAlpha = 1;
    }

    /* Редко мигающие огни города */
    function drawBlinkLights(t) {
        for (let i = 0; i < blinkLights.length; i++) {
            const L = blinkLights[i];
            const slot = Math.floor(t / L.period + L.phase);
            const h = hash01(Math.imul(slot, 374761393) + L.seed);
            let on = h > L.threshold;
            if (L.glow && h > 0.9) {
                on = hash01(Math.floor(t * 5) + L.seed) > 0.5;
            }
            if (!on) continue;
            ctx.globalAlpha = L.alpha;
            ctx.fillStyle = L.color;
            ctx.fillRect(L.x, L.y, L.w, 1);
        }
        ctx.globalAlpha = 1;
    }

    function paint(now) {
        if (!base) return;
        ctx.drawImage(base, 0, 0);
        const t = reduceMotion ? 0 : now / 1000;

        drawSunGlitter(t);

        const leftOff = Math.round(Math.sin(t * 0.25 + 0.7) * 7);
        const rightOff = Math.round(Math.sin(t * 0.19 + 2.4) * 7);
        ctx.drawImage(fogLeft, leftOff, fogLeftY);
        ctx.drawImage(fogRight, W - fogRight.width + rightOff, fogRightY);

        drawBlinkLights(t);
    }

    let rafId = 0;
    let last = 0;
    function loop(now) {
        rafId = 0;
        if (now - last > 66) {
            last = now;
            paint(now);
        }
        rafId = requestAnimationFrame(loop);
    }
    function startLoop() {
        if (!rafId) {
            last = 0;
            rafId = requestAnimationFrame(loop);
        }
    }
    function stopLoop() {
        if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }

    let resizeTimer = 0;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            buildScene();
            paint(performance.now());
        }, 180);
    });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopLoop();
        else startLoop();
    });

    buildScene();
    paint(performance.now());
    if (!reduceMotion) startLoop();
})();
</script>
</body>
</html>
