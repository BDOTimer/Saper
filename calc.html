<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Строчный калькулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            font-family: 'Courier New', monospace;
            color: #0ff;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           Общий каркас
           ============================================================ */
        .app {
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: auto 1fr auto;
            width: 100%;
            height: 100%;
            gap: 10px;
            padding: 10px;
        }

        /* Верхняя панель */
        .topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 44px;
        }

        .back-btn {
            padding: 7px 14px;
            font-family: inherit;
            font-size: clamp(12px, 2.4vw, 15px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            text-decoration: none;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            transition: all 0.15s ease;
        }
        .back-btn:active {
            background: rgba(0, 255, 255, 0.4);
            color: #000;
        }

        .title {
            flex: 1;
            text-align: center;
            color: #0ff;
            font-size: clamp(14px, 3vw, 18px);
            letter-spacing: 3px;
            text-shadow: 0 0 12px #0ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fs-btn {
            padding: 7px 14px;
            font-family: inherit;
            font-size: clamp(12px, 2.4vw, 15px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
        }
        .fs-btn:active {
            background: rgba(0, 255, 255, 0.4);
            color: #000;
        }

        /* ============================================================
           Лог (история вычислений)
           ============================================================ */
        .log {
            grid-column: 1;
            grid-row: 2;
            background: rgba(0, 255, 255, 0.04);
            border: 2px solid #0ff;
            border-radius: 14px;
            box-shadow:
                0 0 24px rgba(0, 255, 255, 0.35),
                inset 0 0 24px rgba(0, 255, 255, 0.06);
            padding: 12px 14px;
            overflow-y: auto;
            font-size: clamp(13px, 2.6vw, 16px);
            line-height: 1.5;
            scrollbar-width: thin;
            scrollbar-color: #0ff transparent;
        }

        .log::-webkit-scrollbar { width: 8px; }
        .log::-webkit-scrollbar-track { background: transparent; }
        .log::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.4);
            border-radius: 4px;
        }

        .entry { margin-bottom: 4px; word-break: break-all; }
        .entry .prompt { color: #0ff; text-shadow: 0 0 8px #0ff; }
        .entry .expr { color: #fff; }
        .entry .result { color: #0f0; text-shadow: 0 0 8px #0f0; }
        .entry.error .result { color: #f0f; text-shadow: 0 0 8px #f0f; }
        .entry.comment .expr { color: #666; font-style: italic; }

        /* ============================================================
           Панель переменных (справа)
           ============================================================ */
        .vars {
            grid-column: 2;
            grid-row: 2;
            background: rgba(0, 255, 255, 0.04);
            border: 2px solid #0ff;
            border-radius: 14px;
            box-shadow:
                0 0 24px rgba(0, 255, 255, 0.35),
                inset 0 0 24px rgba(0, 255, 255, 0.06);
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(12px, 2.4vw, 15px);
            scrollbar-width: thin;
            scrollbar-color: #0ff transparent;
            display: flex;
            flex-direction: column;
        }

        .vars::-webkit-scrollbar { width: 8px; }
        .vars::-webkit-scrollbar-track { background: transparent; }
        .vars::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.4);
            border-radius: 4px;
        }

        .vars-title {
            color: #f0f;
            text-shadow: 0 0 12px #f0f;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: clamp(12px, 2.6vw, 15px);
            border-bottom: 1px solid rgba(255, 0, 255, 0.3);
            padding-bottom: 8px;
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vars-title .count {
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-size: 0.9em;
        }

        .var-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 auto;
        }

        .var-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: baseline;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .var-row:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .var-name {
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .var-value {
            color: #0f0;
            text-shadow: 0 0 8px #0f0;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
        }

        .var-empty {
            color: #555;
            font-style: italic;
            padding: 10px 4px;
            text-align: center;
        }

        /* ============================================================
           Ввод
           ============================================================ */
        .input-row {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 56px;
        }

        .prompt {
            color: #0ff;
            text-shadow: 0 0 12px #0ff;
            font-size: clamp(16px, 3.4vw, 22px);
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }

        #input {
            flex: 1;
            height: 100%;
            padding: 0 16px;
            font-family: inherit;
            font-size: clamp(15px, 3.2vw, 19px);
            background: rgba(0, 255, 255, 0.06);
            color: #fff;
            border: 2px solid #0ff;
            border-radius: 12px;
            outline: none;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.4),
                inset 0 0 20px rgba(0, 255, 255, 0.08);
            caret-color: #0ff;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        #input:focus {
            border-color: #0ff;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.7),
                inset 0 0 24px rgba(0, 255, 255, 0.12);
        }

        #input.error {
            border-color: #f0f;
            box-shadow:
                0 0 30px rgba(255, 0, 255, 0.7),
                inset 0 0 24px rgba(255, 0, 255, 0.12);
        }

        /* Мобильная адаптация */
        @media (max-width: 720px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
                gap: 8px;
                padding: 8px;
            }
            .topbar { height: 40px; }
            .log { grid-column: 1; grid-row: 2; }
            .vars {
                grid-column: 1;
                grid-row: 3;
                max-height: 32vh;
            }
            .input-row {
                grid-row: 4;
                height: 48px;
            }
            .var-value { max-width: none; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Верхняя панель -->
    <div class="topbar">
        <a href="index.html" class="back-btn">← Меню</a>
        <div class="title">СТРОЧНЫЙ КАЛЬКУЛЯТОР</div>
        <button type="button" class="fs-btn" id="btnFullscreen">
            <span id="fsIcon">⛶</span>
        </button>
    </div>

    <!-- Лог вычислений -->
    <div class="log" id="log">
        <div class="entry comment">
            <span class="expr">Добро пожаловать! Введите выражение и нажмите Enter.</span>
        </div>
        <div class="entry comment">
            <span class="expr">Примеры: 2+2*3 , x = 5 , y = x^2 + sin(pi/2) , z = sqrt(x^2 + y^2)</span>
        </div>
        <div class="entry comment">
            <span class="expr">Команды: help · vars · clear · del x</span>
        </div>
    </div>

    <!-- Панель переменных -->
    <aside class="vars">
        <div class="vars-title">
            <span>ПЕРЕМЕННЫЕ</span>
            <span class="count" id="varCount">0</span>
        </div>
        <div class="var-list" id="varList">
            <div class="var-empty">Пока нет переменных</div>
        </div>
    </aside>

    <!-- Строка ввода -->
    <div class="input-row">
        <span class="prompt">&gt;</span>
        <input
            type="text"
            id="input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Введите выражение…"
        >
    </div>
</div>

<script>
    // ============================================================
    //                       ХРАНИЛИЩЕ ПЕРЕМЕННЫХ
    // ============================================================
    const vars = new Map();     // name -> число
    
    // ============================================================
    //                    ЗВУК НАЖАТИЙ
    // ============================================================
    const CLICK_SRC = 'mg/res/click.mp3';
    const CLICK_POOL_SIZE = 4;             // сколько копий звука держать
    const clickPool = [];
    let clickPoolIdx = 0;
    let audioUnlocked = false;

    function initClickSound() {
        for (let i = 0; i < CLICK_POOL_SIZE; i++) {
            const a = new Audio(CLICK_SRC);
            a.preload = 'auto';
            a.volume = 0.35;               // приглушим, чтобы не било по ушам
            clickPool.push(a);
        }
    }

    function playClick() {
        if (!audioUnlocked) return;
        const a = clickPool[clickPoolIdx];
        clickPoolIdx = (clickPoolIdx + 1) % CLICK_POOL_SIZE;
        try {
            a.currentTime = 0;
            // play() возвращает промис — на всякий случай гасим ошибки
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
        } catch (e) { /* игнорируем */ }
    }

    // Разблокировка звука при первом взаимодействии (нужно для iOS/Chrome)
    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        // Проиграем «тишину» — это разблокирует аудио-контекст на мобильных
        const a = new Audio(CLICK_SRC);
        a.volume = 0;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        // Останавливаем сразу
        setTimeout(() => { try { a.pause(); } catch (e) {} }, 50);
    }

    document.addEventListener('pointerdown', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    // Инициализация пула
    initClickSound();
    
    function isTypingKey(e) {
        // Печатная клавиша — это клавиша, которая вставляет символ в поле.
        // e.key для букв/цифр/символов имеет длину 1, кроме спец-случаев.
        if (e.ctrlKey || e.metaKey || e.altKey) return false;   // не Ctrl+C, не Cmd+V
        if (e.key.length !== 1) return false;                    // Shift, Enter, Arrow, Tab, Esc
        return true;
    }

    // ============================================================
    //                       ЛОГ
    // ============================================================
    const logEl    = document.getElementById('log');
    const inputEl  = document.getElementById('input');
    const varListEl= document.getElementById('varList');
    const varCountEl = document.getElementById('varCount');

    function logEntry(expr, result, isError) {
        const div = document.createElement('div');
        div.className = 'entry' + (isError ? ' error' : '');
        div.innerHTML =
            `<span class="prompt">&gt;</span> ` +
            `<span class="expr">${escapeHtml(expr)}</span>` +
            (result !== undefined ? ` <span class="result">= ${escapeHtml(result)}</span>` : '');
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function logComment(text) {
        const div = document.createElement('div');
        div.className = 'entry comment';
        div.innerHTML = `<span class="expr">${escapeHtml(text)}</span>`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    // ============================================================
    //                       ОТРИСОВКА ПЕРЕМЕННЫХ
    // ============================================================
    function renderVars() {
        varCountEl.textContent = vars.size;

        if (vars.size === 0) {
            varListEl.innerHTML = '<div class="var-empty">Пока нет переменных</div>';
            return;
        }

        // Сортируем по имени
        const names = [...vars.keys()].sort((a, b) => a.localeCompare(b));

        varListEl.innerHTML = '';
        for (const name of names) {
            const val = vars.get(name);
            const row = document.createElement('div');
            row.className = 'var-row';
            row.title = 'Кликните, чтобы вставить имя в поле ввода';
            row.innerHTML =
                `<span class="var-name">${escapeHtml(name)}</span>` +
                `<span class="var-value">${escapeHtml(formatNumber(val))}</span>`;
            row.addEventListener('click', () => {
                insertAtCursor(name);
                inputEl.focus();
            });
            varListEl.appendChild(row);
        }
    }

    function formatNumber(n) {
        if (!isFinite(n)) return n > 0 ? '∞' : (n < 0 ? '-∞' : 'NaN');
        if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
        // Ограничиваем длинную мантиссу
        const s = n.toString();
        if (s.length > 16) return n.toPrecision(10).replace(/\.?0+$/, '');
        return s;
    }

    // ============================================================
    //                       ВСТАВКА В КУРСОР
    // ============================================================
    function insertAtCursor(text) {
        const start = inputEl.selectionStart ?? inputEl.value.length;
        const end   = inputEl.selectionEnd   ?? inputEl.value.length;
        const before = inputEl.value.slice(0, start);
        const after  = inputEl.value.slice(end);
        inputEl.value = before + text + after;
        const pos = start + text.length;
        inputEl.setSelectionRange(pos, pos);
    }

    // ============================================================
    //                       ЛЕКСЕР
    // ============================================================
    const TT = {
        NUM: 'NUM',
        IDENT: 'IDENT',
        OP: 'OP',
        LPAREN: 'LPAREN',
        RPAREN: 'RPAREN',
        COMMA: 'COMMA',
        EOF: 'EOF',
    };

    function tokenize(src) {
        const tokens = [];
        let i = 0;
        const n = src.length;
        while (i < n) {
            const c = src[i];

            // Пробелы
            if (c === ' ' || c === '\t') { i++; continue; }

            // Числа: 123, 123.45, .5, 1.2e-3
            if (/[0-9.]/.test(c)) {
                let j = i;
                while (j < n && /[0-9]/.test(src[j])) j++;
                if (src[j] === '.') {
                    j++;
                    while (j < n && /[0-9]/.test(src[j])) j++;
                }
                if (src[j] === 'e' || src[j] === 'E') {
                    let k = j + 1;
                    if (src[k] === '+' || src[k] === '-') k++;
                    if (/[0-9]/.test(src[k])) {
                        j = k;
                        while (j < n && /[0-9]/.test(src[j])) j++;
                    }
                }
                const text = src.slice(i, j);
                const value = parseFloat(text);
                if (isNaN(value)) throw new CalcError(`Некорректное число: ${text}`);
                tokens.push({ type: TT.NUM, value, text });
                i = j;
                continue;
            }

            // Идентификаторы (переменные, функции, константы)
            if (/[A-Za-z_]/.test(c)) {
                let j = i;
                while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
                const text = src.slice(i, j);
                tokens.push({ type: TT.IDENT, value: text });
                i = j;
                continue;
            }

            // Скобки и запятая
            if (c === '(') { tokens.push({ type: TT.LPAREN, value: '(' }); i++; continue; }
            if (c === ')') { tokens.push({ type: TT.RPAREN, value: ')' }); i++; continue; }
            if (c === ',' || c === ';') { tokens.push({ type: TT.COMMA, value: ',' }); i++; continue; }

            // Операторы (включая многосимвольные)
            const two = src.slice(i, i + 2);
            if (two === '**') { tokens.push({ type: TT.OP, value: '^' }); i += 2; continue; }
            if ('+-*/^%='.includes(c)) {
                tokens.push({ type: TT.OP, value: c });
                i++;
                continue;
            }

            throw new CalcError(`Неизвестный символ: '${c}'`);
        }
        tokens.push({ type: TT.EOF, value: null });
        return tokens;
    }

    // ============================================================
    //                       ИСКЛЮЧЕНИЕ
    // ============================================================
    class CalcError extends Error {
        constructor(msg) { super(msg); this.name = 'CalcError'; }
    }

    // ============================================================
    //                       ПАРСЕР (рекурсивный спуск)
    // ============================================================
    //
    // Грамматика (по возрастанию приоритета):
    //   expr     := assign
    //   assign   := IDENT '=' assign | additive
    //   additive := multiplicative (('+' | '-') multiplicative)*
    //   multiplicative := unary (('*' | '/' | '%') unary)*
    //   unary    := ('+' | '-') unary | power
    //   power    := primary ('^' unary)?      // правая ассоциативность
    //   primary  := NUM
    //             | IDENT
    //             | IDENT '(' args ')'
    //             | '(' expr ')'
    //   args     := expr (',' expr)*
    //
    // Возвращает функцию-вычислитель (без аргументов), которая кидает CalcError
    // при неизвестных переменных, либо вычисляет значение.

    function parse(tokens) {
        let pos = 0;
        const peek = () => tokens[pos];
        const next = () => tokens[pos++];
        const expect = (type, val) => {
            const t = peek();
            if (t.type !== type || (val !== undefined && t.value !== val)) {
                throw new CalcError(`Ожидалось ${val ?? type}, получено ${t.type}${t.value !== null ? ' ' + t.value : ''}`);
            }
            return next();
        };

        function parseAssign() {
            // Присваивание: IDENT '=' assign
            if (peek().type === TT.IDENT && tokens[pos + 1]?.type === TT.OP && tokens[pos + 1].value === '=') {
                const name = next().value;
                next(); // '='
                const rhs = parseAssign();
                return () => {
                    const val = rhs();
                    vars.set(name, val);
                    renderVars();
                    return val;
                };
            }
            return parseAdditive();
        }

        function parseAdditive() {
            let left = parseMultiplicative();
            while (peek().type === TT.OP && (peek().value === '+' || peek().value === '-')) {
                const op = next().value;
                const right = parseMultiplicative();
                const l = left, r = right;
                left = op === '+'
                    ? () => l() + r()
                    : () => l() - r();
            }
            return left;
        }

        function parseMultiplicative() {
            let left = parseUnary();
            while (peek().type === TT.OP && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
                const op = next().value;
                const right = parseUnary();
                const l = left, r = right;
                if (op === '*') left = () => l() * r();
                else if (op === '/') left = () => {
                    const d = r();
                    if (d === 0) throw new CalcError('Деление на ноль');
                    return l() / d;
                };
                else left = () => l() % r();
            }
            return left;
        }

        function parseUnary() {
            if (peek().type === TT.OP && (peek().value === '+' || peek().value === '-')) {
                const op = next().value;
                const operand = parseUnary();
                return op === '+' ? operand : () => -operand();
            }
            return parsePower();
        }

        function parsePower() {
            const base = parsePrimary();
            if (peek().type === TT.OP && peek().value === '^') {
                next();
                // Правая ассоциативность: 2^3^2 = 2^(3^2)
                const exp = parseUnary();
                return () => Math.pow(base(), exp());
            }
            return base;
        }

        function parsePrimary() {
            const t = peek();

            if (t.type === TT.NUM) {
                next();
                const v = t.value;
                return () => v;
            }

            if (t.type === TT.IDENT) {
                next();
                const name = t.value;

                // Функция?
                if (peek().type === TT.LPAREN) {
                    next(); // '('
                    const args = [];
                    if (peek().type !== TT.RPAREN) {
                        args.push(parseAssign());
                        while (peek().type === TT.COMMA) {
                            next();
                            args.push(parseAssign());
                        }
                    }
                    expect(TT.RPAREN);
                    return makeFunction(name, args);
                }

                // Константа или переменная
                const lower = name.toLowerCase();
                if (lower === 'pi') return () => Math.PI;
                if (lower === 'e')  return () => Math.E;
                if (lower === 'tau') return () => Math.PI * 2;
                if (lower === 'inf') return () => Infinity;
                if (lower === 'nan') return () => NaN;

                // Переменная (проверяем при вычислении — на случай, если её определят позже)
                return () => {
                    if (!vars.has(name)) throw new CalcError(`Неизвестная переменная: ${name}`);
                    return vars.get(name);
                };
            }

            if (t.type === TT.LPAREN) {
                next();
                const inner = parseAssign();
                expect(TT.RPAREN);
                return inner;
            }

            throw new CalcError(`Неожиданный токен: ${t.type}${t.value !== null ? ' ' + t.value : ''}`);
        }

        // Функции (все принимают фиксированное или переменное число аргументов)
        function makeFunction(name, args) {
            const fname = name.toLowerCase();

            // Тригонометрия
            if (fname === 'sin')   { arity(1); return () => Math.sin(args[0]()); }
            if (fname === 'cos')   { arity(1); return () => Math.cos(args[0]()); }
            if (fname === 'tan')   { arity(1); return () => Math.tan(args[0]()); }
            if (fname === 'asin')  { arity(1); return () => Math.asin(args[0]()); }
            if (fname === 'acos')  { arity(1); return () => Math.acos(args[0]()); }
            if (fname === 'atan')  { arity(1); return () => Math.atan(args[0]()); }
            if (fname === 'atan2') { arity(2); return () => Math.atan2(args[0](), args[1]()); }
            if (fname === 'sinh')  { arity(1); return () => Math.sinh(args[0]()); }
            if (fname === 'cosh')  { arity(1); return () => Math.cosh(args[0]()); }
            if (fname === 'tanh')  { arity(1); return () => Math.tanh(args[0]()); }

            // Экспонента и логарифмы
            if (fname === 'exp')   { arity(1); return () => Math.exp(args[0]()); }
            if (fname === 'ln')    { arity(1); return () => {
                const v = args[0]();
                if (v <= 0) throw new CalcError('ln: аргумент должен быть > 0');
                return Math.log(v);
            }; }
            if (fname === 'log')   {
                // log(x) — десятичный, log(x, base) — по основанию
                if (args.length === 1) return () => {
                    const v = args[0]();
                    if (v <= 0) throw new CalcError('log: аргумент должен быть > 0');
                    return Math.log10(v);
                };
                if (args.length === 2) return () => {
                    const v = args[0](), b = args[1]();
                    if (v <= 0 || b <= 0 || b === 1) throw new CalcError('log: некорректные аргументы');
                    return Math.log(v) / Math.log(b);
                };
                throw new CalcError('log: ожидается 1 или 2 аргумента');
            }
            if (fname === 'log2')  { arity(1); return () => {
                const v = args[0]();
                if (v <= 0) throw new CalcError('log2: аргумент должен быть > 0');
                return Math.log2(v);
            }; }
            if (fname === 'log10') { arity(1); return () => {
                const v = args[0]();
                if (v <= 0) throw new CalcError('log10: аргумент должен быть > 0');
                return Math.log10(v);
            }; }

            // Корни и степени
            if (fname === 'sqrt')  { arity(1); return () => {
                const v = args[0]();
                if (v < 0) throw new CalcError('sqrt: аргумент должен быть ≥ 0');
                return Math.sqrt(v);
            }; }
            if (fname === 'cbrt')  { arity(1); return () => Math.cbrt(args[0]()); }
            if (fname === 'pow')   { arity(2); return () => Math.pow(args[0](), args[1]()); }

            // Округления
            if (fname === 'abs')   { arity(1); return () => Math.abs(args[0]()); }
            if (fname === 'floor') { arity(1); return () => Math.floor(args[0]()); }
            if (fname === 'ceil')  { arity(1); return () => Math.ceil(args[0]()); }
            if (fname === 'round') { arity(1); return () => Math.round(args[0]()); }
            if (fname === 'trunc') { arity(1); return () => Math.trunc(args[0]()); }
            if (fname === 'sign')  { arity(1); return () => Math.sign(args[0]()); }

            // Прочее
            if (fname === 'min')   { return () => Math.min(...args.map(a => a())); }
            if (fname === 'max')   { return () => Math.max(...args.map(a => a())); }
            if (fname === 'hypot') { return () => Math.hypot(...args.map(a => a())); }
            if (fname === 'random'){ arity(0); return () => Math.random(); }

            // Градусы/радианы
            if (fname === 'deg')   { arity(1); return () => args[0]() * Math.PI / 180; }
            if (fname === 'rad')   { arity(1); return () => args[0]() * 180 / Math.PI; }

            throw new CalcError(`Неизвестная функция: ${name}`);

            function arity(n) {
                if (args.length !== n) {
                    throw new CalcError(`${name}: ожидается ${n} аргумент(ов), получено ${args.length}`);
                }
            }
        }

        const fn = parseAssign();
        if (peek().type !== TT.EOF) {
            throw new CalcError(`Лишние символы после выражения: ${peek().value}`);
        }
        return fn;
    }

    // ============================================================
    //                       EVAL
    // ============================================================
    function evaluate(src) {
        const trimmed = src.trim();
        if (!trimmed) return { empty: true };

        // Команды
        const lower = trimmed.toLowerCase();
        if (lower === 'help')  return { help: true };
        if (lower === 'vars')  return { showVars: true };
        if (lower === 'clear') return { clearVars: true };
        if (lower.startsWith('del ')) {
            const name = trimmed.slice(4).trim();
            if (!name) throw new CalcError('del: укажите имя переменной');
            if (!vars.has(name)) throw new CalcError(`del: переменная ${name} не найдена`);
            vars.delete(name);
            renderVars();
            return { deleted: name };
        }

        const tokens = tokenize(trimmed);
        const fn = parse(tokens);
        const value = fn();
        return { value };
    }

    // ============================================================
    //                       ОБРАБОТКА ВВОДА
    // ============================================================
    function handleSubmit() {
        const src = inputEl.value;
        if (!src.trim()) return;

        try {
            const res = evaluate(src);

            if (res.empty) return;
            if (res.help) { inputEl.value = ''; showHelp(); return; }
            if (res.showVars) { inputEl.value = ''; showVars(); return; }
            if (res.clearVars) {
                vars.clear();
                renderVars();
                logComment('Все переменные удалены.');
                inputEl.value = '';
                return;
            }
            if (res.deleted) {
                logComment(`Удалено: ${res.deleted}`);
                inputEl.value = '';
                return;
            }

            // Обычный результат
            const formatted = formatNumber(res.value);
            logEntry(src, formatted, false);
            inputEl.value = '';
            inputEl.classList.remove('error');
        } catch (err) {
            const msg = err instanceof CalcError ? err.message : ('Ошибка: ' + err.message);
            logEntry(src, msg, true);
            inputEl.classList.add('error');
            setTimeout(() => inputEl.classList.remove('error'), 600);
            // НЕ очищаем input — даём исправить
        }
        inputEl.focus();
    }

    // ============================================================
    //                       КОМАНДЫ
    // ============================================================
    function showHelp() {
        logComment('─── СПРАВКА ───');
        logComment('Операторы: + - * / % ^ (или **)');
        logComment('Скобки: ( ) с любой вложенностью');
        logComment('Присваивание: x = 5 · y = x^2 + 1');
        logComment('Константы: pi, e, tau, inf, nan');
        logComment('Тригонометрия: sin, cos, tan, asin, acos, atan, atan2, sinh, cosh, tanh');
        logComment('Логарифмы: ln, log(x), log(x, base), log2, log10, exp');
        logComment('Корни: sqrt, cbrt, pow(x, y)');
        logComment('Округления: abs, floor, ceil, round, trunc, sign');
        logComment('Прочее: min, max, hypot, random, deg, rad');
        logComment('Команды: help · vars · clear · del имя');
        logComment('Клик по переменной справа вставит её имя в строку ввода.');
    }

    function showVars() {
        if (vars.size === 0) {
            logComment('Переменных нет.');
            return;
        }
        const names = [...vars.keys()].sort((a, b) => a.localeCompare(b));
        logComment('─── ПЕРЕМЕННЫЕ ───');
        for (const n of names) {
            logComment(`${n} = ${formatNumber(vars.get(n))}`);
        }
    }

    // ============================================================
    //                       СОБЫТИЯ
    // ============================================================
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSubmit();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            recallHistory(1);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            recallHistory(-1);
        } else if (e.key === 'Escape') {
            inputEl.value = '';
            inputEl.classList.remove('error');
        }
    });

    // ============================================================
    //                       ИСТОРИЯ ВВОДА
    // ============================================================
    const history = [];          // массив строк (последнее — в конце)
    let historyPos = -1;         // -1 = «сейчас не листаем историю»

    function recallHistory(delta) {
        if (history.length === 0) return;

        if (historyPos === -1) {
            // Начинаем листать — сохраняем текущий черновик
            historyDraft = inputEl.value;
            historyPos = history.length;
        }

        historyPos += (delta > 0 ? -1 : 1);
        if (historyPos < 0) historyPos = 0;
        if (historyPos > history.length) historyPos = history.length;

        if (historyPos === history.length) {
            inputEl.value = historyDraft ?? '';
        } else {
            inputEl.value = history[historyPos];
        }
        // Курсор в конец
        const len = inputEl.value.length;
        inputEl.setSelectionRange(len, len);
    }

    let historyDraft = '';

    // ============================================================
    //                       ПОДСКАЗКА ИМЁН ПРИ ВВОДЕ
    // ============================================================
    // Простая автодополнялка: при вводе буквы показываем первую подходящую
    // переменную или функцию в placeholder.
    const KNOWN_FUNCS = [
        'sin','cos','tan','asin','acos','atan','atan2','sinh','cosh','tanh',
        'exp','ln','log','log2','log10','sqrt','cbrt','pow',
        'abs','floor','ceil','round','trunc','sign',
        'min','max','hypot','random','deg','rad',
    ];
    const KNOWN_CONSTS = ['pi','e','tau','inf','nan'];

    function updatePlaceholder() {
        const v = inputEl.value;
        const m = v.match(/[A-Za-z_][A-Za-z0-9_]*$/);
        if (!m) {
            inputEl.placeholder = 'Введите выражение…';
            return;
        }
        const prefix = m[0].toLowerCase();
        if (prefix.length < 1) {
            inputEl.placeholder = 'Введите выражение…';
            return;
        }

        const candidates = [
            ...vars.keys(),
            ...KNOWN_FUNCS,
            ...KNOWN_CONSTS,
        ];
        const match = candidates.find(name => name.toLowerCase().startsWith(prefix) && name.toLowerCase() !== prefix);

        if (match) {
            const suffix = match.slice(prefix.length);
            inputEl.placeholder = inputEl.value + suffix;
        } else {
            inputEl.placeholder = 'Введите выражение…';
        }
    }

    inputEl.addEventListener('input', () => {
        inputEl.classList.remove('error');
        updatePlaceholder();
    });

    // Tab — принять подсказку из placeholder
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
            const ph = inputEl.placeholder;
            if (ph && ph.startsWith(inputEl.value) && ph !== 'Введите выражение…') {
                e.preventDefault();
                inputEl.value = ph;
                const len = inputEl.value.length;
                inputEl.setSelectionRange(len, len);
                updatePlaceholder();
            }
        }
    });

    // ============================================================
    //                       ПОЛНЫЙ ЭКРАН
    // ============================================================
    const fsBtn   = document.getElementById('btnFullscreen');
    const fsIcon  = document.getElementById('fsIcon');
    const fsTarget = document.documentElement;

    function isFullscreen() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement;
    }
    function updateFsIcon() {
        fsIcon.textContent = isFullscreen() ? '⤡' : '⛶';
    }
    function toggleFullscreen() {
        if (!isFullscreen()) {
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        } else {
            const exit = document.exitFullscreen ||
                         document.webkitExitFullscreen ||
                         document.msExitFullscreen;
            if (exit) {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            }
        }
    }
    fsBtn.addEventListener('click', toggleFullscreen);
    fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

    ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
        .forEach(evt => document.addEventListener(evt, updateFsIcon));

    // Автовосстановление полного экрана (как в остальных играх проекта)
    (function autoFullscreenFromMenu() {
        const KEY = 'arcade_fullscreen_pref';
        let pref = '0';
        try { pref = localStorage.getItem(KEY) || '0'; } catch (e) {}
        if (pref !== '1') return;

        function tryFs() {
            if (isFullscreen()) return;
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        }
        const once = () => {
            tryFs();
            document.removeEventListener('pointerdown', once);
            document.removeEventListener('keydown', once);
        };
        document.addEventListener('pointerdown', once, { once: true });
        document.addEventListener('keydown', once, { once: true });
        tryFs();
    })();

    // ============================================================
    //                       ГРАФИКИ (опционально)
    // ============================================================
    // Синтаксис: plot(expr)         — рисует expr(x) в диапазоне [-10, 10]
    //            plot(expr, a, b)   — рисует expr(x) в диапазоне [a, b]
    //
    // Реализовано в самом evaluate — как специальная команда.

    function tryPlot(src) {
        const m = src.match(/^plot\s*\((.+)\)\s*$/i);
        if (!m) return false;

        // Разбираем аргументы plot через токенизатор: expr, [a], [b]
        // Простой путь: найдём верхнеуровневые запятые.
        const inner = m[1];
        const parts = splitTopLevel(inner, ',');
        if (parts.length < 1 || parts.length > 3) {
            throw new CalcError('plot: ожидается plot(expr) или plot(expr, a, b)');
        }

        const exprSrc = parts[0].trim();
        const a = parts[1] !== undefined ? Number(evaluate(parts[1].trim()).value) : -10;
        const b = parts[2] !== undefined ? Number(evaluate(parts[2].trim()).value) :  10;
        if (!isFinite(a) || !isFinite(b) || a >= b) {
            throw new CalcError('plot: некорректный диапазон');
        }

        // Строим функцию f(x)
        const tokens = tokenize(exprSrc);
        const fn = parse(tokens);

        // Показываем canvas в логе
        const W = 480, H = 240, PAD = 20;
        const N_POINTS = 400;

        // Пробуем вычислить значения
        const samples = [];
        let minY = Infinity, maxY = -Infinity;
        for (let i = 0; i <= N_POINTS; i++) {
            const x = a + (b - a) * i / N_POINTS;
            const oldX = vars.get('x');
            vars.set('x', x);
            try {
                const y = fn();
                if (isFinite(y)) {
                    samples.push({ x, y });
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                } else {
                    samples.push({ x, y: null });
                }
            } catch (e) {
                samples.push({ x, y: null });
            }
            if (oldX === undefined) vars.delete('x');
            else vars.set('x', oldX);
        }

        if (!isFinite(minY) || !isFinite(maxY)) {
            throw new CalcError('plot: не удалось вычислить значения');
        }
        if (minY === maxY) { minY -= 1; maxY += 1; }

        // Создаём canvas
        const canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        canvas.style.maxWidth = '100%';
        canvas.style.display = 'block';
        canvas.style.margin = '6px 0';
        canvas.style.borderRadius = '8px';
        canvas.style.background = 'rgba(0, 0, 0, 0.35)';
        canvas.style.boxShadow = '0 0 12px rgba(0, 255, 255, 0.4)';

        const c = canvas.getContext('2d');
        c.scale(dpr, dpr);

        // Оси
        c.strokeStyle = 'rgba(0, 255, 255, 0.25)';
        c.lineWidth = 1;
        // Ось X (y=0)
        if (minY <= 0 && maxY >= 0) {
            const y0 = H - PAD - (0 - minY) / (maxY - minY) * (H - PAD * 2);
            c.beginPath();
            c.moveTo(PAD, y0);
            c.lineTo(W - PAD, y0);
            c.stroke();
        }
        // Ось Y (x=0)
        if (a <= 0 && b >= 0) {
            const x0 = PAD + (0 - a) / (b - a) * (W - PAD * 2);
            c.beginPath();
            c.moveTo(x0, PAD);
            c.lineTo(x0, H - PAD);
            c.stroke();
        }

        // Подписи
        c.fillStyle = 'rgba(0, 255, 255, 0.7)';
        c.font = '11px "Courier New", monospace';
        c.fillText('x: ' + a + ' … ' + b, PAD, H - 4);
        c.fillText('y: ' + minY.toFixed(2) + ' … ' + maxY.toFixed(2), PAD, 12);

        // График
        c.strokeStyle = '#0ff';
        c.lineWidth = 1.6;
        c.shadowColor = '#0ff';
        c.shadowBlur = 8;
        c.beginPath();
        let started = false;
        for (const s of samples) {
            if (s.y === null || !isFinite(s.y)) {
                started = false;
                continue;
            }
            const px = PAD + (s.x - a) / (b - a) * (W - PAD * 2);
            const py = H - PAD - (s.y - minY) / (maxY - minY) * (H - PAD * 2);
            if (!started) {
                c.moveTo(px, py);
                started = true;
            } else {
                c.lineTo(px, py);
            }
        }
        c.stroke();
        c.shadowBlur = 0;

        // Оформляем как запись в логе
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML =
            `<span class="prompt">&gt;</span> ` +
            `<span class="expr">${escapeHtml(src)}</span>`;
        entry.appendChild(document.createElement('br'));
        entry.appendChild(canvas);
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;

        return true;
    }

    // Разбивает строку по разделителю на верхнем уровне (вне скобок)
    function splitTopLevel(src, sep) {
        const parts = [];
        let depth = 0;
        let current = '';
        for (let i = 0; i < src.length; i++) {
            const ch = src[i];
            if (ch === '(') depth++;
            else if (ch === ')') depth--;
            if (ch === sep && depth === 0) {
                parts.push(current);
                current = '';
            } else {
                current += ch;
            }
        }
        parts.push(current);
        return parts;
    }

    // ============================================================
    //                       ОБНОВЛЁННЫЙ handleSubmit
    // ============================================================
    // Переопределяем handleSubmit, чтобы поддержать plot(...)
    // и вести историю.

    const _originalHandleSubmit = handleSubmit;

    handleSubmit = function () {
        const src = inputEl.value;
        if (!src.trim()) return;

        // Спец-команды, не проходящие через eval
        if (/^plot\s*\(/i.test(src.trim())) {
            try {
                tryPlot(src.trim());
                history.push(src);
                if (history.length > 200) history.shift();
                historyPos = -1;
                historyDraft = '';
                inputEl.value = '';
                inputEl.classList.remove('error');
            } catch (err) {
                const msg = err instanceof CalcError ? err.message : ('Ошибка: ' + err.message);
                logEntry(src, msg, true);
                inputEl.classList.add('error');
                setTimeout(() => inputEl.classList.remove('error'), 600);
            }
            inputEl.focus();
            return;
        }

        // Обычный путь + запись в историю
        try {
            const res = evaluate(src);

            if (res.empty) return;
            if (res.help) { history.push(src); inputEl.value = ''; showHelp(); return; }
            if (res.showVars) { history.push(src); inputEl.value = ''; showVars(); return; }
            if (res.clearVars) {
                history.push(src);
                vars.clear();
                renderVars();
                logComment('Все переменные удалены.');
                inputEl.value = '';
                return;
            }
            if (res.deleted) {
                history.push(src);
                logComment(`Удалено: ${res.deleted}`);
                inputEl.value = '';
                return;
            }

            const formatted = formatNumber(res.value);
            logEntry(src, formatted, false);

            history.push(src);
            if (history.length > 200) history.shift();
            historyPos = -1;
            historyDraft = '';

            inputEl.value = '';
            inputEl.classList.remove('error');
        } catch (err) {
            const msg = err instanceof CalcError ? err.message : ('Ошибка: ' + err.message);
            logEntry(src, msg, true);
            inputEl.classList.add('error');
            setTimeout(() => inputEl.classList.remove('error'), 600);
            history.push(src);
            if (history.length > 200) history.shift();
            historyPos = -1;
            historyDraft = '';
        }
        updatePlaceholder();
        inputEl.focus();
    };

    // Переназначаем обработчик Enter (иначе старый handleSubmit закешируется)
    inputEl.removeEventListener('keydown', handleSubmit);
    inputEl.addEventListener('keydown', e => {
    
        // Играем звук только для «печатных» клавиш
        if (isTypingKey(e)) {
            playClick();
        }
    
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSubmit();
        }
    });

    // ============================================================
    //                       СТАРТ
    // ============================================================
    renderVars();
    updateFsIcon();
    inputEl.focus();
</script>
</body>
</html>
