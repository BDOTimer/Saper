<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крестики-нолики 4×4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0a0a14;
            font-family: 'Courier New', monospace;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 60px 10px 30px;
            touch-action: none;
        }

        .scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: clamp(14px, 3.8vw, 20px);
            text-shadow: 0 0 10px #0ff;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
        }

        .scoreboard .x { color: #0ff; text-shadow: 0 0 10px #0ff; }
        .scoreboard .o { color: #f0f; text-shadow: 0 0 10px #f0f; }

        .status {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: clamp(13px, 3.4vw, 18px);
            letter-spacing: 2px;
            text-shadow: 0 0 12px #0ff;
            white-space: nowrap;
            z-index: 20;
            pointer-events: none;
        }

        /* Игровое поле 4×4 */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(6px, 1.6vw, 10px);
            width: min(88vw, 60vh, 480px);
            aspect-ratio: 1 / 1;
            padding: clamp(6px, 1.6vw, 10px);
            background: rgba(0, 255, 255, 0.04);
            border: 2px solid #0ff;
            border-radius: 14px;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.4),
                inset 0 0 30px rgba(0, 255, 255, 0.08);
            position: relative;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.35);
            border-radius: 10px;
            font-family: inherit;
            font-size: clamp(28px, 9vw, 64px);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .cell:hover:not(.taken) {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .cell:active:not(.taken) {
            transform: scale(0.96);
        }

        .cell.taken {
            cursor: default;
        }

        .cell .mark {
            display: inline-block;
            animation: pop 0.25s ease-out;
            line-height: 1;
        }

        .cell .mark.x {
            color: #0ff;
            text-shadow:
                0 0 10px #0ff,
                0 0 25px #0ff;
        }

        .cell .mark.o {
            color: #f0f;
            text-shadow:
                0 0 10px #f0f,
                0 0 25px #f0f;
        }

        @keyframes pop {
            0%   { transform: scale(0.2); opacity: 0; }
            70%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Подсветка выигрышной линии */
        .cell.win {
            background: rgba(0, 255, 255, 0.35);
            border-color: #fff;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.9),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            animation: winPulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes winPulse {
            from { box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255,255,255,0.2); }
            to   { box-shadow: 0 0 30px rgba(0, 255, 255, 1), inset 0 0 30px rgba(255,255,255,0.4); }
        }

        /* Кнопки в углах */
        .corner-btn {
            position: absolute;
            top: 10px;
            padding: 7px 14px;
            font-family: inherit;
            font-size: clamp(12px, 3vw, 15px);
            background: rgba(0, 255, 255, 0.15);
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            text-decoration: none;
            z-index: 25;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .corner-btn:active {
            background: rgba(0, 255, 255, 0.4);
            color: #000;
        }

        .back-btn { left: 10px; }
        .fs-btn   { right: 10px; display: inline-flex; align-items: center; gap: 6px; }

        /* Кнопка "новая игра" внизу */
        .restart-btn {
            margin-top: clamp(14px, 3vh, 24px);
            padding: clamp(10px, 2.5vh, 14px) clamp(20px, 5vw, 28px);
            font-family: inherit;
            font-size: clamp(14px, 3.6vw, 18px);
            letter-spacing: 2px;
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transition: all 0.15s ease;
        }

        .restart-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
        }

        /* Экран результата */
        .result-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 30;
            text-align: center;
            padding: 20px;
            gap: 20px;
        }

        .result-screen h2 {
            color: #fff;
            font-size: clamp(22px, 7vw, 34px);
            text-shadow: 0 0 15px #0ff;
            letter-spacing: 3px;
        }

        .result-screen h2.win  { color: #0ff; text-shadow: 0 0 20px #0ff; }
        .result-screen h2.lose { color: #f0f; text-shadow: 0 0 20px #f0f; }

        .result-screen button {
            padding: 14px 30px;
            font-family: inherit;
            font-size: clamp(15px, 4vw, 19px);
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<a href="index.html" class="corner-btn back-btn">← Меню</a>
<button type="button" class="corner-btn fs-btn" id="btnFullscreen">
    <span id="fsIcon">⛶</span>
</button>

<div class="game-wrapper">
    <div class="scoreboard">
        <span class="x">✕</span> Вы: <span id="scoreX">0</span>
        &nbsp;|&nbsp;
        <span class="o">◯</span> Бот: <span id="scoreO">0</span>
    </div>
    <div class="status" id="status">Ваш ход</div>

    <div class="board" id="board"></div>

    <button class="restart-btn" id="restart">НОВАЯ ИГРА</button>

    <div class="result-screen" id="resultScreen">
        <h2 id="resultText"></h2>
        <button onclick="newGame()">Играть снова</button>
    </div>
</div>

<script>
    const SIZE = 4;
    const PLAYER = 'X';
    const BOT    = 'O';

    const boardEl   = document.getElementById('board');
    const statusEl  = document.getElementById('status');
    const scoreXEl  = document.getElementById('scoreX');
    const scoreOEl  = document.getElementById('scoreO');
    const resultScr = document.getElementById('resultScreen');
    const resultTxt = document.getElementById('resultText');

    let cells = [];       // DOM-узлы
    let grid  = [];       // 'X' | 'O' | null
    let locked = false;   // блокировка во время хода бота
    let finished = false; // партия завершена
    let scoreX = 0, scoreO = 0;

    // ---- Инициализация поля ----
    function buildBoard() {
        boardEl.innerHTML = '';
        cells = [];
        for (let i = 0; i < SIZE * SIZE; i++) {
            const c = document.createElement('div');
            c.className = 'cell';
            c.dataset.i = i;
            c.addEventListener('click', () => onCellClick(i));
            boardEl.appendChild(c);
            cells.push(c);
        }
    }

    function newGame() {
        grid = Array(SIZE * SIZE).fill(null);
        cells.forEach(c => {
            c.className = 'cell';
            c.innerHTML = '';
        });
        locked = false;
        finished = false;
        statusEl.textContent = 'Ваш ход';
        resultScr.style.display = 'none';
    }

    // ---- Проверка победы ----
    // Возвращает { winner: 'X'|'O', line: [i1,i2,i3,i4] } или null
    function checkWin(g) {
        // Горизонтали
        for (let r = 0; r < SIZE; r++) {
            const start = r * SIZE;
            const v = g[start];
            if (v && [1,2,3].every(k => g[start + k] === v)) {
                return { winner: v, line: [start, start+1, start+2, start+3] };
            }
        }
        // Вертикали
        for (let c = 0; c < SIZE; c++) {
            const v = g[c];
            if (v && [1,2,3].every(k => g[c + k * SIZE] === v)) {
                return { winner: v, line: [c, c+SIZE, c+2*SIZE, c+3*SIZE] };
            }
        }
        // Главная диагональ
        {
            const v = g[0];
            if (v && [1,2,3].every(k => g[k * (SIZE + 1)] === v)) {
                const line = [0,1,2,3].map(k => k * (SIZE + 1));
                return { winner: v, line };
            }
        }
        // Побочная диагональ
        {
            const v = g[SIZE - 1];
            if (v && [1,2,3].every(k => g[(SIZE - 1) + k * (SIZE - 1)] === v)) {
                const line = [0,1,2,3].map(k => (SIZE - 1) + k * (SIZE - 1));
                return { winner: v, line };
            }
        }
        return null;
    }

    function isFull(g) {
        return g.every(v => v !== null);
    }

    // ---- Ход игрока ----
    function onCellClick(i) {
        if (locked || finished) return;
        if (grid[i]) return;
        placeMark(i, PLAYER);

        const win = checkWin(grid);
        if (win) return finishGame(win, PLAYER);
        if (isFull(grid)) return finishGame(null, null);

        locked = true;
        statusEl.textContent = 'Ход бота...';
        setTimeout(botMove, 350);
    }

    function placeMark(i, who) {
        grid[i] = who;
        const cell = cells[i];
        cell.classList.add('taken');
        const span = document.createElement('span');
        span.className = 'mark ' + (who === PLAYER ? 'x' : 'o');
        span.textContent = who === PLAYER ? '✕' : '◯';
        cell.appendChild(span);
    }

    // ---- Логика бота ----
    function botMove() {
        const move = chooseBotMove();
        if (move == null) { locked = false; return; }
        placeMark(move, BOT);

        const win = checkWin(grid);
        if (win) return finishGame(win, BOT);
        if (isFull(grid)) return finishGame(null, null);

        locked = false;
        statusEl.textContent = 'Ваш ход';
    }

    function chooseBotMove() {
        const empty = [];
        for (let i = 0; i < grid.length; i++) if (!grid[i]) empty.push(i);
        if (empty.length === 0) return null;

        // 1. Победный ход
        for (const i of empty) {
            const test = grid.slice(); test[i] = BOT;
            if (checkWin(test)) return i;
        }
        // 2. Блокировка победы игрока
        for (const i of empty) {
            const test = grid.slice(); test[i] = PLAYER;
            if (checkWin(test)) return i;
        }
        // 3. Центр (если свободен) — стратегически важно на 4×4
        const center = [];
        // для 4×4 «центр» — четыре центральные клетки
        const mid = [SIZE/2 - 1, SIZE/2];
        for (const r of mid) for (const c of mid) center.push(r * SIZE + c);
        const freeCenter = center.filter(i => !grid[i]);
        if (freeCenter.length) {
            return freeCenter[Math.floor(Math.random() * freeCenter.length)];
        }
        // 4. Случайный ход
        return empty[Math.floor(Math.random() * empty.length)];
    }

    // ---- Завершение партии ----
    function finishGame(win, who) {
        finished = true;
        locked = true;

        if (win) {
            win.line.forEach(i => cells[i].classList.add('win'));
            if (who === PLAYER) {
                scoreX++;
                scoreXEl.textContent = scoreX;
                statusEl.textContent = 'Вы победили!';
                resultTxt.textContent = '✕ ПОБЕДА!';
                resultTxt.className = 'win';
            } else {
                scoreO++;
                scoreOEl.textContent = scoreO;
                statusEl.textContent = 'Бот победил';
                resultTxt.textContent = '◯ БОТ ПОБЕДИЛ';
                resultTxt.className = 'lose';
            }
        } else {
            statusEl.textContent = 'Ничья';
            resultTxt.textContent = 'НИЧЬЯ';
            resultTxt.className = '';
        }
        setTimeout(() => { resultScr.style.display = 'flex'; }, 700);
    }

    // ---- Кнопка "новая игра" ----
    document.getElementById('restart').addEventListener('click', newGame);

    // ---- Полный экран ----
    const fsBtn   = document.getElementById('btnFullscreen');
    const fsIcon  = document.getElementById('fsIcon');
    const fsTarget = document.documentElement;

    function isFullscreen() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement;
    }
    function updateFsIcon() {
        fsIcon.textContent = isFullscreen() ? '⤡' : '⛶';
    }
    function toggleFullscreen() {
        if (!isFullscreen()) {
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        } else {
            const exit = document.exitFullscreen ||
                         document.webkitExitFullscreen ||
                         document.msExitFullscreen;
            if (exit) {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            }
        }
    }
    fsBtn.addEventListener('click', toggleFullscreen);
    fsBtn.addEventListener('pointerdown', e => e.stopPropagation());

    ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']
        .forEach(evt => document.addEventListener(evt, updateFsIcon));

    // ---- Автовосстановление полного экрана из меню ----
    (function autoFullscreenFromMenu() {
        const KEY = 'arcade_fullscreen_pref';
        let pref = '0';
        try { pref = localStorage.getItem(KEY) || '0'; } catch (e) {}
        if (pref !== '1') return;

        function tryFs() {
            if (isFullscreen()) return;
            const req = fsTarget.requestFullscreen ||
                        fsTarget.webkitRequestFullscreen ||
                        fsTarget.msRequestFullscreen;
            if (req) {
                const p = req.call(fsTarget);
                if (p && p.catch) p.catch(() => {});
            }
        }
        const once = () => {
            tryFs();
            document.removeEventListener('pointerdown', once);
            document.removeEventListener('keydown', once);
        };
        document.addEventListener('pointerdown', once, { once: true });
        document.addEventListener('keydown', once, { once: true });
        tryFs();
    })();

    // ---- Старт ----
    buildBoard();
    newGame();
    updateFsIcon();
</script>
</body>
</html>
