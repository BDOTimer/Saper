    <!-- ===== Стили для карточек профиля (в неоновом стиле) ===== -->
    <style>
      /* ---------- Левая панель-агрегатор ---------- */
      .profiles-panel {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: min(260px, 34vw);
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 3;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 255, 255, 0.35) transparent;
      }

      .profiles-panel::-webkit-scrollbar {
        width: 6px;
      }
      .profiles-panel::-webkit-scrollbar-thumb {
        background: rgba(0, 255, 255, 0.35);
        border-radius: 4px;
      }
      .profiles-panel::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- Карточка профиля ---------- */
      .profile-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 16px;
        background: rgba(0, 255, 255, 0.06);
        border: 2px solid #0ff;
        border-radius: 14px;
        box-shadow:
          0 0 15px rgba(0, 255, 255, 0.25),
          inset 0 0 15px rgba(0, 255, 255, 0.08);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        width: 100%;
        animation: cardIn 0.35s ease-out;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .profile-card:hover {
        box-shadow:
          0 0 25px rgba(0, 255, 255, 0.5),
          inset 0 0 18px rgba(0, 255, 255, 0.15);
      }

      /* Аватар */
      .profile-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #0ff;
        box-shadow:
          0 0 10px rgba(0, 255, 255, 0.55),
          inset 0 0 10px rgba(0, 255, 255, 0.15);
        background: #0a0a14;
        transition: box-shadow 0.25s ease, transform 0.25s ease;
      }

      .profile-avatar:hover {
        transform: scale(1.06);
        box-shadow:
          0 0 18px rgba(0, 255, 255, 0.85),
          inset 0 0 12px rgba(0, 255, 255, 0.25);
      }

      /* Имя */
      .profile-name {
        color: #0ff;
        font-size: 13px;
        letter-spacing: 1.5px;
        text-align: center;
        text-shadow:
          0 0 6px rgba(0, 255, 255, 0.8),
          0 0 16px rgba(0, 255, 255, 0.4);
        margin: 0;
        word-break: break-word;
        line-height: 1.2;
      }

      /* Кнопка-ссылка */
      .profile-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 7px 10px;
        background: rgba(0, 255, 255, 0.08);
        border: 2px solid #0ff;
        color: #0ff;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: 2px;
        text-decoration: none;
        text-transform: uppercase;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
      }

      .profile-link:hover,
      .profile-link:active {
        background: rgba(0, 255, 255, 0.25);
        color: #fff;
        box-shadow:
          0 0 18px rgba(0, 255, 255, 0.6),
          inset 0 0 12px rgba(0, 255, 255, 0.2);
        transform: translateY(-1px);
      }

      .profile-link .arrow {
        transition: transform 0.2s ease;
      }

      .profile-link:hover .arrow {
        transform: translateX(4px);
      }

      /* На узких экранах панель прячем, чтобы не мешала меню */
      @media (max-width: 900px) {
        .profiles-panel {
          display: none;
        }
      }
    </style>
